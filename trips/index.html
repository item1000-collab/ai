<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trips Around the World</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5efe7;
      font-family: system-ui, 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #2c3e2f;
    }

    .classes-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem 2rem 3rem;
      position: relative;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .top-left-logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo {
      font-weight: 800;
      background: #2c3e2f;
      color: #fff;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      font-size: 0.85rem;
    }

    .tech-link {
      color: #7f6b5a;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .tech-link:hover {
      text-decoration: underline;
    }

    .filter-section {
      background: #fff;
      border-radius: 2rem;
      padding: 0.8rem 1.5rem;
      margin: 0 0 2rem;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03);
      border: 1px solid #e9dfd3;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.8rem;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .filter-btn {
      background: #f5f0e6;
      border: none;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
      font-size: 0.7rem;
      font-weight: 500;
      color: #4a3b2f;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-btn.active {
      background: #2c3e2f;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .filter-btn:hover:not(.active) {
      background: #e2d4c4;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.6rem;
      margin: 1.5rem 0 2rem;
    }

    .class-card {
      background: #fff;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .class-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 32px -14px rgba(0, 0, 0, 0.12);
    }

    .class-card.hidden-card {
      display: none;
    }

    .card-media {
      height: 54px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
      color: #fff;
    }

    .date-tag {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.65rem;
      color: #fff;
      letter-spacing: 0.5px;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .teacher-tag {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.65rem;
      color: #1e293b;
      letter-spacing: 0.3px;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .card-content {
      padding: 1rem 1.2rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .class-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
      color: #2c3e2f;
      flex: 1;
    }

    .pending-badge {
      font-size: 0.65rem;
      color: #d97746;
      background: #fdf3ef;
      padding: 2px 6px;
      border-radius: 10px;
      margin-left: 6px;
      font-weight: 500;
    }

    .class-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      background: #f5f0e6;
      padding: 0.6rem 1rem;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.75rem;
      color: #2c3e2f;
      transition: all 0.2s;
      width: 100%;
      gap: 6px;
      margin-top: 0.8rem;
      flex-shrink: 0;
    }

    .class-link:hover {
      background: #e6d9c8;
      gap: 10px;
    }

    .arrow-icon {
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .class-link:hover .arrow-icon {
      transform: translateX(4px);
    }

    .footer-note {
      text-align: center;
      padding: 1.5rem 1rem 1rem;
      font-size: 0.7rem;
      color: #8f7a66;
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid #e2d6c8;
      margin-top: 2rem;
    }

    .footer-note a {
      color: #8f7a66;
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .classes-container {
        padding: 1rem;
      }
      .filter-section {
        padding: 0.8rem 1rem;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="classes-container">
  <div class="header">
    <div class="top-left-logo">
      <span class="logo">Trips Around the World</span>
    </div>
    <div class="header-right">
      <a href="tech.html" class="tech-link">Tech</a>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-group">
      <div class="filter-buttons" id="teacherFilterButtons"></div>
    </div>
  </div>

  <div class="grid" id="lessonsGrid"></div>

  <div class="footer-note">
    <span>🎓 Engoo online English school — interactive conversation lessons with certified teachers</span>
    <a href="#">About these materials</a>
    <a href="#">Need help?</a>
  </div>
</div>

<script>
// ============== DATA ==============
const LESSONS = [
  { date: '28.02.2024', teacher: 'Anatoly', title: 'Cuba', url: './20240228-cuba/index.html', colors: ['#1e6f5c', '#28b487'] },
  { date: '02.07.2026', teacher: 'Anatoly', title: 'Green Park', url: './20250702-green-p/index.html', colors: ['#2c5f2d', '#6a9c78'] },
  { date: '16.02.2026', teacher: 'Anatoly', title: 'Moscow', url: './20260216-moscow/index.html', colors: ['#1a4d5e', '#3ba0b5'] },
  { date: '24.04.2026', teacher: 'Anatoly', title: 'Vietnam', url: './20260424-vietnam/index.html', colors: ['#d45a2b', '#f4a261'] },
  { date: '14.06.2026', teacher: 'Anatoly', title: 'Vladivostok', url: './20260614-vladivostok/index.html', colors: ['#2b5876', '#4e4376'] },
  { date: '24.06.2026', teacher: 'Anatoly', title: 'DPRK', url: './20260624-dprk/index.html', colors: ['#2c3e50', '#e74c3c'] },
  { date: '27.06.2026', teacher: 'Anatoly', title: 'Blue Glass', url: './20260627-b-glass/index.html', colors: ['#1a759f', '#52b2cf'] },
  { date: '30.06.2026', teacher: 'Anatoly', title: 'Kimchi', url: './20260630-kimchi/index.html', colors: ['#c1272d', '#d94f30'] },
  { date: '03.07.2026', teacher: 'Anatoly', title: 'Leaders', url: './20260703-leaders/index.html', colors: ['#2b2d42', '#8d99ae'] },
  { date: '05.07.2026', teacher: 'Anatoly', title: 'Buddha', url: './20260705-budda/index.html', colors: ['#bd7f37', '#e3b87c'] },
  { date: '06.07.2026', teacher: 'Anatoly', title: 'Juche Idea', url: './20260706-juche/index.html', colors: ['#3c2c3e', '#7d5d6e'] },
  { date: '07.07.2026', teacher: 'Anatoly', title: 'Art & Society USSR', url: './20260707-as-ussr/index.html', colors: ['#9b2f2f', '#d97746'] },
  { date: '08.07.2026', teacher: 'Anatoly', title: 'Gates', url: './20260708-gates/index.html', colors: ['#4a2c2a', '#bd8a5a'] },
  { date: '08.07.2026', teacher: 'Anatoly', title: 'Posters', url: './20260708-posters/index.html', colors: ['#0f2b3d', '#2f6f8f'] },
  { date: '11.07.2026', teacher: 'Anatoly', title: 'Buddhism & Juche', url: './20260711-buddhism-juche/index.html', colors: ['#2c5a6e', '#4c9faf'] },
  { date: '12.07.2026', teacher: 'Anatoly', title: 'Metro Museum', url: './20260712-metro-museum/index.html', colors: ['#1f1a2e', '#5a3f6b'] },
  { date: '13.07.2026', teacher: 'Anatoly', title: 'Gifts Museum', url: './20260713-gifts-museum/index.html', colors: ['#7b4b3a', '#c28b6e'] },
  { date: '16.07.2026', teacher: 'Anatoly', title: 'NK Students', url: './20260716-nk-students/index.html', colors: ['#1e6b5e', '#20b2aa'] },
  { date: '17.07.2026', teacher: 'Anatoly', title: 'North Village', url: './20260717-n-vil/index.html', colors: ['#3c5e3a', '#7da07a'] },
  { date: '16.08.2026', teacher: 'Anatoly', title: 'Moscow', url: './20260816-moscow/index.html', colors: ['#1a4d5e', '#3ba0b5'] },
  { date: '18.08.2026', teacher: 'Anatoly', title: 'Korean Embroidery', url: './20260818-korean-embroidery/index.html', colors: ['#5b2e6e', '#e88d9e'] },
  { date: '27.08.2026', teacher: 'Anatoly', title: 'DPRK', url: './20260827-dprk/index.html', colors: ['#2c3e50', '#e74c3c'] }
];

// ============== HELPERS ==============
const getGradient = colors => colors.length === 2 
  ? `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`
  : `linear-gradient(135deg, ${colors.map((c, i) => `${c} ${(i / (colors.length - 1)) * 100}%`).join(', ')})`;

// ============== STATE ==============
let currentTeacher = 'all';

// ============== RENDER ==============
function renderLessons() {
  const filtered = currentTeacher === 'all' ? LESSONS : LESSONS.filter(l => l.teacher === currentTeacher);
  
  document.getElementById('lessonsGrid').innerHTML = filtered.map(l => `
    <div class="class-card">
      <div class="card-media" style="background: ${getGradient(l.colors)};">
        <span class="date-tag">🗓️ ${l.date}</span>
        ${l.teacher ? `<span class="teacher-tag">👩‍🏫 ${l.teacher}</span>` : ''}
      </div>
      <div class="card-content">
        <div class="class-title">${l.pending ? `${l.title} <span class="pending-badge">🔗 link pending</span>` : l.title}</div>
        <a href="${l.url}" class="class-link" target="_blank">
          <span>📘 Material</span>
          <span class="arrow-icon">→</span>
        </a>
      </div>
    </div>
  `).join('');
}

// ============== FILTERS ==============
const filterContainer = document.getElementById('teacherFilterButtons');

function renderFilters() {
  const teachers = [...new Set(LESSONS.map(l => l.teacher).filter(Boolean))].sort();
  if (teachers.length === 0) {
    filterContainer.parentElement.style.display = 'none';
    return;
  }
  
  filterContainer.parentElement.style.display = 'flex';
  filterContainer.innerHTML = [
    `<button data-teacher="all" class="filter-btn ${currentTeacher === 'all' ? 'active' : ''}">All teachers</button>`,
    ...teachers.map(t => `<button data-teacher="${t}" class="filter-btn ${currentTeacher === t ? 'active' : ''}">${t}</button>`)
  ].join('');
  
  filterContainer.querySelectorAll('[data-teacher]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTeacher = btn.dataset.teacher;
      renderFilters();
      renderLessons();
    });
  });
}

// ============== INIT ==============
renderFilters();
renderLessons();
</script>
</body>
</html>
