<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Trips Around the World</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="classes-container">
  <div class="header">
    <div class="top-left-logo">
      <span class="logo">Trips Around the World</span>
    </div>
    <div class="header-right">
      <a href="tech.html" class="tech-link">Tech</a>
      <span id="lessonCountDisplay" class="stats-info">0 lessons</span>
    </div>
  </div>

  <div class="filter-section">
    <div class="filter-group">
      <div class="filter-buttons" id="teacherFilterButtons"></div>
    </div>
  </div>

  <div class="grid" id="lessonsGrid"></div>

  <div class="footer-note">
    <span>🎓 Engoo online English school — interactive conversation lessons with certified teachers</span>
    <a href="#">About these materials</a>
    <a href="#">Need help?</a>
  </div>
</div>

<script>
// ============== DATA (chronological order) ==============
const LESSONS = [
  { date: '2024-02-28', teacher: '', title: 'Cuba', url: './20240228-cuba/index.html', colors: ['#1e6f5c', '#28b487'] },
  { date: '2026-07-02', teacher: '', title: 'Green Park', url: './20250702-green-p/index.html', colors: ['#2c5f2d', '#6a9c78'] },
  { date: '2026-02-16', teacher: '', title: 'Moscow', url: './20260216-moscow/index.html', colors: ['#1a4d5e', '#3ba0b5'] },
  { date: '2026-04-24', teacher: '', title: 'Vietnam', url: './20260424-vietnam/index.html', colors: ['#d45a2b', '#f4a261'] },
  { date: '2026-06-14', teacher: '', title: 'Vladivostok', url: './20260614-vladivostok/index.html', colors: ['#2b5876', '#4e4376'] },
  { date: '2026-06-24', teacher: '', title: 'DPRK', url: './20260624-dprk/index.html', colors: ['#2c3e50', '#e74c3c'] },
  { date: '2026-06-27', teacher: '', title: 'Blue Glass', url: './20260627-b-glass/index.html', colors: ['#1a759f', '#52b2cf'] },
  { date: '2026-06-30', teacher: '', title: 'Kimchi', url: './20260630-kimchi/index.html', colors: ['#c1272d', '#d94f30'] },
  { date: '2026-07-03', teacher: '', title: 'Leaders', url: './20260703-leaders/index.html', colors: ['#2b2d42', '#8d99ae'] },
  { date: '2026-07-05', teacher: '', title: 'Buddha', url: './20260705-budda/index.html', colors: ['#bd7f37', '#e3b87c'] },
  { date: '2026-07-06', teacher: '', title: 'Juche Idea', url: './20260706-juche/index.html', colors: ['#3c2c3e', '#7d5d6e'] },
  { date: '2026-07-07', teacher: '', title: 'Art & Society USSR', url: './20260707-as-ussr/index.html', colors: ['#9b2f2f', '#d97746'] },
  { date: '2026-07-08', teacher: '', title: 'Gates', url: './20260708-gates/index.html', colors: ['#4a2c2a', '#bd8a5a'] },
  { date: '2026-07-08', teacher: '', title: 'Posters', url: './20260708-posters/index.html', colors: ['#0f2b3d', '#2f6f8f'] },
  { date: '2026-07-11', teacher: '', title: 'Buddhism & Juche', url: './20260711-buddhism-juche/index.html', colors: ['#2c5a6e', '#4c9faf'] },
  { date: '2026-07-12', teacher: '', title: 'Metro Museum', url: './20260712-metro-museum/index.html', colors: ['#1f1a2e', '#5a3f6b'] },
  { date: '2026-07-13', teacher: '', title: 'Gifts Museum', url: './20260713-gifts-museum/index.html', colors: ['#7b4b3a', '#c28b6e'] },
  { date: '2026-07-16', teacher: '', title: 'NK Students', url: './20260716-nk-students/index.html', colors: ['#1e6b5e', '#20b2aa'] },
  { date: '2026-07-17', teacher: '', title: 'North Village', url: './20260717-n-vil/index.html', colors: ['#3c5e3a', '#7da07a'] },
  { date: '2026-08-16', teacher: '', title: 'Moscow', url: './20260816-moscow/index.html', colors: ['#1a4d5e', '#3ba0b5'] },
  { date: '2026-08-18', teacher: '', title: 'Korean Embroidery', url: './20260818-korean-embroidery/index.html', colors: ['#5b2e6e', '#e88d9e'] },
  { date: '2026-08-27', teacher: '', title: 'DPRK', url: './20260827-dprk/index.html', colors: ['#2c3e50', '#e74c3c'] }
];

// ============== HELPERS ==============
const getGradient = colors => colors.length === 2 
  ? `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`
  : `linear-gradient(135deg, ${colors.map((c, i) => `${c} ${(i / (colors.length - 1)) * 100}%`).join(', ')})`;

const formatDate = dateStr => new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

// ============== STATE ==============
let currentTeacher = 'all';

// ============== RENDER ==============
function renderLessons() {
  const filtered = (currentTeacher === 'all' ? LESSONS : LESSONS.filter(l => l.teacher === currentTeacher))
    .slice()
    .sort((a, b) => new Date(a.date + 'T00:00:00') - new Date(b.date + 'T00:00:00'));
  
  document.getElementById('lessonsGrid').innerHTML = filtered.map(l => `
    <div class="class-card">
      <div class="card-media" style="background: ${getGradient(l.colors)};">
        <span class="date-tag">🗓️ ${formatDate(l.date)}</span>
        ${l.teacher ? `<span class="teacher-tag">👩‍🏫 ${l.teacher}</span>` : ''}
      </div>
      <div class="card-content">
        <div class="class-title">${l.pending ? `${l.title} <span class="pending-badge">🔗 link pending</span>` : l.title}</div>
        <a href="${l.url}" class="class-link" target="_blank">
          <span>📘 Material</span>
          <span class="arrow-icon">→</span>
        </a>
      </div>
    </div>
  `).join('');
  
  document.getElementById('lessonCountDisplay').innerText = `${filtered.length} lesson${filtered.length !== 1 ? 's' : ''}`;
}

// ============== FILTERS ==============
const filterContainer = document.getElementById('teacherFilterButtons');

function renderFilters() {
  const teachers = [...new Set(LESSONS.map(l => l.teacher).filter(Boolean))].sort();
  if (teachers.length === 0) {
    filterContainer.parentElement.style.display = 'none';
    return;
  }
  
  filterContainer.parentElement.style.display = 'flex';
  filterContainer.innerHTML = [
    `<button data-teacher="all" class="filter-btn ${currentTeacher === 'all' ? 'active' : ''}">All teachers</button>`,
    ...teachers.map(t => `<button data-teacher="${t}" class="filter-btn ${currentTeacher === t ? 'active' : ''}">${t}</button>`)
  ].join('');
  
  filterContainer.querySelectorAll('[data-teacher]').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTeacher = btn.dataset.teacher;
      renderFilters();
      renderLessons();
    });
  });
}

// ============== INIT ==============
renderFilters();
renderLessons();
</script>
</body>
</html>
