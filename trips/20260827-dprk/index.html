<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources · PDF & HTML</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f8f6f3;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1.5rem;
      color: #1a1a2e;
    }
    .container {
      max-width: 880px;
      width: 100%;
      background: transparent;
    }
    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .logo {
      font-size: 2rem;
      line-height: 1;
    }
    .title-group {
      display: flex;
      flex-direction: column;
    }
    .title {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1a1a2e;
      line-height: 1.2;
    }
    .subtitle {
      font-size: 0.95rem;
      font-weight: 400;
      color: #6b7280;
      letter-spacing: -0.01em;
      margin-top: 0.1rem;
    }
    /* badge with pulsing dot */
    .badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
      padding: 0.5rem 1.2rem 0.5rem 1rem;
      border-radius: 40px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02), 0 2px 6px rgba(0,0,0,0.03);
      font-weight: 500;
      font-size: 0.9rem;
      color: #1a1a2e;
      border: 1px solid rgba(224, 122, 95, 0.15);
    }
    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #e07a5f;
      border-radius: 50%;
      margin-right: 2px;
      animation: pulse-dot 1.6s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0% { opacity: 0.5; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.12); }
      100% { opacity: 0.5; transform: scale(0.92); }
    }
    .badge-label {
      letter-spacing: 0.01em;
    }

    /* card */
    .card {
      background: white;
      border-radius: 24px;
      padding: 1.8rem 1.8rem 1.8rem 1.8rem;
      box-shadow: 0 12px 32px rgba(0,0,0,0.04), 0 4px 12px rgba(0,0,0,0.02);
      transition: box-shadow 0.2s;
      border: 1px solid rgba(0,0,0,0.02);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem 1.2rem;
    }
    /* item links */
    .item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 0.9rem 0.7rem 0.9rem;
      border-radius: 16px;
      background: transparent;
      text-decoration: none;
      color: #1a1a2e;
      border: 1.5px solid transparent;
      transition: all 0.2s ease;
      position: relative;
      font-weight: 450;
      font-size: 0.96rem;
      letter-spacing: -0.01em;
      line-height: 1.3;
      word-break: break-word;
    }
    .item .emoji {
      font-size: 1.3rem;
      line-height: 1;
      flex-shrink: 0;
      width: 1.8rem;
      text-align: left;
    }
    .item .name {
      flex: 1;
      font-weight: 450;
      color: #1a1a2e;
      transition: color 0.15s;
    }
    .item .arrow {
      font-size: 1.1rem;
      color: #b0a9a0;
      opacity: 0;
      transform: translateX(-6px);
      transition: all 0.2s ease;
      font-weight: 300;
      flex-shrink: 0;
      margin-left: 0.2rem;
    }
    .item:hover {
      background: #fcfaf8;
      border-color: #e07a5f;
      box-shadow: 0 4px 12px rgba(224, 122, 95, 0.08);
      transform: translateY(-1px);
    }
    .item:hover .arrow {
      opacity: 1;
      transform: translateX(0);
      color: #e07a5f;
    }
    .item:hover .name {
      color: #1a1a2e;
    }
    /* footer */
    .footer {
      margin-top: 2.4rem;
      text-align: center;
      font-size: 0.85rem;
      color: #9ca3af;
      letter-spacing: 0.3px;
      font-weight: 400;
      border-top: 1px solid rgba(0,0,0,0.03);
      padding-top: 1.8rem;
    }

    /* responsive */
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 0.3rem;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
      }
      .badge {
        align-self: flex-start;
      }
      .card {
        padding: 1.2rem 1.2rem 1.2rem 1.2rem;
      }
      .title {
        font-size: 1.5rem;
      }
    }
    @media (max-width: 400px) {
      .item {
        font-size: 0.9rem;
        padding: 0.6rem 0.6rem;
      }
    }

    /* remove counter – no count class */
    .no-count {
      display: none;
    }
  </style>
</head>
<body>
<div class="container">
  <!-- header -->
  <header class="header">
    <div class="header-left">
      <span class="logo">📖</span>
      <div class="title-group">
        <span class="title">Resources</span>
        <span class="subtitle">trips · 2026-08-27</span>
      </div>
    </div>
    <div class="badge">
      <span class="dot"></span>
      <span class="badge-label">PDF Files</span>
    </div>
  </header>

  <!-- card + grid -->
  <div class="card">
    <div class="grid">
      <!-- PDF file: sum.pdf -->
      <a href="https://item1000-collab.github.io/ai/trips/20260827-dprk/sum.pdf" target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📄</span>
        <span class="name">sum.pdf</span>
        <span class="arrow">→</span>
      </a>
      <!-- HTML file: script.html (also included as requested) -->
      <a href="https://item1000-collab.github.io/ai/trips/20260827-dprk/script.html" target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📄</span>
        <span class="name">script.html</span>
        <span class="arrow">→</span>
      </a>
      <!-- additional PDF? none other – only sum.pdf and script.html are present in the list.
           The list also shows .txt files, but they are ignored per spec (only .pdf and .html are included).
           but spec says "include ONLY files with .pdf" AND "page should contain links not only on pdf but also on html"
           so we include script.html as an extra. Also we keep sum.pdf as the only PDF.
      -->
    </div>
  </div>

  <footer class="footer">
    Powered by AI Exploration Hub
  </footer>
</div>
</body>
</html>
