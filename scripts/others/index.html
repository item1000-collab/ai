<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f8f6f3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            color: #1a1a2e;
        }

        .container {
            width: 100%;
            max-width: 820px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }

        .title-block h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #1a1a2e;
            line-height: 1.2;
        }

        .title-block .subtitle {
            font-size: 15px;
            color: #6b7280;
            font-weight: 400;
            margin-top: 2px;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #ffffff;
            padding: 8px 16px 8px 14px;
            border-radius: 100px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
            font-size: 14px;
            font-weight: 500;
            color: #1a1a2e;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #e07a5f;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.8s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: #f8f6f3;
            border-radius: 16px;
            text-decoration: none;
            color: #1a1a2e;
            border: 2px solid transparent;
            transition: all 0.25s ease;
            position: relative;
            cursor: pointer;
        }

        .item:hover {
            border-color: #e07a5f;
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(224, 122, 95, 0.15);
            background: #ffffff;
        }

        .item .emoji {
            font-size: 22px;
            flex-shrink: 0;
            width: 32px;
            text-align: center;
            line-height: 1;
        }

        .item .name {
            font-size: 14px;
            font-weight: 500;
            word-break: break-word;
            flex: 1;
            line-height: 1.35;
            color: #1a1a2e;
        }

        .item .arrow {
            font-size: 18px;
            color: #e07a5f;
            opacity: 0;
            transition: opacity 0.25s ease, transform 0.25s ease;
            flex-shrink: 0;
            transform: translateX(-4px);
            font-weight: 400;
            line-height: 1;
        }

        .item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            font-weight: 400;
            letter-spacing: 0.01em;
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: 1fr;
            }

            body {
                padding: 20px 14px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .badge {
                align-self: flex-start;
            }

            .title-block h1 {
                font-size: 22px;
            }

            .logo-icon {
                width: 42px;
                height: 42px;
                font-size: 22px;
                border-radius: 14px;
            }

            .card {
                padding: 16px;
                border-radius: 20px;
            }

            .item {
                padding: 14px 16px;
                border-radius: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <div class="logo-icon">🌐</div>
                <div class="title-block">
                    <h1>Resources</h1>
                    <div class="subtitle">scripts / others</div>
                </div>
            </div>
            <div class="badge">
                <span class="pulse-dot"></span>
                HTML Pages
            </div>
        </header>

        <main class="card">
            <div class="grid">
                <a href="https://item1000-collab.github.io/ai/scripts/others/its-a-wonderful-life.html" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">🌐</span>
                    <span class="name">its-a-wonderful-life.html</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </main>

        <footer class="footer">
            Powered by AI Exploration Hub
        </footer>
    </div>
</body>
</html>
