<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Your Language — Episode Scripts</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            line-height: 1.6;
            color: #2c3e50;
            background: #f0f2f5;
            min-height: 100vh;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 2em;
            color: #1a252f;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        .episode-list {
            list-style: none;
            padding: 0;
        }
        .episode-list li {
            background: #ffffff;
            margin: 12px 0;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .episode-list li:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.12);
        }
        .episode-list a {
            display: flex;
            align-items: center;
            padding: 18px 24px;
            text-decoration: none;
            color: #2c3e50;
            font-size: 1.1em;
            font-weight: 500;
        }
        .episode-list a:hover {
            color: #2980b9;
        }
        .episode-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #3498db;
            color: #ffffff;
            min-width: 52px;
            height: 32px;
            padding: 0 10px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: 700;
            margin-right: 16px;
            flex-shrink: 0;
        }
        .episode-title {
            flex: 1;
        }
        .arrow {
            color: #bdc3c7;
            font-size: 1.2em;
            margin-left: 10px;
            transition: color 0.2s, transform 0.2s;
        }
        .episode-list a:hover .arrow {
            color: #3498db;
            transform: translateX(4px);
        }
        .note {
            text-align: center;
            color: #95a5a6;
            font-style: italic;
            margin-top: 40px;
            font-size: 0.95em;
        }
        footer {
            text-align: center;
            margin-top: 50px;
            padding-top: 20px;
            border-top: 1px solid #dfe6e9;
            color: #b2bec3;
            font-size: 0.85em;
        }
    </style>
</head>
<body>

    <header>
        <h1>Mind Your Language</h1>
        <p class="subtitle">Episode Scripts</p>
    </header>

    <ul class="episode-list">
        <li>
            <a href="https://item1000-collab.github.io/ai/scripts/mind-your-language/101-mind-your-language.html">
                <span class="episode-number">101</span>
                <span class="episode-title">Principal's office · Enter excusing me please</span>
                <span class="arrow">→</span>
            </a>
        </li>
        <li>
            <a href="https://item1000-collab.github.io/ai/scripts/mind-your-language/102-mind-your-language.html">
                <span class="episode-number">102</span>
                <span class="episode-title">Episode 102 · Script</span>
                <span class="arrow">→</span>
            </a>
        </li>
        <!-- Add new episodes below by copying the <li> block above -->
    </ul>

    <p class="note">New episodes will be added as they are published.</p>

    <footer>
        Mind Your Language — Script Archive
    </footer>

</body>
</html>
