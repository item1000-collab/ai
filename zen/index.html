<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Zen Channel · travel notes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5efe7;
      font-family: system-ui, 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .classes-container {
      max-width: 100%;
      margin: 0 auto;
      padding: 1rem 2rem 3rem;
      position: relative;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 0 1rem 1rem;
      background: transparent;
      position: relative;
    }

    .top-left-logo {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #7f6b5a;
    }

    .logo {
      font-weight: 800;
      background: #2c3e2f;
      color: white;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
    }

    .header h1 {
      font-size: 2.7rem;
      font-weight: 700;
      color: #2c3e2f;
      margin-bottom: 0;
      margin-top: 0;
    }

    .filter-section {
      background: white;
      border-radius: 2rem;
      padding: 1rem 1.5rem;
      margin: 1rem 0 2rem;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03);
      border: 1px solid #e9dfd3;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.2rem;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .filter-label {
      font-weight: 600;
      font-size: 0.8rem;
      color: #4a3b2f;
      background: #f0e9e0;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: #f5f0e6;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #4a3b2f;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-btn.active {
      background: #2c3e2f;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .filter-btn:hover:not(.active) {
      background: #e2d4c4;
    }

    .reset-btn {
      background: #e1d5c7;
    }

    .reset-btn:hover {
      background: #cdbcab;
    }

    .stats-info {
      font-size: 0.7rem;
      color: #8f7a66;
      background: #f9f5ef;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.6rem;
      margin: 1.5rem 0 2rem;
    }

    .class-card {
      background: #ffffff;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .class-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 32px -14px rgba(0, 0, 0, 0.12);
    }

    .card-media {
      height: 44px;
      position: relative;
      background-size: cover;
      background-position: center;
      background: linear-gradient(135deg, #2c3e2f 0%, #5a7d5c 100%);
    }

    .card-media.dprk-overview { background: linear-gradient(135deg, #1f3a3a 0%, #4b7a6e 100%); }
    .card-media.dprk-glass { background: linear-gradient(135deg, #1e3b4a 0%, #5a8a8a 100%); }
    .card-media.dprk-kimchi { background: linear-gradient(135deg, #4a3a2a 0%, #8a6a4a 100%); }
    .card-media.dprk-green { background: linear-gradient(135deg, #1e4a3a 0%, #5a9a6a 100%); }
    .card-media.dprk-leaders { background: linear-gradient(135deg, #4a2a2a 0%, #8a4a3a 100%); }
    .card-media.dprk-buddha { background: linear-gradient(135deg, #3a2a4a 0%, #7a5a8a 100%); }
    .card-media.dprk-juche { background: linear-gradient(135deg, #2a3a4a 0%, #5a7a9a 100%); }
    .card-media.dprk-ussr { background: linear-gradient(135deg, #3a2a2a 0%, #7a4a3a 100%); }
    .card-media.dprk-posters { background: linear-gradient(135deg, #2a2a3a 0%, #5a5a7a 100%); }
    .card-media.dprk-gates { background: linear-gradient(135deg, #3a2a2a 0%, #6a4a3a 100%); }
    .card-media.dprk-buddhism { background: linear-gradient(135deg, #2a3a2a 0%, #5a7a5a 100%); }
    .card-media.dprk-metro { background: linear-gradient(135deg, #1a2a3a 0%, #4a6a8a 100%); }
    .card-media.dprk-gifts { background: linear-gradient(135deg, #2a2a1a 0%, #6a5a3a 100%); }
    .card-media.dprk-students { background: linear-gradient(135deg, #1a3a2a 0%, #4a7a5a 100%); }
    .card-media.dprk-village { background: linear-gradient(135deg, #2a4a2a 0%, #5a8a4a 100%); }
    .card-media.dprk-embroidery { background: linear-gradient(135deg, #3a2a4a 0%, #7a5a7a 100%); }

    .country-tag {
      position: absolute;
      bottom: 8px;
      left: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.6rem;
      color: white;
      z-index: 2;
    }

    .card-content {
      padding: 1rem 1.2rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .lesson-date {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #b47c48;
      margin-bottom: 0.3rem;
    }

    .class-title {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
      color: #2c3e2f;
    }

    .class-title a {
      text-decoration: none;
      color: #2c3e2f;
      border-bottom: 1px solid transparent;
      transition: border-color 0.15s;
    }

    .class-title a:hover {
      border-bottom: 1px solid #b47c48;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.5rem 0 0;
      align-items: center;
    }

    .teacher-badge {
      background: #2c3e2f;
      color: white;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .topic-badge {
      background: #e6b422;
      color: #2c3e2f;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .topic-icon {
      font-size: 0.85rem;
    }

    .class-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      background: #f5f0e6;
      padding: 0.6rem 1rem;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.75rem;
      color: #2c3e2f;
      transition: all 0.2s;
      width: 100%;
      gap: 6px;
      margin-top: 0.8rem;
    }

    .class-link:hover {
      background: #e6d9c8;
      gap: 10px;
    }

    .arrow-icon {
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .class-link:hover .arrow-icon {
      transform: translateX(4px);
    }

    .class-card.hidden-card {
      display: none;
    }

    .footer-note {
      text-align: center;
      padding: 1.5rem 1rem 1rem;
      font-size: 0.7rem;
      color: #8f7a66;
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid #e2d6c8;
      margin-top: 2rem;
    }

    .footer-note a {
      color: #8f7a66;
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    @media (min-width: 1600px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    @media (max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
    }

    @media (max-width: 700px) {
      .classes-container { padding: 1rem; }
      .header h1 { font-size: 1.8rem; }
      .filter-section { flex-direction: column; align-items: stretch; }
      .filter-group { justify-content: space-between; }
      .card-media { height: 40px; }
      .grid { grid-template-columns: 1fr; margin-top: 0.5rem; }
      .meta-row { flex-direction: column; align-items: flex-start; }
      .top-left-logo { position: static; margin-bottom: 0.5rem; justify-content: center; }
      .header { padding-top: 0; }
    }
  </style>
</head>
<body>
<div class="classes-container">
  <div class="header">
    <div class="top-left-logo">
      <span>+ travel notes +</span>
      <span class="logo">Zen</span>
    </div>
    <h1>Zen Channel · eyewitness series</h1>
  </div>

  <div class="filter-section">
    <div class="filter-group">
      <span class="filter-label">Date</span>
      <div class="filter-buttons" id="yearFilterButtons"></div>
    </div>
    <div class="filter-group">
      <button id="resetFiltersBtn" class="filter-btn reset-btn">[ Reset ]</button>
      <span id="lessonCountDisplay" class="stats-info">16 events</span>
    </div>
  </div>

  <div class="grid" id="lessonsGrid">
    <!-- Cards will be inserted via JS -->
  </div>

  <div class="footer-note">
    <span>Zen Channel · eyewitness series</span>
    <a href="#">Archive</a>
    <a href="#">About</a>
  </div>
</div>

<script>
  const linksData = [
    {
      url: "https://item1000-collab.github.io/ai/trips/20260624-dprk/index.html",
      title: "Overview · DPRK journey 15–25 Jun 2026",
      dateLabel: "26 Jun 2026",
      dateObj: new Date(2026, 5, 26),
      year: "2026",
      icon: "🇰🇵",
      cardClass: "dprk-overview",
      topic: "journey"
    },
    {
      url: "20260627-b-glass/index.html",
      title: "Behind the Glass of a Closed City",
      dateLabel: "27 Jun 2026",
      dateObj: new Date(2026, 5, 27),
      year: "2026",
      icon: "🏙️",
      cardClass: "dprk-glass",
      topic: "city"
    },
    {
      url: "20260630-kimchi/index.html",
      title: "Kimchi, North Korean style",
      dateLabel: "30 Jun 2026",
      dateObj: new Date(2026, 5, 30),
      year: "2026",
      icon: "🥬",
      cardClass: "dprk-kimchi",
      topic: "food"
    },
    {
      url: "20250702-green-p/index.html",
      title: "Green Pyongyang, Triumphal Arch & 38th-floor view",
      dateLabel: "2 Jul 2026",
      dateObj: new Date(2026, 6, 2),
      year: "2026",
      icon: "🌳",
      cardClass: "dprk-green",
      topic: "city"
    },
    {
      url: "20260703-leaders/index.html",
      title: "They respect their leaders",
      dateLabel: "3 Jul 2026",
      dateObj: new Date(2026, 6, 3),
      year: "2026",
      icon: "🎖️",
      cardClass: "dprk-leaders",
      topic: "politics"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260705-budda/index.html",
      title: "The Mystery of the 'Fire' Buddha",
      dateLabel: "5 Jul 2026",
      dateObj: new Date(2026, 6, 5),
      year: "2026",
      icon: "☸️",
      cardClass: "dprk-buddha",
      topic: "religion"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260706-juche/index.html",
      title: "How Juche theory works in real life",
      dateLabel: "6 Jul 2026",
      dateObj: new Date(2026, 6, 6),
      year: "2026",
      icon: "⭐",
      cardClass: "dprk-juche",
      topic: "politics"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260707-as-ussr/index.html",
      title: "DPRK through the lens of the USSR",
      dateLabel: "7 Jul 2026",
      dateObj: new Date(2026, 6, 7),
      year: "2026",
      icon: "🕊️",
      cardClass: "dprk-ussr",
      topic: "history"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260708-posters/index.html",
      title: "Seven Posters in a Pyongyang Hotel",
      dateLabel: "8 Jul 2026",
      dateObj: new Date(2026, 6, 8),
      year: "2026",
      icon: "🖼️",
      cardClass: "dprk-posters",
      topic: "art"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260708-gates/index.html",
      title: "The Gates of Pyongyang",
      dateLabel: "8 Jul 2026",
      dateObj: new Date(2026, 6, 8),
      year: "2026",
      icon: "🚪",
      cardClass: "dprk-gates",
      topic: "architecture"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260711-buddhism-juche/index.html",
      title: "Buddhism and Juche: spiritual parallels",
      dateLabel: "11 Jul 2026",
      dateObj: new Date(2026, 6, 11),
      year: "2026",
      icon: "☸️",
      cardClass: "dprk-buddhism",
      topic: "religion"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260712-metro-museum/index.html",
      title: "Pyongyang Metro: Museum on Rails",
      dateLabel: "12 Jul 2026",
      dateObj: new Date(2026, 6, 12),
      year: "2026",
      icon: "🚇",
      cardClass: "dprk-metro",
      topic: "city"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260713-gifts-museum/index.html",
      title: "The Gifts Museum: diplomatic history",
      dateLabel: "13 Jul 2026",
      dateObj: new Date(2026, 6, 13),
      year: "2026",
      icon: "🏛️",
      cardClass: "dprk-gifts",
      topic: "history"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260716-nk-students/index.html",
      title: "North Korean students: education and life",
      dateLabel: "16 Jul 2026",
      dateObj: new Date(2026, 6, 16),
      year: "2026",
      icon: "🎓",
      cardClass: "dprk-students",
      topic: "education"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260717-n-vil/index.html",
      title: "A glimpse into a North Korean village",
      dateLabel: "17 Jul 2026",
      dateObj: new Date(2026, 6, 17),
      year: "2026",
      icon: "🏘️",
      cardClass: "dprk-village",
      topic: "village"
    },
    {
      url: "https://item1000-collab.github.io/ai/zen/20260818-korean-embroidery/index.html",
      title: "Korean Embroidery: Threads of Tradition",
      dateLabel: "18 Aug 2026",
      dateObj: new Date(2026, 7, 18),
      year: "2026",
      icon: "🧵",
      cardClass: "dprk-embroidery",
      topic: "art"
    }
  ];

  const sorted = [...linksData].sort((a, b) => a.dateObj - b.dateObj);

  const grid = document.getElementById('lessonsGrid');
  const yearFilterContainer = document.getElementById('yearFilterButtons');
  const resetBtn = document.getElementById('resetFiltersBtn');
  const lessonCountSpan = document.getElementById('lessonCountDisplay');

  let currentYear = 'all';

  function buildCard(link) {
    const div = document.createElement('div');
    div.className = `class-card ${link.cardClass || 'dprk-overview'}`;
    div.setAttribute('data-year', link.year);
    div.innerHTML = `
      <div class="card-media ${link.cardClass || 'dprk-overview'}">
        <div class="country-tag">${link.icon} ${link.topic || 'DPRK'}</div>
      </div>
      <div class="card-content">
        <div class="lesson-date">📅 ${link.dateLabel}</div>
        <div class="class-title"><a href="${link.url}" target="_blank">${link.title}</a></div>
        <div class="meta-row">
          <span class="teacher-badge">🧘 Zen</span>
          <span class="topic-badge"><span class="topic-icon">#</span> ${link.topic || 'eyewitness'}</span>
        </div>
        <a href="${link.url}" class="class-link" target="_blank">
          <span>📖 Read more</span>
          <span class="arrow-icon">→</span>
        </a>
      </div>
    `;
    return div;
  }

  function renderYearButtons() {
    const years = [...new Set(sorted.map(d => d.year))].sort();
    let buttonsHtml = `<button data-year="all" class="filter-btn ${currentYear === 'all' ? 'active' : ''}">All</button>`;
    years.forEach(year => {
      buttonsHtml += `<button data-year="${year}" class="filter-btn ${currentYear === year ? 'active' : ''}">${year}</button>`;
    });
    yearFilterContainer.innerHTML = buttonsHtml;
    
    yearFilterContainer.querySelectorAll('[data-year]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentYear = btn.getAttribute('data-year');
        updateFilters();
        updateActiveButtons();
      });
    });
  }

  function updateActiveButtons() {
    yearFilterContainer.querySelectorAll('[data-year]').forEach(btn => {
      const val = btn.getAttribute('data-year');
      btn.classList.toggle('active', val === currentYear);
    });
  }

  function updateFilters() {
    let visibleCount = 0;
    const allCards = grid.querySelectorAll('.class-card');
    allCards.forEach(card => {
      const year = card.getAttribute('data-year');
      const matches = (currentYear === 'all' || year === currentYear);
      card.classList.toggle('hidden-card', !matches);
      if (matches) visibleCount++;
    });
    lessonCountSpan.innerText = `${visibleCount} event${visibleCount !== 1 ? 's' : ''}`;
  }

  function resetFilters() {
    currentYear = 'all';
    updateFilters();
    updateActiveButtons();
  }

  sorted.forEach(link => {
    grid.appendChild(buildCard(link));
  });

  renderYearButtons();
  resetBtn.addEventListener('click', resetFilters);
  updateFilters();
</script>
</body>
</html>
