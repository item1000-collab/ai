<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Radio – Korean Embroidery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #121212;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #e0e0e0;
            line-height: 1.5;
            padding: 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-wrapper {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
        }

        /* Player card */
        .player-card {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 2.2rem;
            border: 1px solid #2c2c2c;
        }

        .cover-img {
            width: 100%;
            max-height: 260px;
            object-fit: cover;
            border-radius: 16px;
            border: 1px solid #3a3a3a;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
            display: block;
            margin-bottom: 1.2rem;
            background: #2a2a2a;
        }

        .show-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 0.8rem;
            border-bottom: 1px solid #2e2e2e;
            padding-bottom: 0.6rem;
        }

        .show-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #ffffff;
            line-height: 1.2;
            word-break: break-word;
        }

        .duration-badge {
            background: #2d2d2d;
            padding: 0.3rem 0.8rem;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #b8b8b8;
            border: 1px solid #3f3f3f;
        }

        audio {
            width: 100%;
            margin-top: 0.5rem;
            border-radius: 40px;
            outline: none;
            background: #1f1f1f;
        }

        /* transcript */
        .transcript-block {
            background: #181818;
            border-radius: 20px;
            padding: 1.6rem 1.4rem;
            border: 1px solid #2a2a2a;
        }

        .transcript-heading {
            font-size: 1.15rem;
            font-weight: 600;
            color: #c0c0c0;
            letter-spacing: 0.3px;
            margin-bottom: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border-bottom: 1px dashed #3a3a3a;
            padding-bottom: 0.8rem;
            text-transform: uppercase;
            font-size: 0.9rem;
            color: #888;
        }

        .transcript-list {
            list-style: none;
        }

        .line-item {
            padding: 0.9rem 0.8rem;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            border-radius: 8px;
            margin-bottom: 2px;
            transition: background 0.15s ease, border-left 0.1s ease;
            border-left: 3px solid transparent;
        }

        .line-item:hover {
            background: #242424;
            border-left-color: #5f5f5f;
        }

        .line-item.active {
            background: #007bff;
            border-left-color: #ffffff;
            color: white;
        }

        .line-item.active .speaker-label,
        .line-item.active .transcript-text {
            color: white;
        }

        .speaker-label {
            font-weight: 700;
            color: #9aa0a6;
            margin-right: 0.35rem;
        }

        .transcript-text {
            color: #cfcfcf;
        }

        .timestamp-marker {
            font-size: 0.7rem;
            background: #2d2d2d;
            padding: 0.1rem 0.5rem;
            border-radius: 30px;
            color: #9a9a9a;
            margin-right: 0.6rem;
            font-family: monospace;
            font-weight: 500;
            letter-spacing: 0.4px;
        }

        .line-item.active .timestamp-marker {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .error-box {
            background: #3a1a1a;
            border-left: 5px solid #ff6b6b;
            padding: 1.3rem 1.2rem;
            border-radius: 14px;
            color: #ffb3b3;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .footer-note {
            color: #4d4d4d;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 2.2rem;
            border-top: 1px solid #242424;
            padding-top: 1.2rem;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- PLAYER CARD -->
        <div class="player-card">
            <img src="cover.png" alt="Show cover" class="cover-img" id="coverImage" onerror="this.style.display='none'">
            <div class="show-header">
                <h1 class="show-title" id="showTitle">Loading…</h1>
                <span class="duration-badge" id="showDuration">--:--</span>
            </div>
            <audio id="audioPlayer" controls preload="metadata">
                <source src="ai_radio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- TRANSCRIPT -->
        <div class="transcript-block">
            <div class="transcript-heading">
                <span>⏱️ synchronized transcript</span>
            </div>
            <div id="transcriptContainer">
                <div class="error-box" id="errorMessage" style="display: none;">
                    ⚠️ Could not load transcript. Check that show_notes.json exists.
                </div>
                <ul class="transcript-list" id="transcriptList"></ul>
            </div>
        </div>

        <div class="footer-note">
            AI Talk Radio • Korean Embroidery: Painting with Thread
        </div>
    </div>

    <script>
        (function() {
            // ---------- Strictly controlled paths ----------
            const AUDIO_FILE = 'ai_radio.mp3';      // fixed by spec
            const COVER_IMG  = 'cover.png';         // fixed by spec
            const JSON_FILE  = 'show_notes.json';   // fixed by spec

            // DOM references
            const audioElem = document.getElementById('audioPlayer');
            const titleEl = document.getElementById('showTitle');
            const durationEl = document.getElementById('showDuration');
            const transcriptContainer = document.getElementById('transcriptContainer');
            const transcriptList = document.getElementById('transcriptList');
            const errorBox = document.getElementById('errorMessage');

            // ----- in-memory state -----
            let showData = null;               // parsed JSON
            let lineElements = [];             // store DOM li elements
            let timeRanges = [];               // [{start, end, element}]

            // ---------- helper: convert "M:SS" or "MM:SS" to seconds ----------
            function timecodeToSeconds(tc) {
                if (!tc || typeof tc !== 'string') return 0;
                const parts = tc.split(':');
                if (parts.length === 2) {
                    const minutes = parseInt(parts[0], 10) || 0;
                    const seconds = parseInt(parts[1], 10) || 0;
                    return (minutes * 60) + seconds;
                } else if (parts.length === 3) {
                    // hours not expected but safe
                    const hours = parseInt(parts[0], 10) || 0;
                    const minutes = parseInt(parts[1], 10) || 0;
                    const seconds = parseInt(parts[2], 10) || 0;
                    return (hours * 3600) + (minutes * 60) + seconds;
                }
                return 0;
            }

            // format seconds back to M:SS (for optional display)
            function formatTime(seconds) {
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            }

            // ---------- render transcript from JSON data ----------
            function renderTranscript(data) {
                if (!data || !Array.isArray(data.timecoded_transcript) || data.timecoded_transcript.length === 0) {
                    showError('Transcript data is empty or malformed.');
                    return false;
                }

                // clear old content
                transcriptList.innerHTML = '';
                lineElements = [];
                timeRanges = [];

                const transcriptArray = data.timecoded_transcript;
                const totalLines = transcriptArray.length;

                // Build list items and compute ranges
                transcriptArray.forEach((entry, idx) => {
                    const startSec = timecodeToSeconds(entry.timecode);
                    let endSec;

                    if (idx < totalLines - 1) {
                        const nextStart = timecodeToSeconds(transcriptArray[idx + 1].timecode);
                        endSec = nextStart > startSec ? nextStart : startSec + 20;
                    } else {
                        // last line: start + 20 sec fallback
                        endSec = startSec + 20;
                    }

                    // create li element
                    const li = document.createElement('li');
                    li.className = 'line-item';
                    li.setAttribute('data-start', startSec);
                    li.setAttribute('data-end', endSec);

                    // timestamp marker (small display)
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'timestamp-marker';
                    timeSpan.textContent = entry.timecode;

                    // speaker label
                    const speakerSpan = document.createElement('span');
                    speakerSpan.className = 'speaker-label';
                    speakerSpan.textContent = entry.speaker ? `${entry.speaker}:` : '';

                    // text
                    const textSpan = document.createElement('span');
                    textSpan.className = 'transcript-text';
                    textSpan.textContent = entry.text || '';

                    li.appendChild(timeSpan);
                    li.appendChild(speakerSpan);
                    li.appendChild(textSpan);

                    // attach click handler (seek)
                    li.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const start = parseFloat(this.getAttribute('data-start'));
                        if (!isNaN(start)) {
                            audioElem.currentTime = start;
                            audioElem.play().catch(() => {});
                        }
                    });

                    transcriptList.appendChild(li);
                    lineElements.push(li);
                    timeRanges.push({ start: startSec, end: endSec, element: li });
                });

                return true;
            }

            // ---------- handle error / fallback ----------
            function showError(message) {
                titleEl.textContent = '⚠️ Audio transcript unavailable';
                durationEl.textContent = '--:--';
                transcriptList.style.display = 'none';
                errorBox.style.display = 'flex';
                errorBox.textContent = message || 'Could not load show notes.';
                console.warn(message);
            }

            // clear error if we have data
            function clearError() {
                errorBox.style.display = 'none';
                transcriptList.style.display = 'block';
            }

            // ---------- synchronisation: highlight active line ----------
            function updateActiveLine(currentTime) {
                if (!timeRanges.length) return;

                let activeLine = null;
                for (let i = 0; i < timeRanges.length; i++) {
                    const range = timeRanges[i];
                    if (currentTime >= range.start && currentTime < range.end) {
                        activeLine = range.element;
                        break;
                    }
                }

                // remove .active from all lines
                lineElements.forEach(el => el.classList.remove('active'));
                if (activeLine) {
                    activeLine.classList.add('active');
                    // scroll into view (center)
                    activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            // ---------- load JSON ----------
            async function loadShowNotes() {
                try {
                    const response = await fetch(JSON_FILE, { cache: 'no-store' });
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    const data = await response.json();
                    
                    // validate basic structure
                    if (!data || !data.show_title) {
                        throw new Error('Missing show_title');
                    }

                    // clear previous error
                    clearError();

                    // set title, duration
                    titleEl.textContent = data.show_title || 'Untitled Show';
                    durationEl.textContent = data.show_duration || '--:--';

                    // render transcript
                    const renderOk = renderTranscript(data);
                    if (!renderOk) {
                        showError('The transcript format is incorrect.');
                        return;
                    }

                    // store data
                    showData = data;

                    // after successful render, highlight initial if audio already loaded? 
                    // We'll do it on first timeupdate.
                } catch (error) {
                    console.error('Failed to load show_notes.json', error);
                    showError('Could not find show_notes.json. Ensure the file is present in the same directory.');
                }
            }

            // ---------- EVENT LISTENERS ----------
            function initAudioEvents() {
                audioElem.addEventListener('timeupdate', function() {
                    if (showData) {
                        updateActiveLine(audioElem.currentTime);
                    }
                });

                // also update once when metadata loads to set correct duration (optional)
                audioElem.addEventListener('loadedmetadata', () => {
                    if (showData && showData.show_duration) {
                        durationEl.textContent = showData.show_duration;
                    }
                });
            }

            // ---------- INIT ----------
            function init() {
                initAudioEvents();
                loadShowNotes();
            }

            // run after DOM fully parsed
            document.addEventListener('DOMContentLoaded', init);
        })();
    </script>
</body>
</html>
