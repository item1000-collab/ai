<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources – grease</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f8f6f3;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            font-size: 2.4rem;
            line-height: 1;
        }

        .header-text h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #1a1a2e;
            line-height: 1.2;
        }

        .header-text .subtitle {
            font-size: 1rem;
            font-weight: 400;
            color: #6b7280;
            margin-top: 0.15rem;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: white;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            font-size: 0.9rem;
            font-weight: 500;
            color: #1a1a2e;
            border: 1px solid rgba(224, 122, 95, 0.15);
            white-space: nowrap;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #e07a5f;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.85);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Card */
        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .file-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.85rem 1rem;
            background: #faf9f8;
            border-radius: 16px;
            text-decoration: none;
            color: #1a1a2e;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            font-size: 0.95rem;
            font-weight: 500;
            word-break: break-word;
        }

        .item:hover {
            background: white;
            border-color: #e07a5f;
            box-shadow: 0 6px 18px rgba(224, 122, 95, 0.12);
            transform: translateY(-2px);
        }

        .item .emoji {
            font-size: 1.4rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .item .name {
            flex: 1;
            text-align: left;
            line-height: 1.3;
        }

        .item .arrow {
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            font-size: 1.2rem;
            color: #e07a5f;
            flex-shrink: 0;
            transform: translateX(-4px);
        }

        .item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        /* Footer */
        .footer {
            text-align: center;
            font-size: 0.85rem;
            color: #6b7280;
            padding: 0.5rem 0 1rem;
            letter-spacing: 0.01em;
        }

        /* Responsive */
        @media (max-width: 500px) {
            body {
                padding: 1.25rem 1rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.75rem;
            }

            .header-text h1 {
                font-size: 1.5rem;
            }

            .logo {
                font-size: 2rem;
            }

            .badge {
                align-self: flex-start;
                font-size: 0.8rem;
                padding: 0.4rem 0.9rem;
            }

            .file-grid {
                grid-template-columns: 1fr;
                gap: 0.75rem;
            }

            .card {
                padding: 1rem;
                border-radius: 20px;
            }

            .item {
                padding: 0.75rem 0.9rem;
                font-size: 0.9rem;
            }

            .item .emoji {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <span class="logo">📄</span>
                <div class="header-text">
                    <h1>Resources</h1>
                    <div class="subtitle">grease</div>
                </div>
            </div>
            <div class="badge">
                <span class="pulse-dot"></span>
                PDF Files
            </div>
        </header>

        <main class="card">
            <div class="file-grid">
                <a href="https://item1000-collab.github.io/ai/engoo/20260930-grease/grease-anatomy-of-a-cultural-phenomenon.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📕</span>
                    <span class="name">grease-anatomy-of-a-cultural-phenomenon.pdf</span>
                    <span class="arrow">→</span>
                </a>
                <a href="https://item1000-collab.github.io/ai/engoo/20260930-grease/grease-deconstructed.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📘</span>
                    <span class="name">grease-deconstructed.pdf</span>
                    <span class="arrow">→</span>
                </a>
                <a href="https://item1000-collab.github.io/ai/engoo/20260930-grease/grease-language-lessons.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📗</span>
                    <span class="name">grease-language-lessons.pdf</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </main>

        <footer class="footer">
            Powered by AI Exploration Hub
        </footer>
    </div>
</body>
</html>
