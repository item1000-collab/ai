<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poster Hunter 📸 — The One After the Superbowl Picture Game</title>
<style>
  :root {
    --bg: #f7f1e8; --card: #fffdf7; --ink: #3a2c22; --muted: #8a7566;
    --accent: #b0722f; --accent-dark: #7c4a1e; --line: #e8d9c3;
    --green: #3e7c4f; --green-bg: #e8f4ea; --red: #b0452f; --red-bg: #f9e9e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #f7f1e8 0%, #f0e2cd 100%);
    color: var(--ink);
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    line-height: 1.6; min-height: 100vh;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 1rem 1rem 3rem; }

  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: .6rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: .55rem 1rem; box-shadow: 0 6px 18px rgba(70,45,20,.12);
    margin-bottom: .6rem; flex-wrap: wrap;
  }
  .brand { font-weight: bold; color: var(--accent-dark); font-size: .95rem; }
  .stats { display: flex; gap: 1rem; align-items: center; font-size: .95rem; }
  .stats b { color: var(--accent-dark); }
  #soundBtn { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: .05rem .25rem; }

  .dots { display: flex; gap: .35rem; justify-content: center; margin-bottom: .8rem; flex-wrap: wrap; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: #e3d2ba; border: 1px solid #d3bd9c; }
  .dot.current { background: var(--accent); box-shadow: 0 0 0 3px #efdcc0; }
  .dot.good { background: var(--green); border-color: var(--green); }
  .dot.bad { background: var(--red); border-color: var(--red); }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 1.3rem; box-shadow: 0 10px 26px rgba(70,45,20,.14); animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(.97); opacity: .55; } to { transform: scale(1); opacity: 1; } }
  .level-tag { text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; color: var(--accent); font-weight: bold; }
  h1 { font-size: 1.6rem; margin: .3rem 0 .4rem; color: var(--accent-dark); line-height: 1.25; }
  h2 { font-size: 1.25rem; margin: .2rem 0 .5rem; color: var(--accent-dark); }
  .tagline { font-style: italic; color: #5c4a3c; margin: .4rem 0 1rem; }
  .howto { margin: .8rem 0 1.2rem; padding-left: 1.3rem; }
  .howto li { margin: .35rem 0; }
  .center { text-align: center; }
  .big-emoji { font-size: 2.8rem; text-align: center; margin: .2rem 0; }

  .btn {
    display: inline-block; background: linear-gradient(180deg, #c07f37, #a5641f);
    color: #fff8ec; border: none; border-radius: 999px; padding: .72rem 1.55rem;
    font-size: 1.02rem; font-weight: bold; cursor: pointer; font-family: inherit;
    box-shadow: 0 5px 14px rgba(122,74,30,.35); transition: transform .12s; margin: .3rem .25rem 0;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.secondary { background: var(--card); color: var(--accent-dark); border: 2px solid var(--accent); box-shadow: none; }
  .btn.small { padding: .38rem .95rem; font-size: .88rem; }
  a.btn { text-decoration: none; }

  /* ===== POSTER HOLDER: remote image auto-replaces the drawn art ===== */
  .poster-holder {
    position: relative; width: 100%; aspect-ratio: 16 / 9;
    border-radius: 14px; overflow: hidden; background: #fff;
    box-shadow: 0 8px 20px rgba(70,45,20,.18); margin: .8rem 0 1rem;
    border: 1px solid var(--line);
  }
  .poster-holder .remote { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #fff; z-index: 2; }
  .poster-holder.has-remote .remote { display: block; }
  .poster-holder.has-remote .art { display: none; }

  /* ===== DRAWN SLIDE ART ===== */
  .art {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 5px;
    padding: 12px 14px; font-size: 11px; line-height: 1.45; color: #f5e9d6; overflow: hidden;
  }
  .art1 { background: radial-gradient(circle at 22% 25%, #5a3c22, #2b1d12 72%); font-family: Georgia, serif; align-items: center; justify-content: center; text-align: center; }
  .a1-emoji { font-size: 22px; }
  .a1-title { font-size: 27px; font-weight: bold; color: #f7ecd2; line-height: 1.12; }
  .a1-sub { font-size: 13px; color: #e8cfa0; }
  .a1-tag { font-size: 11px; color: #c9ad84; max-width: 85%; }

  .art2 { background: linear-gradient(135deg, #171310, #2e2418); }
  .a2-head { font-size: 15px; font-weight: bold; letter-spacing: .06em; color: #f2d9a0; text-align: center; }
  .a2-stats { display: flex; gap: 6px; }
  .a2-stats span { flex: 1; background: #f5ecd8; color: #3a2c22; border-radius: 8px; padding: 6px 7px; font-size: 9.5px; text-align: center; }
  .a2-note { font-size: 10px; color: #d9c39a; text-align: center; }
  .a2-vocab { background: #f5ecd8; color: #3a2c22; border-radius: 8px; padding: 6px 9px; font-size: 10px; }

  .art3 { background: linear-gradient(135deg, #a35f24, #6f3c14); }
  .art4 { background: linear-gradient(135deg, #3a2418, #241408); }
  .art5 { background: linear-gradient(135deg, #6d5aa8, #4a3a78); }
  .art6 { background: linear-gradient(135deg, #26221c, #14110c); }
  .aP-head { font-weight: bold; font-size: 13px; letter-spacing: .05em; color: #f7ecd2; }
  .aP-body { font-size: 10.5px; }
  .aP-emoji { text-align: center; font-size: 17px; }
  .aP-vocab { background: rgba(255,252,243,.93); color: #3a2c22; border-radius: 8px; padding: 6px 9px; font-size: 9.8px; }

  .art8 { background: linear-gradient(135deg, #c8a06a, #9a7444); color: #3a2c22; }
  .art8 .aP-head { color: #3a2c22; }
  .a8-circle { border: 2px solid #c0392b; border-radius: 999px; padding: 0 6px; font-weight: bold; }
  .a8-red { color: #c0392b; font-weight: bold; font-style: italic; }
  .a8-p { font-size: 9.8px; }

  .art7 { background: linear-gradient(135deg, #c96f3b, #8f4a1e); align-items: center; }
  .a7-head { font-weight: bold; font-size: 14px; color: #fff5e0; letter-spacing: .05em; }
  table.a7-t { width: 100%; border-collapse: collapse; font-size: 9.6px; background: #fdf6e8; color: #3a2c22; }
  .a7-t th, .a7-t td { border: 1px solid #b98d55; padding: 3.5px 5px; text-align: center; line-height: 1.3; }
  .a7-t th { background: #f0dcb4; }

  .art9 { background: #f2e9d2; color: #3a2c22; }
  .a9-head { font-weight: bold; font-size: 14px; color: #3a2c22; text-align: center; }
  .art9 ol { margin: 0; padding-left: 16px; font-size: 10px; }
  .art9 li { margin: 3px 0; }
  .art9 b { color: #a33c22; }

  .art10 { background: linear-gradient(135deg, #3c4a63, #232c3d); }
  .a10-head { font-weight: bold; font-size: 15px; color: #ffffff; }
  .art10 ol { margin: 0; padding-left: 16px; font-size: 10.2px; }
  .art10 li { margin: 3px 0; }
  .a10-foot { background: rgba(255,255,255,.12); border-radius: 8px; padding: 6px 9px; font-size: 10px; }

  /* ===== TIMER ===== */
  .timer-row { display: flex; align-items: center; gap: .6rem; margin: .2rem 0 .7rem; }
  .timer-bar-wrap { flex: 1; height: 10px; background: #e8d9c3; border-radius: 999px; overflow: hidden; }
  #timerBar { height: 100%; width: 100%; background: linear-gradient(90deg, #3e7c4f, #8fbf6a); transition: width 1s linear; }
  #timerBar.danger { background: linear-gradient(90deg, #b0452f, #d96a4b); }
  #timerLabel { font-size: .88rem; font-weight: bold; color: var(--accent-dark); min-width: 52px; text-align: right; }

  /* ===== QUESTION ===== */
  .q-text { font-size: 1.08rem; font-weight: bold; margin: .3rem 0 .9rem; }
  .options { display: grid; gap: .55rem; }
  .option {
    text-align: left; background: #fbf5ea; border: 2px solid var(--line);
    border-radius: 12px; padding: .65rem .95rem; font-size: .98rem; cursor: pointer;
    font-family: inherit; color: var(--ink); transition: border-color .15s, background .15s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); background: #fdf6ec; }
  .option.correct { background: var(--green-bg); border-color: var(--green); color: #2c5c39; font-weight: bold; }
  .option.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); }
  .option.gone { display: none; }

  .powerups { display: flex; gap: .5rem; flex-wrap: wrap; margin: .8rem 0 0; }
  .powerup {
    background: #fdf0dc; border: 1.5px dashed var(--accent); border-radius: 10px;
    padding: .35rem .8rem; font-size: .85rem; cursor: pointer; font-family: inherit; color: var(--accent-dark);
  }
  .powerup:disabled { opacity: .4; cursor: default; }

  #feedback { margin-top: .8rem; border-radius: 12px; padding: .75rem 1rem; display: none; position: relative; }
  #feedback.show { display: block; animation: pop .2s ease; }
  #feedback.good { background: var(--green-bg); border: 1px solid var(--green); }
  #feedback.bad { background: var(--red-bg); border: 1px solid var(--red); }
  #feedback .fact { display: block; margin-top: .4rem; font-size: .9rem; color: #5c4a3c; }
  .poster-pill { display: inline-block; background: #fdf0dc; border: 1px solid var(--accent); border-radius: 999px;
    padding: .1rem .6rem; font-size: .85rem; font-weight: bold; color: var(--accent-dark); margin-top: .4rem; }
  .float-pts { position: absolute; right: 12px; top: -8px; font-weight: bold; color: var(--green);
    animation: floatUp 1.1s ease-out forwards; pointer-events: none; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-36px); } }
  .next-row { text-align: center; margin-top: .9rem; }

  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .shake { animation: shake .35s; }

  /* ===== GALLERY ===== */
  .gallery { display: grid; grid-template-columns: repeat(5, 1fr); gap: .6rem; margin: 1rem 0; }
  @media (max-width: 620px) { .gallery { grid-template-columns: repeat(3, 1fr); } }
  .poster.mini {
    aspect-ratio: 16 / 9; border-radius: 10px; border: 2px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; color: #f7ecd2; cursor: pointer; position: relative; overflow: hidden;
    padding: 4px; text-align: center;
  }
  .poster.mini:hover { border-color: var(--accent); }
  .m-emoji { font-size: 1.5rem; line-height: 1; }
  .m-cap { font-size: .6rem; line-height: 1.2; font-weight: bold; }
  .poster.mini.locked { filter: grayscale(.9) brightness(.75); }
  .poster.mini .lock { position: absolute; font-size: 1.4rem; }
  .m1 { background: #503722; } .m2 { background: #2e2418; } .m3 { background: #a35f24; }
  .m4 { background: #3a2418; } .m5 { background: #5f4f96; } .m6 { background: #2a2620; }
  .m7 { background: #c96f3b; } .m8 { background: #b08a55; } .m9 { background: #7a6748; }
  .m10 { background: #3c4a63; }

  #lightbox { display: none; position: fixed; inset: 0; background: rgba(30,20,10,.86); z-index: 200;
    align-items: center; justify-content: center; flex-direction: column; padding: 1.5rem; }
  #lightbox.show { display: flex; }
  #lightbox .lb-holder { width: min(92vw, 900px); margin: 0; }
  #lightbox .lb-cap { color: #f5e9d6; margin-top: .7rem; font-style: italic; text-align: center; font-size: .9rem; }

  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; margin: 1rem 0; }
  @media (max-width: 480px) { .stat-grid { grid-template-columns: 1fr; } }
  .stat-box { background: #fbf5ea; border: 1px dashed var(--accent); border-radius: 12px; text-align: center; padding: .65rem .4rem; }
  .stat-box b { display: block; font-size: 1.3rem; color: var(--accent-dark); }
  .stat-box span { font-size: .8rem; color: var(--muted); }

  #cheatsheet { display: none; margin-top: 1rem; background: #fdf6ec; border: 1px solid var(--line);
    border-radius: 12px; padding: 1rem 1.2rem; text-align: left; }
  #cheatsheet.show { display: block; }
  #cheatsheet li { margin: .3rem 0; font-size: .92rem; }

  .confetti { position: fixed; top: -50px; font-size: 1.5rem; z-index: 99; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }

  .footer-note { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 1.6rem; }
  .rank { font-size: 2.3rem; margin: .2rem 0; }
  .hearts { font-size: 1.05rem; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">📸 Poster Hunter</div>
    <div class="stats">
      <span>⭐ <b id="statScore">0</b></span>
      <span class="hearts" id="statHearts">❤️❤️❤️</span>
      <span id="statStreak">🔥 0</span>
      <button id="soundBtn" title="Toggle sound">🔊</button>
    </div>
  </div>

  <div class="dots" id="dots"></div>
  <div id="stage"></div>

  <p class="footer-note">Based on the study guide <em>The One After The Superbowl — An English Vocabulary &amp; Reading Journey</em> (Gemini Notebook).</p>
</div>

<div id="lightbox">
  <div class="lb-holder" id="lbHolder"></div>
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
/* ================= CONFIG ================= */
const BASE = "https://item1000-collab.github.io/ai/engoo/20260910-friends-213/";
const imgURL = n => BASE + "slide-00" + (n < 10 ? "0" + n : n) + ".jpg";
const ROUND_TIME = 25;
const TOTAL = 10;

/* ================= SLIDE DATA (questions stay the same) ================= */
const SLIDES = [
  { n: 1, caption: "The Title Card", emoji: "☕",
    q: "The opening slide promises to help you master essential English phrases through…",
    options: ["the biggest sitcom episode of the 1990s", "the greatest sports event of the 1990s", "the most famous coffee house in New York", "the top-rated documentary of the 1990s"],
    correct: 0,
    fact: "The title card reads: 'The One After The Superbowl — An English Vocabulary & Reading Journey. Master essential English phrases through the biggest sitcom episode of the 1990s.'",
    hint: "The picture shows coffee, a notebook and a retro TV — a very sitcom setting." },

  { n: 2, caption: "A Record-Breaking Phenomenon", emoji: "🏆",
    q: "On the 'A Record-Breaking Phenomenon' slide, what was the cost of a 30-second commercial?",
    options: ["$600,000", "$6,000", "$6,000,000", "$60,000"],
    correct: 0,
    fact: "The slide lists: '52.9 Million: Total viewers (most-watched in series history)' and '$600,000: Cost for a 30-second commercial'.",
    hint: "It is a six-figure sum — enough for a house in the 90s." },

  { n: 3, caption: "Plot A: The Hollywood Reunion", emoji: "🐵",
    q: "According to Plot A, who revealed the truth about what really happened to Marcel?",
    options: ["A janitor", "An administrator", "A zoo veterinarian", "The movie director"],
    correct: 0,
    fact: "The slide says: 'An administrator claims Marcel died, but a janitor reveals the truth: Marcel was kidnapped and forced into show business.'",
    hint: "Not the official manager — the person with a mop and a conscience." },

  { n: 4, caption: "Plot B: The Date and the Trap", emoji: "👞",
    q: "According to Plot B, why did Susie steal Chandler's clothes?",
    options: ["As an act of revenge for a 4th-grade prank", "To sell them and buy movie tickets", "Because Chandler took her sweater by mistake", "It was an accident at the restaurant"],
    correct: 0,
    fact: "The slide explains: 'But it is a trap—Susie steals his clothes as an act of revenge, leaving him in terrible embarrassment.'",
    hint: "Remember what Chandler did to her in 4th grade." },

  { n: 5, caption: "Plot C: The Best Friend Rivalry", emoji: "🧶",
    q: "Which word from the Vocab Box describes Monica — 'strongly attracted to someone'?",
    options: ["Smitten", "Tension", "Rivalry", "Threesome"],
    correct: 0,
    fact: "The Vocab Box defines: 'Smitten (adj): Strongly attracted to someone. Monica is smitten but too shy to speak to him.'",
    hint: "It is the only adjective in the box — the others are nouns." },

  { n: 6, caption: "Plot D: The Extras", emoji: "🎬",
    q: "According to Plot D, why did Joey lose his only line in the movie?",
    options: ["Due to severe overacting", "He never came to the film set", "The director cut his character", "He lost his voice before filming"],
    correct: 0,
    fact: "The slide says: 'He finally lands a tiny role as a dying plague victim, but loses his only line due to severe overacting.'",
    hint: "He performed the dying scene a little too… dramatically." },

  { n: 7, caption: "The Character Motivation Matrix", emoji: "🛋️",
    q: "In the Character Motivation Matrix, what was Ross's goal?",
    options: ["Find his old pet monkey", "Get a role in the new movie", "Date his attractive childhood friend", "Date the same famous action star"],
    correct: 0,
    fact: "The Matrix row for Ross: Goal — 'Find his old pet monkey'; Outcome — 'Spends the day in NY with him'; Key vocabulary — 'Reunion, Kidnapped'.",
    hint: "His goal has four legs and a tail." },

  { n: 8, caption: "Idioms & Phrasal Verbs", emoji: "🥨",
    q: "According to the idiom slide, 'Keep your panties on' is a slang expression meaning…",
    options: ["calm down; be patient", "get dressed quickly", "keep a secret forever", "stay angry"],
    correct: 0,
    fact: "The slide notes it is a 'GREAT DOUBLE MEANING!' — here it is literal, because Chandler is actually wearing them.",
    hint: "The friend simply wants Chandler to stop panicking and wait." },

  { n: 9, caption: "Comprehension Check", emoji: "✏️",
    q: "On the Comprehension Check slide, statement 1 about Ross and Marcel at the San Diego Zoo is marked…",
    options: ["False — he found him in New York working in show business", "True — Marcel lived happily at the zoo", "False — because Marcel escaped from the zoo", "False — the zoo never had Marcel"],
    correct: 0,
    fact: "The notebook page shows: '(False: He found him in New York working in show business).'",
    hint: "Look at the pencil note in brackets under statement 1." },

  { n: 10, caption: "Think & Discuss", emoji: "🌧️",
    q: "The final 'Think & Discuss' slide ends with the encouraging words…",
    options: ["'Great job! Review the Character Matrix anytime to refresh your memory.'", "'That is all folks!'", "'See you at the audition!'", "'The coffee is on us.'"],
    correct: 0,
    fact: "The closing line invites you to practice the vocabulary by answering the three discussion questions out loud or in writing.",
    hint: "It praises you and points back to a very useful table." }
];

const PHRASES_GOOD = ["How you doin'! Correct!", "Could this BE any more right?", "Pivot! Nailed it!", "Smelly Cat approves!", "The One Where You Got It Right!"];
const PHRASES_BAD = ["We were on a break! Wrong.", "Oh. My. God. Not quite!", "It's a moo point... and it's wrong.", "Miss Chanandler Bong disagrees!"];

/* ================= DRAWN POSTERS (CSS reconstructions of the slides) ================= */
const ART = {
  1: () => `
    <div class="art art1">
      <div class="a1-emoji">☕ 📺 📼</div>
      <div class="a1-title">The One After<br>The Superbowl</div>
      <div class="a1-sub">An English Vocabulary &amp; Reading Journey</div>
      <div class="a1-tag">Master essential English phrases through the biggest sitcom episode of the 1990s.</div>
    </div>`,
  2: () => `
    <div class="art art2">
      <div class="a2-head">A RECORD-BREAKING PHENOMENON</div>
      <div class="a2-stats">
        <span><b>52.9 Million</b><br>total viewers (most-watched in series history)</span>
        <span><b>$600,000</b><br>cost of a 30-second commercial</span>
        <span><b>1</b><br>Emmy Award won for directing</span>
      </div>
      <div class="a2-note">Aired January 28, 1996, immediately following Super Bowl XXX — top Hollywood talent on board.</div>
      <div class="a2-vocab"><b>📺 VOCAB FLASHCARD</b><br>
        <b>Broadcast</b> (n/v): a television or radio program ·
        <b>Record-breaking</b> (adj): surpassing all previous achievements ·
        <b>Guest star</b> (n): a famous actor appearing temporarily in a show ·
        <b>Sitcom</b> (n): a "situation comedy" television series</div>
    </div>`,
  3: () => `
    <div class="art art3">
      <div class="aP-head">PLOT A · THE HOLLYWOOD REUNION</div>
      <div class="aP-body">Ross travels to the San Diego Zoo to visit his former pet monkey, Marcel. An administrator claims Marcel died, but a janitor reveals the truth: Marcel was kidnapped and forced into show business. Ross travels back to New York, where Marcel is starring in a major Hollywood movie.</div>
      <div class="aP-emoji">🐵 🕶️ 🎬</div>
      <div class="aP-vocab"><b>📚 VOCAB BOX</b> · <b>Reunion</b>: coming together again after being separated · <b>Administrator</b>: a person who manages an organization · <b>Kidnapped</b>: taken away illegally by force · <b>Show business</b>: the entertainment industry (movies, theater, TV)</div>
    </div>`,
  4: () => `
    <div class="art art4">
      <div class="aP-head">PLOT B · THE DATE AND THE TRAP</div>
      <div class="aP-body">Chandler meets Susie, a childhood classmate. In 4th grade, Chandler pulled a cruel prank on her. Now, Susie acts extremely interested in him. They go on a date and make out in a restaurant bathroom. But it is a trap — Susie steals his clothes as an act of revenge, leaving him in terrible embarrassment.</div>
      <div class="aP-emoji">🚪 👞 🧥</div>
      <div class="aP-vocab"><b>📚 VOCAB BOX</b> · <b>Prank</b>: a trick played on someone as a joke · <b>Make out</b> (informal): to kiss passionately · <b>Revenge</b>: action taken to hurt someone because they hurt you · <b>Embarrassment</b>: a feeling of shame, self-consciousness, or awkwardness</div>
    </div>`,
  5: () => `
    <div class="art art5">
      <div class="aP-head">PLOT C · THE BEST FRIEND RIVALRY</div>
      <div class="aP-body">Monica and Rachel both meet a famous action star on the movie set. Monica is smitten but too shy to speak to him. Rachel talks to him but accidentally takes the date for herself. This creates fierce tension and a bitter rivalry. They fight until he suggests a threesome, at which point both women dump him.</div>
      <div class="aP-emoji">🧶 ☕ ☕</div>
      <div class="aP-vocab"><b>📚 VOCAB BOX</b> · <b>Smitten</b>: strongly attracted to someone · <b>Tension</b>: mental or emotional strain; bad feelings between people · <b>Rivalry</b>: competition for the same objective or superiority · <b>Threesome</b>: a romantic encounter involving three people</div>
    </div>`,
  6: () => `
    <div class="art art6">
      <div class="aP-head">PLOT D · THE EXTRAS</div>
      <div class="aP-body">Joey tries desperately to get an audition for the movie. He finally lands a tiny role as a dying plague victim, but loses his only line due to severe overacting. Meanwhile, he goes on a date with a woman who turns out to be a stalker — she believes Joey is actually the fictional doctor he plays on a soap opera.</div>
      <div class="aP-emoji">🎬 🎤 🎸</div>
      <div class="aP-vocab"><b>📚 VOCAB BOX</b> · <b>Audition</b>: an interview for a role as an actor or musician · <b>Overacting</b>: performing a role in an exaggerated, unnatural way · <b>Stalker</b>: a person who obsessively harasses or follows someone</div>
    </div>`,
  7: () => `
    <div class="art art7">
      <div class="a7-head">THE CHARACTER MOTIVATION MATRIX 🛋️</div>
      <table class="a7-t">
        <tr><th>Character</th><th>The Goal</th><th>The Outcome</th><th>Key Vocabulary</th></tr>
        <tr><td>Ross</td><td>Find his old pet monkey</td><td>Spends the day in NY with him</td><td>Reunion, Kidnapped</td></tr>
        <tr><td>Chandler</td><td>Date his attractive childhood friend</td><td>Tricked and left without clothes</td><td>Prank, Revenge, Embarrassment</td></tr>
        <tr><td>Monica &amp; Rachel</td><td>Date the same famous action star</td><td>They fight, then both reject him</td><td>Smitten, Rivalry, Tension</td></tr>
        <tr><td>Joey</td><td>Get a role in the new movie</td><td>Hired, but fails at performing</td><td>Audition, Overacting</td></tr>
      </table>
    </div>`,
  8: () => `
    <div class="art art8">
      <div class="aP-head">English in Action: Idioms &amp; Phrasal Verbs 🥨</div>
      <div class="a8-p"><b>Panel 1:</b> <span class="a8-circle">"Keep your panties on."</span> <span class="a8-red">← GREAT DOUBLE MEANING!</span><br>
        Context: Chandler is trapped in the bathroom wearing only women's underwear. He asks for milk, and a friend replies, "Keep your panties on."<br>
        Meaning: a slang expression meaning "calm down" or "be patient." Here it is a double-meaning joke because Chandler is literally wearing them.</div>
      <div class="a8-p"><b>Panel 2:</b> <span class="a8-circle">"Hamming it up."</span><br>
        Context: Joey is playing a dying plague victim but won't stop hamming up the scene by moaning and moving too much.<br>
        Meaning: to <b>overact</b>; to perform in an exaggerated theatrical way to get attention.</div>
    </div>`,
  9: () => `
    <div class="art art9">
      <div class="a9-head">Comprehension Check: True or False? ✏️</div>
      <ol>
        <li>Ross found his monkey, Marcel, living safely at the San Diego Zoo. <b>(False: he found him in New York working in show business.)</b></li>
        <li>Susie stole Chandler's clothes as an act of revenge for a childhood prank. <b>(True)</b></li>
        <li>Monica and Rachel's rivalry ended because the famous actor chose to date Drew Barrymore instead. <b>(False: they dumped him after he suggested a threesome.)</b></li>
        <li>Joey lost his single movie line because he was overacting. <b>(True)</b></li>
      </ol>
    </div>`,
  10: () => `
    <div class="art art10">
      <div class="a10-head">Think &amp; Discuss 🌧️🏙️</div>
      <ol>
        <li>Explain why Susie's actions against Chandler are considered revenge. Do you think her reaction was justified?</li>
        <li>Describe the tension between Monica and Rachel. How does a romantic interest often test a friendship?</li>
        <li>If you were a guest star on a 1990s sitcom, what kind of character would you want to play?</li>
      </ol>
      <div class="a10-foot"><b>Great job!</b> Review the Character Matrix anytime to refresh your memory.</div>
    </div>`
};

function posterHTML(n) {
  return `
    <div class="poster-holder">
      <img class="remote" src="${imgURL(n)}" alt="Study Guide slide ${n}"
           onload="this.parentElement.classList.add('has-remote')"
           onerror="this.remove()">
      ${ART[n]()}
    </div>`;
}

/* ================= STATE ================= */
const state = {
  round: 0, score: 0, hearts: 3, streak: 0, correct: 0,
  posters: new Set(), dots: [],
  used: { fifty: false, skip: false, time: false },
  timerId: null, timeLeft: ROUND_TIME, roundTotal: ROUND_TIME,
  answered: false, muted: false
};

/* ================= HELPERS ================= */
const $ = sel => document.querySelector(sel);
const stage = $("#stage");
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let lastG = -1, lastB = -1;
const pickGood = () => { let i; do { i = Math.floor(Math.random() * PHRASES_GOOD.length); } while (i === lastG && PHRASES_GOOD.length > 1); lastG = i; return PHRASES_GOOD[i]; };
const pickBad = () => { let i; do { i = Math.floor(Math.random() * PHRASES_BAD.length); } while (i === lastB && PHRASES_BAD.length > 1); lastB = i; return PHRASES_BAD[i]; };

function updateTop() {
  const sc = $("#statScore"); if (sc) sc.textContent = state.score;
  const ht = $("#statHearts"); if (ht) ht.textContent = "❤️".repeat(state.hearts) + "🖤".repeat(3 - state.hearts);
  const st = $("#statStreak"); if (st) st.textContent = "🔥 " + state.streak;
}
function renderDots() {
  const box = $("#dots"); if (!box) return;
  box.innerHTML = SLIDES.map((s, i) => {
    let cls = "dot";
    if (state.dots[i] === "good") cls += " good";
    else if (state.dots[i] === "bad") cls += " bad";
    else if (i === state.round && state.round < TOTAL) cls += " current";
    return "<span class='" + cls + "'></span>";
  }).join("");
}
function setFeedback(type, phrase, fact, posterNum) {
  const fb = $("#feedback"); if (!fb) return;
  fb.className = "show " + (type === "good" ? "good" : "bad");
  fb.innerHTML = "<strong>" + phrase + "</strong>" +
    (fact ? "<span class='fact'>💡 " + fact + "</span>" : "") +
    (posterNum ? "<span class='poster-pill'>📸 Poster unlocked: " + SLIDES[posterNum - 1].caption + "</span>" : "");
}
function award(pts, box) {
  state.score += pts; updateTop();
  if (box) { const f = document.createElement("span"); f.className = "float-pts"; f.textContent = "+" + pts; box.appendChild(f); setTimeout(() => f.remove(), 1100); }
}

/* ================= SOUND ================= */
let audioCtx = null;
function beep(freq, dur, type, gain, when) {
  if (state.muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    const t = audioCtx.currentTime + (when || 0);
    g.gain.setValueAtTime(gain || 0.07, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { }
}
function sound(kind) {
  if (kind === "correct") { beep(660, .12); beep(880, .18, "sine", .07, .1); }
  if (kind === "wrong") { beep(170, .28, "square", .05); }
  if (kind === "unlock") { beep(520, .1); beep(780, .14, "sine", .07, .09); }
  if (kind === "level") { [523, 659, 784].forEach((f, i) => beep(f, .16, "sine", .07, i * .1)); }
  if (kind === "win") { [523, 659, 784, 1047].forEach((f, i) => beep(f, .22, "sine", .08, i * .13)); }
  if (kind === "tick") { beep(300, .05, "square", .02); }
}
 $("#soundBtn").addEventListener("click", () => {
  state.muted = !state.muted;
  const b = $("#soundBtn"); if (b) b.textContent = state.muted ? "🔇" : "🔊";
});

/* ================= TIMER ================= */
function stopTimer() { if (state.timerId) { clearInterval(state.timerId); state.timerId = null; } }
function startTimer() {
  stopTimer();
  state.roundTotal = ROUND_TIME; state.timeLeft = ROUND_TIME;
  updateTimerUI();
  state.timerId = setInterval(() => {
    state.timeLeft--;
    updateTimerUI();
    if (state.timeLeft <= 5 && state.timeLeft > 0) sound("tick");
    if (state.timeLeft <= 0) { stopTimer(); onTimeUp(); }
  }, 1000);
}
function updateTimerUI() {
  const bar = $("#timerBar"), lab = $("#timerLabel");
  if (!bar || !lab) return;
  const pct = Math.max(0, Math.round(state.timeLeft / state.roundTotal * 100));
  bar.style.width = pct + "%";
  bar.className = state.timeLeft <= 8 ? "danger" : "";
  lab.textContent = "⏱ " + Math.max(0, state.timeLeft) + "s";
}

/* ================= SCREENS ================= */
function showStart() {
  stopTimer();
  state.round = 0; state.score = 0; state.hearts = 3; state.streak = 0; state.correct = 0;
  state.posters = new Set(); state.dots = [];
  state.used = { fifty: false, skip: false, time: false };
  updateTop(); renderDots();
  stage.innerHTML = `
    <div class="card">
      <p class="level-tag">📚 A picture-based challenge — every slide is a prize</p>
      <h1>Poster Hunter 📸<br>The One After the Superbowl</h1>
      <p class="tagline">Ten iconic slides from the Study Guide — one question each. Answer correctly and the poster joins your collection!</p>
      <ul class="howto">
        <li>🖼️ Study the <strong>poster</strong> carefully — every answer is hidden in plain sight.</li>
        <li>⏱️ You have <strong>25 seconds</strong> per round. The faster you answer, the bigger the bonus.</li>
        <li>❤️ Three mistakes and the hunt is over.</li>
        <li>🪄 Once per game: <strong>50/50</strong>, <strong>+10 seconds</strong>, and <strong>Skip</strong>.</li>
        <li>🏆 Fill your gallery with all <strong>10 posters</strong>!</li>
      </ul>
      <div class="center"><button class="btn" id="startBtn">Start the Hunt ▶</button></div>
      <p class="center" style="font-size:.85rem;color:var(--muted);margin-bottom:0;">
        Need a refresher first? <a href="${BASE}213-90s-sitcom-english-guide.pdf" target="_blank" rel="noopener">Read the Study Guide (PDF)</a>
      </p>
    </div>`;
  const sb = $("#startBtn");
  if (sb) sb.addEventListener("click", () => { sound("level"); renderRound(); });
}

function renderRound() {
  stopTimer();
  state.answered = false;
  renderDots();
  const s = SLIDES[state.round];
  const opts = shuffle(s.options.map((t, i) => ({ t, ok: i === s.correct })));
  stage.innerHTML = `
    <div class="card">
      <p class="level-tag">Round ${state.round + 1} of ${TOTAL} · Target: ${s.caption} ${s.emoji}</p>
      ${posterHTML(s.n)}
      <div class="timer-row">
        <div class="timer-bar-wrap"><div id="timerBar"></div></div>
        <span id="timerLabel">⏱ ${ROUND_TIME}s</span>
      </div>
      <p class="q-text">${s.q}</p>
      <div class="options" id="optBox">
        ${opts.map((o) => `<button class="option" data-ok="${o.ok ? 1 : 0}">${o.t}</button>`).join("")}
      </div>
      <div class="powerups">
        <button class="powerup" id="fiftyBtn" ${state.used.fifty ? "disabled" : ""}>✂️ 50/50</button>
        <button class="powerup" id="timeBtn" ${state.used.time ? "disabled" : ""}>⏱️ +10s</button>
        <button class="powerup" id="skipBtn" ${state.used.skip ? "disabled" : ""}>⏭️ Skip</button>
        <button class="powerup" id="hintBtn">💡 Hint</button>
      </div>
      <div id="hintBox" style="display:none;background:#fdf6ec;border:1px dashed var(--accent);border-radius:10px;padding:.5rem .8rem;margin-top:.6rem;font-size:.9rem;color:#5c4a3c;"></div>
      <div id="feedback"></div>
      <div class="next-row" id="nextRow"></div>
    </div>`;

  document.querySelectorAll("#optBox .option").forEach(btn => {
    btn.addEventListener("click", () => onAnswer(btn, s));
  });
  const bind = (id, fn) => { const el = $(id); if (el) el.addEventListener("click", fn); };
  bind("#fiftyBtn", useFifty);
  bind("#timeBtn", useTime);
  bind("#skipBtn", useSkip);
  bind("#hintBtn", () => {
    const hb = $("#hintBox");
    if (hb) { hb.textContent = "💡 " + s.hint; hb.style.display = "block"; }
    const b = $("#hintBtn"); if (b) b.disabled = true;
  });

  startTimer();
}

function disableRound() {
  document.querySelectorAll("#optBox .option").forEach(b => b.disabled = true);
  ["#fiftyBtn", "#timeBtn", "#skipBtn", "#hintBtn"].forEach(id => {
    const el = $(id); if (el) el.disabled = true;
  });
}

function useFifty() {
  if (state.used.fifty || state.answered) return;
  state.used.fifty = true;
  const btn = $("#fiftyBtn"); if (btn) btn.disabled = true;
  const wrong = Array.from(document.querySelectorAll("#optBox .option")).filter(b => b.dataset.ok === "0");
  shuffle(wrong).slice(0, 2).forEach(b => b.classList.add("gone"));
  sound("unlock");
}
function useTime() {
  if (state.used.time || state.answered) return;
  state.used.time = true;
  const btn = $("#timeBtn"); if (btn) btn.disabled = true;
  state.timeLeft += 10; state.roundTotal += 10;
  updateTimerUI();
  sound("unlock");
}
function useSkip() {
  if (state.used.skip || state.answered) return;
  state.used.skip = true;
  state.answered = true;
  stopTimer();
  renderDots();
  setFeedback("good", "⏭️ Skipped — no heart lost, but no poster either.", "The poster stays locked. Come back for it in the next game!");
  sound("level");
  nextButton();
}

function onAnswer(btn, s) {
  if (state.answered) return;
  stopTimer();
  state.answered = true;
  disableRound();
  const ok = btn.dataset.ok === "1";
  const fb = $("#feedback");
  if (ok) {
    btn.classList.add("correct");
    state.correct++; state.streak++;
    state.dots[state.round] = "good";
    state.posters.add(s.n);
    const speedBonus = Math.round(Math.max(0, state.timeLeft) / state.roundTotal * 10);
    const streakBonus = Math.min((state.streak - 1) * 2, 10);
    award(10 + speedBonus + streakBonus, fb);
    setFeedback("good", pickGood() + " (+" + speedBonus + " speed, +" + streakBonus + " streak)", s.fact, s.n);
    sound("correct"); setTimeout(() => sound("unlock"), 250);
  } else {
    btn.classList.add("wrong", "shake");
    document.querySelectorAll("#optBox .option").forEach(b => {
      if (b.dataset.ok === "1") b.classList.add("correct");
    });
    state.hearts--; state.streak = 0;
    state.dots[state.round] = "bad";
    setFeedback("bad", pickBad(), "❤️ Heart lost! " + s.fact);
    sound("wrong");
  }
  updateTop(); renderDots();
  nextButton();
}

function onTimeUp() {
  if (state.answered) return;
  state.answered = true;
  disableRound();
  document.querySelectorAll("#optBox .option").forEach(b => {
    if (b.dataset.ok === "1") b.classList.add("correct");
  });
  state.hearts--; state.streak = 0;
  state.dots[state.round] = "bad";
  const s = SLIDES[state.round];
  setFeedback("bad", "⏱️ Time is up!", "❤️ Heart lost! " + s.fact);
  sound("wrong");
  updateTop(); renderDots();
  nextButton();
}

function nextButton() {
  const nr = $("#nextRow"); if (!nr) return;
  const isLast = state.round === TOTAL - 1;
  const dead = state.hearts <= 0;
  const label = dead ? "See the results 💔" : (isLast ? "Open the gallery 🖼️" : "Next poster ▶");
  nr.innerHTML = "<button class='btn' id='nextBtn'>" + label + "</button>";
  const nb = $("#nextBtn");
  if (nb) nb.addEventListener("click", () => {
    if (dead) { gameOver(); return; }
    if (isLast) { finishGame(); return; }
    state.round++;
    renderRound();
  });
}

/* ================= GALLERY & END SCREENS ================= */
function galleryHTML() {
  return "<div class='gallery'>" + SLIDES.map((s, i) => {
    const got = state.posters.has(s.n);
    return "<div class='poster mini m" + s.n + (got ? "" : " locked") + "' data-n='" + s.n + "'>" +
      "<span class='m-emoji'>" + s.emoji + "</span>" +
      "<span class='m-cap'>" + s.caption + "</span>" +
      (got ? "" : "<span class='lock'>🔒</span>") +
      "</div>";
  }).join("") + "</div>";
}
function bindGallery() {
  document.querySelectorAll(".poster.mini").forEach(p => {
    p.addEventListener("click", () => {
      const n = parseInt(p.dataset.n, 10);
      const holder = $("#lbHolder"), cap = $("#lbCap"), lb = $("#lightbox");
      if (holder && cap && lb) {
        holder.innerHTML = posterHTML(n);
        cap.textContent = SLIDES[n - 1].caption + (state.posters.has(n) ? " · collected ✓" : " · still locked 🔒");
        lb.classList.add("show");
      }
    });
  });
  const lb = $("#lightbox");
  if (lb) lb.addEventListener("click", () => lb.classList.remove("show"));
}

function statsBoxes() {
  return `
    <div class="stat-grid">
      <div class="stat-box"><b>${state.posters.size}/${TOTAL}</b><span>posters collected</span></div>
      <div class="stat-box"><b>${state.score}</b><span>points ⭐</span></div>
      <div class="stat-box"><b>${state.correct}/${TOTAL}</b><span>correct answers</span></div>
    </div>`;
}

function rankInfo() {
  const pct = Math.round(state.correct / TOTAL * 100);
  if (pct >= 90) return { emoji: "⭐⭐⭐", rank: "Hollywood Star", note: "A perfect hunt! Marcel wants you in his next movie." };
  if (pct >= 70) return { emoji: "⭐⭐", rank: "Guest Star", note: "Top Hollywood talent — the advertisers approve!" };
  if (pct >= 40) return { emoji: "⭐", rank: "Central Perk Regular", note: "Grab a coffee, study the locked posters, and hunt again." };
  return { emoji: "📚", rank: "On a Break", note: "We were on a break... with the posters. Review the Study Guide and return!" };
}

function finishGame() {
  stopTimer(); sound("win"); confetti();
  renderDots();
  const r = rankInfo();
  stage.innerHTML = `
    <div class="card center">
      <p class="level-tag">🏆 Gallery Complete</p>
      <div class="rank">${r.emoji}</div>
      <h1 style="margin-top:0;">${r.rank}</h1>
      <p class="tagline">${r.note}</p>
      ${statsBoxes()}
      <p class="level-tag" style="margin-bottom:.2rem;">Tap any poster to view it full-size</p>
      ${galleryHTML()}
      <p><em>"Great job! Review the Character Matrix anytime to refresh your memory."</em></p>
      <button class="btn" id="againBtn">🔁 Hunt Again</button>
      <button class="btn secondary" id="cheatBtn">📖 Vocabulary Cheat Sheet</button>
      <a class="btn secondary" href="${BASE}213-90s-sitcom-english-guide.pdf" target="_blank" rel="noopener">📥 Study Guide (PDF)</a>
      <div id="cheatsheet">
        <h3 style="margin-top:0;">📚 All vocabulary from the lesson</h3>
        <ul>
          <li><strong>broadcast</strong> — a television or radio program</li>
          <li><strong>record-breaking</strong> — surpassing all previous achievements</li>
          <li><strong>guest star</strong> — a famous actor appearing temporarily in a show</li>
          <li><strong>sitcom</strong> — a "situation comedy" television series</li>
          <li><strong>reunion</strong> — coming together again after being separated</li>
          <li><strong>administrator</strong> — a person who manages an organization</li>
          <li><strong>kidnapped</strong> — taken away illegally by force</li>
          <li><strong>show business</strong> — the entertainment industry (movies, theater, TV)</li>
          <li><strong>prank</strong> — a trick played on someone as a joke</li>
          <li><strong>make out</strong> — to kiss passionately (informal)</li>
          <li><strong>revenge</strong> — action taken to hurt someone because they hurt you</li>
          <li><strong>embarrassment</strong> — a feeling of shame, self-consciousness, or awkwardness</li>
          <li><strong>smitten</strong> — strongly attracted to someone</li>
          <li><strong>tension</strong> — mental or emotional strain; bad feelings between people</li>
          <li><strong>rivalry</strong> — competition for the same objective or superiority</li>
          <li><strong>audition</strong> — an interview for a role as an actor or musician</li>
          <li><strong>overacting</strong> — performing a role in an exaggerated, unnatural way</li>
          <li><strong>stalker</strong> — a person who obsessively harasses or follows someone</li>
          <li><strong>keep your panties on</strong> — slang: calm down, be patient</li>
          <li><strong>hamming it up</strong> — overacting; performing in an exaggerated way to get attention</li>
        </ul>
      </div>
    </div>`;
  bindGallery();
  const ab = $("#againBtn"); if (ab) ab.addEventListener("click", showStart);
  const cb = $("#cheatBtn"); if (cb) cb.addEventListener("click", () => { const cs = $("#cheatsheet"); if (cs) cs.classList.toggle("show"); });
}

function gameOver() {
  stopTimer(); sound("wrong");
  stage.innerHTML = `
    <div class="card center">
      <div class="big-emoji">💔</div>
      <h2>Out of hearts!</h2>
      <p class="tagline">The hunt ended early — but ${state.posters.size} poster${state.posters.size === 1 ? "" : "s"} ${state.posters.size === 1 ? "is" : "are"} safely in your collection.</p>
      ${statsBoxes()}
      ${state.posters.size > 0 ? "<p class='level-tag'>Your trophies so far — tap to view</p>" + galleryHTML() : "<p>🖼️ No posters yet — the gallery awaits your comeback!</p>"}
      <button class="btn" id="retryBtn">🔁 Retry the Hunt</button>
      <a class="btn secondary" href="${BASE}213-90s-sitcom-english-guide.pdf" target="_blank" rel="noopener">📥 Study Guide (PDF)</a>
    </div>`;
  bindGallery();
  const rb = $("#retryBtn"); if (rb) rb.addEventListener("click", showStart);
}

function confetti() {
  const emojis = ["📸", "☕", "⭐", "🎉", "🖼️", "💛"];
  for (let i = 0; i < 55; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (3 + Math.random() * 3) + "s";
    s.style.animationDelay = (Math.random() * 1.5) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 8000);
  }
}

/* ---------- GO! ---------- */
showStart();
</script>
</body>
</html>
