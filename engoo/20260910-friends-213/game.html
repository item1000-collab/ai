function imgFail(img){

<script>
"use strict";
/* ================= BASE ================= */
const BASE = "https://item1000-collab.github.io/ai/engoo/20260910-friends-213/";
const imgURL = n => BASE + "slide-00" + (n < 10 ? "0" + n : n) + ".jpg";

/* ================= VOCABULARY ================= */
const VOCAB = {
  "broadcast":{w:"broadcast",pos:"noun / verb",lit:"The act of sending a program out over the airwaves, or the program that is sent.",
    ctx:"The whole business of putting a show in front of a mass audience.",
    ex:"The episode was “Aired on January 28, 1996” — the guide pairs the verb aired with this entry, showing that one event can be described with interchangeable media words.",
    def:"Broadcast (n/v): A television or radio program."},
  "record-breaking":{w:"record-breaking",pos:"adjective",lit:"Breaking records, one after another.",
    ctx:"Historically exceptional; better than anything that came before.",
    ex:"The headline “A RECORD-BREAKING PHENOMENON” sits above 52.9 million viewers, “most-watched in series history” — the word and the number prove each other.",
    def:"Record-breaking (adj): Surpassing all previous achievements."},
  "guest star":{w:"guest star",pos:"noun",lit:"A star who appears as a guest.",
    ctx:"A famous actor brought in temporarily to boost ratings and buzz.",
    ex:"The episode was “designed to attract massive advertising revenue by bringing in top Hollywood talent” — the guest stars were literally a business strategy.",
    def:"Guest star (n): A famous actor appearing temporarily in a show."},
  "sitcom":{w:"sitcom",pos:"noun",lit:"A shortening of “situation comedy.”",
    ctx:"A comedy series built on a fixed cast and recurring situations — the genre that made Friends a global phenomenon.",
    ex:"The guide calls it “the biggest sitcom episode of the 1990s,” placing the show inside its genre explicitly.",
    def:"Sitcom (n): A “situation comedy” television series."},
  "reunion":{w:"reunion",pos:"noun",lit:"The act of coming back together.",
    ctx:"An emotional meeting after a long separation, charged with history and warmth.",
    ex:"Ross's storyline is titled “The Hollywood Reunion,” so the word frames the whole plot before a single detail is given.",
    def:"Reunion (n): Coming together again after being separated."},
  "administrator":{w:"administrator",pos:"noun",lit:"A person who administers or manages.",
    ctx:"An official representative of an organization whose version of events turns out to be false.",
    ex:"“An administrator claims Marcel died,” and the lie sets the whole plot in motion.",
    def:"Administrator (n): A person who manages an organization."},
  "kidnapped":{w:"kidnapped",pos:"verb, passive",lit:"Taken away illegally by force.",
    ctx:"Applied darkly and comically to a monkey recruited into the movie industry.",
    ex:"“Marcel was kidnapped and forced into show business” — the passive construction keeps the victim at the center of the sentence.",
    def:"Kidnapped (v): Taken away illegally by force."},
  "show business":{w:"show business",pos:"noun",lit:"The business of shows.",
    ctx:"The entertainment industry with all its glamour, money, and ruthlessness.",
    ex:"The janitor's revelation — “forced into show business” — and its happy sequel: “Marcel is starring in a major Hollywood movie.”",
    def:"Show business (n): The entertainment industry (movies, theater, TV)."},
  "prank":{w:"prank",pos:"noun",lit:"A trick played for fun.",
    ctx:"Here, a cruel trick from childhood with consequences that return decades later.",
    ex:"“In 4th grade, Chandler pulled a cruel prank on her” — pulled a prank is the collocation native speakers use automatically.",
    def:"Prank (n): A trick played on someone as a joke."},
  "make out":{w:"make out",pos:"verb, informal",lit:"make + out — meaningless separately, which is exactly why phrasal verbs must be learned whole.",
    ctx:"To kiss passionately; a piece of casual, spoken English.",
    ex:"“They go on a date, and they make out in a restaurant bathroom.”",
    def:"Make out (v, informal): To kiss passionately."},
  "revenge":{w:"revenge",pos:"noun",lit:"A strike returned for a strike.",
    ctx:"Payback for a past hurt, planned with theatrical patience.",
    ex:"“But it is a trap—Susie steals his clothes as an act of revenge.” The phrase as an act of revenge is polished, portable English.",
    def:"Revenge (n): Action taken to hurt someone because they hurt you."},
  "embarrassment":{w:"embarrassment",pos:"noun",lit:"The state of being embarrassed.",
    ctx:"Extreme, public awkwardness — being left alone in a bathroom without clothes.",
    ex:"“…leaving him in terrible embarrassment.” The adjective terrible shows how the noun is normally intensified.",
    def:"Embarrassment (n): A feeling of shame, self-consciousness, or awkwardness."},
  "smitten":{w:"smitten",pos:"adjective",lit:"Struck — the word comes from an older sense of being hit hard.",
    ctx:"Strongly, helplessly attracted to someone; head-over-heels.",
    ex:"“Monica is smitten but too shy to speak to him.” The pairing of smitten with too shy captures a feeling everyone recognizes.",
    def:"Smitten (adj): Strongly attracted to someone."},
  "tension":{w:"tension",pos:"noun",lit:"A physical stretching force — the meaning the guide's image makes visible.",
    ctx:"Strain and bad feeling between people.",
    ex:"“This creates fierce tension and a bitter rivalry.” Two collocations for the price of one sentence.",
    def:"Tension (n): Mental or emotional strain; bad feelings between people."},
  "rivalry":{w:"rivalry",pos:"noun",lit:"The state of being rivals.",
    ctx:"Competition for the same prize, especially when it poisons a friendship between two best friends.",
    ex:"“…a bitter rivalry” between Monica and Rachel over one famous action star.",
    def:"Rivalry (n): Competition for the same objective or superiority."},
  "threesome":{w:"threesome",pos:"noun",lit:"Any group of three.",
    ctx:"In the guide's words, a romantic encounter involving three people; in the plot, the proposal that instantly ends the rivalry.",
    ex:"“They fight until he suggests a threesome, at which point both women dump him.” One sentence delivers the noun and the verb dump.",
    def:"Threesome (n): A romantic encounter involving three people."},
  "audition":{w:"audition",pos:"noun",lit:"From the Latin audire, “to hear” — historically, a hearing.",
    ctx:"The test performance that decides who gets a role.",
    ex:"“Joey tries desperately to get an audition for the movie” — get an audition is the natural pairing.",
    def:"Audition (n): An interview for a role as an actor or musician."},

/* ================= AUDIO ================= */
let AC=null;
function beep(f,d,type,g,when){
  if(state.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), gn=AC.createGain();
    o.type=type||"sine"; o.frequency.value=f;
    const t=AC.currentTime+(when||0);
    gn.gain.setValueAtTime(g||.06,t);
    gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(gn); gn.connect(AC.destination);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
function noise(dur,g){
  if(state.muted) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const n=Math.floor(AC.sampleRate*dur), buf=AC.createBuffer(1,n,AC.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<n;i++) ch[i]=(Math.random()*2-1)*(1-i/n);
    const src=AC.createBufferSource(); src.buffer=buf;
    const gn=AC.createGain(); gn.gain.value=g||.08;
    const fl=AC.createBiquadFilter(); fl.type="highpass"; fl.frequency.value=900;
    src.connect(fl); fl.connect(gn); gn.connect(AC.destination); src.start();
  }catch(e){}
}
const S = {
  click:()=>beep(420,.06,"sine",.04),
  type:()=>beep(950+Math.random()*300,.015,"square",.008),
  collect:()=>{beep(560,.1,"sine",.06);beep(840,.14,"sine",.05,.08);},
  good:()=>{beep(660,.12);beep(880,.18,"sine",.06,.1);},
  bad:()=>beep(160,.28,"square",.05),
  open:()=>{beep(500,.08,"sine",.05);beep(760,.12,"sine",.04,.07);},
  chapter:()=>[523,659,784].forEach((f,i)=>beep(f,.15,"sine",.06,i*.09)),
  win:()=>[523,659,784,1047].forEach((f,i)=>beep(f,.2,"sine",.07,i*.12)),
  static:()=>noise(.55,.1)

/* ================= TYPEWRITER ================= */
let skipFlag=false, typingNow=false;
function typeInto(el,text,done){
  const sess=state.typeSession;
  let i=0; const step=Math.max(2,Math.round(text.length/120));
  el.classList.add("tw"); typingNow=true;
  const iv=setInterval(()=>{
    if(sess!==state.typeSession){clearInterval(iv); typingNow=false; return;}
    if(skipFlag){ skipFlag=false; typingNow=false; el.textContent=text; el.classList.add("done"); clearInterval(iv); done(); return; }
    i+=step;
    el.textContent=text.slice(0,i);
    if(i%6===0) S.type();
    if(i>=text.length){ typingNow=false; el.textContent=text; el.classList.add("done"); clearInterval(iv); done(); }
  },16);
}
function playNarr(items,box,done){
  state.typeSession++; const sess=state.typeSession;
  if(!box){ if(done)done(); return; }
  let i=0;
  function next(){
    if(sess!==state.typeSession) return;
    if(i>=items.length){ if(done)done(); return; }
    const it=items[i];
    if(it.t==="q"){
      const el=document.createElement("div"); el.className="q"; el.style.visibility="hidden";
      el.innerHTML=esc(it.x)+`<span class="src">— from the study guide</span>`;
      box.appendChild(el);
      setTimeout(()=>{ if(sess!==state.typeSession)return;
        el.style.visibility="visible"; S.open(); i++; setTimeout(next,250);
      },250);
      return;
    }
    skipFlag=false;
    const el=document.createElement("p"); box.appendChild(el);
    typeInto(el,it.x,()=>{ i++; setTimeout(next,100); });
  }
  next();
}

function tvBlock(imgN,cap){
  const safeCap=esc(cap||"");
  const inner = imgN
    ? `<img src="${imgURL(imgN)}" alt="${safeCap}" referrerpolicy="no-referrer" onerror="imgFail(this)">`
    : `<div class="noimg"><span class="ne">🎬</span><span class="ns">DIRECTOR'S CUT</span></div>`;
  return `
  <div class="tv">
    <div class="screen">${inner}</div>
    <div class="tv-controls"><span class="knob"></span><span class="knob"></span><span class="speaker"></span></div>
  </div>
  ${cap?`<div class="tv-caption">🖼️ Memory: ${safeCap}</div>`:""}`;
}

function handleQuizOpt(opt){
  const box=$("#quizBox"); if(!box||opt.disabled||!state.scene) return;
  const ch=CHAPTERS[state.ch]; if(!ch||!ch.quiz) return;
  const fb=$("#quizFb"); if(!fb) return;
  if(opt.dataset.ok==="1"){
    if(state.scene.quizDone) return;
    box.querySelectorAll(".opt").forEach(b=>b.disabled=true);
    opt.classList.add("correct");
    state.scene.quizDone=true; state.correct++;
    state.pts+=state.scene.quizTried?5:15;
    fb.className="fb show good";
    fb.innerHTML=`<strong>${state.scene.quizTried?"+5 ☕ — got there!":"+15 ☕ How you doin'!"}</strong><br>💡 ${esc(ch.quiz.fact)}`;
    S.good(); hud(); checkSceneDone();
  }else{
    state.scene.quizTried=true;
    opt.disabled=true; opt.classList.add("wrong");
    fb.className="fb show bad";
    fb.innerHTML=`<strong>We were on a break — try again!</strong>`;

  }

  const ok=(btn.dataset.v==="1")===item.ok;
  box.querySelectorAll(".opt").forEach(b=>b.disabled=true);
  if(ok){ btn.classList.add("correct"); state.scene.trialOk++; state.correct++; state.pts+=15; fb.className="fb show good"; S.good(); }
  else{ btn.classList.add("wrong"); state.pts+=5; fb.className="fb show bad"; S.bad();
    box.querySelectorAll(".opt").forEach(b=>{ if((b.dataset.v==="1")===item.ok) b.classList.add("correct"); });
  }
  fb.innerHTML=(ok?"<strong>+15 ☕ Precise reading!</strong>":"<strong>+5 ☕ Noted!</strong>")+"<br>💡 "+esc(item.why);
  state.scene.trialIdx++;
  setTimeout(()=>{ if(CHAPTERS[state.ch]===ch && state.scene) renderTrialItem(ch); },1400);
}

/* ================= COMPLETION GLOW (never a gate) ================= */
function checkSceneDone(){
  try{
    const sc=state.scene, ch=CHAPTERS[state.ch];
    if(!sc||!ch) return;
    let done=true;
    if(ch.quiz) done=done&&sc.quizDone;
    if(ch.matrix) done=done&&sc.extraDone;
    if(ch.symbols) done=done&&sc.extraDone;
    if(ch.trial) done=done&&sc.trialIdx>=ch.trial.length;
    const b=$("#contBtn");
    if(b&&done&&!b.classList.contains("glow")){
      b.classList.add("glow");
      const last=state.ch===TOTAL_CH-1;
      b.textContent=last?"✓ Ready — open the finale album 🏆":"✓ Chapter complete — Continue ▶";
    }
  }catch(e){}
}

/* ================= RENDER CHAPTER — narration auto-starts ================= */
function revealPanel(ch){
  const p=$("#panelBox");
  if(!p){ return; }
  let html="";
  if(ch.words && ch.words.length) html+=shelfHTML(ch.words);
  if(ch.quiz) html+=quizHTML(ch.quiz);
  if(ch.matrix) html+=`<div class="panel-label">🛋️ Tap each character to reveal the row</div>`+
    ch.matrix.map(m=>`<button class="mrow"><span class="mhead">${esc(m.who)}</span><span class="hinttap"> · tap to reveal</span><div class="mbody">${esc(m.body)}</div></button>`).join("");
  if(ch.symbols) html+=`<div class="panel-label">🎓 Tap each symbol to open the commentary</div>`+
    ch.symbols.map(s=>`<div class="sym"><div class="shead">${s.icon} ${esc(s.title)}</div><div class="sbody">${esc(s.body)}</div></div>`).join("");
  if(ch.trial) html+=`<div id="trialBox"></div>`;
  if(ch.finPrompts) html+=`
    <div class="panel-label">🌧️ From the final panel of the guide</div>
    <ol class="prompts">
      <li>Explain why Susie's actions against Chandler are considered revenge. Do you think her reaction was justified?</li>
      <li>Describe the tension between Monica and Rachel. How does a romantic interest often test a friendship?</li>
      <li>If you were a guest star on a 1990s sitcom, what kind of character would you want to play?</li>
    </ol>
    <p style="font-size:.95rem;color:var(--muted);font-style:italic">Say the answers out loud, or write them down — every prompt pushes the new words out of the jar.</p>`;
  p.innerHTML=html; p.classList.add("show");
  if(ch.words && ch.words.length){
    ch.words.forEach(w=>{ if(state.words.has(w)){ const el=document.querySelector(`.bean[data-w="${CSS.escape(w)}"]`); if(el) el.classList.add("done"); } });
    updateShelfLabel();
  }
  if(ch.trial) renderTrialItem(ch);
  checkSceneDone();
}

function renderChapter(i){
  state.ch=i; state.typeSession++; skipFlag=false;
  const ch=CHAPTERS[i];
  state.scene={quizDone:false,quizTried:false,extraDone:false,trialIdx:0,trialOk:0};
  renderChapters(); hud();
  $("#stage").innerHTML=shell(ch,i);
  S.static();
  const nb=$("#narrBox");
  setTimeout(()=>{
    playNarr(ch.narr, nb, ()=>{
      try{ revealPanel(ch); }catch(e){ checkSceneDone(); }
    });
  },350);
}

/* ================= BOOT / FINALE ================= */
function showBoot(){
  state.ch=-1; renderChapters(); hud();
  $("#stage").innerHTML=`
  <div class="scene center">
    <div class="steamrow"><span class="steam" style="left:46%"></span><span class="steam" style="left:50%;animation-delay:.9s"></span><span class="steam" style="left:54%;animation-delay:1.7s"></span></div>
    <div class="steamcup">☕</div>
    <div class="neon-wrap">
      <div class="chapter-tag">An Interactive English Story · Friends, January 28, 1996</div>
      <h1 class="neon" style="font-size:2rem;margin:.4rem 0">THE ONE AFTER THE SUPERBOWL</h1>
      <div class="neon-sub">Master 21 essential English phrases through the biggest sitcom episode of the 1990s — one memory at a time.</div>
    </div>
    ${tvBlock(1,"The Title Card")}
    <div style="max-width:520px;margin:0 auto;text-align:left">
      <p style="font-size:1rem">The café is quiet, the coffee is warm, and an old television flickers to life in the corner. Inside it sleeps the night when 52.9 million people stayed on the couch — the most-watched episode in the series' history, a $600,000-per-ad broadcast, an Emmy for directing.</p>
      <p style="font-size:1rem">Walk through ten memories, collect phrases into your jar for bonus coffee, pass the comprehension trial, and hear the director's commentary on the symbols hiding behind the laughs.</p>
    </div>
    <div class="navrow">
      <button class="btn" data-action="enter">Enter the café ▶</button>
    </div>
    <p class="center" style="font-size:.8rem;color:var(--muted)">
      Prefer the original first? <a href="${BASE}213-90s-sitcom-english-guide.pdf" target="_blank" rel="noopener" style="color:var(--amber)">Open the Study Guide (PDF)</a>
    </p>
  </div>`;
}

function showFinaleAlbum(){
  S.win(); confetti();
  const pctWords=state.words.size/21, pctQuiz=state.correct/state.quizTotal;
  const pct=Math.round((pctQuiz*0.65+pctWords*0.35)*100);
  let rank,note;
  if(pct>=90){rank="⭐⭐⭐ Hollywood Star";note="A perfect evening at the café. Marcel wants you in his next movie.";}
  else if(pct>=70){rank="⭐⭐ Guest Star";note="Top Hollywood talent — the advertisers approve.";}
  else if(pct>=40){rank="⭐ Central Perk Regular";note="The couch is saved for you — reopen the jar and return for the missing words.";}
  else{rank="📚 On a Break";note="We were on a break… with the vocabulary. Review the study guide and come back.";}
  const ch=CHAPTERS[TOTAL_CH-1];
  $("#stage").innerHTML=`
  <div class="scene">
    ${ch.rain?`<div class="rain-layer" id="rainL"></div>`:""}
    <div class="chapter-tag">Finale · The Memory Album</div>
    <h2>The One Where You Collected Every Memory</h2>
    ${tvBlock(ch.img,ch.cap)}
    <div class="grad-line"></div>
    <div class="rank">${rank.split(" ")[0]}</div>
    <div class="rankname">${rank.split(" ").slice(1).join(" ")}</div>
    <p class="center" style="font-style:italic;color:var(--muted)">${note}</p>
    <div class="statgrid">
      <div class="sbox"><b>${state.mem.size}/10</b><span>memories on the shelf</span></div>
      <div class="sbox"><b>${state.words.size}/21</b><span>phrases in the jar</span></div>
      <div class="sbox"><b>${state.pts}</b><span>coffee points ☕</span></div>
    </div>
    <div class="panel-label">🖼️ The memory shelf — tap any photo</div>
    <div class="album" id="album"></div>
    <div class="q">“Great job! Review the Character Matrix anytime to refresh your memory.”<span class="src">— the study guide, closing words</span></div>
    <p style="font-size:.97rem">The main takeaway is the method itself — story first, matrix second, idioms third, quiz fourth, discussion last. It is a complete learning loop wrapped in twenty-two minutes of television history. Download the full study guide, watch or rewatch the episode, retell each plot using the goal–outcome–vocabulary template, and try <em>hamming it up</em> the next time a friend overdoes something. Review the matrix until the words feel like old friends — because in the end that is what a vocabulary reunion is: <strong>coming together again after being separated.</strong></p>
    <div class="navrow">
      <button class="btn" data-action="again">🔁 Watch it again</button>
      <a class="btn ghost" href="${BASE}213-90s-sitcom-english-guide.pdf" target="_blank" rel="noopener">📥 Study Guide (PDF)</a>
    </div>
  </div>`;
  if(ch.rain){
    const rl=$("#rainL");
    if(rl) for(let i=0;i<70;i++){
      const d=document.createElement("span"); d.className="drop";
      d.style.left=Math.random()*100+"%";
      d.style.animationDuration=(.7+Math.random()*.9)+"s";
      d.style.animationDelay=(Math.random()*2)+"s";
      rl.appendChild(d);
    }
  }
  buildAlbum(); renderChapters(); window.scrollTo({top:0,behavior:"smooth"});
}
function buildAlbum(){
  const al=$("#album"); if(!al) return;
  const names=[{img:1,cap:"The Title Card"}].concat(CHAPTERS.filter(c=>c.img&&c.img!==1&&c.cap).map(c=>({img:c.img,cap:c.cap})));
  al.innerHTML=names.map(c=>{
    const got=state.mem.has(c.img);
    return `<div class="polaroid ${got?"":"locked"}" data-n="${c.img}">
      <div class="ph"><img src="${imgURL(c.img)}" alt="${esc(c.cap)}" referrerpolicy="no-referrer" onerror="imgFail(this)"></div>
      <div class="num">№${c.img}</div>
      ${got?"":"<div class='lock'>🔒</div>"}
      <div class="cap">${esc(c.cap)}</div>
    </div>`;
  }).join("");
}
function openMemory(n){
  let cap="Memory №"+n;
  if(n===1) cap="The Title Card";
  else{ const ch=CHAPTERS.find(c=>c.img===n); if(ch&&ch.cap) cap=ch.cap; }
  const card=$("#lbCard");
  card.innerHTML=`<button class="close-x" data-close="lbOverlay">✕</button>
    <div class="tv"><div class="screen"><img src="${imgURL(n)}" alt="${esc(cap)}" referrerpolicy="no-referrer" onerror="imgFail(this)"></div>
    <div class="tv-controls"><span class="knob"></span><span class="knob"></span><span class="speaker"></span></div></div>
    <p class="center" style="color:var(--muted);font-style:italic">${esc(cap)} ${state.mem.has(n)?"· collected ✓":"· still locked 🔒"}</p>`;
  $("#lbOverlay").classList.add("show");
}

/* ================= JAR ================= */
function openJar(){
  const list=$("#jarList");
  const entries=[...state.words];
  list.innerHTML = entries.length
    ? entries.map(w=>`<div class="wrow">🫘 <b>${esc(VOCAB[w].w)}</b> <span class="pos">(${esc(VOCAB[w].pos)})</span><br>${esc(VOCAB[w].def)}</div>`).join("")
    : `<p class="pos">The jar is empty for now. Every chapter hides new phrases — collecting them earns bonus coffee but never blocks the story.</p>`;
  $("#jarOverlay").classList.add("show");
}

/* ================= ONE GLOBAL CLICK DISPATCHER (bulletproof) ================= */
function handleClick(e){
  let t=e.target;
  if(!(t instanceof Element)) t=t.parentElement;
  if(!t) return;

  const closer=t.closest("[data-close]");
  if(closer){ const o=$("#"+closer.dataset.close); if(o)o.classList.remove("show"); return; }

  if(t.classList.contains("overlay")){ t.classList.remove("show"); return; }

  const actEl=t.closest("[data-action]");
  if(actEl){
    const a=actEl.dataset.action;
    if(a==="sound"){ state.muted=!state.muted; const b=$("#sndBtn"); if(b) b.textContent=state.muted?"🔇":"🔊"; return; }
    if(a==="jar"){ openJar(); return; }
    if(a==="enter"){ S.chapter(); state.mem.add(1); hud(); renderChapters(); renderChapter(0); return; }
    if(a==="next-ch"){
      const ch=CHAPTERS[state.ch]; if(!ch) return;
      S.chapter();
      if(ch.img) state.mem.add(ch.img);
      hud(); renderChapters();
      if(state.ch>=TOTAL_CH-1) showFinaleAlbum();
      else renderChapter(state.ch+1);
      window.scrollTo({top:0,behavior:"smooth"});
      return;
    }
    if(a==="collect"){ collectWord(actEl.dataset.w, actEl); return; }
    if(a==="again"){ resetAll(); return; }
    return;
  }

  const bean=t.closest(".bean");
  if(bean){ if(!bean.classList.contains("done")){ S.click(); openWordCard(bean.dataset.w); } return; }

  const optEl=t.closest(".opt");
  if(optEl){
    if(optEl.closest("#quizBox")){ handleQuizOpt(optEl); return; }
    if(optEl.closest("#trialBox")){ handleTrialOpt(optEl); return; }
    return;
  }

  const mr=t.closest(".mrow");
  if(mr){ openExtra(mr,"matrix"); return; }
  const sy=t.closest(".sym");
  if(sy){ openExtra(sy,"symbols"); return; }

  const po=t.closest(".polaroid");
  if(po){ S.click(); openMemory(+po.dataset.n); return; }

  if(t.closest("#narrBox") && typingNow) skipFlag=true;
}
document.addEventListener("click",function(e){
  try{ handleClick(e); }
  catch(err){ try{ checkSceneDone(); }catch(_){ } }
});

function resetAll(){
  state.pts=0; state.words=new Set(); state.mem=new Set(); state.correct=0; state.ch=-1; state.scene=null;
  hud(); showBoot();
}
function confetti(){
  if(!document.getElementById("fallStyle")){
    const st=document.createElement("style"); st.id="fallStyle";
    st.textContent="@keyframes fallC{to{transform:translateY(115vh) rotate(720deg)}}";
    document.head.appendChild(st);
  }
  const emojis=["📸","☕","⭐","🎉","🖼️","💛"];
  for(let i=0;i<50;i++){
    const s=document.createElement("span");
    s.className="confetti"; s.style.position="fixed"; s.style.top="-50px";
    s.style.fontSize="1.5rem"; s.style.zIndex="99";
    s.style.animation="fallC linear forwards";
    s.textContent=emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(3+Math.random()*3)+"s";
    s.style.animationDelay=(Math.random()*1.5)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),8000);
  }
}

/* ---------- GO ---------- */
showBoot();
</script>
</body>
