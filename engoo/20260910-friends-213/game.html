<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The One After the Superbowl ☕ The English Challenge</title>
<style>
  :root {
    --bg: #f7f1e8;
    --card: #fffdf7;
    --ink: #3a2c22;
    --muted: #8a7566;
    --accent: #b0722f;
    --accent-dark: #7c4a1e;
    --line: #e8d9c3;
    --green: #3e7c4f;
    --green-bg: #e8f4ea;
    --red: #b0452f;
    --red-bg: #f9e9e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(180deg, #f7f1e8 0%, #f0e2cd 100%);
    color: var(--ink);
    font-family: 'Trebuchet MS', 'Segoe UI', Verdana, sans-serif;
    line-height: 1.6;
    min-height: 100vh;
  }
  .game-wrap { max-width: 780px; margin: 0 auto; padding: 1.2rem 1rem 3rem; }

  /* ---------- TOP BAR ---------- */
  .topbar {
    display: flex; justify-content: space-between; align-items: center; gap: .6rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: .6rem 1rem; box-shadow: 0 6px 18px rgba(70,45,20,.12);
    margin-bottom: .8rem; flex-wrap: wrap;
  }
  .brand { font-weight: bold; color: var(--accent-dark); font-size: .95rem; }
  .stats { display: flex; gap: .9rem; align-items: center; font-size: .95rem; }
  .stat b { color: var(--accent-dark); }
  #soundBtn { background: none; border: none; font-size: 1.25rem; cursor: pointer; padding: .1rem .3rem; }

  .level-line { display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); margin: .2rem .2rem .35rem; }
  .progress { height: 12px; background: #e8d9c3; border-radius: 999px; overflow: hidden; margin-bottom: 1rem; }
  .progress > div { height: 100%; width: 0%;
    background: linear-gradient(90deg, #b0722f, #d99a52); transition: width .45s ease; }

  /* ---------- CARDS ---------- */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 1.4rem 1.4rem 1.5rem; box-shadow: 0 10px 26px rgba(70,45,20,.14);
    animation: pop .25s ease;
  }
  @keyframes pop { from { transform: scale(.97); opacity: .6; } to { transform: scale(1); opacity: 1; } }
  .level-tag { text-transform: uppercase; letter-spacing: .12em; font-size: .72rem; color: var(--accent); font-weight: bold; }
  h1 { font-size: 1.7rem; margin: .3rem 0 .4rem; color: var(--accent-dark); line-height: 1.25; }
  h2 { font-size: 1.25rem; margin: .2rem 0 .5rem; color: var(--accent-dark); }
  .tagline { font-style: italic; color: #5c4a3c; margin: .4rem 0 1rem; }
  .howto { margin: .8rem 0 1.2rem; padding-left: 1.3rem; }
  .howto li { margin: .35rem 0; }

  .btn {
    display: inline-block; background: linear-gradient(180deg, #c07f37, #a5641f);
    color: #fff8ec; border: none; border-radius: 999px; padding: .75rem 1.6rem;
    font-size: 1.05rem; font-weight: bold; cursor: pointer; font-family: inherit;
    box-shadow: 0 5px 14px rgba(122,74,30,.35); transition: transform .12s;
    margin-top: .4rem;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }
  .btn.secondary { background: var(--card); color: var(--accent-dark); border: 2px solid var(--accent); box-shadow: none; }
  .btn.small { padding: .4rem 1rem; font-size: .9rem; }
  a.btn { text-decoration: none; }

  /* ---------- MC ---------- */
  .q-text { font-size: 1.12rem; font-weight: bold; margin: .6rem 0 1rem; }
  .options { display: grid; gap: .6rem; margin-bottom: .6rem; }
  .option {
    text-align: left; background: #fbf5ea; border: 2px solid var(--line);
    border-radius: 12px; padding: .7rem 1rem; font-size: 1rem; cursor: pointer;
    font-family: inherit; color: var(--ink); transition: border-color .15s, background .15s;
  }
  .option:hover:not(:disabled) { border-color: var(--accent); background: #fdf6ec; }
  .option:disabled { cursor: default; opacity: .85; }
  .option.correct { background: var(--green-bg); border-color: var(--green); color: #2c5c39; font-weight: bold; }
  .option.wrong { background: var(--red-bg); border-color: var(--red); color: var(--red); opacity: .75; }
  .tf-options { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  .tf-options .option { text-align: center; font-weight: bold; font-size: 1.1rem; }
  @media (max-width: 480px) { .tf-options { grid-template-columns: 1fr; } }

  /* ---------- FEEDBACK ---------- */
  #feedback { margin-top: .8rem; border-radius: 12px; padding: .75rem 1rem; display: none; position: relative; }
  #feedback.show { display: block; animation: pop .2s ease; }
  #feedback.good { background: var(--green-bg); border: 1px solid var(--green); }
  #feedback.bad { background: var(--red-bg); border: 1px solid var(--red); }
  #feedback .fact { display: block; margin-top: .4rem; font-size: .92rem; color: #5c4a3c; }
  .float-pts { position: absolute; right: 12px; top: -6px; font-weight: bold; color: var(--green);
    animation: floatUp 1.1s ease-out forwards; pointer-events: none; }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-38px); } }

  .hint-box { font-size: .9rem; color: #5c4a3c; background: #fdf6ec; border: 1px dashed var(--accent);
    border-radius: 10px; padding: .5rem .8rem; margin: .6rem 0 0; display: none; }
  .hint-box.show { display: block; }
  .next-row { text-align: center; margin-top: 1rem; }

  /* ---------- MATCH ---------- */
  .match-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .8rem; margin-top: .6rem; }
  @media (max-width: 560px) { .match-grid { grid-template-columns: 1fr; } }
  .match-col { display: grid; gap: .55rem; align-content: start; }
  .col-label { font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: bold; }
  .chip {
    background: #fbf5ea; border: 2px solid var(--line); border-radius: 12px;
    padding: .55rem .8rem; font-size: .95rem; cursor: pointer; font-family: inherit;
    color: var(--ink); text-align: left; transition: all .15s;
  }
  .chip:hover:not(:disabled) { border-color: var(--accent); }
  .chip.selected { border-color: var(--accent); background: #fdf0dc; box-shadow: 0 0 0 3px #efdcc0; }
  .chip.locked { background: var(--green-bg); border-color: var(--green); color: #2c5c39; cursor: default; opacity: .9; }
  .chip.chip-wrong { background: var(--red-bg); border-color: var(--red); }

  /* ---------- GAP ---------- */
  .gap-sentence { font-size: 1.08rem; margin: .4rem 0 1rem; }
  .gap {
    display: inline-block; min-width: 130px; text-align: center;
    border-bottom: 3px dashed var(--accent); padding: 0 .4rem; margin: 0 .2rem;
    color: var(--accent-dark); font-weight: bold;
  }
  .gap.filled { border-bottom-style: solid; border-color: var(--green); color: var(--green); }
  .bank { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .4rem; }
  .bank .chip { text-align: center; }

  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .shake { animation: shake .35s; }

  /* ---------- RESULTS ---------- */
  .rank { font-size: 2.4rem; margin: .2rem 0; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .7rem; margin: 1rem 0; }
  @media (max-width: 480px) { .stat-grid { grid-template-columns: 1fr; } }
  .stat-box { background: #fbf5ea; border: 1px dashed var(--accent); border-radius: 12px; text-align: center; padding: .7rem .4rem; }
  .stat-box b { display: block; font-size: 1.35rem; color: var(--accent-dark); }
  .stat-box span { font-size: .8rem; color: var(--muted); }

  #cheatsheet { display: none; margin-top: 1rem; background: #fdf6ec; border: 1px solid var(--line);
    border-radius: 12px; padding: 1rem 1.2rem; }
  #cheatsheet.show { display: block; }
  #cheatsheet li { margin: .3rem 0; font-size: .93rem; }

  .confetti { position: fixed; top: -50px; font-size: 1.5rem; z-index: 99; pointer-events: none;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }

  .footer-note { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 1.6rem; }
  .big-emoji { font-size: 3rem; text-align: center; margin: .2rem 0; }
  .center { text-align: center; }
</style>
</head>
<body>
<div class="game-wrap">

  <div class="topbar">
    <div class="brand">☕ The English Challenge</div>
    <div class="stats">
      <span class="stat">☕ <b id="statPoints">0</b></span>
      <span class="stat" id="statStreak">🔥 0</span>
      <button id="soundBtn" title="Toggle sound">🔊</button>
    </div>
  </div>

  <div class="level-line"><span id="levelLabel"></span><span id="itemsLabel"></span></div>
  <div class="progress"><div id="progressBar"></div></div>

  <div id="stage"></div>

  <p class="footer-note">Based on the study guide <em>The One After The Superbowl — An English Vocabulary &amp; Reading Journey</em> (Gemini Notebook).</p>
</div>

<script>
/* ================= DATA ================= */
const PHRASES_CORRECT = [
  "How you doin'! Correct!",
  "Could this BE any more right?",
  "Pivot! Nailed it!",
  "Smelly Cat approves!",
  "We were NOT on a break — correct!",
  "The One Where You Got It Right!"
];
const PHRASES_WRONG = [
  "We were on a break! Try again.",
  "Oh. My. God. Not quite!",
  "It's a moo point... and it's wrong.",
  "Miss Chanandler Bong disagrees!",
  "Janice's voice: OH... NO... TRY AGAIN!"
];

const LEVELS = [
  {
    icon: "📺", name: "A Record-Breaking Phenomenon", type: "mc",
    intro: "Warm-up trivia about the night America stayed on the couch after the Super Bowl.",
    items: [
      { q: "When did the special episode air?",
        options: ["January 28, 1996", "December 24, 1995", "July 4, 1996", "February 28, 1997"],
        correct: 0,
        fact: "The guide: 'Aired on January 28, 1996, immediately following Super Bowl XXX.'",
        hint: "It followed the biggest night in American football — Super Bowl XXX." },
      { q: "How many viewers made it the most-watched episode in series history?",
        options: ["52.9 million", "12.9 million", "95.2 million", "5.29 million"],
        correct: 0,
        fact: "52.9 million people watched — a true record-breaking phenomenon.",
        hint: "Think 'over 50 million' — more than the population of Spain." },
      { q: "What was the cost of a 30-second commercial during the broadcast?",
        options: ["$600,000", "$6,000", "$6,000,000", "$60,000"],
        correct: 0,
        fact: "The episode was 'designed to attract massive advertising revenue by bringing in top Hollywood talent.'",
        hint: "Six figures — it could buy a house in the 90s." },
      { q: "Which award did the episode win?",
        options: ["An Emmy Award for directing", "An Oscar for Best Original Song", "A Grammy for Best Soundtrack", "A Golden Raspberry"],
        correct: 0,
        fact: "The guide lists: '1: Emmy Award won for directing.'",
        hint: "Television's highest honor, for the person who shouts 'Action!'" }
    ]
  },
  {
    icon: "🧩", name: "Vocab Box Match", type: "match",
    intro: "Tap a word, then tap its definition. All definitions come straight from the Study Guide.",
    pairs: [
      { w: "Smitten", d: "Strongly attracted to someone" },
      { w: "Rivalry", d: "Competition for the same objective or superiority" },
      { w: "Revenge", d: "Action taken to hurt someone because they hurt you" },
      { w: "Prank", d: "A trick played on someone as a joke" },
      { w: "Audition", d: "An interview for a role as an actor or musician" },
      { w: "Overacting", d: "Performing a role in an exaggerated, unnatural way" },
      { w: "Reunion", d: "Coming together again after being separated" },
      { w: "Stalker", d: "A person who obsessively harasses or follows someone" }
    ]
  },
  {
    icon: "✏️", name: "English in Action", type: "gap",
    intro: "Complete each quote from the episode summary with the right word from the coffee-house word bank.",
    items: [
      { before: "A janitor reveals the truth: Marcel was ", after: " and forced into show business.", answer: "kidnapped" },
      { before: "Ross travels back to New York, where a joyful ", after: " with his old pet awaits.", answer: "reunion" },
      { before: "Monica is ", after: " but too shy to speak to the famous action star.", answer: "smitten" },
      { before: "Susie steals Chandler's clothes as an act of ", after: ".", answer: "revenge" },
      { before: "Joey finally lands a tiny role as a dying plague victim, but loses his only line due to severe ", after: ".", answer: "overacting" },
      { before: "His date turns out to be a ", after: " who believes Joey is really a doctor.", answer: "stalker" },
      { before: "The competition between the two friends creates fierce ", after: ".", answer: "tension" },
      { before: "Being left without clothes left Chandler in terrible ", after: ".", answer: "embarrassment" }
    ]
  },
  {
    icon: "🎬", name: "The Character Motivation Matrix", type: "mc",
    intro: "Who did what? Match the outcome to the character — goal, outcome, vocabulary!",
    items: [
      { q: "Who lost his only movie line because of severe overacting?",
        options: ["Ross", "Chandler", "Joey", "Monica & Rachel"], correct: 2,
        fact: "The guide: 'He finally lands a tiny role as a dying plague victim, but loses his only line due to severe overacting.'",
        hint: "How you doin'... not! He plays a doctor on a soap opera." },
      { q: "Who was tricked and left without clothes in a restaurant bathroom?",
        options: ["Ross", "Chandler", "Joey", "Monica & Rachel"], correct: 1,
        fact: "The Matrix: 'Tricked and left without clothes.' Key words: Prank, Revenge, Embarrassment.",
        hint: "His childhood prank came back with interest." },
      { q: "Who spent the day in New York with his old pet monkey?",
        options: ["Ross", "Chandler", "Joey", "Monica & Rachel"], correct: 0,
        fact: "The Matrix: 'Spends the day in NY with him.' Key words: Reunion, Kidnapped.",
        hint: "He once owned this monkey as a pet." },
      { q: "Who dumped the famous action star after his infamous suggestion?",
        options: ["Ross", "Chandler", "Joey", "Monica & Rachel"], correct: 3,
        fact: "The Matrix: 'They fight, then both reject him.' Key words: Smitten, Rivalry, Tension.",
        hint: "Two best friends made a joint decision." }
    ]
  },
  {
    icon: "💬", name: "Idiom Detective", type: "mc",
    intro: "The double-meaning edition. Read the context, catch the meaning, feel the humor.",
    items: [
      { q: "Chandler is trapped in the bathroom wearing only women's underwear and asks for milk. A friend replies: 'Keep your panties on.' What does the expression normally mean?",
        options: ["Calm down; be patient", "Get dressed quickly", "Keep a secret forever", "Stay where you are"], correct: 0,
        fact: "The guide: 'A slang expression meaning calm down or be patient.'",
        hint: "The friend is simply telling Chandler to be patient." },
      { q: "Why does the guide mark this idiom with 'GREAT DOUBLE MEANING!'?",
        options: ["Because Chandler is literally wearing them", "Because it rhymes with 'panto'", "Because it was invented in the 1990s", "Because it only works in British English"], correct: 0,
        fact: "The guide: 'Here, it is used as a double-meaning joke because Chandler is literally wearing them.'",
        hint: "Look at what Chandler is (not) wearing." },
      { q: "Joey is playing a dying plague victim but 'won't stop hamming up the scene.' What does 'hamming it up' mean?",
        options: ["To overact; perform in an exaggerated, theatrical way", "To eat too much before filming", "To forget all your lines", "To act nervous and shy"], correct: 0,
        fact: "The guide: 'To overact; to perform in an exaggerated theatrical way to get attention.'",
        hint: "Think theatrical exaggeration — the prefix 'over-'." },
      { q: "Which vocabulary word from the Study Guide means the same as 'hamming it up'?",
        options: ["Overacting", "Reunion", "Rivalry", "Broadcast"], correct: 0,
        fact: "The guide defines overacting as 'performing a role in an exaggerated, unnatural way.'",
        hint: "It starts with 'over-'." }
    ]
  },
  {
    icon: "✅", name: "True or False", type: "mc",
    intro: "The official Comprehension Check. Precision matters — read every statement carefully!",
    items: [
      { q: "Ross found his monkey, Marcel, living safely at the San Diego Zoo.",
        options: ["True", "False"], correct: 1,
        fact: "False — he found him in New York, working in show business.", hint: null },
      { q: "Susie stole Chandler's clothes as an act of revenge for a childhood prank.",
        options: ["True", "False"], correct: 0,
        fact: "True — the cruel prank from 4th grade finally got its payback.", hint: null },
      { q: "Monica and Rachel's rivalry ended because the famous actor chose to date Drew Barrymore instead.",
        options: ["True", "False"], correct: 1,
        fact: "False — they dumped him after he suggested a threesome.", hint: null },
      { q: "Joey lost his single movie line because he was overacting.",
        options: ["True", "False"], correct: 0,
        fact: "True — severe overacting cost him his one and only line.", hint: null }
    ]
  }
];

const CHEATSHEET = [
  ["broadcast", "a television or radio program"],
  ["record-breaking", "surpassing all previous achievements"],
  ["guest star", "a famous actor appearing temporarily in a show"],
  ["sitcom", "a 'situation comedy' television series"],
  ["reunion", "coming together again after being separated"],
  ["administrator", "a person who manages an organization"],
  ["kidnapped", "taken away illegally by force"],
  ["show business", "the entertainment industry (movies, theater, TV)"],
  ["prank", "a trick played on someone as a joke"],
  ["make out", "to kiss passionately (informal)"],
  ["revenge", "action taken to hurt someone because they hurt you"],
  ["embarrassment", "a feeling of shame, self-consciousness, or awkwardness"],
  ["smitten", "strongly attracted to someone"],
  ["tension", "mental or emotional strain; bad feelings between people"],
  ["rivalry", "competition for the same objective or superiority"],
  ["threesome", "a romantic encounter involving three people"],
  ["audition", "an interview for a role as an actor or musician"],
  ["overacting", "performing a role in an exaggerated, unnatural way"],
  ["stalker", "a person who obsessively harasses or follows someone"],
  ["keep your panties on", "slang: calm down, be patient"],
  ["hamming it up", "overacting; performing in an exaggerated way to get attention"]
];

const TOTAL_ITEMS = LEVELS.reduce((s, l) => s + (l.items ? l.items.length : l.pairs.length), 0);

/* ================= STATE ================= */
const state = {
  level: 0, points: 0, streak: 0, bestStreak: 0,
  correct: 0, completed: 0, muted: false,
  mc: null, match: null, gap: null, levelPoints: 0
};

/* ================= HELPERS ================= */
const $ = sel => document.querySelector(sel);
const stage = $("#stage");
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let lastGood = -1, lastBad = -1;
const pickGood = () => { let i; do { i = Math.floor(Math.random() * PHRASES_CORRECT.length); } while (i === lastGood && PHRASES_CORRECT.length > 1); lastGood = i; return PHRASES_CORRECT[i]; };
const pickBad = () => { let i; do { i = Math.floor(Math.random() * PHRASES_WRONG.length); } while (i === lastBad && PHRASES_WRONG.length > 1); lastBad = i; return PHRASES_WRONG[i]; };

function updateTop() {
  $("#statPoints").textContent = state.points;
  $("#statStreak").textContent = "🔥 " + state.streak;
  $("#progressBar").style.width = (state.completed / TOTAL_ITEMS * 100) + "%";
  $("#itemsLabel").textContent = state.completed + " / " + TOTAL_ITEMS + " challenges";
  const lv = state.level;
  $("#levelLabel").textContent = lv < LEVELS.length ? ("Level " + (lv + 1) + " of " + LEVELS.length + " · " + LEVELS[lv].name) : "All levels complete!";
}
function award(pts, box) {
  state.points += pts; state.levelPoints += pts; updateTop();
  if (box) { const f = document.createElement("span"); f.className = "float-pts"; f.textContent = "+" + pts + " ☕"; box.appendChild(f); setTimeout(() => f.remove(), 1100); }
}
function bumpStreak() { state.streak++; state.bestStreak = Math.max(state.bestStreak, state.streak); updateTop(); }
function breakStreak() { state.streak = 0; updateTop(); }
function markCorrect() { state.correct++; state.completed++; updateTop(); }

/* --- FIXED: null-safe feedback functions (this was the freeze bug) --- */
function setFeedback(type, phrase, fact) {
  const fb = $("#feedback");
  if (!fb) return;                       // guard: no feedback element on this screen
  fb.className = "show " + (type === "good" ? "good" : "bad");
  fb.innerHTML = "<strong>" + phrase + "</strong>" + (fact ? "<span class='fact'>💡 " + fact + "</span>" : "");
}
function hideFeedback() {
  const fb = $("#feedback");
  if (!fb) return;                       // guard: nothing to hide
  fb.className = "";
  fb.innerHTML = "";
}

/* ================= SOUND ================= */
let audioCtx = null;
function beep(freq, dur, type, gain, when) {
  if (state.muted) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    const t = audioCtx.currentTime + (when || 0);
    g.gain.setValueAtTime(gain || 0.07, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  } catch (e) { }
}
function sound(kind) {
  if (kind === "correct") { beep(660, .12); beep(880, .18, "sine", .07, .1); }
  if (kind === "wrong") { beep(170, .28, "square", .05); }
  if (kind === "level") { [523, 659, 784].forEach((f, i) => beep(f, .16, "sine", .07, i * .1)); }
  if (kind === "win") { [523, 659, 784, 1047].forEach((f, i) => beep(f, .22, "sine", .08, i * .13)); }
}
 $("#soundBtn").addEventListener("click", () => {
  state.muted = !state.muted;
  $("#soundBtn").textContent = state.muted ? "🔇" : "🔊";
});

/* ================= SCREENS ================= */
function showStart() {
  state.level = 0; updateTop();
  stage.innerHTML = `
    <div class="card">
      <p class="level-tag">📚 An English Vocabulary &amp; Reading Journey — The Game</p>
      <h1>The One After the Superbowl ☕<br>The English Challenge</h1>
      <p class="tagline">Master essential English phrases through the biggest sitcom episode of the 1990s — now as a game!</p>
      <ul class="howto">
        <li>☕ Earn <strong>Coffee Points</strong> for every correct answer.</li>
        <li>🔥 Build a <strong>streak</strong> — one wrong click breaks it!</li>
        <li>🏆 Survive <strong>6 levels and 32 challenges</strong>: trivia, matching, gap-fill, idioms and the final True-or-False check.</li>
      </ul>
      <div class="center"><button class="btn" id="startBtn">Start the Challenge ▶</button></div>
      <p class="center" style="font-size:.85rem;color:var(--muted);margin-bottom:0;">
        Need a refresher first? <a href="https://item1000-collab.github.io/ai/engoo/20260910-friends-213/213-90s-sitcom-english-guide.pdf" target="_blank" rel="noopener">Read the Study Guide (PDF)</a>
      </p>
    </div>`;
  $("#startBtn").addEventListener("click", () => { sound("level"); renderLevelIntro(0); });
}

function renderLevelIntro(i) {
  state.level = i; state.levelPoints = 0; updateTop();
  const L = LEVELS[i];
  const count = L.items ? L.items.length + " " + (L.type === "gap" ? "sentences" : "questions") : L.pairs.length + " word pairs";
  stage.innerHTML = `
    <div class="card center">
      <div class="big-emoji">${L.icon}</div>
      <p class="level-tag">Level ${i + 1} of ${LEVELS.length}</p>
      <h2>${L.name}</h2>
      <p class="tagline">${L.intro}</p>
      <p><strong>${count}</strong> await you.</p>
      <button class="btn" id="goBtn">Bring it on! ☕</button>
    </div>`;
  $("#goBtn").addEventListener("click", () => startLevel(i));
}

function startLevel(i) {
  const L = LEVELS[i];
  if (L.type === "mc") { state.mc = { idx: 0, attempted: false, answered: false }; renderMC(); }
  if (L.type === "match") { state.match = { locked: new Set(), sel: null, words: shuffle(L.pairs.map((p, k) => ({ k, t: p.w }))), defs: shuffle(L.pairs.map((p, k) => ({ k, t: p.d }))) }; renderMatch(); }
  if (L.type === "gap") { state.gap = { idx: 0, attempted: false, bank: shuffle(L.items.map(it => it.answer)) }; renderGap(); }
}

/* ---------- MC ENGINE ---------- */
function renderMC() {
  const L = LEVELS[state.level], q = L.items[state.mc.idx];
  state.mc.attempted = false; state.mc.answered = false;
  const isTF = q.options.length === 2 && (q.options[0] === "True");
  const opts = shuffle(q.options.map((t, i) => ({ t, ok: i === q.correct })));
  stage.innerHTML = `
    <div class="card">
      <p class="level-tag">${L.icon} ${L.name} · Question ${state.mc.idx + 1} of ${L.items.length}</p>
      <p class="q-text">${q.q}</p>
      <div class="options ${isTF ? "tf-options" : ""}" id="optBox">
        ${opts.map((o, n) => `<button class="option" data-n="${n}" data-ok="${o.ok ? 1 : 0}">${o.t}</button>`).join("")}
      </div>
      ${q.hint ? `<button class="btn secondary small" id="hintBtn">💡 Hint</button><div class="hint-box" id="hintBox"></div>` : ""}
      <div id="feedback"></div>
      <div class="next-row" id="nextRow"></div>
    </div>`;
  hideFeedback();
  document.querySelectorAll("#optBox .option").forEach(btn => {
    btn.addEventListener("click", () => onMCAnswer(btn, q));
  });
  const hb = $("#hintBtn");
  if (hb) hb.addEventListener("click", () => { $("#hintBox").textContent = "💡 " + q.hint; $("#hintBox").classList.add("show"); });
}

function onMCAnswer(btn, q) {
  if (state.mc.answered) return;
  if (btn.dataset.ok === "1") {
    state.mc.answered = true;
    btn.classList.add("correct");
    document.querySelectorAll("#optBox .option").forEach(b => b.disabled = true);
    markCorrect(); bumpStreak();
    const pts = state.mc.attempted ? 5 : 10;
    award(pts, $("#feedback"));
    setFeedback("good", pickGood(), q.fact);
    sound("correct");
    const nr = $("#nextRow");
    const last = state.mc.idx === LEVELS[state.level].items.length - 1;
    nr.innerHTML = `<button class="btn" id="nextBtn">${last ? "Finish the level 🎉" : "Next question ▶"}</button>`;
    $("#nextBtn").addEventListener("click", () => {
      if (last) levelComplete();
      else { state.mc.idx++; renderMC(); }
    });
  } else {
    btn.disabled = true; btn.classList.add("wrong");
    state.mc.attempted = true; breakStreak();
    setFeedback("bad", pickBad(), null);
    sound("wrong");
  }
}

/* ---------- MATCH ENGINE ---------- */
function renderMatch() {
  const L = LEVELS[state.level];
  stage.innerHTML = `
    <div class="card">
      <p class="level-tag">${L.icon} ${L.name} · ${L.pairs.length} pairs</p>
      <p class="q-text">Tap a <strong>word</strong>, then tap its <strong>definition</strong>.</p>
      <div class="match-grid">
        <div class="match-col"><div class="col-label">📚 Words</div>${state.match.words.map(w => `<button class="chip" data-side="w" data-key="${w.k}">${w.t}</button>`).join("")}</div>
        <div class="match-col"><div class="col-label">📖 Definitions</div>${state.match.defs.map(d => `<button class="chip" data-side="d" data-key="${d.k}">${d.t}</button>`).join("")}</div>
      </div>
      <div id="feedback"></div>
    </div>`;
  hideFeedback();
  document.querySelectorAll("#stage .chip").forEach(chip => {
    chip.addEventListener("click", () => {
      if (chip.classList.contains("locked")) return;
      if (chip.dataset.side === "w") onWordPick(chip);
      else onDefPick(chip);
    });
  });
}

function onWordPick(chip) {
  const m = state.match;
  if (m.sel) m.sel.classList.remove("selected");
  if (m.sel === chip) { m.sel = null; return; }
  m.sel = chip; chip.classList.add("selected");
  hideFeedback();
}

function onDefPick(chip) {
  const m = state.match;
  if (!m.sel) { setFeedback("bad", "Tap a word first ☝️", null); return; }
  const wordChip = m.sel;
  if (chip.dataset.key === wordChip.dataset.key) {
    wordChip.classList.remove("selected");
    wordChip.classList.add("locked"); wordChip.disabled = true;
    chip.classList.add("locked"); chip.disabled = true;
    m.locked.add(chip.dataset.key); m.sel = null;
    markCorrect(); bumpStreak(); award(10, $("#feedback"));
    setFeedback("good", pickGood(), null);
    sound("correct");
    if (m.locked.size === LEVELS[state.level].pairs.length) setTimeout(levelComplete, 700);
  } else {
    wordChip.classList.remove("selected"); m.sel = null;
    [wordChip, chip].forEach(c => { c.classList.add("chip-wrong", "shake"); setTimeout(() => c.classList.remove("chip-wrong", "shake"), 500); });
    breakStreak();
    setFeedback("bad", pickBad(), null);
    sound("wrong");
  }
}

/* ---------- GAP ENGINE ---------- */
function renderGap() {
  const L = LEVELS[state.level], it = L.items[state.gap.idx];
  state.gap.attempted = false;
  stage.innerHTML = `
    <div class="card">
      <p class="level-tag">${L.icon} ${L.name} · Sentence ${state.gap.idx + 1} of ${L.items.length}</p>
      <p class="gap-sentence">${state.gap.idx + 1}. ${it.before} <span class="gap" id="gapSlot">______</span>${it.after}</p>
      <div class="col-label" style="margin-bottom:.4rem;">☕ Word bank — tap a word</div>
      <div class="bank" id="bank">
        ${state.gap.bank.map(w => `<button class="chip" data-w="${w}">${w}</button>`).join("")}
      </div>
      <div id="feedback"></div>
    </div>`;
  hideFeedback();
  document.querySelectorAll("#bank .chip").forEach(chip => {
    chip.addEventListener("click", () => onGapChip(chip, it));
  });
}

function onGapChip(chip, it) {
  if ($("#gapSlot").classList.contains("filled")) return;
  if (chip.dataset.w === it.answer) {
    const slot = $("#gapSlot");
    slot.textContent = it.answer; slot.classList.add("filled");
    chip.remove();
    document.querySelectorAll("#bank .chip").forEach(c => c.disabled = true);
    markCorrect(); bumpStreak();
    const pts = state.gap.attempted ? 5 : 10;
    award(pts, $("#feedback"));
    setFeedback("good", pickGood(), null);
    sound("correct");
    setTimeout(() => {
      state.gap.idx++;
      if (state.gap.idx < LEVELS[state.level].items.length) renderGap();
      else levelComplete();
    }, 850);
  } else {
    chip.classList.add("chip-wrong", "shake");
    setTimeout(() => chip.classList.remove("chip-wrong", "shake"), 500);
    state.gap.attempted = true; breakStreak();
    setFeedback("bad", pickBad(), null);
    sound("wrong");
  }
}

/* ---------- LEVEL COMPLETE ---------- */
function levelComplete() {
  sound("level");
  const last = state.level === LEVELS.length - 1;
  stage.innerHTML = `
    <div class="card center">
      <div class="big-emoji">🎉</div>
      <h2>Level ${state.level + 1} cleared!</h2>
      <p>You earned <strong>☕ +${state.levelPoints} Coffee Points</strong> in this level.</p>
      <button class="btn" id="lvlNextBtn">${last ? "See the final results 🏆" : "Next level ▶"}</button>
    </div>`;
  $("#lvlNextBtn").addEventListener("click", () => {
    if (last) finishGame();
    else renderLevelIntro(state.level + 1);
  });
}

/* ---------- FINAL ---------- */
function finishGame() {
  sound("win"); confetti();
  const pct = Math.round(state.correct / TOTAL_ITEMS * 100);
  let rank, emoji, note;
  if (pct >= 90) { emoji = "⭐⭐⭐"; rank = "Hollywood Star"; note = "Marcel wants you in his next movie!"; }
  else if (pct >= 70) { emoji = "⭐⭐"; rank = "Guest Star"; note = "Top Hollywood talent — the advertisers approve!"; }
  else if (pct >= 50) { emoji = "⭐"; rank = "Central Perk Regular"; note = "Grab a coffee and try once more — the couch is saved for you."; }
  else { emoji = "📚"; rank = "On a Break"; note = "We were on a break... with the vocabulary. Review the Study Guide and come back!"; }
  stage.innerHTML = `
    <div class="card center">
      <p class="level-tag">🏆 Final Results</p>
      <div class="rank">${emoji}</div>
      <h1 style="margin-top:0;">${rank}</h1>
      <p class="tagline">${note}</p>
      <div class="stat-grid">
        <div class="stat-box"><b>${state.correct}/${TOTAL_ITEMS}</b><span>correct answers</span></div>
        <div class="stat-box"><b>${state.points}</b><span>Coffee Points ☕</span></div>
        <div class="stat-box"><b>${state.bestStreak}</b><span>best streak 🔥</span></div>
      </div>
      <p><em>"Great job! Review the Character Matrix anytime to refresh your memory."</em></p>
      <button class="btn" id="againBtn">🔁 Play Again</button>
      <button class="btn secondary" id="cheatBtn">📖 Vocabulary Cheat Sheet</button>
      <a class="btn secondary" href="https://item1000-collab.github.io/ai/engoo/20260910-friends-213/213-90s-sitcom-english-guide.pdf" target="_blank" rel="noopener">📥 Download the Study Guide (PDF)</a>
      <div id="cheatsheet">
        <h3 style="margin-top:0;">📚 All vocabulary from the lesson</h3>
        <ul style="text-align:left;">${CHEATSHEET.map(p => `<li><strong>${p[0]}</strong> — ${p[1]}</li>`).join("")}</ul>
      </div>
    </div>`;
  $("#againBtn").addEventListener("click", showStart);
  $("#cheatBtn").addEventListener("click", () => $("#cheatsheet").classList.toggle("show"));
}

function confetti() {
  const emojis = ["☕", "🍩", "⭐", "🎉", "📺", "🧦", "💛"];
  for (let i = 0; i < 60; i++) {
    const s = document.createElement("span");
    s.className = "confetti";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (3 + Math.random() * 3) + "s";
    s.style.animationDelay = (Math.random() * 1.5) + "s";
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 8000);
  }
}

/* ---------- GO! ---------- */
showStart();
</script>
</body>
</html>
