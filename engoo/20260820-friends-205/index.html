<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources · PDF files</title>
    <!-- Google Font: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <style>
        /* reset & base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f6f3;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .container {
            max-width: 820px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.08), 0 8px 24px -6px rgba(0, 0, 0, 0.02);
            padding: 2rem 2rem 1.5rem;
            transition: box-shadow 0.2s;
        }

        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem 0.5rem;
            margin-bottom: 1.75rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .logo-icon {
            font-size: 2rem;
            line-height: 1;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .title {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #1a1a2e;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 0.9rem;
            font-weight: 400;
            color: #6b7280;
            letter-spacing: -0.01em;
            margin-top: 0.1rem;
        }

        /* badge (pulsing dot + label) */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(224, 122, 95, 0.08);
            padding: 0.4rem 1rem 0.4rem 0.9rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #1a1a2e;
            letter-spacing: -0.01em;
            border: 1px solid rgba(224, 122, 95, 0.15);
            backdrop-filter: blur(2px);
        }

        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #e07a5f;
            border-radius: 50%;
            position: relative;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background-color: #e07a5f;
            opacity: 0.4;
            animation: pulse-ring 2s ease-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.6; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* card grid */
        .card-grid {
            background: #ffffff;
            border-radius: 16px;
            padding: 0.25rem 0 0.25rem 0;
            display: flex;
            flex-direction: column;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.9rem 1.2rem;
            border-radius: 16px;
            text-decoration: none;
            color: #1a1a2e;
            background: transparent;
            transition: all 0.2s ease;
            border: 1.5px solid transparent;
            margin-bottom: 0.2rem;
            position: relative;
        }

        .item:last-child {
            margin-bottom: 0;
        }

        .item:hover {
            background: #fcfaf8;
            border-color: #e07a5f;
            box-shadow: 0 4px 12px rgba(224, 122, 95, 0.06);
            transform: translateY(-1px);
        }

        .item .emoji {
            font-size: 1.5rem;
            line-height: 1;
            flex-shrink: 0;
            width: 2rem;
            text-align: left;
        }

        .item .name {
            font-size: 0.98rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #1a1a2e;
            word-break: break-word;
            flex: 1;
        }

        .item .arrow {
            font-size: 1.2rem;
            color: #cbd5e1;
            transition: all 0.2s;
            opacity: 0;
            transform: translateX(-4px);
            flex-shrink: 0;
        }

        .item:hover .arrow {
            opacity: 1;
            transform: translateX(2px);
            color: #e07a5f;
        }

        /* footer */
        .footer {
            margin-top: 2.2rem;
            text-align: center;
            font-size: 0.8rem;
            color: #9ca3af;
            letter-spacing: 0.2px;
            border-top: 1px solid #f0eeea;
            padding-top: 1.5rem;
            font-weight: 400;
        }

        /* responsive grid: 2 columns on wide, 1 on narrow */
        @media (min-width: 501px) {
            .card-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem 0.9rem;
                padding: 0;
            }

            .item {
                margin-bottom: 0;
                padding: 0.8rem 1rem;
                border-radius: 16px;
                background: #fcfaf9;
                border: 1px solid #f0ede8;
                transition: all 0.2s ease;
            }

            .item:hover {
                background: #ffffff;
                border-color: #e07a5f;
                box-shadow: 0 6px 14px rgba(224, 122, 95, 0.06);
                transform: translateY(-2px);
            }

            .item .arrow {
                opacity: 0.2;
            }

            .item:hover .arrow {
                opacity: 1;
                transform: translateX(2px);
                color: #e07a5f;
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 1.5rem 1.2rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .badge {
                align-self: flex-start;
                margin-top: 0.1rem;
            }

            .card-grid {
                gap: 0.3rem;
            }

            .item {
                padding: 0.9rem 0.8rem;
            }
        }

        /* small additional touch */
        .subtitle span {
            font-weight: 400;
        }

        .badge .label {
            display: inline-block;
        }

        /* no counter – exactly as required */
        .badge .count {
            display: none;
        }

        /* preserve spacing */
        .header-left .title-group {
            gap: 0;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <span class="logo-icon">📖</span>
            <div class="title-group">
                <span class="title">Resources</span>
                <span class="subtitle">engoo · 20260820-friends-205</span>
            </div>
        </div>
        <div class="badge">
            <span class="pulse-dot"></span>
            <span class="label">PDF Files</span>
            <!-- no count -->
        </div>
    </div>

    <!-- PDF grid -->
    <div class="card-grid">
        <!-- 1. english-with-friends.pdf -->
        <a href="https://item1000-collab.github.io/ai/engoo/20260820-friends-205/english-with-friends.pdf"
           target="_blank" rel="noopener noreferrer" class="item">
            <span class="emoji">📘</span>
            <span class="name">english-with-friends.pdf</span>
            <span class="arrow">→</span>
        </a>

        <!-- 2. manhattan-comedy-of-manners.pdf -->
        <a href="https://item1000-collab.github.io/ai/engoo/20260820-friends-205/manhattan-comedy-of-manners.pdf"
           target="_blank" rel="noopener noreferrer" class="item">
            <span class="emoji">📗</span>
            <span class="name">manhattan-comedy-of-manners.pdf</span>
            <span class="arrow">→</span>
        </a>

        <!-- 3. the-sitcom-syllabus.pdf -->
        <a href="https://item1000-collab.github.io/ai/engoo/20260820-friends-205/the-sitcom-syllabus.pdf"
           target="_blank" rel="noopener noreferrer" class="item">
            <span class="emoji">📙</span>
            <span class="name">the-sitcom-syllabus.pdf</span>
            <span class="arrow">→</span>
        </a>
    </div>

    <!-- Footer -->
    <div class="footer">
        Powered by AI Exploration Hub
    </div>
</div>
</body>
</html>
