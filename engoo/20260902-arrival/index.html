<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources · PDF</title>
  <!-- DM Sans from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #f8f6f3;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .container {
      max-width: 900px;
      width: 100%;
    }
    /* header */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      margin-bottom: 2rem;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }
    .header-left .logo {
      font-size: 2rem;
      line-height: 1;
    }
    .header-left h1 {
      font-size: 1.9rem;
      font-weight: 600;
      color: #1a1a2e;
      letter-spacing: -0.01em;
    }
    .subtitle {
      font-size: 1rem;
      font-weight: 400;
      color: #6b7280;
      margin-top: 0.1rem;
    }
    .badge {
      background: white;
      padding: 0.4rem 1rem 0.4rem 1.2rem;
      border-radius: 60px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.03);
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1a1a2e;
      border: 1px solid #f0ede8;
    }
    .dot-pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #e07a5f;
      border-radius: 50%;
      animation: pulse-dot 1.8s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0% { opacity: 0.5; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.5; transform: scale(0.92); }
    }
    /* card */
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.04), 0 6px 12px rgba(0,0,0,0.02);
      padding: 1.8rem 2rem;
      margin-bottom: 2.5rem;
      transition: box-shadow 0.2s;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem 1.5rem;
    }
    /* item link */
    .item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.65rem 0.9rem;
      border-radius: 16px;
      background: #fcfcfa;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #1a1a2e;
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.02);
    }
    .item .emoji {
      font-size: 1.4rem;
      line-height: 1;
      flex-shrink: 0;
      width: 2rem;
      text-align: center;
    }
    .item .name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .item .arrow {
      font-size: 1.2rem;
      color: #b0b0b0;
      transition: transform 0.2s, color 0.2s;
      flex-shrink: 0;
      margin-left: 0.2rem;
      opacity: 0;
      transform: translateX(-4px);
    }
    .item:hover {
      background: #ffffff;
      border-color: #e07a5f;
      box-shadow: 0 6px 14px rgba(224, 122, 95, 0.08), 0 2px 4px rgba(0,0,0,0.02);
      transform: translateY(-1px);
    }
    .item:hover .arrow {
      opacity: 1;
      transform: translateX(0);
      color: #e07a5f;
    }
    /* footer */
    .footer {
      text-align: center;
      font-size: 0.9rem;
      color: #8f8f9a;
      letter-spacing: 0.3px;
      margin-top: 0.5rem;
      border-top: 1px solid #eeeae5;
      padding-top: 1.8rem;
      width: 100%;
    }
    /* responsive */
    @media (max-width: 600px) {
      .page-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .badge {
        align-self: flex-start;
      }
    }
    @media (max-width: 500px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
      .card {
        padding: 1.5rem 1.2rem;
      }
      .header-left h1 {
        font-size: 1.7rem;
      }
    }
    /* small touches */
    .header-left .subtitle-wrap {
      display: flex;
      flex-direction: column;
    }
    .subtitle {
      font-weight: 400;
    }
    /* no counter — badge label only */
    .badge .label {
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- header -->
    <header class="page-header">
      <div class="header-left">
        <span class="logo">📖</span>
        <div>
          <h1>Resources</h1>
          <div class="subtitle">engoo · arrival</div>
        </div>
      </div>
      <div class="badge">
        <span class="dot-pulse"></span>
        <span class="label">PDF Files</span>
      </div>
    </header>

    <!-- main card with grid -->
    <div class="card">
      <div class="grid">
        <!-- PDF files -->
        <a href="https://item1000-collab.github.io/ai/engoo/20260902-arrival/arrival.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📕</span>
          <span class="name">arrival.pdf</span>
          <span class="arrow">→</span>
        </a>
        <!-- New summary PDF link -->
        <a href="https://item1000-collab.github.io/ai/engoo/20260902-arrival/summary-20260902232956Iza81x.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📄</span>
          <span class="name">summary-20260902232956Iza81x.pdf</span>
          <span class="arrow">→</span>
        </a>
      </div>
    </div>

    <footer class="footer">
      Powered by AI Exploration Hub
    </footer>
  </div>
</body>
</html>
