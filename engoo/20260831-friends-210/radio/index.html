<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Talk Radio · Friends & English</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #121212;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      margin: 0;
      color: #f0f0f0;
    }

    .app {
      max-width: 780px;
      width: 100%;
      background: #1e1e1e;
      border-radius: 32px;
      padding: 2rem 1.8rem 2.2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      transition: background 0.2s;
    }

    /* cover small & neat */
    .cover-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 1.2rem;
    }

    .cover-wrap img {
      width: 200px;
      height: auto;
      border-radius: 8px;
      display: block;
      box-shadow: 0 6px 16px rgba(0,0,0,0.6);
      background: #2a2a2a;
      object-fit: cover;
    }

    .show-title {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0.25rem 0 0.15rem;
      text-align: center;
      color: #ffffff;
    }

    .show-duration {
      text-align: center;
      color: #a0a0a0;
      font-size: 0.95rem;
      margin-bottom: 1.3rem;
      border-bottom: 1px solid #2c2c2c;
      padding-bottom: 0.9rem;
    }

    /* standard audio */
    audio {
      width: 100%;
      margin-bottom: 1.8rem;
      background: #2a2a2a;
      border-radius: 40px;
      display: block;
      outline: none;
    }
    audio::-webkit-media-controls-panel {
      background: #2a2a2a;
    }

    /* transcript list */
    .transcript-container {
      max-height: 460px;
      overflow-y: auto;
      padding-right: 4px;
      scroll-behavior: smooth;
      border-top: 1px solid #2a2a2a;
      padding-top: 0.5rem;
    }

    .transcript-container::-webkit-scrollbar {
      width: 5px;
    }
    .transcript-container::-webkit-scrollbar-track {
      background: #1e1e1e;
    }
    .transcript-container::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 20px;
    }

    .line {
      padding: 0.7rem 0.9rem;
      margin: 0.2rem 0;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.1s ease, color 0.1s ease;
      border-bottom: 1px solid #282828;
      line-height: 1.5;
      font-size: 0.98rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.2rem 0.4rem;
    }

    .line:hover {
      background: #2a2a2a;
    }

    .line .speaker {
      font-weight: 600;
      color: #b0b0ff;
      letter-spacing: 0.02em;
      margin-right: 0.3rem;
    }

    .line .text {
      color: #e8e8e8;
      word-break: break-word;
    }

    /* active state – bright blue (#007bff) with white text */
    .line.active {
      background: #007bff;
      color: #ffffff;
      border-radius: 12px;
      border-bottom-color: #007bff;
      box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
      transition: background 0.15s;
    }

    .line.active .speaker {
      color: #ffffff;
    }

    .line.active .text {
      color: #ffffff;
    }

    .error-msg {
      background: #2a1a1a;
      border-left: 4px solid #d44;
      padding: 1.2rem 1.5rem;
      border-radius: 16px;
      color: #ffb0b0;
      font-weight: 500;
      margin: 1rem 0;
      text-align: center;
    }

    .fallback-title {
      color: #aaa;
      text-align: center;
      font-size: 1.4rem;
      margin: 0.5rem 0;
    }

    /* small */
    @media (max-width: 500px) {
      .app {
        padding: 1.2rem;
      }
      .cover-wrap img {
        width: 160px;
      }
      .show-title {
        font-size: 1.4rem;
      }
      .line {
        font-size: 0.9rem;
        padding: 0.6rem 0.7rem;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <!-- cover -->
    <div class="cover-wrap">
      <img src="cover.png" alt="show cover" id="coverImage">
    </div>

    <!-- title / duration -->
    <div id="titleArea">
      <h1 class="show-title" id="showTitle">AI Talk Radio</h1>
      <div class="show-duration" id="showDuration">⏱ 0:00</div>
    </div>

    <!-- audio player -->
    <audio id="audioPlayer" controls preload="metadata">
      <source src="ai_radio.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
    </audio>

    <!-- transcript list -->
    <div class="transcript-container" id="transcriptContainer">
      <!-- lines will be injected here -->
      <div class="error-msg" id="errorMessage" style="display: none;">⚠️ Could not load show notes.</div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      // DOM refs
      const audio = document.getElementById('audioPlayer');
      const container = document.getElementById('transcriptContainer');
      const errorMsg = document.getElementById('errorMessage');
      const showTitleEl = document.getElementById('showTitle');
      const showDurationEl = document.getElementById('showDuration');
      const coverImg = document.getElementById('coverImage');

      // state
      let transcriptData = [];       // array of { startSec, endSec, speaker, text, timecode }
      let lineElements = [];
      let isActiveSet = false;

      // ---------- helpers ----------
      function timecodeToSeconds(tc) {
        if (!tc) return 0;
        const parts = tc.split(':');
        if (parts.length === 2) {
          return parseInt(parts[0], 10) * 60 + parseFloat(parts[1]);
        }
        return 0;
      }

      // ---------- fetch & render ----------
      async function loadShowNotes() {
        try {
          const resp = await fetch('show_notes.json');
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const json = await resp.json();

          // validate minimal fields
          if (!json.timecoded_transcript || !Array.isArray(json.timecoded_transcript)) {
            throw new Error('Invalid transcript format');
          }

          // set title & duration
          const title = json.show_title || 'AI Talk Radio';
          showTitleEl.textContent = title;
          const duration = json.show_duration || '0:00';
          showDurationEl.textContent = `⏱ ${duration}`;

          // build transcript with start/end seconds
          const raw = json.timecoded_transcript;
          const parsed = raw.map((item, idx) => {
            const startSec = timecodeToSeconds(item.timecode);
            return {
              startSec: startSec,
              endSec: 0, // will fill later
              speaker: item.speaker || 'Speaker',
              text: item.text || '',
              timecode: item.timecode || '0:00',
              rawIndex: idx
            };
          });

          // compute endSec: if next exists, use next.startSec, else start + 20
          for (let i = 0; i < parsed.length; i++) {
            if (i < parsed.length - 1) {
              parsed[i].endSec = parsed[i + 1].startSec;
            } else {
              parsed[i].endSec = parsed[i].startSec + 20; // last line
            }
            // avoid zero-length if next start is same (rare)
            if (parsed[i].endSec <= parsed[i].startSec) {
              parsed[i].endSec = parsed[i].startSec + 2;
            }
          }

          transcriptData = parsed;
          renderTranscript(parsed);
          errorMsg.style.display = 'none';
        } catch (err) {
          console.warn('Fetch error:', err);
          // show error, hide transcript
          container.innerHTML = '';
          errorMsg.style.display = 'block';
          showTitleEl.textContent = 'AI Talk Radio';
          showDurationEl.textContent = '⏱ --:--';
          // keep cover
        }
      }

      function renderTranscript(lines) {
        container.innerHTML = ''; // clear
        lineElements = [];
        const frag = document.createDocumentFragment();

        lines.forEach((line, index) => {
          const div = document.createElement('div');
          div.className = 'line';
          div.dataset.index = index;
          div.dataset.start = line.startSec;
          div.dataset.end = line.endSec;

          const speakerSpan = document.createElement('span');
          speakerSpan.className = 'speaker';
          speakerSpan.textContent = line.speaker + ':';

          const textSpan = document.createElement('span');
          textSpan.className = 'text';
          textSpan.textContent = line.text;

          div.appendChild(speakerSpan);
          div.appendChild(textSpan);

          // click to seek
          div.addEventListener('click', function(e) {
            const start = parseFloat(this.dataset.start);
            if (!isNaN(start) && audio) {
              audio.currentTime = start;
              audio.play().catch(() => {});
            }
          });

          frag.appendChild(div);
          lineElements.push(div);
        });

        container.appendChild(frag);
        // after render, sync once
        syncActiveLine();
      }

      // ---------- sync active line ----------
      function syncActiveLine() {
        if (!audio || !transcriptData.length || !lineElements.length) {
          return;
        }

        const currentTime = audio.currentTime;
        let activeIndex = -1;

        // find first line where start <= currentTime < end
        for (let i = 0; i < transcriptData.length; i++) {
          const line = transcriptData[i];
          if (currentTime >= line.startSec && currentTime < line.endSec) {
            activeIndex = i;
            break;
          }
        }

        // if none found, but we are near end -> maybe last line
        if (activeIndex === -1 && transcriptData.length > 0) {
          const last = transcriptData[transcriptData.length - 1];
          if (currentTime >= last.startSec) {
            activeIndex = transcriptData.length - 1;
          }
        }

        // clear active from all
        lineElements.forEach(el => el.classList.remove('active'));

        if (activeIndex !== -1 && lineElements[activeIndex]) {
          const el = lineElements[activeIndex];
          el.classList.add('active');
          // scroll into view (smooth, center)
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      }

      // ---------- audio timeupdate ----------
      function onTimeUpdate() {
        syncActiveLine();
      }

      // ---------- init ----------
      function init() {
        // load notes
        loadShowNotes();

        // set cover fallback (if image missing, still ok)
        coverImg.alt = 'show cover';

        // event listeners
        audio.addEventListener('timeupdate', onTimeUpdate);

        // extra: if metadata loaded, maybe set duration from json? but we already set from json
        // if audio duration is available, we could update, but keep json duration
        audio.addEventListener('loadedmetadata', function() {
          // optionally sync after load
          syncActiveLine();
        });

        // manual sync when seeking
        audio.addEventListener('seeked', function() {
          syncActiveLine();
        });

        // small guard: if audio not playing, still sync on click
        document.addEventListener('click', function(e) {
          // if click on line, sync already done in line click
          // but we may want to sync after any click that changes time? 
          // we rely on 'seeked' and 'timeupdate'
        });
      }

      // run after DOM ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
