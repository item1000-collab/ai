<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Resources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f6f3;
            --accent: #e07a5f;
            --text-dark: #1a1a2e;
            --text-light: #6b7280;
            --card-bg: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --border-radius-lg: 24px;
            --border-radius-sm: 16px;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.5;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo {
            font-size: 36px;
            line-height: 1;
            background: var(--card-bg);
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--border-radius-sm);
            box-shadow: var(--shadow);
        }
        
        .header-content {
            display: flex;
            flex-direction: column;
        }
        
        .header-title {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        
        .header-subtitle {
            font-size: 14px;
            color: var(--text-light);
            font-weight: 500;
        }
        
        .badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: var(--card-bg);
            padding: 8px 16px;
            border-radius: 100px;
            box-shadow: var(--shadow);
            font-size: 14px;
            font-weight: 500;
            color: var(--text-dark);
        }
        
        .pulse-dot {
            width: 10px;
            height: 10px;
            background-color: var(--accent);
            border-radius: 50%;
            position: relative;
        }
        
        .pulse-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: var(--accent);
            border-radius: 50%;
            opacity: 0.6;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.7;
            }
            70% {
                transform: scale(2.2);
                opacity: 0;
            }
            100% {
                transform: scale(2.2);
                opacity: 0;
            }
        }
        
        .main-card {
            background: var(--card-bg);
            border-radius: var(--border-radius-lg);
            padding: 40px;
            box-shadow: var(--shadow);
            margin-top: 10px;
        }
        
        .files-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        
        @media (min-width: 500px) {
            .files-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
        
        .item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px 20px;
            background: var(--bg-color);
            border: 2px solid transparent;
            border-radius: var(--border-radius-sm);
            text-decoration: none;
            color: inherit;
            transition: all 0.25s ease;
            cursor: pointer;
        }
        
        .item:hover {
            border-color: var(--accent);
            background-color: var(--card-bg);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(224, 122, 95, 0.15);
        }
        
        .emoji {
            font-size: 32px;
            line-height: 1;
            flex-shrink: 0;
        }
        
        .name {
            flex-grow: 1;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-dark);
            word-break: break-all;
            line-height: 1.4;
        }
        
        .arrow {
            font-size: 18px;
            color: var(--accent);
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.25s ease;
            flex-shrink: 0;
        }
        
        .item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }
        
        .footer {
            text-align: center;
            padding: 40px 0 20px;
            color: var(--text-light);
            font-size: 14px;
            font-weight: 500;
        }
        
        /* Main container wrapper */
        .container {
            max-width: 1080px;
            margin: 0 auto;
            padding: 20px 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-left">
                <div class="logo">📖</div>
                <div class="header-content">
                    <div class="header-title">Resources</div>
                    <div class="header-subtitle">20260831-friends-210</div>
                </div>
            </div>
            <div class="badge">
                <div class="pulse-dot"></div>
                <span>PDF Files</span>
            </div>
        </header>
        
        <main class="main-card">
            <div class="files-grid">
                <a href="https://item1000-collab.github.io/ai/engoo/20260831-friends-210/90s-sitcom-english.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📘</span>
                    <span class="name">90s-sitcom-english.pdf</span>
                    <span class="arrow">→</span>
                </a>
                <a href="https://item1000-collab.github.io/ai/engoo/20260831-friends-210/friends-english-masterclass.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📗</span>
                    <span class="name">friends-english-masterclass.pdf</span>
                    <span class="arrow">→</span>
                </a>
                <a href="https://item1000-collab.github.io/ai/engoo/20260831-friends-210/manhattan-farce-deconstructed.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📕</span>
                    <span class="name">manhattan-farce-deconstructed.pdf</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </main>
        
        <footer class="footer">
            Powered by AI Exploration Hub
        </footer>
    </div>
</body>
</html>
