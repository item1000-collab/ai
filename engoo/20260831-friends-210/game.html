<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>The One with the Game — Friends S02E10 Trainer</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:#f4f4f4; color:#333; line-height:1.6; }
  .app { max-width:860px; margin:0 auto; background:#fff; min-height:100vh; box-shadow:0 0 14px rgba(0,0,0,.12); display:flex; flex-direction:column; }
  header { position:sticky; top:0; z-index:20; background:linear-gradient(180deg,#fff,#fffdf5); border-bottom:3px solid #e0a800; padding:10px 16px; display:flex; align-items:center; gap:12px; }
  .h-title b{display:block;font-size:1.05em;color:#1a1a1a;line-height:1.2}
  .h-title span{font-size:.78em;color:#888}

  .stars-badge{font-weight:700;color:#b5651e;background:#f9f0e6;border:1px solid #d4a373;padding:6px 10px;border-radius:8px;font-size:.85rem;white-space:nowrap}
  main{flex:1;padding:24px 20px 50px}
  footer{text-align:center;color:#888;font-size:.85em;padding:16px;border-top:1px solid #eee}

  .hero{background:linear-gradient(135deg,#fff8e1,#f3e5f5);border:1px solid #f0e68c;border-radius:14px;padding:22px}

  .hero p{margin:0;color:#555}

  .menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
  .menu-card{position:relative;text-align:left;background:#fff;border:2px solid #eee;border-radius:14px;padding:18px;cursor:pointer;transition:.18s;display:flex;flex-direction:column;gap:6px;font-family:inherit}
  .menu-card:hover{transform:translateY(-3px);border-color:#e0a800;box-shadow:0 8px 18px rgba(224,168,0,.18)}
  .menu-card .ic{font-size:2rem;line-height:1}
  .menu-card b{font-size:1.05em;color:#2c3e50}
  .menu-card p{margin:0;font-size:.9em;color:#666}
  .menu-card .best{position:absolute;top:10px;right:12px;font-size:.78rem;background:#f3e5f5;border:1px solid #ce93d8;border-radius:8px;padding:2px 8px;color:#6a1b9a}

  .rank-box{margin-top:20px}
  .rank{display:flex;align-items:center;gap:12px;background:#f9f9f9;border:1px solid #eee;border-left:5px solid #e0a800;padding:14px;border-radius:0 10px 10px 0}
  .rank-ic{font-size:1.8rem}
  .rank b{display:block;color:#2c3e50}
  .rank span{font-size:.9em;color:#777}
  .rank-stars{margin-left:auto;font-weight:700;color:#b5651e;white-space:nowrap}

  .qtext{font-size:1.15em;color:#2c3e50;font-weight:600;margin-top:12px}
  .qcount{font-size:.85em;color:#999;margin-top:4px}
  .hint{color:#777;font-size:.92em;margin:6px 0 0}

  .pbar i{display:block;height:100%;background:linear-gradient(90deg,#e0a800,#f4c542);transition:.3s}
  .opts{display:grid;gap:10px;margin-top:16px}
  .opt{text-align:left;background:#fff;border:2px solid #e6e6e6;border-radius:12px;padding:13px 16px;font-size:1rem;cursor:pointer;transition:.15s;color:#333;font-family:inherit}
  .opt:hover:not(:disabled){border-color:#e0a800;background:#fffdf3}
  .opt.correct{border-color:#27ae60;background:#eafaf1;color:#1e7e46;font-weight:600}
  .opt.wrong{border-color:#e74c3c;background:#fdecea;color:#b03a2e}

  .note{margin-top:14px;background:#eef7ff;border-left:5px solid #3498db;padding:12px 14px;border-radius:0 8px 8px 0;font-size:.95em;color:#2c3e50;display:none}

  .nav{margin-top:16px}
  .btn{background:linear-gradient(180deg,#f4c542,#e0a800);border:none;color:#fff;font-weight:700;padding:12px 22px;border-radius:10px;cursor:pointer;font-size:1rem;box-shadow:0 2px 6px rgba(224,168,0,.35);transition:.15s;font-family:inherit}

  .btn.ghost{background:#fff;color:#b5651e;border:2px solid #e0a800;box-shadow:none}
  .row-btns{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}

  .match-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  .mcol{display:flex;flex-direction:column;gap:10px}
  .mcard{padding:12px;border:2px solid #e6e6e6;border-radius:10px;background:#fff;cursor:pointer;transition:.15s;font-size:.93rem;min-height:56px;display:flex;align-items:center;font-family:inherit;color:#333;text-align:left}

  .mcard.done{border-color:#27ae60;background:#eafaf1;opacity:.55;cursor:default}

  .order-list{display:grid;gap:10px;margin-top:14px}
  .ord{text-align:left;padding:12px 14px;border:2px solid #e6e6e6;border-radius:10px;background:#fff;cursor:pointer;transition:.15s;font-family:inherit;font-size:.95rem;color:#333}
  .ord:hover:not(.done){border-color:#e0a800;background:#fffdf3}
  .ord.done{border-color:#27ae60;background:#eafaf1;cursor:default;color:#1e7e46}

  .res-note{text-align:left;color:#444}

  .scene{background:#f9f9f9;border:1px solid #eee;border-left:4px solid #e0a800;padding:18px;border-radius:0 10px 10px 0;animation:fadeUp .35s;margin-top:8px}
  .s-title{font-weight:700;color:#b5651e;margin-bottom:8px;font-size:.85em;text-transform:uppercase;letter-spacing:.4px}
  .vc{display:inline-block;background:#fff8e1;border:1px dashed #d4a373;color:#7a5a1f;border-radius:8px;padding:0 8px;font-size:.9em;margin:0 2px;font-weight:600}
  .integrity{display:inline-block;background:#f3e5f5;border:1px solid #ce93d8;color:#6a1b9a;border-radius:8px;padding:6px 12px;font-weight:600;font-size:.9em}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal.open{display:flex}
  .modal-card{background:#fff;max-width:560px;width:100%;max-height:80vh;overflow:auto;border-radius:14px;padding:20px;border-top:5px solid #e0a800}
  .vrow{padding:8px 0;border-bottom:1px dashed #eee;display:flex;gap:10px;flex-wrap:wrap;font-size:.95em}
  .vrow b{color:#2c3e50;min-width:150px}
  .vrow span{color:#666;flex:1}

  #fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:99}
  .confetti{position:absolute;top:-20px;border-radius:2px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
  .fade{animation:fadeUp .25s}
  @media (max-width:560px){
    .h-title span{display:none}
    main{padding:18px 14px 40px}
    .mcard{font-size:.85rem;min-height:64px}
  }
</style>

<div class="app">
  <header>
    <button class="icon-btn" id="homeBtn" title="Home">🏠</button>

  <div class="modal-card">

<script>
// ---------------- DATA ----------------
var VOCAB = [
  ['Slump', 'a period of poor performance or inactivity (“a bad patch”)'],
  ['Pay your dues', 'work hard at the bottom of a profession to earn success later'],
  ['Wasted / Bombed / Hammered', 'slang: completely drunk'],
  ['Sober', 'not affected by alcohol'],
  ['Intervention', 'loved ones confronting someone about a dangerous habit'],
  ['Fall off the wagon', 'to relapse into an addiction after a period of quitting'],
  ['Mannerisms', 'habitual gestures and characteristic ways of speaking'],
  ['Doppelgänger', 'someone\u2019s exact double'],
  ['Callback', 'a second-round invitation after an audition'],
  ['Integrity', 'honesty and strong moral principles'],
  ['Poetic justice', 'an ironic twist where virtue is rewarded or vice punished']
];

var QUIZ = [
  { q:'Joey has spent ten years without a single lucky break. A period of failure like this is called…',
    opts:['a slump','a callback','a cameo','a premiere'], a:0,
    note:'Slump — a period of poor performance or inactivity. Joey is in a deep acting slump.' },
  { q:'Working patiently at the bottom of a profession to earn future success is the idiom…',
    opts:['to pay your dues','to pay the piper','to pass the buck','to pay it forward'], a:0,
    note:'Pay your dues — “contributing” through hard, unglamorous work: the duty of every aspiring actor.' },
  { q:'Which word means “not drunk” rather than “very drunk”?',
    opts:['hammered','sober','bombed','wasted'], a:1,
    note:'Sober means “not under the influence”. The rest are slang for being heavily drunk.' },
  { q:'The friends staged an ___ to make Bobby admit his drinking problem.',
    opts:['intervention','interruption','rehearsal','audition'], a:0,
    note:'An intervention — loved ones confronting someone about a problem he refuses to see.' },
  { q:'To relapse and return to a habit after quitting for a while is…',
    opts:['to fall off the wagon','to miss the boat','to jump the shark','to hit the road'], a:0,
    note:'Fall off the wagon. Monica “fell off the wagon” to tolerate boring, sober Bobby.' },
  { q:'Habitual gestures and characteristic ways of speaking are…',
    opts:['mannerisms','materialism','masterpieces','milestones'], a:0,
    note:'Mannerisms. Ross and Russ share identical mannerisms — that\u2019s why Rachel never notices.' },
  { q:'Joey walked out of the callback in order to keep…',
    opts:['his integrity','his wardrobe','his haircut','his stamina'], a:0,
    note:'Integrity — honesty and strong moral principles. As Joey put it: “I\u2019m a professional.”' },
  { q:'After a successful first audition, an actor is invited to…',
    opts:['a callback','a payoff','a backup','a comeback'], a:0,
    note:'A callback — the second-round invitation. Joey\u2019s callback came with… conditions.' },
  { q:'Someone who looks exactly like someone else is called…',
    opts:['a doppelgänger','a headliner','an understudy','a sidekick'], a:0,
    note:'Doppelgänger — a double. Russ is the perfect doppelgänger of Ross.' },
  { q:'Both were dumped — and they found each other. This ironic twist of fate is…',
    opts:['poetic justice','comic relief','a cliffhanger','a plot twist'], a:0,
    note:'Poetic justice: Russ and Julie — both freshly dumped — rode off together.' }
];

var PAIRS = [
  ['Slump','A period of poor performance or inactivity'],
  ['Pay your dues','Work hard at the bottom to earn success later'],
  ['Fall off the wagon','Relapse into an old habit after quitting'],
  ['Mannerisms','Habitual gestures and ways of speaking'],
  ['Integrity','Faithfulness to moral principles'],
  ['Doppelgänger','Someone\u2019s exact double'],
  ['Callback','A second-round audition invitation'],
  ['Sober','Not affected by alcohol']
];

var EVENTS = [
  '☕ 6:45 a.m.: Joey, Chandler and Ross at the newsstand — waiting for the review of Joey\u2019s play',
  '☕ The review is brutal: Joey is in a deep slump and announces he is quitting acting',
  '☕ Joey aces the audition and earns a callback',
  '☕ At the callback the casting director hints at “a favor” — Joey walks away, keeping his integrity',
  '🍷 The friends stage an intervention: Fun Bobby drinks far too much',
  '🍷 Bobby quits drinking: completely sober but unbearably dull',
  '🍷 Monica starts drinking herself to put up with his boring stories',
  '🍷 The paradox is complete: Bobby dumps Monica',
  '💘 Rachel starts dating Russ — an exact doppelgänger of Ross',
  '💘 Poetic justice: Russ and Julie (Ross\u2019s ex) find each other'
];

var RR = [
  { q:'Dinosaurs, the museum, paleontology — who is it?', a:0, note:'Ross Geller is a paleontologist.' },
  { q:'A periodontist — a gum specialist whose job title sounds almost the same as the other guy\u2019s…', a:1,
    note:'A “Doppelgänger Matrix” joke: paleontologist vs. periodontist.' },
  { q:'At cards he was called “card shark” (the American spelling)', a:0,
    note:'Card shark is the US variant, card sharp the British one — a way to tell the doubles apart!' },
  { q:'Was dating Julie before this episode began', a:0, note:'Julie is Ross\u2019s girlfriend this season.' },
  { q:'Rides off with Julie in the end — poetic justice!', a:1,
    note:'The dumped double Russ and the dumped Julie found each other.' },
  { q:'Gestures, moves and talks exactly like his double', a:2,
    note:'Identical mannerisms — the central joke of the episode.' },
  { q:'Said the legendary “We were on a break!”', a:0, note:'Ross\u2019s signature phrase after the breakup with Rachel.' },
  { q:'Started dating Rachel before she even knew he existed', a:1,
    note:'Rachel met Russ only after she had broken up with Ross.' },
  { q:'A four-letter name starting with “R” that makes everyone mix them up', a:2,
    note:'Ross and Russ — a parody of indistinguishable doubles.' },
  { q:'Monica\u2019s brother', a:0, note:'Ross is Monica Geller\u2019s brother. Russ is just a very convincing double.' }
];

var STORY = {
  s1: { title:'☕ Scene 1 · At the newsstand, 6:45 a.m.',
    text:'Ten years of <span class="vc">paying your dues</span>: hundreds of auditions, waiter shifts, roles like “guy with a hot dog”. Today the papers carry the review of the play where you played <b>the King</b>. Your hands shake. You unfold the page:<br><br>“Joey Tribbiani as the King — as wooden as his throne.”<br><br>You are in a textbook <span class="vc">slump</span>.',
    choices:[
      { label:'😤 “That\u2019s it! I quit acting!”', next:'s1quit', fx:0 },
      { label:'😮‍💨 Take a breath and prepare for the next audition', next:'s1grit', fx:1 }
    ]},
  s1quit: { title:'☕ Scene 2 · The fifth act of the drama “I Quit”',
    text:'You solemnly announce to the friends that your career is over. Chandler: “You said the same after playing Corpse #4.” Ross: “Bad reviews only hit people who actually get on stage.” You remember: a <span class="vc">slump</span> is a pause in the story — not its finale.',
    choices:[ { label:'🎬 “Fine… take me to the audition”', next:'s2', fx:0 } ]},
  s1grit: { title:'☕ Scene 2 · The composure of a monarch',
    text:'You fold the paper and draw a professional conclusion: a review is feedback, and <span class="vc">paying your dues</span> is about patience. Something warms up inside: character is a muscle too.',
    choices:[ { label:'🎬 “Take me to the audition”', next:'s2', fx:0 } ]},
  s2: { title:'🎭 Scene 3 · The audition',
    text:'Estelle lands you a shot: an audition for a TV series. You walk into the room — and play so well the casting director leans forward: “Not bad… very not bad. We\u2019d like to see you at the <span class="vc">callback</span>.” First step cleared!',
    choices:[ { label:'🚪 “Deal with the callback later” → continue', next:'s3', fx:0 } ]},
  s3: { title:'⚠️ Scene 4 · A callback with conditions',
    text:'The callback. The casting director leans back in the chair and purrs: “You know… there are ways to arrange things. Have a seat closer.” Everything is clear without words. The dream role is right there on the table — together with the <span class="vc">compromise</span> of your principles. What will you choose?',
    choices:[
      { label:'🚶 “I\u2019m a professional” — stand up and walk out', next:'endGood', fx:2 },
      { label:'🤝 Accept the conditions — the role comes first', next:'endBad', fx:-2 }
    ]},
  endGood: { end:true, title:'🏆 Ending: Integrity Works',
    text:'You leave without the role but with your head held high. A week later Estelle calls: “You got it!” The actor who accepted the conditions bombed the screen test — and the producers came back to you. That\u2019s how <span class="vc">integrity</span> works — and sometimes <span class="vc">poetic justice</span> too.<br><br><b>Reflection question (from the lesson\u2019s final slide):</b> “If you were in Joey\u2019s shoes — offered your dream job but required to compromise your morals to get it — what choice would you make?” Discuss it with a partner… or with an AI Rachel.' },
  endBad: { end:true, title:'🎬 Ending: The Price of Compromise',
    text:'The role is yours. But backstage the whispers have already started, and the competitor with a clean reputation looks at you as if he knows something you don\u2019t. A month later your character “moves to Omaha”: the storyline got cut. Sometimes the price of <span class="vc">compromise</span> is too high — <span class="vc">integrity</span> is not for rent.<br><br><i>Tip: play again and try the other path at the callback 😉</i>' }
};

// ---------------- STATE ----------------
var KEY = 'friends210game-v1';
var save = (function(){
  try { var raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
})() || { sound:true, best:{} };
function persist(){ try{ localStorage.setItem(KEY, JSON.stringify(save)); }catch(e){} }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function starsOf(n){ return '★'.repeat(n)+'☆'.repeat(3-n); }
function getBest(id){ return (save.best && save.best[id]!==undefined) ? save.best[id] : null; }
function setBest(id,s){ if(!save.best) save.best={}; if((save.best[id]||0)<s){ save.best[id]=s; persist(); updateHeader(); renderRankBox(); } }
function totalBest(){ var t=0; for(var k in save.best){ t+=save.best[k]; } return t; }
function updateHeader(){ document.getElementById('totalStars').textContent='⭐ '+totalBest()+'/15'; }
function toStars(sc,th){ return sc>=th[0]?3:sc>=th[1]?2:sc>=th[2]?1:0; }

// ---------------- SOUND ----------------
var actx=null;
function tone(f,d,type,g,delay){
  if(!save.sound) return;
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    var o=actx.createOscillator(), gn=actx.createGain();
    o.type=type||'sine'; o.frequency.value=f;
    o.connect(gn); gn.connect(actx.destination);
    var t=actx.currentTime+(delay||0);
    gn.gain.setValueAtTime(g||.05,t);
    gn.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.start(t); o.stop(t+d);
  }catch(e){}
}
function sClick(){ tone(500,.05,'triangle',.03); }
function sOk(){ tone(620,.09,'sine',.05); tone(830,.14,'sine',.05,.09); }
function sBad(){ tone(150,.22,'sawtooth',.045); }
function sWin(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.16,'sine',.055,i*.12); }); }

// ---------------- CONFETTI ----------------
function confetti(n){
  var fx=document.getElementById('fx');
  var colors=['#e0a800','#3498db','#8e44ad','#e74c3c','#2ecc71'];
  for(var i=0;i<n;i++){
    var d=document.createElement('div');
    d.className='confetti';
    d.style.left=Math.random()*100+'vw';
    d.style.background=colors[i%colors.length];
    d.style.width=d.style.height=(6+Math.random()*8)+'px';
    d.style.animationDelay=(Math.random()*.5)+'s';
    d.style.animationDuration=(2.2+Math.random()*1.6)+'s';
    fx.appendChild(d);
    setTimeout(function(el){ return function(){ el.remove(); }; }(d),5000);
  }
}

// ---------------- ROUTER ----------------
var scr=document.getElementById('screen');
var SCREENS={ home:renderHome, quiz:startQuiz, match:startMatch, order:startOrder, ross:startRoss, story:startStory };
function go(n){
  scr.classList.remove('fade'); void scr.offsetWidth;
  SCREENS[n]();
  scr.classList.add('fade');
  window.scrollTo(0,0);
}

// ---------------- MENU ----------------
function renderHome(){
  var cards=[
    { id:'quiz', ic:'🎯', t:'Vocabulary Blitz', d:'10 questions on the episode\u2019s words: slump, integrity, doppelgänger…' },
    { id:'match', ic:'🔗', t:'Match the Pairs', d:'Connect each term with its meaning. Fewer misses — more stars.' },
    { id:'order', ic:'📖', t:'Build the Plot', d:'Put the events of all three storylines in chronological order.' },
    { id:'ross', ic:'🎭', t:'Ross or Russ?', d:'The doppelgänger detector: 10 checks of your attention.' },
    { id:'story', ic:'⚖️', t:'Joey\u2019s Dilemma', d:'An interactive story: the role or your principles? Your choice decides the ending.' }
  ];
  var html='<section class="hero"><h1>The One with the Game 🎬</h1>'+
    '<p>A trainer for “The One with Russ” (Friends, S02E10), based on the lesson by Marina and Anatoliy. Vocabulary, idioms, storylines — and that famous moral dilemma. Collect all 15 ⭐!</p></section>'+
    '<div class="menu-grid">';
  for(var i=0;i<cards.length;i++){
    var c=cards[i];
    var best=getBest(c.id);
    html+='<button class="menu-card" data-g="'+c.id+'">'+
      '<span class="ic">'+c.ic+'</span><b>'+c.t+'</b><p>'+c.d+'</p>'+
      (best!==null?'<span class="best">best: '+starsOf(best)+'</span>':'')+
      '</button>';
  }
  html+='</div><div class="rank-box" id="rankBox"></div>';
  scr.innerHTML=html;
  renderRankBox();
  var btns=scr.querySelectorAll('.menu-card');
  for(var j=0;j<btns.length;j++){
    (function(b){ b.addEventListener('click',function(){ sClick(); go(b.getAttribute('data-g')); }); })(btns[j]);
  }
}
function renderRankBox(){
  var box=document.getElementById('rankBox'); if(!box) return;
  var t=totalBest();
  var r;
  if(t>=15)      r=['🏆','The One Where Everyone Wins','You collected every star! Ross is proud, Joey is proud, Marina is proud.'];
  else if(t>=10) r=['🌟','The One With Real Progress','Great result! A couple more runs and you\u2019ll hit the max.'];
  else if(t>=5)  r=['💪','Paying Your Dues','Persistence is the key. Keep going!'];
  else           r=['🎬','Still in a Slump','Like Joey with that review: the main thing is not to give up. Pick any mode to start!'];
  box.innerHTML='<div class="rank"><span class="rank-ic">'+r[0]+'</span><div><b>'+r[1]+'</b><span>'+r[2]+'</span></div><div class="rank-stars">⭐ '+t+'/15</div></div>';
}

// ---------------- GAME 1: QUIZ ----------------
var qState;
function startQuiz(){ qState={i:0,score:0}; showQuizQ(); }
function showQuizQ(){
  var q=QUIZ[qState.i];
  var opts=shuffle(q.opts.map(function(t,idx){ return {t:t, ok:idx===q.a}; }));
  var html='<h2 style="color:#2c3e50">🎯 Vocabulary Blitz</h2>'+
    '<div class="pbar"><i style="width:'+(qState.i/QUIZ.length*100)+'%"></i></div>'+
    '<div class="qcount">Question '+(qState.i+1)+' of '+QUIZ.length+' · Score: '+qState.score+'</div>'+
    '<div class="qtext">'+q.q+'</div><div class="opts">';
  for(var i=0;i<opts.length;i++){
    html+='<button class="opt" data-ok="'+opts[i].ok+'">'+opts[i].t+'</button>';
  }
  html+='</div><div class="note" id="note">💡 '+q.note+'</div>'+
    '<div class="nav"><button class="btn" id="nextBtn" style="display:none">'+(qState.i===QUIZ.length-1?'Results →':'Next →')+'</button></div>';
  scr.innerHTML=html;
  var ob=scr.querySelectorAll('.opt');
  for(var j=0;j<ob.length;j++){
    (function(b){ b.addEventListener('click',function(){ answerQuiz(b); }); })(ob[j]);
  }
}
function answerQuiz(btn){
  if(btn.disabled) return;
  var ok = btn.getAttribute('data-ok')==='true';
  var all=scr.querySelectorAll('.opt');
  for(var i=0;i<all.length;i++){
    all[i].disabled=true;
    if(all[i].getAttribute('data-ok')==='true') all[i].classList.add('correct');
  }
  if(!ok) btn.classList.add('wrong'); else qState.score++;
  if(ok) sOk(); else sBad();
  document.getElementById('note').classList.add('show');
  var nb=document.getElementById('nextBtn'); nb.style.display='inline-block';
  nb.addEventListener('click',function(){
    sClick(); qState.i++;
    if(qState.i<QUIZ.length) showQuizQ(); else quizEnd();
  });
}
function quizEnd(){
  var s=toStars(qState.score,[9,7,5]);
  setBest('quiz',s); sWin(); confetti(s>=2?70:25);
  var msg = s===3?'Unagi! The episode\u2019s vocabulary is yours.': s===2?'Almost perfect. Check the cheat sheet 📖 and try again.':'Time to rewatch the episode… and peek at the cheat sheet 📖';
  scr.innerHTML='<div class="result-box">'+
    '<div class="big">'+(s===3?'🏆':s===2?'🎉':'🎬')+'</div>'+
    '<h2 style="color:#2c3e50">'+qState.score+' out of '+QUIZ.length+' correct</h2>'+
    '<div class="stars-row">'+starsOf(s)+'</div>'+
    '<p class="hint">'+msg+'</p>'+
    '<div class="row-btns"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home2">Back to menu</button></div></div>';
  document.getElementById('again').onclick=function(){ sClick(); go('quiz'); };
  document.getElementById('home2').onclick=function(){ sClick(); go('home'); };
}

// ---------------- GAME 2: MATCH ----------------
var mState;
function startMatch(){
  mState={mistakes:0,done:0,selT:null};
  var terms=shuffle(PAIRS.map(function(p,i){ return {id:i,txt:p[0]}; }));
  var defs=shuffle(PAIRS.map(function(p,i){ return {id:i,txt:p[1]}; }));
  var html='<h2 style="color:#2c3e50">🔗 Match the Pairs</h2>'+
    '<p class="hint">Tap a term on the left, then its meaning on the right. Misses: <b id="mMist">0</b> <span id="mHint" style="color:#b5651e"></span></p>'+
    '<div class="match-wrap"><div class="mcol">';
  for(var i=0;i<terms.length;i++) html+='<button class="mcard" data-id="'+terms[i].id+'" data-side="t">'+terms[i].txt+'</button>';
  html+='</div><div class="mcol">';
  for(var j=0;j<defs.length;j++) html+='<button class="mcard" data-id="'+defs[j].id+'" data-side="d">'+defs[j].txt+'</button>';
  html+='</div></div>';
  scr.innerHTML=html;
  var cards=scr.querySelectorAll('.mcard');
  for(var k=0;k<cards.length;k++){
    (function(b){ b.addEventListener('click',function(){ matchClick(b); }); })(cards[k]);
  }
}
function matchClick(btn){
  if(btn.classList.contains('done')) return;
  var hint=document.getElementById('mHint'); if(hint) hint.textContent='';
  if(btn.getAttribute('data-side')==='t'){
    var ts=scr.querySelectorAll('.mcard[data-side="t"]');
    for(var i=0;i<ts.length;i++) ts[i].classList.remove('sel');
    btn.classList.add('sel'); mState.selT=parseInt(btn.getAttribute('data-id'),10); sClick();
    return;
  }
  if(mState.selT===null){
    btn.classList.add('bad'); setTimeout(function(){ btn.classList.remove('bad'); },450);
    if(hint) hint.textContent='— pick a term on the left first!';
    sBad(); return;
  }
  if(parseInt(btn.getAttribute('data-id'),10)===mState.selT){
    var sel=scr.querySelector('.mcard[data-side="t"].sel');
    if(sel){ sel.classList.add('done'); sel.classList.remove('sel'); }
    btn.classList.add('done');
    mState.done++; mState.selT=null; sOk();
    if(mState.done===PAIRS.length) matchEnd();
  } else {
    mState.mistakes++; sBad();
    document.getElementById('mMist').textContent=mState.mistakes;
    btn.classList.add('bad'); setTimeout(function(){ btn.classList.remove('bad'); },450);
  }
}
function matchEnd(){
  var s=mState.mistakes===0?3:mState.mistakes<=2?2:1;
  setBest('match',s); sWin(); confetti(s>=2?70:25);
  scr.innerHTML='<div class="result-box">'+
    '<div class="big">'+(s===3?'🏆':s===2?'🎉':'🎬')+'</div>'+
    '<h2 style="color:#2c3e50">All 8 pairs matched! Misses: '+mState.mistakes+'</h2>'+
    '<div class="stars-row">'+starsOf(s)+'</div>'+
    '<div class="row-btns"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home2">Back to menu</button></div></div>';
  document.getElementById('again').onclick=function(){ sClick(); go('match'); };
  document.getElementById('home2').onclick=function(){ sClick(); go('home'); };
}

// ---------------- GAME 3: TIMELINE ----------------
var oState;
function startOrder(){
  oState={step:0,mistakes:0,wrongHere:0};
  var evs=shuffle(EVENTS.map(function(t,i){ return {t:t,i:i}; }));
  var html='<h2 style="color:#2c3e50">📖 Build the Plot</h2>'+
    '<p class="hint">Tap the events in the order they happened in the episode — all three storylines mixed together. Step <b id="oStep">1</b> of '+EVENTS.length+' · misses: <b id="oMist">0</b></p>'+
    '<div class="order-list">';
  for(var i=0;i<evs.length;i++) html+='<button class="ord" data-i="'+evs[i].i+'">'+evs[i].t+'</button>';
  html+='</div>';
  scr.innerHTML=html;
  var ob=scr.querySelectorAll('.ord');
  for(var j=0;j<ob.length;j++){
    (function(b){ b.addEventListener('click',function(){ orderClick(b); }); })(ob[j]);
  }
}
function orderClick(btn){
  if(btn.classList.contains('done')) return;
  if(parseInt(btn.getAttribute('data-i'),10)===oState.step){
    btn.classList.add('done');
    btn.innerHTML='<span class="num">'+(oState.step+1)+'</span>'+btn.textContent;
    oState.step++; oState.wrongHere=0; sOk();
    var st=document.getElementById('oStep');
    if(st) st.textContent=Math.min(oState.step+1,EVENTS.length);
    if(oState.step===EVENTS.length) orderEnd();
  } else {
    oState.mistakes++; oState.wrongHere++; sBad();
    document.getElementById('oMist').textContent=oState.mistakes;
    btn.classList.add('bad'); setTimeout(function(){ btn.classList.remove('bad'); },450);
    if(oState.wrongHere>=2){
      var c=scr.querySelector('.ord[data-i="'+oState.step+'"]');
      if(c){ c.classList.add('hintme'); setTimeout(function(){ c.classList.remove('hintme'); },1400); }
    }
  }
}
function orderEnd(){
  var s=oState.mistakes===0?3:oState.mistakes<=2?2:1;
  setBest('order',s); sWin(); confetti(s>=2?70:25);
  scr.innerHTML='<div class="result-box">'+
    '<div class="big">'+(s===3?'🏆':s===2?'🎉':'🎬')+'</div>'+
    '<h2 style="color:#2c3e50">Plot assembled! Misses: '+oState.mistakes+'</h2>'+
    '<div class="stars-row">'+starsOf(s)+'</div>'+
    '<p class="hint">Three storylines — one episode: that\u2019s how the “plot A, B, C” structure works.</p>'+
    '<div class="row-btns"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home2">Back to menu</button></div></div>';
  document.getElementById('again').onclick=function(){ sClick(); go('order'); };
  document.getElementById('home2').onclick=function(){ sClick(); go('home'); };
}

// ---------------- GAME 4: ROSS OR RUSS ----------------
var rState;
function startRoss(){ rState={i:0,score:0}; showRR(); }
function showRR(){
  var q=RR[rState.i];
  scr.innerHTML='<h2 style="color:#2c3e50">🎭 Ross or Russ?</h2>'+
    '<div class="pbar"><i style="width:'+(rState.i/RR.length*100)+'%"></i></div>'+
    '<div class="qcount">Check '+(rState.i+1)+' of '+RR.length+' · Score: '+rState.score+'</div>'+
    '<div class="qtext">'+q.q+'</div>'+
    '<div class="opts">'+
    '<button class="opt" data-k="0">📘 Ross</button>'+
    '<button class="opt" data-k="1">📗 Russ</button>'+
    '<button class="opt" data-k="2">🤯 Both — identical!</button>'+
    '</div>'+
    '<div class="note" id="note">💡 '+q.note+'</div>'+
    '<div class="nav"><button class="btn" id="nextBtn" style="display:none">'+(rState.i===RR.length-1?'Results →':'Next →')+'</button></div>';
  var ob=scr.querySelectorAll('.opt');
  for(var j=0;j<ob.length;j++){
    (function(b){ b.addEventListener('click',function(){ answerRR(b); }); })(ob[j]);
  }
}
function answerRR(btn){
  if(btn.disabled) return;
  var correct=RR[rState.i].a;
  var ok=parseInt(btn.getAttribute('data-k'),10)===correct;
  var all=scr.querySelectorAll('.opt');
  for(var i=0;i<all.length;i++){
    all[i].disabled=true;
    if(parseInt(all[i].getAttribute('data-k'),10)===correct) all[i].classList.add('correct');
  }
  if(!ok) btn.classList.add('wrong'); else rState.score++;
  if(ok) sOk(); else sBad();
  document.getElementById('note').classList.add('show');
  var nb=document.getElementById('nextBtn'); nb.style.display='inline-block';
  nb.addEventListener('click',function(){
    sClick(); rState.i++;
    if(rState.i<RR.length) showRR(); else rrEnd();
  });
}
function rrEnd(){
  var s=toStars(rState.score,[9,7,5]);
  setBest('ross',s); sWin(); confetti(s>=2?70:25);
  var msg = s===3?'Eagle eye — the double is exposed!':'Sometimes the double is obvious, and we only see what we expect to see…';
  scr.innerHTML='<div class="result-box">'+
    '<div class="big">'+(s===3?'🏆':s===2?'🎉':'🎭')+'</div>'+
    '<h2 style="color:#2c3e50">'+rState.score+' out of '+RR.length+' correct</h2>'+
    '<div class="stars-row">'+starsOf(s)+'</div>'+
    '<p class="hint">'+msg+'</p>'+
    '<div class="row-btns"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home2">Back to menu</button></div></div>';
  document.getElementById('again').onclick=function(){ sClick(); go('ross'); };
  document.getElementById('home2').onclick=function(){ sClick(); go('home'); };
}

// ---------------- GAME 5: JOEY'S DILEMMA ----------------
var st;
function startStory(){ st={node:'s1',integrity:0}; showScene(); }
function showScene(){
  var s=STORY[st.node];
  if(s.end) return renderEnding(s);
  var meter;
  if(st.integrity>=0) meter=('⭐'.repeat(st.integrity)||'—');
  else meter='🪫 −'+(-st.integrity);
  var html='<h2 style="color:#2c3e50">⚖️ Joey\u2019s Dilemma</h2>'+
    '<div class="integrity">Integrity meter: '+meter+'</div>'+
    '<div class="scene"><div class="s-title">'+s.title+'</div>'+s.text+'</div><div class="opts">';
  for(var i=0;i<s.choices.length;i++){
    html+='<button class="opt" data-n="'+s.choices[i].next+'" data-fx="'+s.choices[i].fx+'">'+s.choices[i].label+'</button>';
  }
  html+='</div>';
  scr.innerHTML=html;
  var ob=scr.querySelectorAll('.opt');
  for(var j=0;j<ob.length;j++){
    (function(b){ b.addEventListener('click',function(){
      sClick(); st.integrity+=parseInt(b.getAttribute('data-fx'),10); st.node=b.getAttribute('data-n'); showScene();
    }); })(ob[j]);
  }
}
function renderEnding(s){
  var stars=st.integrity>=3?3:st.integrity>=1?2:1;
  setBest('story',stars); sWin(); confetti(stars>=2?80:25);
  scr.innerHTML='<h2 style="color:#2c3e50">⚖️ Joey\u2019s Dilemma</h2>'+
    '<div class="result-box">'+
    '<div class="big">'+(stars===3?'🏆':stars===2?'👏':'🎬')+'</div>'+
    '<h3 style="color:#2c3e50">'+s.title+'</h3>'+
    '<div class="stars-row">'+starsOf(stars)+'</div>'+
    '<p class="res-note">'+s.text+'</p>'+
    '<div class="row-btns"><button class="btn" id="again">Play again</button><button class="btn ghost" id="home2">Back to menu</button></div>'+
    '</div>';
  document.getElementById('again').onclick=function(){ sClick(); go('story'); };
  document.getElementById('home2').onclick=function(){ sClick(); go('home'); };
}

// ---------------- HEADER / MODAL / START ----------------
document.getElementById('homeBtn').addEventListener('click',function(){ sClick(); go('home'); });
document.getElementById('soundBtn').addEventListener('click',function(){
  save.sound=!save.sound; persist(); this.textContent=save.sound?'🔊':'🔇'; if(save.sound) sClick();
});
document.getElementById('soundBtn').textContent=save.sound?'🔊':'🔇';
document.getElementById('cheatBtn').addEventListener('click',function(){ sClick(); document.getElementById('cheatModal').classList.add('open'); });
document.getElementById('cheatClose').addEventListener('click',function(){ document.getElementById('cheatModal').classList.remove('open'); });
document.getElementById('cheatModal').addEventListener('click',function(e){ if(e.target===this) this.classList.remove('open'); });
document.getElementById('vocabList').innerHTML=VOCAB.map(function(v){
  return '<div class="vrow"><b>'+v[0]+'</b><span>'+v[1]+'</span></div>';
}).join('');

updateHeader();
go('home');
</script>
