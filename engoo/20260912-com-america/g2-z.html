<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>👑 The Royal Urbanite — Coming to America</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* ===== RESET & GLOBAL ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-dark: #0d0a0b;
      --bg-card: #1a1418;
      --gold: #c9a84c;
      --gold-light: #e8d48b;
      --gold-dark: #8b6b2e;
      --red: #a83e3e;
      --green: #3e7a4e;
      --text: #f0e6d8;
      --text-dim: #b8a89a;
      --shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      --radius: 18px;
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: var(--font-body);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    /* ===== PRELOADER ===== */
    #preloader {
      position: fixed;
      inset: 0;
      background: var(--bg-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.8s ease;
    }
    #preloader.hidden {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none;
    }
    .preloader-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 4rem);
      color: var(--gold);
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      text-align: center;
      text-shadow: 0 0 40px rgba(201, 168, 76, 0.3);
    }
    .preloader-sub {
      font-size: clamp(0.9rem, 2vw, 1.2rem);
      color: var(--text-dim);
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 2.5rem;
      text-align: center;
    }
    .play-btn {
      background: transparent;
      border: 2px solid var(--gold);
      color: var(--gold);
      font-family: var(--font-body);
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      font-weight: 700;
      padding: 0.8em 2.5em;
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 0.15em;
      transition: all 0.3s ease;
      animation: pulse-gold 2s infinite;
      display: flex;
      align-items: center;
      gap: 0.5em;
    }
    .play-btn:hover {
      background: var(--gold);
      color: var(--bg-dark);
      transform: scale(1.05);
      box-shadow: 0 0 60px rgba(201, 168, 76, 0.4);
    }
    @keyframes pulse-gold {
      0%, 100% { box-shadow: 0 0 20px rgba(201, 168, 76, 0.2); }
      50% { box-shadow: 0 0 60px rgba(201, 168, 76, 0.5); }
    }
    /* ===== APP SHELL ===== */
    #app {
      width: 100%;
      max-width: 900px;
      height: 100%;
      max-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background: var(--bg-dark);
      box-shadow: 0 0 80px rgba(0,0,0,0.9);
    }
    /* ===== HEADER CONSOLE ===== */
    #hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1.2rem;
      background: rgba(13, 10, 11, 0.95);
      border-bottom: 1px solid rgba(201, 168, 76, 0.15);
      backdrop-filter: blur(12px);
      z-index: 50;
      flex-shrink: 0;
      gap: 0.8rem;
    }
    .hud-brand {
      font-family: var(--font-display);
      font-size: 1rem;
      color: var(--gold);
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .hud-progress {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hud-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      transition: all 0.3s ease;
      border: 1px solid transparent;
    }
    .hud-dot.completed {
      background: var(--gold);
      box-shadow: 0 0 10px rgba(201, 168, 76, 0.5);
    }
    .hud-dot.current {
      border-color: var(--gold);
      background: transparent;
      box-shadow: 0 0 15px rgba(201, 168, 76, 0.6);
      transform: scale(1.2);
    }
    .hud-right {
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .hud-score {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--gold-light);
      background: rgba(201, 168, 76, 0.1);
      padding: 0.3em 0.8em;
      border-radius: 20px;
      border: 1px solid rgba(201, 168, 76, 0.2);
      white-space: nowrap;
    }
    .hud-btn {
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 0.4em;
      border-radius: 8px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }
    .hud-btn:hover {
      color: var(--gold);
      background: rgba(201, 168, 76, 0.1);
    }
    .hud-btn.active {
      color: var(--gold);
    }
    /* ===== SCREENS ===== */
    .screen {
      display: none;
      flex-direction: column;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 1.2rem 1.2rem 2rem;
      position: relative;
      scroll-behavior: smooth;
    }
    .screen.active {
      display: flex;
      animation: screenIn 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* ===== INTRO SCREEN ===== */
    .intro-hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 2rem 0 1.5rem;
      gap: 0.8rem;
    }
    .intro-hero h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      color: var(--gold);
      line-height: 1.1;
      text-shadow: 0 4px 30px rgba(201, 168, 76, 0.2);
    }
    .intro-hero .sub {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: var(--text-dim);
      font-style: italic;
      max-width: 600px;
      line-height: 1.6;
    }
    .intro-hero .badge {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold-dark);
      border: 1px solid var(--gold-dark);
      padding: 0.3em 1.2em;
      border-radius: 20px;
      margin-bottom: 0.5rem;
    }
    .intro-cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      width: 100%;
      max-width: 700px;
      margin: 0.5rem auto;
    }
    @media (max-width: 500px) {
      .intro-cards { grid-template-columns: 1fr; }
    }
    .intro-card {
      background: var(--bg-card);
      border: 1px solid rgba(201, 168, 76, 0.12);
      border-radius: var(--radius);
      padding: 1.2rem 1rem;
      text-align: left;
      transition: all 0.3s;
    }
    .intro-card:hover {
      border-color: rgba(201, 168, 76, 0.35);
      transform: translateY(-2px);
    }
    .intro-card h3 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      color: var(--gold-light);
      margin-bottom: 0.4rem;
    }
    .intro-card p {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.5;
    }
    .intro-card .emoji {
      font-size: 1.6rem;
      display: block;
      margin-bottom: 0.3rem;
    }
    .cta-btn {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--bg-dark);
      border: none;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      padding: 0.9em 2.5em;
      border-radius: 60px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.3s;
      margin: 0.5rem auto 0;
      display: block;
      box-shadow: 0 8px 30px rgba(201, 168, 76, 0.25);
    }
    .cta-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 40px rgba(201, 168, 76, 0.4);
    }
    .cta-btn:active {
      transform: translateY(0) scale(0.98);
    }
    /* ===== MAP SCREEN ===== */
    .map-header {
      text-align: center;
      margin-bottom: 1.2rem;
    }
    .map-header h2 {
      font-family: var(--font-display);
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      color: var(--gold);
    }
    .map-header p {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-top: 0.3rem;
    }
    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 0.9rem;
      width: 100%;
    }
    .map-card {
      background: var(--bg-card);
      border: 1px solid rgba(201, 168, 76, 0.1);
      border-radius: var(--radius);
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .map-card:hover:not(.locked) {
      border-color: rgba(201, 168, 76, 0.4);
      transform: translateY(-4px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }
    .map-card.locked {
      opacity: 0.5;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }
    .map-card .card-img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      display: block;
      border-bottom: 1px solid rgba(201, 168, 76, 0.1);
      background: #1a1418;
    }
    .map-card .card-body {
      padding: 0.8rem 1rem 0.9rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      flex: 1;
    }
    .map-card .card-num {
      font-size: 0.7rem;
      color: var(--gold-dark);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .map-card .card-title {
      font-family: var(--font-display);
      font-size: 1.05rem;
      color: var(--text);
      line-height: 1.2;
    }
    .map-card .card-char {
      font-size: 0.8rem;
      color: var(--text-dim);
      font-style: italic;
    }
    .map-card .card-stars {
      font-size: 0.9rem;
      color: var(--gold);
      letter-spacing: 0.1em;
      margin-top: 0.2rem;
    }
    .map-card .card-best {
      font-size: 0.7rem;
      color: var(--text-dim);
      opacity: 0.7;
    }
    .map-card .lock-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(13, 10, 11, 0.7);
      font-size: 2rem;
      color: var(--text-dim);
    }
    /* ===== SCENE SCREEN ===== */
    .scene-header {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.8rem;
      flex-wrap: wrap;
    }
    .scene-header .back-btn {
      background: none;
      border: 1px solid rgba(201, 168, 76, 0.2);
      color: var(--text-dim);
      padding: 0.4em 0.8em;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }
    .scene-header .back-btn:hover {
      border-color: var(--gold);
      color: var(--gold);
    }
    .scene-header h2 {
      font-family: var(--font-display);
      font-size: clamp(1.2rem, 3.5vw, 1.8rem);
      color: var(--gold);
      flex: 1;
    }
    .scene-header .scene-tag {
      font-size: 0.7rem;
      color: var(--gold-dark);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      border: 1px solid var(--gold-dark);
      padding: 0.2em 0.8em;
      border-radius: 20px;
    }
    .scene-img {
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid rgba(201, 168, 76, 0.15);
      margin-bottom: 0.8rem;
      display: block;
      background: #1a1418;
      max-height: 220px;
      object-fit: cover;
    }
    .scene-flavor {
      font-size: 0.95rem;
      color: var(--text-dim);
      line-height: 1.7;
      margin-bottom: 1rem;
      padding: 0.8rem 1rem;
      border-left: 3px solid var(--gold-dark);
      background: rgba(201, 168, 76, 0.04);
      border-radius: 0 12px 12px 0;
      font-style: italic;
    }
    .scene-flavor strong {
      color: var(--gold-light);
      font-style: normal;
    }
    .scene-obj {
      font-size: 0.9rem;
      color: var(--gold-light);
      background: rgba(201, 168, 76, 0.08);
      padding: 0.6em 1em;
      border-radius: 12px;
      margin-bottom: 1rem;
      display: flex;
      align-items: flex-start;
      gap: 0.5em;
    }
    .scene-obj i {
      flex-shrink: 0;
      margin-top: 0.15em;
    }
    /* ===== GAME AREA ===== */
    .game-area {
      background: var(--bg-card);
      border: 1px solid rgba(201, 168, 76, 0.1);
      border-radius: var(--radius);
      padding: 1.2rem;
      margin-top: 0.3rem;
    }
    .game-prompt {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
      line-height: 1.5;
    }
    .game-prompt .hl {
      color: var(--gold);
    }
    /* Word bank / fill blanks */
    .blank-sentence {
      font-size: 1.05rem;
      line-height: 2.2;
      margin-bottom: 1rem;
      color: var(--text);
    }
    .blank {
      display: inline-block;
      min-width: 100px;
      border-bottom: 2px solid var(--gold-dark);
      text-align: center;
      padding: 0 0.5em;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--gold);
      font-weight: 600;
      margin: 0 0.1em;
    }
    .blank:hover {
      background: rgba(201, 168, 76, 0.1);
      border-radius: 4px 4px 0 0;
    }
    .blank.filled {
      border-bottom-color: var(--green);
      color: var(--green);
    }
    .blank.filled.correct {
      border-bottom-color: var(--green);
      color: var(--green);
    }
    .blank.filled.wrong {
      border-bottom-color: var(--red);
      color: var(--red);
      animation: shake 0.4s;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .word-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 0.8rem;
    }
    .word-chip {
      background: rgba(201, 168, 76, 0.1);
      border: 1px solid rgba(201, 168, 76, 0.25);
      color: var(--gold-light);
      padding: 0.4em 1em;
      border-radius: 30px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .word-chip:hover {
      background: rgba(201, 168, 76, 0.25);
      transform: translateY(-2px);
    }
    .word-chip.used {
      opacity: 0.3;
      pointer-events: none;
      text-decoration: line-through;
    }
    /* True/False */
    .tf-card {
      background: rgba(201, 168, 76, 0.05);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 14px;
      padding: 1.2rem;
      margin-bottom: 1rem;
      font-size: 1rem;
      line-height: 1.6;
      min-height: 80px;
      display: flex;
      align-items: center;
    }
    .tf-actions {
      display: flex;
      gap: 0.8rem;
      margin-top: 0.5rem;
    }
    .tf-btn {
      flex: 1;
      padding: 0.7em;
      border: 2px solid;
      border-radius: 12px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
    }
    .tf-btn.real {
      border-color: var(--green);
      color: var(--green);
    }
    .tf-btn.real:hover, .tf-btn.real.selected {
      background: var(--green);
      color: var(--bg-dark);
    }
    .tf-btn.not-real {
      border-color: var(--red);
      color: var(--red);
    }
    .tf-btn.not-real:hover, .tf-btn.not-real.selected {
      background: var(--red);
      color: var(--bg-dark);
    }
    .tf-timer {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      margin-top: 0.8rem;
      overflow: hidden;
    }
    .tf-timer-fill {
      height: 100%;
      background: var(--gold);
      width: 100%;
      transition: width 0.1s linear;
    }
    .tf-timer-fill.warning {
      background: var(--red);
      animation: flash 0.5s infinite;
    }
    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .streak-badge {
      display: inline-block;
      font-size: 0.8rem;
      color: var(--gold);
      background: rgba(201, 168, 76, 0.1);
      padding: 0.2em 0.8em;
      border-radius: 20px;
      margin-bottom: 0.5rem;
    }
    /* Multiple Choice */
    .mc-options {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .mc-opt {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(201, 168, 76, 0.15);
      border-radius: 12px;
      padding: 0.8em 1em;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 0.95rem;
      text-align: left;
      color: var(--text);
      font-family: var(--font-body);
    }
    .mc-opt:hover {
      border-color: var(--gold);
      background: rgba(201, 168, 76, 0.08);
    }
    .mc-opt.correct {
      border-color: var(--green);
      background: rgba(62, 122, 78, 0.15);
    }
    .mc-opt.wrong {
      border-color: var(--red);
      background: rgba(168, 62, 62, 0.15);
    }
    .mc-opt:disabled {
      cursor: default;
      opacity: 0.7;
    }
    /* Sorting */
    .sort-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }
    .sort-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(201, 168, 76, 0.12);
      border-radius: 10px;
      padding: 0.6em 0.8em;
      cursor: grab;
      transition: all 0.2s;
      font-size: 0.9rem;
    }
    .sort-item:active {
      cursor: grabbing;
    }
    .sort-item.dragging {
      opacity: 0.4;
      border-style: dashed;
    }
    .sort-item.drag-over {
      border-color: var(--gold);
      background: rgba(201, 168, 76, 0.1);
    }
    .sort-item.correct {
      border-color: var(--green);
      background: rgba(62, 122, 78, 0.1);
    }
    .sort-item.wrong {
      border-color: var(--red);
      background: rgba(168, 62, 62, 0.1);
    }
    .sort-item .drag-handle {
      color: var(--text-dim);
      font-size: 1.1rem;
      cursor: grab;
      user-select: none;
    }
    .sort-item .sort-text {
      flex: 1;
    }
    .sort-item .arrow-btns {
      display: flex;
      gap: 0.2rem;
    }
    .sort-item .arrow-btns button {
      background: rgba(201, 168, 76, 0.1);
      border: none;
      color: var(--gold);
      width: 26px;
      height: 26px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .sort-item .arrow-btns button:hover {
      background: rgba(201, 168, 76, 0.3);
    }
    /* Memory */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin-bottom: 0.8rem;
    }
    @media (max-width: 500px) {
      .memory-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .mem-card {
      aspect-ratio: 1;
      perspective: 800px;
      cursor: pointer;
    }
    .mem-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .mem-card.flipped .mem-inner {
      transform: rotateY(180deg);
    }
    .mem-face {
      position: absolute;
      inset: 0;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      backface-visibility: hidden;

  const LEVEL_GAMES = {

    workethic: {

      ]
    },
    wealth: {
      type: 'fill',
      prompt: 'Complete the comparison between Akeem and Darryl.',
      sentence: 'Akeem represents inherent {0} and dignity. Darryl represents flashy, inherited {1}. Cleo favors Darryl purely for his {2}.',
      blanks: ['nobility', 'wealth', 'capital'],
      bank: ['nobility', 'wealth', 'capital', 'poverty', 'status', 'character']
    },
    respect: {
      type: 'mc',
      prompt: 'How does Akeem earn respect in the concrete jungle?',
      questions: [
        {
          q: 'What does Akeem use to disarm the robber?',

          ans: 1
        },
        {

          opts: ['Action dictates status', 'Wealth solves everything', 'Royalty is always respected'],

        },
        {

          opts: ['Weakness', 'Courage and resourcefulness', 'Defeat'],

        }
      ]
    },
    past: {
      type: 'tf',
      prompt: 'Real or Not Real? The past catches up.',
      statements: [
        { text: 'King Jaffe Joffer arrives in Queens with a full royal entourage.', real: true },

        { text: 'Cleo shouts: "This is America, Jack. I don\'t care who you are!"', real: true },

      ]
    },
    renounce: {
      type: 'fill',
      prompt: 'Complete the synthesis of Akeem\'s journey.',
      sentence: 'Confronted by Lisa\'s feeling of betrayal, Akeem declares his willingness to {0} his crown entirely. He proves that the person is infinitely more valuable than the {1}. True wealth is building a life based on mutual {2} and individual merit.',
      blanks: ['renounce', 'position', 'respect'],
      bank: ['renounce', 'position', 'respect', 'accept', 'wealth', 'obedience']
    }
  };

  /* ===== STATE ===== */
  let state = {
    currentScreen: 'intro',
    currentScene: null,
    scores: {},
    stars: {},
    totalScore: 0,
    totalStars: 0,
    streak: 0,
    levelInProgress: false,
    cleanupFn: null,
    bonusActive: false
  };

  const STORAGE_KEY = 'royal_urbanite_v1';

  function saveProgress() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        scores: state.scores,
        stars: state.stars,
        totalScore: state.totalScore,
        totalStars: state.totalStars
      }));
    } catch(e) { /* private mode */ }
  }

  function loadProgress() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        const parsed = JSON.parse(data);
        state.scores = parsed.scores || {};
        state.stars = parsed.stars || {};
        state.totalScore = parsed.totalScore || 0;
        state.totalStars = parsed.totalStars || 0;
      }
    } catch(e) { /* ignore */ }
  }

  /* ===== CLEANUP ===== */
  function setCleanup(fn) {
    if (state.cleanupFn) state.cleanupFn();
    state.cleanupFn = fn;
  }

  /* ===== HUD ===== */
  function updateHUD() {
    const prog = $('#hudProgress');
    let dotsHtml = '';
    SCENES.forEach((s, i) => {
      const done = state.stars[s.id] > 0;
      const current = state.currentScene && state.currentScene.id === s.id;
      dotsHtml += `<span class="hud-dot ${done ? 'completed' : ''} ${current ? 'current' : ''}"></span>`;
    });
    prog.innerHTML = dotsHtml;
    $('#hudScore').textContent = state.totalScore + ' pts';
    renderSound();
  }

  /* ===== SCREEN SWITCHING ===== */
  function showScreen(name) {
    state.currentScreen = name;
    $$('.screen').forEach(s => s.classList.remove('active'));
    const el = $('#screen-' + name);
    if (el) el.classList.add('active');
    updateHUD();
  }

  /* ===== INTRO RENDER ===== */
  function renderIntro() {
    const el = $('#screen-intro');
    el.innerHTML = `
      <div class="intro-hero">
        <div class="badge">👑 An Interactive Journey</div>
        <h1>The Royal Urbanite</h1>
        <p class="sub">A narrative learning experience through the concrete canyons of 1980s America — where a prince becomes a man.</p>
      </div>
      <div class="intro-cards">
        <div class="intro-card">
          <span class="emoji">🏰</span>
          <h3>From Zamunda to Queens</h3>
          <p>Follow Prince Akeem as he trades rose petals for broken glass in search of authenticity.</p>
        </div>
        <div class="intro-card">
          <span class="emoji">💪</span>
          <h3>Earn Your Place</h3>
          <p>Discover that true worth is not inherited — it is built through friction, labor, and courage.</p>
        </div>
        <div class="intro-card">
          <span class="emoji">📚</span>
          <h3>Master the Vocabulary</h3>
          <p>Learn key terms like <strong>megacity</strong>, <strong>authenticity</strong>, and <strong>renounce</strong> through play.</p>
        </div>
        <div class="intro-card">
          <span class="emoji">🎯</span>
          <h3>Prove Your Merit</h3>
          <p>Complete eleven challenges, earn stars, and rise through the ranks of the Royal Urbanite.</p>
        </div>
      </div>
      <button class="cta-btn" id="startBtn">Begin the Journey →</button>
      <p style="font-size:0.75rem; color:var(--text-dim); margin-top:1rem; text-align:center;">
        Based on the presentation <em>Discovering the Megacity: The American Dream, Urban Life, and the Search for Authenticity in Coming to America</em>.
      </p>
    `;
    $('#startBtn').addEventListener('click', () => {
      initAudio();
      sfx.click();
      showScreen('map');
      renderMap();
    });
  }

  /* ===== MAP RENDER ===== */
  function renderMap() {
    const el = $('#screen-map');
    let html = `
      <div class="map-header">
        <h2>🗺️ The Journey</h2>
        <p>Complete each chapter to unlock the next.</p>
      </div>
      <div class="map-grid">
    `;
    SCENES.forEach((s, i) => {
      const unlocked = i === 0 || state.stars[SCENES[i-1].id] > 0;
      const stars = state.stars[s.id] || 0;
      const best = state.scores[s.id] || 0;
      const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
      html += `
        <div class="map-card ${unlocked ? '' : 'locked'}" data-scene="${s.id}" data-index="${i}">
          <img class="card-img" src="${BASE_URL}${s.slide}" alt="${s.title}" loading="lazy"
               onerror="this.style.display='none'">
          <div class="card-body">
            <div class="card-num">Chapter ${s.num}</div>
            <div class="card-title">${s.title}</div>
            <div class="card-char">${s.char}</div>
            <div class="card-stars">${starStr}</div>
            <div class="card-best">${best > 0 ? 'Best: ' + best + ' pts' : ''}</div>
          </div>
          ${!unlocked ? '<div class="lock-overlay">🔒</div>' : ''}
        </div>
      `;
    });
    html += `</div>`;
    // Final button
    const allDone = SCENES.every(s => state.stars[s.id] > 0);
    if (allDone) {
      html += `<button class="cta-btn" id="finaleBtn" style="margin-top:1.5rem;">🏆 View Finale</button>`;
    } else {
      html += `<p style="text-align:center; color:var(--text-dim); font-size:0.8rem; margin-top:1.5rem;">Complete all chapters to unlock the finale.</p>`;
    }
    el.innerHTML = html;

    // Handlers
    $$('.map-card', el).forEach(card => {
      card.addEventListener('click', () => {
        const idx = parseInt(card.dataset.index);
        const unlocked = idx === 0 || state.stars[SCENES[idx-1].id] > 0;
        if (!unlocked) {
          toast('🔒 Complete the previous chapter first.');
          sfx.wrong();
          return;
        }
        initAudio();
        sfx.click();
        openScene(SCENES[idx]);
      });
    });
    const fb = $('#finaleBtn');
    if (fb) fb.addEventListener('click', () => { sfx.fanfare(); showScreen('finale'); renderFinale(); });
  }

  /* ===== SCENE ===== */
  function openScene(scene) {
    state.currentScene = scene;
    state.levelInProgress = true;
    state.streak = 0;
    showScreen('scene');
    renderSceneIntro(scene);
    updateHUD();
  }

  function renderSceneIntro(scene) {
    const el = $('#screen-scene');
    el.innerHTML = `
      <div class="scene-header">
        <button class="back-btn" id="sceneBack">← Map</button>
        <h2>${scene.title}</h2>
        <span class="scene-tag">${scene.tag}</span>
      </div>
      <!-- SLIDE-IMAGE: ${scene.slide} -->
      <img class="scene-img" src="${BASE_URL}${scene.slide}" alt="${scene.title}"
           onerror="this.style.display='none'">
      <div class="scene-flavor">${scene.flavor}</div>
      <div class="scene-obj"><i>🎯</i> <span>${scene.obj}</span></div>
      <div class="scene-obj" style="background:rgba(201,168,76,0.04); font-style:italic;">
        <i>💡</i> <span>${scene.tip}</span>
      </div>
      <button class="cta-btn" id="sceneStart" style="width:100%;">Start Challenge →</button>
    `;
    $('#sceneBack').addEventListener('click', () => {
      sfx.click();
      state.levelInProgress = false;
      if (state.cleanupFn) state.cleanupFn();
      showScreen('map');
      renderMap();
    });
    $('#sceneStart').addEventListener('click', () => {
      initAudio();
      sfx.click();
      startLevelGame(scene);
    });
  }

  /* ===== LEVEL GAME ROUTER ===== */
  function startLevelGame(scene) {
    const game = LEVEL_GAMES[scene.id];
    if (!game) return;
    const el = $('#screen-scene');
    // Replace content with game area
    el.innerHTML = `
      <div class="scene-header">
        <button class="back-btn" id="gameBack">← Map</button>
        <h2>${scene.title}</h2>
        <span class="scene-tag">Challenge</span>
      </div>
      <div class="game-area" id="gameArea"></div>
      <div id="gameResult" class="hidden"></div>
    `;
    $('#gameBack').addEventListener('click', () => {
      sfx.click();
      state.levelInProgress = false;
      if (state.cleanupFn) state.cleanupFn();
      showScreen('map');
      renderMap();
    });

    const area = $('#gameArea');
    let correctCount = 0;
    let mistakeCount = 0;
    let levelScore = 0;
    let streak = 0;
    let totalQuestions = 0;

    function finishLevel() {
      state.levelInProgress = false;
      const stars = mistakeCount === 0 ? 3 : mistakeCount <= 2 ? 2 : 1;
      if (!state.scores[scene.id] || levelScore > state.scores[scene.id]) {
        state.scores[scene.id] = levelScore;
      }
      if (!state.stars[scene.id] || stars > state.stars[scene.id]) {
        state.stars[scene.id] = stars;
      }
      state.totalScore = Object.values(state.scores).reduce((a, b) => a + b, 0);
      state.totalStars = Object.values(state.stars).reduce((a, b) => a + b, 0);
      saveProgress();
      updateHUD();
      sfx.fanfare();
      spawnConfetti(30);
      const resultEl = $('#gameResult');
      resultEl.classList.remove('hidden');
      area.style.display = 'none';
      const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
      resultEl.innerHTML = `
        <div class="result-box">
          <div style="font-size:1.5rem; margin-bottom:0.5rem;">${stars === 3 ? '🏆' : stars === 2 ? '🥈' : '🥉'}</div>
          <div class="result-stars">${starStr}</div>
          <div class="result-score">${levelScore} pts</div>
          <div class="result-msg">${stars === 3 ? 'Flawless! You are a true Royal Urbanite.' : stars === 2 ? 'Well done! A few missteps, but strong progress.' : 'You made it through. The city is tough — try again for a better score.'}</div>
          <div style="display:flex; gap:0.8rem; justify-content:center; flex-wrap:wrap;">
            <button class="cta-btn" id="retryBtn" style="font-size:0.9rem; padding:0.7em 1.8em;">Retry</button>
            <button class="cta-btn" id="nextBtn" style="font-size:0.9rem; padding:0.7em 1.8em; background:transparent; border:2px solid var(--gold); color:var(--gold); box-shadow:none;">Back to Map</button>
          </div>
        </div>
      `;
      $('#retryBtn').addEventListener('click', () => {
        sfx.click();
        startLevelGame(scene);
      });
      $('#nextBtn').addEventListener('click', () => {
        sfx.click();
        showScreen('map');
        renderMap();
      });
    }

    function addScore(pts) {
      levelScore += pts;
      state.totalScore += pts;
      updateHUD();
    }

    /* --- FILL IN THE BLANKS --- */
    if (game.type === 'fill') {
      totalQuestions = game.blanks.length;
      let filled = new Array(game.blanks.length).fill(null);
      let bankUsed = new Array(game.bank.length).fill(false);
      let selectedBlank = null;

      function renderFill() {
        let sentence = game.sentence;
        let blankIdx = 0;
        sentence = sentence.replace(/\{(\d+)\}/g, (m, i) => {
          const idx = parseInt(i);
          const val = filled[idx];
          return `<span class="blank ${val ? 'filled' : ''}" data-blank="${idx}">${val || '______'}</span>`;
        });
        let bankHtml = '';
        game.bank.forEach((w, i) => {
          bankHtml += `<span class="word-chip ${bankUsed[i] ? 'used' : ''}" data-word="${i}">${w}</span>`;
        });
        area.innerHTML = `
          <div class="game-prompt">${game.prompt}</div>
          <div class="blank-sentence">${sentence}</div>
          <div style="font-size:0.8rem; color:var(--text-dim); margin-bottom:0.5rem;">Word Bank:</div>
          <div class="word-bank">${bankHtml}</div>
        `;

        // Blank click
        $$('.blank', area).forEach(b => {
          b.addEventListener('click', () => {
            if (b.classList.contains('filled')) return;
            sfx.click();
            $$('.blank', area).forEach(x => x.style.boxShadow = 'none');
            b.style.boxShadow = '0 0 15px rgba(201,168,76,0.5)';
            selectedBlank = parseInt(b.dataset.blank);
          });
        });
        // Word click
        $$('.word-chip', area).forEach(w => {
          w.addEventListener('click', () => {
            if (w.classList.contains('used')) return;
            if (selectedBlank === null) {
              toast('Select a blank first.');
              sfx.wrong();
              return;
            }
            const wordIdx = parseInt(w.dataset.word);
            const word = game.bank[wordIdx];
            const correct = game.blanks[selectedBlank];
            if (word === correct) {
              filled[selectedBlank] = word;
              bankUsed[wordIdx] = true;
              correctCount++;
              streak++;
              const pts = 100 + streak * 20;
              addScore(pts);
              sfx.correct();
              popFloat(window.innerWidth/2, window.innerHeight/2, '+' + pts, 'var(--green)');
              selectedBlank = null;
              renderFill();
              if (correctCount === totalQuestions) {
                setTimeout(finishLevel, 400);
              }
            } else {
              mistakeCount++;
              streak = 0;
              sfx.wrong();
              w.style.animation = 'shake 0.4s';
              setTimeout(() => w.style.animation = '', 400);
              addScore(-20);
              toast('❌ Not quite. Try another word.');
            }
          });
        });
      }
      renderFill();
      setCleanup(() => {});
    }

    /* --- TRUE / FALSE --- */
    if (game.type === 'tf') {
      totalQuestions = game.statements.length;
      let qIndex = 0;
      let timerId = null;
      let timeLeft = 6;

      function renderTF() {
        if (qIndex >= game.statements.length) {
          finishLevel();
          return;
        }
        const st = game.statements[qIndex];
        area.innerHTML = `
          <div class="game-prompt">${game.prompt}</div>
          <div class="streak-badge">🔥 Streak: ${streak}×</div>
          <div class="tf-card">${st.text}</div>
          <div class="tf-actions">
            <button class="tf-btn real" data-ans="true">✅ REAL</button>
            <button class="tf-btn not-real" data-ans="false">❌ NOT REAL</button>
          </div>
          <div class="tf-timer"><div class="tf-timer-fill" id="tfTimerFill"></div></div>
        `;
        timeLeft = 6;
        const fill = $('#tfTimerFill');
        if (timerId) clearInterval(timerId);
        timerId = setInterval(() => {
          timeLeft -= 0.1;
          if (fill) fill.style.width = clamp((timeLeft / 6) * 100, 0, 100) + '%';
          if (timeLeft <= 2 && fill) fill.classList.add('warning');
          if (timeLeft <= 0) {
            clearInterval(timerId);
            handleTFAnswer(null);
          }
        }, 100);

        $$('.tf-btn', area).forEach(btn => {
          btn.addEventListener('click', () => {
            if (timerId) clearInterval(timerId);
            handleTFAnswer(btn.dataset.ans === 'true');
          });
        });
      }

      function handleTFAnswer(answer) {
        const st = game.statements[qIndex];
        const correct = answer === st.real;
        if (correct) {
          correctCount++;
          streak++;
          const pts = 80 + streak * 15;
          addScore(pts);
          sfx.correct();
          toast('✅ Correct!');
        } else {
          mistakeCount++;
          streak = 0;
          sfx.wrong();
          toast('❌ Incorrect.');
          addScore(-15);
        }
        qIndex++;
        setTimeout(renderTF, 500);
      }

      // Keyboard support
      const keyHandler = (e) => {
        if (e.key === 'ArrowLeft') {
          const btn = $('.tf-btn.real', area);
          if (btn) btn.click();
        } else if (e.key === 'ArrowRight') {
          const btn = $('.tf-btn.not-real', area);
          if (btn) btn.click();
        }
      };
      document.addEventListener('keydown', keyHandler);
      setCleanup(() => {
        if (timerId) clearInterval(timerId);
        document.removeEventListener('keydown', keyHandler);
      });
      renderTF();
    }

    /* --- MULTIPLE CHOICE --- */
    if (game.type === 'mc') {
      totalQuestions = game.questions.length;
      let qIndex = 0;

      function renderMC() {
        if (qIndex >= game.questions.length) {
          finishLevel();
          return;
        }
        const q = game.questions[qIndex];
        let optsHtml = '';
        q.opts.forEach((o, i) => {
          optsHtml += `<button class="mc-opt" data-idx="${i}">${o}</button>`;
        });
        area.innerHTML = `
          <div class="game-prompt">${game.prompt}</div>
          <div class="streak-badge">🔥 Streak: ${streak}×</div>
          <div class="tf-card" style="min-height:auto; font-size:0.95rem;">${q.q}</div>
          <div class="mc-options">${optsHtml}</div>
        `;
        $$('.mc-opt', area).forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.idx);
            const correct = idx === q.ans;
            $$('.mc-opt', area).forEach(b => b.disabled = true);
            if (correct) {
              btn.classList.add('correct');
              correctCount++;
              streak++;
              const pts = 120 + streak * 20;
              addScore(pts);
              sfx.correct();
              toast('✅ Exactly right!');
            } else {
              btn.classList.add('wrong');
              $$('.mc-opt', area)[q.ans].classList.add('correct');
              mistakeCount++;
              streak = 0;
              sfx.wrong();
              toast('❌ Not quite.');
              addScore(-20);
            }
            qIndex++;
            setTimeout(renderMC, 1000);
          });
        });
      }
      renderMC();
      setCleanup(() => {});
    }

    /* --- SORTING --- */
    if (game.type === 'sort') {
      totalQuestions = 1;
      let items = shuffle([...game.items]);
      let dragSrc = null;

      function renderSort() {
        let html = `
          <div class="game-prompt">${game.prompt}</div>
          <div class="sort-list" id="sortList">
        `;
        items.forEach((item, i) => {
          html += `
            <div class="sort-item" draggable="true" data-idx="${i}">
              <span class="drag-handle">⠿</span>
              <span class="sort-text">${item}</span>
              <span class="arrow-btns">
                <button data-dir="up" data-idx="${i}">▲</button>
                <button data-dir="down" data-idx="${i}">▼</button>
              </span>
            </div>
          `;
        });
        html += `</div>
          <button class="cta-btn" id="sortCheck" style="width:100%;">Check Order</button>
        `;
        area.innerHTML = html;

        // Drag and drop
        $$('.sort-item', area).forEach(el => {
          el.addEventListener('dragstart', (e) => {
            dragSrc = parseInt(el.dataset.idx);
            el.classList.add('dragging');
          });
          el.addEventListener('dragend', () => el.classList.remove('dragging'));
          el.addEventListener('dragover', (e) => {
            e.preventDefault();
            el.classList.add('drag-over');
          });
          el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
          el.addEventListener('drop', (e) => {
            e.preventDefault();
            el.classList.remove('drag-over');
            const target = parseInt(el.dataset.idx);
            if (dragSrc !== null && dragSrc !== target) {
              const temp = items[dragSrc];
              items.splice(dragSrc, 1);
              items.splice(target, 0, temp);
              renderSort();
            }
          });
        });
        // Arrow buttons
        $$('.arrow-btns button', area).forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = parseInt(btn.dataset.idx);
            const dir = btn.dataset.dir;
            if (dir === 'up' && idx > 0) {
              [items[idx-1], items[idx]] = [items[idx], items[idx-1]];
            } else if (dir === 'down' && idx < items.length - 1) {
              [items[idx], items[idx+1]] = [items[idx+1], items[idx]];
            }
            sfx.click();
            renderSort();
          });
        });
        // Check
        $('#sortCheck').addEventListener('click', () => {
          const correctOrder = game.items;
          let allCorrect = true;
          items.forEach((item, i) => {
            if (item !== correctOrder[i]) allCorrect = false;
          });
          if (allCorrect) {
            correctCount = 1;
            const pts = 200;
            addScore(pts);
            sfx.correct();
            spawnConfetti(20);
            toast('✅ Perfect order!');
            setTimeout(finishLevel, 600);
          } else {
            mistakeCount++;
            sfx.wrong();
            toast('❌ Not quite. Rearrange and try again.');
            addScore(-30);
          }
        });
      }
      renderSort();
      setCleanup(() => {});
    }

    /* --- BONUS ROUND (timed) --- */
    if (game.type === 'bonus') {
      // Handled separately
    }
  }

  /* ===== FINALE ===== */
  function renderFinale() {
    const el = $('#screen-finale');
    const totalScore = state.totalScore;
    const totalStars = state.totalStars;
    let rank = 'Peasant';
    if (totalScore > 1500) rank = 'Royal Urbanite';
    else if (totalScore > 1000) rank = 'Honorary Prince';
    else if (totalScore > 600) rank = 'Rising Star';
    else if (totalScore > 300) rank = 'Apprentice';

    let rows = '';
    SCENES.forEach(s => {
      const stars = state.stars[s.id] || 0;
      const score = state.scores[s.id] || 0;
      const starStr = '★'.repeat(stars) + '☆'.repeat(3 - stars);
      rows += `
        <tr>
          <td>${s.num}. ${s.title}</td>
          <td class="stars-cell">${starStr}</td>
          <td>${score} pts</td>
        </tr>
      `;
    });

    el.innerHTML = `
      <div class="finale-wrap">
        <h1>🏆 The Royal Urbanite</h1>
        <div class="finale-rank">Rank: <strong>${rank}</strong></div>
        <div class="finale-total">${totalScore} pts · ${totalStars} ★</div>
        <table class="finale-table">
          <thead><tr><th>Chapter</th><th>Stars</th><th>Best</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <p style="font-size:0.9rem; color:var(--text-dim); line-height:1.6; margin:1rem 0;">
          "The majestic promise of the New York skyline is ultimately fulfilled not in the penthouses of Manhattan, but in the gritty, hard-working, independent communities of Queens."
        </p>
        <button class="cta-btn" id="resetBtn" style="background:transparent; border:2px solid var(--red); color:var(--red); box-shadow:none; font-size:0.9rem;">⏪ Rewind the Tape</button>
      </div>
    `;
    $('#resetBtn').addEventListener('click', () => {
      if (confirm('Erase all progress and start over?')) {
        state.scores = {};
        state.stars = {};
        state.totalScore = 0;
        state.totalStars = 0;
        saveProgress();
        updateHUD();
        showScreen('map');
        renderMap();
        toast('Progress reset. The journey begins anew.');
      }
    });
    // Confetti for finale
    if (totalStars >= 30) spawnConfetti(60);
  }

  /* ===== MODAL ===== */
  function showModal(title, text, onConfirm) {
    const overlay = $('#modalOverlay');
    const box = $('#modalBox');
    box.innerHTML = `
      <h3>${title}</h3>
      <p>${text}</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="modalCancel">Cancel</button>
        <button class="btn-primary" id="modalOk">Confirm</button>
      </div>
    `;
    overlay.classList.add('open');
    $('#modalCancel').addEventListener('click', () => overlay.classList.remove('open'));
    $('#modalOk').addEventListener('click', () => {
      overlay.classList.remove('open');
      if (onConfirm) onConfirm();
    });
  }

  /* ===== EVENT LISTENERS ===== */
  // Preloader
  $('#playBtn').addEventListener('click', () => {
    initAudio();
    sfx.click();
    $('#preloader').classList.add('hidden');
    setTimeout(() => {
      showScreen('intro');
      renderIntro();
    }, 300);
  });

  // Sound toggle
  $('#soundToggle').addEventListener('click', () => {
    soundOn = !soundOn;
    try { localStorage.setItem('royal_sound', soundOn ? 'on' : 'off'); } catch(e) {}
    renderSound();
    if (soundOn) { initAudio(); sfx.click(); }
  });

  // Map button
  $('#mapBtn').addEventListener('click', () => {
    sfx.click();
    if (state.currentScreen !== 'map') {
      if (state.cleanupFn) state.cleanupFn();
      state.levelInProgress = false;
      showScreen('map');
      renderMap();
    }
  });

  /* ===== INIT ===== */
  function init() {
    loadProgress();
    renderSound();
    updateHUD();
    // Preload images
    SCENES.forEach(s => {
      const img = new Image();
      img.src = BASE_URL + s.slide;
    });
    refreshIcons();
  }

  init();

  // Handle visibility change to pause timers
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.cleanupFn) {
      // Optionally pause; we'll just leave it
    }
  });

  // End of code
  updateHUD();
  renderMap();
  renderSound();
  refreshIcons();
