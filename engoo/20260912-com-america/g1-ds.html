<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Coming to America · Megacity Arcade</title>
  <!-- Google Fonts + Lucide (allowed CDN) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Caveat:wght@400;600&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.294.0/lucide.min.css">
  <style>
    /* ===== RESET & VARS ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --paper: #FAF3E4;
      --ink: #2E2438;
      --red: #D9433B;
      --teal: #3E8E8C;
      --yellow: #F2B33D;
      --gold: #E6A817;
      --success: #4A7C59;
      --error: #B33A3A;
      --shadow-hard: 0 6px 0 rgba(0,0,0,0.2);
      --shadow-soft: 0 4px 12px rgba(0,0,0,0.15);
      --font-display: 'Righteous', cursive;
      --font-mono: 'Courier Prime', monospace;
      --font-hand: 'Caveat', cursive;
      --font-body: 'Nunito Sans', sans-serif;
      --radius: 12px;
    }

    body {
      background: #1A141F;
      background-image: radial-gradient(circle at 20% 30%, #2E2438 0%, #1A141F 80%);
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    /* ===== FILM GRAIN (SVG feTurbulence) ===== */
    .grain {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      opacity: 0.08;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/></filter><rect width="200" height="200" filter="url(%23n)" opacity="1"/></svg>');
      mix-blend-mode: overlay;
    }

    /* ===== APP SHELL ===== */
    .app {
      width: 100%;
      max-width: 1000px;
      background: var(--paper);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 4px #2E2438, 0 0 0 8px #FAF3E4;
      padding: 20px 20px 24px;
      position: relative;
      overflow: hidden;
      min-height: 650px;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s;
    }

    /* ===== HEADER CONSOLE ===== */
    .console {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--ink);
      padding: 8px 16px;
      border-radius: 40px;
      color: var(--paper);
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), var(--shadow-hard);
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .console-brand {
      font-family: var(--font-display);
      font-size: 1.3rem;
      letter-spacing: 2px;
      color: var(--yellow);
      text-shadow: 2px 2px 0 #1A141F;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .console-brand i {
      font-size: 1.6rem;
    }

    .console-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1rem;
    }

    .console-stats span {
      background: rgba(255,255,255,0.1);
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .console-actions {
      display: flex;
      gap: 6px;
    }

    .console-actions button {
      background: transparent;
      border: 2px solid rgba(255,255,255,0.3);
      color: var(--paper);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.1s;
      font-size: 1rem;
    }

    .console-actions button:hover {
      background: var(--yellow);
      color: var(--ink);
      border-color: var(--yellow);
    }

    .console-actions button:active {
      transform: scale(0.92);
    }

    /* ===== SCREENS ===== */
    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      animation: fadeUp 0.35s ease-out;
    }

    .screen.active {
      display: flex;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== INTRO SCREEN ===== */
    .intro-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 30%, #F2B33D22 0%, transparent 70%);
    }

    .intro-wrap h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 8vw, 4rem);
      color: var(--ink);
      line-height: 1.1;
      text-shadow: 4px 4px 0 var(--yellow), 8px 8px 0 rgba(0,0,0,0.1);
      margin-bottom: 12px;
    }

    .intro-wrap h1 span {
      color: var(--red);
      display: block;
      font-size: 0.6em;
      text-shadow: 2px 2px 0 var(--yellow);
    }

    .intro-sub {
      font-family: var(--font-hand);
      font-size: 1.6rem;
      color: var(--teal);
      margin-bottom: 24px;
      max-width: 500px;
    }

    .intro-badge {
      background: var(--ink);
      color: var(--paper);
      padding: 8px 20px;
      border-radius: 40px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-hard);
    }

    .btn-play {
      background: var(--red);
      color: white;
      border: none;
      font-family: var(--font-display);
      font-size: 2rem;
      padding: 16px 48px;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 8px 0 #7A2A24, var(--shadow-hard);
      transition: all 0.1s;
      display: flex;
      align-items: center;
      gap: 12px;
      letter-spacing: 2px;
      margin-top: 8px;
    }

    .btn-play:hover {
      background: #E85A4F;
      transform: translateY(-2px);
      box-shadow: 0 10px 0 #7A2A24, var(--shadow-hard);
    }

    .btn-play:active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 #7A2A24;
    }

    /* ===== LEVEL MAP ===== */
    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      padding: 8px 4px;
      overflow-y: auto;
      flex: 1;
    }

    .level-card {
      background: white;
      border-radius: var(--radius);
      box-shadow: var(--shadow-hard);
      border: 2px solid var(--ink);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: all 0.15s;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .level-card:hover:not(.locked) {
      transform: translateY(-3px);
      box-shadow: 0 10px 0 rgba(0,0,0,0.15);
    }

    .level-card.locked {
      opacity: 0.6;
      filter: grayscale(0.8);
      cursor: not-allowed;
    }

    .level-card .preview {
      background: var(--teal);
      height: 100px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: white;
      font-family: var(--font-display);
      font-size: 2.4rem;
      border: 2px solid var(--ink);
    }

    .level-card .meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #555;
    }

    .level-card h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--ink);
      line-height: 1.2;
    }

    .level-card .stars {
      display: flex;
      gap: 4px;
      font-size: 1.2rem;
      color: #ccc;
    }

    .level-card .stars .filled {
      color: var(--gold);
      text-shadow: 0 0 8px #F2B33D88;
    }

    .lock-icon {
      position: absolute;
      top: 12px;
      right: 12px;
      color: var(--ink);
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      font-size: 1.2rem;
    }

    /* ===== SCENE / GAME SCREEN ===== */
    .scene-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .scene-header .title {
      font-family: var(--font-display);
      font-size: 1.4rem;
      color: var(--ink);
      background: var(--yellow);
      padding: 4px 16px;
      border-radius: 40px;
      border: 2px solid var(--ink);
      box-shadow: var(--shadow-hard);
    }

    .scene-header .hud {
      display: flex;
      gap: 12px;
      font-family: var(--font-mono);
      font-weight: 700;
      background: var(--ink);
      color: var(--paper);
      padding: 6px 18px;
      border-radius: 40px;
    }

    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 12px 0;
      min-height: 300px;
    }

    .card {
      background: white;
      border-radius: 20px;
      border: 3px solid var(--ink);
      box-shadow: var(--shadow-hard);
      padding: 24px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      transition: all 0.2s;
    }

    .card.shake {
      animation: shake 0.4s;
    }

    @keyframes shake {
      0%,
      100% {
        transform: translateX(0);
      }
      25% {
        transform: translateX(-10px);
      }
      75% {
        transform: translateX(10px);
      }
    }

    .card .prompt {
      font-family: var(--font-hand);
      font-size: 1.8rem;
      color: var(--teal);
      margin-bottom: 16px;
    }

    .card .statement {
      font-size: 1.4rem;
      font-weight: 700;
      margin: 16px 0;
      color: var(--ink);
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 16px 0;
    }

    .option-btn {
      background: var(--paper);
      border: 3px solid var(--ink);
      border-radius: 40px;
      padding: 12px 28px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--ink);
      transition: all 0.1s;
      color: var(--ink);
    }

    .option-btn:hover {
      background: var(--yellow);
      transform: translateY(-2px);
      box-shadow: 0 6px 0 var(--ink);
    }

    .option-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--ink);
    }

    .option-btn.correct {
      background: var(--success);
      color: white;
      border-color: var(--success);
      box-shadow: 0 4px 0 #2E5A3A;
    }

    .option-btn.wrong {
      background: var(--error);
      color: white;
      border-color: var(--error);
      box-shadow: 0 4px 0 #7A2A2A;
    }

    .timer-bar {
      width: 100%;
      height: 12px;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
      margin: 12px 0;
      border: 2px solid var(--ink);
    }

    .timer-fill {
      height: 100%;
      background: var(--teal);
      width: 100%;
      transition: width 0.1s linear;
    }

    .timer-fill.danger {
      background: var(--red);
      animation: pulse 0.5s infinite alternate;
    }

    @keyframes pulse {
      from {
        opacity: 1;
      }
      to {
        opacity: 0.6;
      }
    }

    /* Memory grid */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      max-width: 400px;
      margin: 0 auto;
    }

    .memory-card {
      aspect-ratio: 1;
      background: var(--teal);
      border-radius: 12px;
      border: 3px solid var(--ink);
      display: grid;
      place-items: center;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: var(--shadow-hard);
      color: white;
      font-family: var(--font-display);
    }

    .memory-card.flipped {
      background: var(--yellow);
      color: var(--ink);
      transform: rotateY(180deg);
    }

    .memory-card.matched {
      background: var(--success);
      color: white;
      cursor: default;
      transform: scale(0.95);
      opacity: 0.7;
    }

    /* Sorting */
    .sort-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
    }

    .sort-item {
      background: white;
      border: 2px solid var(--ink);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: grab;
      box-shadow: var(--shadow-hard);
      font-weight: 600;
      transition: all 0.1s;
    }

    .sort-item.dragging {
      opacity: 0.5;
    }

    .sort-item.correct-order {
      background: var(--success);
      color: white;
      border-color: #2E5A3A;
      cursor: default;
    }

    .sort-item .handle {
      font-size: 1.4rem;
      color: var(--teal);
      margin-right: 12px;
    }

    /* Buttons */
    .btn {
      background: var(--ink);
      color: var(--paper);
      border: none;
      padding: 10px 24px;
      border-radius: 40px;
      font-family: var(--font-body);
      font-weight: 700;
      cursor: pointer;
      box-shadow: var(--shadow-hard);
      transition: all 0.1s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: var(--teal);
      transform: translateY(-2px);
      box-shadow: 0 8px 0 rgba(0,0,0,0.15);
    }

    .btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }

    .btn-outline {
      background: transparent;
      color: var(--ink);
      border: 2px solid var(--ink);
    }

    /* ===== MODALS ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      place-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-overlay.active {
      display: grid;
    }

    .modal-box {
      background: var(--paper);
      border-radius: 24px;
      padding: 28px;
      max-width: 480px;
      width: 100%;
      border: 3px solid var(--ink);
      box-shadow: 0 12px 0 rgba(0,0,0,0.3);
      text-align: center;
      animation: popIn 0.3s ease-out;
    }

    @keyframes popIn {
      from {
        transform: scale(0.9);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .modal-box h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      margin-bottom: 8px;
    }

    .modal-box p {
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    /* ===== TOAST ===== */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .toast {
      background: var(--ink);
      color: var(--paper);
      padding: 10px 24px;
      border-radius: 40px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      box-shadow: var(--shadow-hard);
      animation: toastIn 0.3s ease-out;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== CONFETTI ===== */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      z-index: 3000;
      pointer-events: none;
      animation: confettiFall 2s linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-10vh) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0;
      }
    }

    /* ===== FINALE ===== */
    .finale-wrap {
      text-align: center;
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .finale-wrap .rank {
      font-family: var(--font-display);
      font-size: 3rem;
      color: var(--red);
      text-shadow: 3px 3px 0 var(--yellow);
    }

    .result-table {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      background: white;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid var(--ink);
      width: 100%;
      max-width: 500px;
    }

    .result-table .header {
      font-weight: 700;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 4px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      .app {
        padding: 12px;
        border-radius: 16px;
      }
      .console-brand {
        font-size: 1rem;
      }
      .console-stats {
        font-size: 0.8rem;
        gap: 8px;
      }
      .btn-play {
        font-size: 1.4rem;
        padding: 14px 32px;
      }
      .memory-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .memory-card {
        font-size: 1.4rem;
      }
      .option-btn {
        padding: 10px 18px;
        font-size: 0.95rem;
      }
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="grain"></div>

  <div class="app" id="app">
    <!-- ===== HEADER CONSOLE ===== -->
    <header class="console">
      <div class="console-brand">
        <i data-lucide="crown"></i> MEGACITY
      </div>
      <div class="console-stats">
        <span><i data-lucide="star"></i> <span id="scoreDisplay">0</span></span>
        <span><i data-lucide="check-circle"></i> <span id="progressDisplay">0/6</span></span>
      </div>
      <div class="console-actions">
        <button id="soundToggle" aria-label="Toggle sound"><i data-lucide="volume-2"></i></button>
        <button id="mapBtn" aria-label="Level map"><i data-lucide="map"></i></button>
      </div>
    </header>

    <!-- ===== INTRO SCREEN ===== -->
    <section id="screenIntro" class="screen active">
      <div class="intro-wrap">
        <div class="intro-badge">
          <i data-lucide="film"></i> COMING TO AMERICA · 1988
        </div>
        <h1>
          THE MEGACITY
          <span>ARCADE</span>
        </h1>
        <p class="intro-sub">
          “Bypassing the palace for the pavement”
        </p>
        <button class="btn-play" id="btnStart">
          PLAY ▶
        </button>
      </div>
    </section>

    <!-- ===== LEVEL MAP SCREEN ===== -->
    <section id="screenMap" class="screen">
      <div class="map-grid" id="mapGrid"></div>
    </section>

    <!-- ===== GAME SCENE SCREEN ===== -->
    <section id="screenScene" class="screen">
      <div class="scene-header">
        <div class="title" id="sceneTitle">Level 1</div>
        <div class="hud">
          <span><i data-lucide="zap"></i> <span id="sceneScore">0</span></span>
          <span><i data-lucide="flame"></i> <span id="sceneStreak">0</span></span>
        </div>
        <button class="btn btn-outline" id="btnBackToMap" style="padding:6px 12px;font-size:0.8rem;">
          <i data-lucide="arrow-left"></i> Map
        </button>
      </div>
      <div class="game-area" id="gameArea">
        <!-- dynamic content -->
      </div>
    </section>

    <!-- ===== FINALE SCREEN ===== -->
    <section id="screenFinale" class="screen">
      <div class="finale-wrap" id="finaleContent">
        <!-- dynamic -->
      </div>
    </section>
  </div>

  <!-- ===== MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox">
      <h2 id="modalTitle">Briefing</h2>
      <p id="modalText">Get ready!</p>
      <button class="btn" id="modalBtn">Start</button>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Lucide icons -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.294.0/lucide.min.js"></script>

  <script>
    (function() {
      "use strict";

      /* ===== UTILITIES ===== */
      const $ = (sel, ctx = document) => ctx.querySelector(sel);
      const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];
      const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
      const shuffle = (arr) => {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }

      /* ===== AUDIO (Web Audio API) ===== */
      let audioCtx = null;
      let soundEnabled = true;

      function initAudio() {
        if (audioCtx) return;
        try {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        } catch (e) {
          soundEnabled = false;
        }
      }

      function tone(freq, dur = 0.15, type = "sine", vol = 0.2, when = 0) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const t = audioCtx.currentTime + when;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(vol, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + dur);
        } catch (e) {}
      }

      function noiseBurst(dur = 0.3, vol = 0.15) {
        if (!soundEnabled || !audioCtx) return;
        try {
          const bufferSize = audioCtx.sampleRate * dur;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
          const src = audioCtx.createBufferSource();
          src.buffer = buffer;
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(vol, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
          src.connect(gain);
          gain.connect(audioCtx.destination);
          src.start();
        } catch (e) {}
      }

        const qs = LEVEL_QUESTIONS[currentLevel];
        if (!qs || answeredQuestions >= qs.length) {
          finishLevel();
          return;

        const q = qs[answeredQuestions];
        const area = $("#gameArea");

        if (q.type === "truefalse") {
          renderTrueFalse(q, area);
        } else if (q.type === "multiple") {
          renderMultiple(q, area);
        } else if (q.type === "fillblank") {
          renderFillBlank(q, area);
        }

        let timeLeft = 6;
        area.innerHTML = `

            <div class="prompt">Real or Delusion?</div>

            <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>

          </div>
        `;

        const fill = $("#timerFill");
        const card = $("#questionCard");

        timerInterval = setInterval(() => {
          timeLeft -= 0.1;
          fill.style.width = Math.max(0, (timeLeft / 6) * 100) + "%";
          if (timeLeft <= 2) fill.classList.add("danger");
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            handleAnswer(false, q, card, "⏰ Time's up!");
          }
        }, 100);

        setCleanup(() => {
          if (timerInterval) {
            clearInterval(timerInterval);
            timerInterval = null;
          }
        });

        const handleClick = (answer) => {
          if (!gameActive) return;
          clearInterval(timerInterval);
          timerInterval = null;
          const isCorrect = (answer === q.correct);
          handleAnswer(isCorrect, q, card);
        };

        $("#btnTrue").addEventListener("click", () => handleClick(true));
        $("#btnFalse").addEventListener("click", () => handleClick(false));

        // Keyboard
        const keyHandler = (e) => {
          if (e.key === "ArrowLeft") { e.preventDefault(); handleClick(true); }
          if (e.key === "ArrowRight") { e.preventDefault(); handleClick(false); }
        };
        document.addEventListener("keydown", keyHandler);
        setCleanup(() => document.removeEventListener("keydown", keyHandler));
      }

          const btn = e.target.closest(".option-btn");

      /* ===== HANDLE ANSWER ===== */
      function handleAnswer(isCorrect, q, card, overrideMsg) {
        if (!gameActive) return;
        gameActive = false;

        const feedback = $("#feedback", card) || card.querySelector("#feedback");

        if (isCorrect) {
          currentStreak++;
          const base = 100;
          const streakBonus = Math.min(currentStreak * 20, 100);
          const points = base + streakBonus;
          currentScore += points;
          sfx.correct();
          if (feedback) feedback.innerHTML = `<span style="color:var(--success);">✅ Correct! +${points} pts</span>`;
          if (currentStreak >= 3) {
            sfx.cheer();
            spawnConfetti(15);
          }
        } else {
          currentStreak = 0;
          mistakes++;
          currentScore = Math.max(0, currentScore - 30);
          sfx.wrong();
          card.classList.add("shake");
          setTimeout(() => card.classList.remove("shake"), 400);
          if (feedback) feedback.innerHTML = `<span style="color:var(--error);">❌ ${overrideMsg || "Incorrect!"} -30 pts</span>`;
        }

        $("#sceneScore").textContent = currentScore;
        $("#sceneStreak").textContent = currentStreak;
        answeredQuestions++;

        setTimeout(() => {
          gameActive = true;
          if (answeredQuestions >= totalQuestions) {
            finishLevel();
          } else {
            renderLevelQuestions();
          }
        }, 1500);
      }

      /* ===== FINISH LEVEL ===== */
      function finishLevel() {
        gameActive = false;
        const lv = LEVELS.find(l => l.id === currentLevel);
        if (!lv) return;

        let stars = 1;
        if (mistakes === 0) stars = 3;
        else if (mistakes <= 2) stars = 2;

        const levelResult = { score: currentScore, stars: stars, mistakes: mistakes };
        if (!progress.levels) progress.levels = {};
        const prev = progress.levels[currentLevel];
        if (!prev || currentScore > prev.score) {
          progress.levels[currentLevel] = levelResult;
        }
        progress.totalScore = Object.values(progress.levels).reduce((s, r) => s + r.score, 0);
        progress.stars = Object.values(progress.levels).reduce((s, r) => s + r.stars, 0);
        saveProgress();
        updateHUD();

        sfx.fanfare();
        spawnConfetti(40);

        showModal(
          `Level Complete!`,
          `You scored <strong>${currentScore}</strong> points.<br>Stars: ${"★".repeat(stars)}${"☆".repeat(3-stars)}<br><br>${lv.tip}`,
          "Continue",

            hideModal();
            if (currentLevel < LEVELS.length) {
              // Check if all levels completed
              const allCompleted = LEVELS.every(l => progress.levels[l.id] !== undefined);

                showFinale();

            <div class="header">Score</div>
            <div class="header">Stars</div>
        `;
        LEVELS.forEach(lv => {
          const r = progress.levels[lv.id];
          tableHtml += `
            <div>${lv.title}</div>
            <div>${r ? r.score : 0}</div>
            <div>${r ? "★".repeat(r.stars) : "—"}</div>
          `;
        });
        tableHtml += `</div>`;

        $("#finaleContent").innerHTML = `
          <div style="font-family:var(--font-display);font-size:2rem;color:var(--ink);">FINAL SCORE</div>
          <div style="font-size:4rem;font-family:var(--font-mono);font-weight:700;color:var(--red);">${totalScore}</div>
          <div class="rank">${rank}</div>
          <div style="font-size:1.2rem;margin-bottom:8px;">⭐ ${totalStars} / ${LEVELS.length * 3} stars</div>
          ${tableHtml}
          <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;justify-content:center;">
            <button class="btn" id="btnReplay">⟲ Rewind the tape</button>
            <button class="btn btn-outline" id="btnMapFinal">🗺️ Back to map</button>
          </div>
        `;

        $("#btnReplay").addEventListener("click", () => {
          try {
            localStorage.removeItem(STORAGE_KEY);
          } catch (e) {}
          progress = { levels: {}, totalScore: 0, stars: 0 };
          updateHUD();
          renderMap();
          showScreen("screenMap");
          toast("Progress reset. Ready for a new journey!", "refresh-cw");
        });

        $("#btnMapFinal").addEventListener("click", () => {
          showScreen("screenMap");
          renderMap();
        });

        refreshIcons();
      }

      /* ===== BONUS ROUND (not implemented as separate, but could be added) ===== */
      // Bonus round is available as an idea; for now, the game has 6 levels with 3 questions each.

      /* ===== SOUND TOGGLE ===== */
      function renderSound() {
        const btn = $("#soundToggle");
        if (!btn) return;
        btn.innerHTML = soundEnabled ? '<i data-lucide="volume-2"></i>' : '<i data-lucide="volume-x"></i>';
        refreshIcons();
      }

      /* ===== EVENT LISTENERS ===== */
      function init() {
        loadProgress();
        updateHUD();
        renderMap();
        renderSound();
        refreshIcons();

        // Sound toggle
        $("#soundToggle").addEventListener("click", () => {
          initAudio();
          soundEnabled = !soundEnabled;
          renderSound();
          if (soundEnabled) sfx.click();
          toast(soundEnabled ? "Sound on" : "Sound off", soundEnabled ? "volume-2" : "volume-x");
        });

        // Map button
        $("#mapBtn").addEventListener("click", () => {
          if ($("#screenIntro").classList.contains("active")) return;
          showScreen("screenMap");
          renderMap();
          sfx.click();
        });

        // Start button
        $("#btnStart").addEventListener("click", () => {
          initAudio();
          sfx.fanfare();
          showScreen("screenMap");
          renderMap();
        });

        // Back to map
        $("#btnBackToMap").addEventListener("click", () => {
          runCleanup();
          showScreen("screenMap");
          renderMap();
          sfx.click();
        });

        // Modal close on overlay click
        $("#modalOverlay").addEventListener("click", (e) => {
          if (e.target === e.currentTarget) {
            hideModal();
          }
        });

        // Escape key
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            hideModal();
          }
        });

        // Initial audio unlock on first click
        document.body.addEventListener("click", function unlockAudio() {
          initAudio();
          document.body.removeEventListener("click", unlockAudio);
        }, { once: true });
      }

      /* ===== START ===== */
      document.addEventListener("DOMContentLoaded", init);

      // Expose to window for debugging (optional)
      window.__megacity = { progress, LEVELS };

    })();
  </script>
</body>
</html>
