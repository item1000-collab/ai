<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jazz Suits & Library Cards · Harlem Renaissance</title>
  <style>
    /* ===== FONTS & RESET ===== */
    @import url('https://fonts.googleapis.com/css2?family=Righteous&family=Courier+Prime:wght@400;700&family=Nunito+Sans:wght@400;600;700&display=swap');
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --paper: #FAF3E4;
      --ink: #2E2438;
      --gold: #D4AF37;
      --gold-dark: #B8962E;
      --brown: #5C3A21;
      --cream: #F5E9D8;
      --success: #2E7D5E;
      --error: #C0392B;
      --accent: #A67B5B;
      --shadow: 0 6px 0 rgba(0,0,0,0.3);
      --card-radius: 14px;
    }

    body {
      font-family: 'Nunito Sans', sans-serif;
      background: var(--brown);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(212,175,55,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(212,175,55,0.06) 0%, transparent 50%),
        repeating-linear-gradient(45deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      color: var(--ink);
      position: relative;
    }

    /* film grain texture */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.06'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
    }

    /* ===== SHELL / CONTAINER ===== */
    .game-shell {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16/9;
      background: var(--paper);
      border-radius: 24px;
      box-shadow: 
        0 12px 0 rgba(0,0,0,0.4),
        0 0 0 3px var(--gold-dark),
        inset 0 0 40px rgba(92,58,33,0.08);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: opacity 0.4s;
    }

    .game-shell.hidden-preloader .preloader {
      opacity: 0;
      pointer-events: none;
      transform: translateY(-100%);
      transition: opacity 0.5s, transform 0.6s ease-in;
    }

    /* ===== PRELOADER ===== */
    .preloader {
      position: absolute;
      inset: 0;
      background: var(--ink);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      transition: opacity 0.5s, transform 0.6s ease-in;
      border-radius: 24px;
    }

    .preloader-logo {
      font-family: 'Righteous', cursive;
      font-size: clamp(2rem, 6vw, 4rem);
      color: var(--gold);
      letter-spacing: 4px;
      text-shadow: 0 0 20px rgba(212,175,55,0.5);
      animation: pulse 1.2s infinite alternate;
    }

    .preloader-btn {
      background: var(--gold);
      color: var(--ink);
      border: none;
      font-family: 'Righteous', cursive;
      font-size: 1.4rem;
      padding: 0.8rem 2.5rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--gold-dark);
      transition: transform 0.1s, box-shadow 0.1s;
      animation: bounce 1s infinite alternate;
    }

    .preloader-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--gold-dark);
    }

    @keyframes pulse {
      from { opacity: 0.8; transform: scale(1); }
      to { opacity: 1; transform: scale(1.02); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-6px); }
    }

    /* ===== HEADER CONSOLE ===== */
    .header-console {
      background: var(--ink);
      padding: 0.6rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-bottom: 3px solid var(--gold);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .brand {
      font-family: 'Righteous', cursive;
      font-size: 1.2rem;
      color: var(--gold);
      letter-spacing: 1px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .brand svg {
      width: 22px;
      height: 22px;
      fill: var(--gold);
    }

    .progress-dots {
      display: flex;
      gap: 6px;
      flex: 1;
      justify-content: center;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 2px solid rgba(212,175,55,0.4);
      transition: background 0.3s, transform 0.2s;
    }

    .dot.completed {
      background: var(--gold);
      transform: scale(1.1);
      box-shadow: 0 0 8px rgba(212,175,55,0.6);
    }

    .dot.current {
      background: var(--cream);
      border-color: var(--gold);
      animation: pulse-dot 1s infinite alternate;
    }

    @keyframes pulse-dot {
      from { box-shadow: 0 0 0 0 rgba(212,175,55,0.6); }
      to { box-shadow: 0 0 0 6px rgba(212,175,55,0); }
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: var(--cream);
      font-family: 'Courier Prime', monospace;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .hud-score {
      background: rgba(212,175,55,0.2);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      border: 1px solid var(--gold);
      color: var(--gold);
      min-width: 70px;
      text-align: center;
    }

    .icon-btn {
      background: none;
      border: none;
      color: var(--cream);
      cursor: pointer;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.1s;
    }

    .icon-btn:hover {
      background: rgba(255,255,255,0.1);
    }

    .icon-btn:active {
      transform: scale(0.9);
    }

    .icon-btn svg {
      width: 20px;
      height: 20px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== SCREENS ===== */
    .screen {
      flex: 1;
      display: none;
      flex-direction: column;
      padding: 1.5rem;
      overflow-y: auto;
      background: var(--paper);
      position: relative;
    }

    .screen.active {
      display: flex;
      animation: fadeSlide 0.4s ease-out;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ===== INTRO SCREEN ===== */
    .intro-screen {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 1.2rem;
    }

    .intro-title {
      font-family: 'Righteous', cursive;
      font-size: clamp(2rem, 5vw, 3.5rem);
      color: var(--ink);
      letter-spacing: 2px;
      line-height: 1.1;
    }

    .intro-title span {
      color: var(--gold-dark);
      display: block;
      font-size: 0.6em;
      letter-spacing: 6px;
    }

    .intro-sub {
      font-family: 'Courier Prime', monospace;
      color: var(--accent);
      font-size: 1rem;
      max-width: 500px;
      line-height: 1.6;
    }

    .btn-primary {
      background: var(--gold);
      color: var(--ink);
      border: none;
      font-family: 'Righteous', cursive;
      font-size: 1.3rem;
      padding: 0.8rem 2.8rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--gold-dark);
      transition: transform 0.1s, box-shadow 0.1s;
      letter-spacing: 1px;
    }

    .btn-primary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--gold-dark);
    }

    /* ===== LEVEL MAP ===== */
    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      padding: 0.5rem 0;
    }

    .reel-card {
      background: var(--cream);
      border-radius: var(--card-radius);
      padding: 1rem;
      box-shadow: 0 5px 0 rgba(92,58,33,0.25);
      border: 2px solid var(--accent);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .reel-card:not(.locked):hover {
      transform: translateY(-4px);
      box-shadow: 0 9px 0 rgba(92,58,33,0.3);
    }

    .reel-card.locked {
      opacity: 0.55;
      cursor: not-allowed;
      filter: grayscale(0.6);
    }

    .reel-card .card-num {
      font-family: 'Courier Prime', monospace;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
    }

    .reel-card .card-title {
      font-family: 'Righteous', cursive;
      font-size: 1.1rem;
      color: var(--ink);
    }

    .reel-card .card-char {
      font-size: 0.8rem;
      color: var(--brown);
      font-style: italic;
    }

    .card-stars {
      display: flex;
      gap: 4px;
      font-size: 1rem;
      color: #ccc;
    }

    .card-stars .star.filled {
      color: var(--gold);
      text-shadow: 0 0 6px rgba(212,175,55,0.6);
    }

    .card-lock {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 1.2rem;
    }

    .card-best {
      font-family: 'Courier Prime', monospace;
      font-size: 0.75rem;
      color: var(--gold-dark);
      font-weight: 700;
    }

    /* ===== SCENE / MINIGAME ===== */
    .scene-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.6rem;
      border-bottom: 2px dashed var(--accent);
    }

    .scene-title {
      font-family: 'Righteous', cursive;
      font-size: 1.3rem;
      color: var(--ink);
    }

    .scene-timer {
      font-family: 'Courier Prime', monospace;
      font-weight: 700;
      color: var(--error);
    }

    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      justify-content: center;
    }

    .question-box {
      background: var(--cream);
      border-radius: var(--card-radius);
      padding: 1rem;
      border: 2px solid var(--accent);
      font-size: 1.1rem;
      line-height: 1.5;
      text-align: center;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem;
    }

    .option-btn {
      background: var(--paper);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 0.8rem;
      font-family: 'Nunito Sans', sans-serif;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .option-btn:hover:not(:disabled) {
      background: var(--cream);
      border-color: var(--gold);
    }

    .option-btn:disabled {
      cursor: default;
      opacity: 0.7;
    }

    .option-btn.correct {
      background: #D4EDDA;
      border-color: var(--success);
      animation: pop 0.3s;
    }

    .option-btn.wrong {
      background: #F8D7DA;
      border-color: var(--error);
      animation: shake 0.4s;
    }

    @keyframes pop {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .feedback-line {
      font-family: 'Courier Prime', monospace;
      font-size: 0.9rem;
      text-align: center;
      min-height: 24px;
      color: var(--accent);
    }

    /* ===== TRUE/FALSE & REACTION ===== */
    .reaction-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .reaction-btn {
      flex: 1;
      max-width: 200px;
      padding: 1rem;
      border: none;
      border-radius: 14px;
      font-family: 'Righteous', cursive;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 5px 0 rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .reaction-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }

    .reaction-btn.true-btn {
      background: var(--success);
      color: white;
    }

    .reaction-btn.false-btn {
      background: var(--error);
      color: white;
    }

    .timer-bar {
      height: 10px;
      background: var(--cream);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--accent);
    }

    .timer-fill {
      height: 100%;
      background: var(--gold);
      width: 100%;
      transition: width 0.1s linear;
    }

    /* ===== SORTING / DRAG ===== */
    .sort-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .sort-item {
      background: var(--cream);
      border: 2px solid var(--accent);
      border-radius: 10px;
      padding: 0.7rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: grab;
      transition: background 0.2s, border-color 0.2s;
    }

    .sort-item.stuck {
      background: #D4EDDA;
      border-color: var(--success);
      cursor: default;
    }

    .sort-item.dragging {
      opacity: 0.4;
    }

    .sort-arrows {
      display: flex;
      gap: 4px;
    }

    .sort-arrow {
      background: var(--paper);
      border: 1px solid var(--accent);
      border-radius: 6px;
      width: 28px;
      height: 28px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sort-arrow:hover {
      background: var(--gold);
    }

    /* ===== MEMORY ===== */
    .memory-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      perspective: 800px;
    }

    .memory-card {
      aspect-ratio: 1;
      cursor: pointer;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s;
      border-radius: 10px;
    }

    .memory-card.flipped {
      transform: rotateY(180deg);
    }

    .memory-card .front,
    .memory-card .back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      text-align: center;
      padding: 0.4rem;
      border: 2px solid var(--accent);
    }

    .memory-card .front {
      background: var(--gold);
      color: var(--ink);
      font-family: 'Righteous', cursive;
    }

    .memory-card .back {
      background: var(--cream);
      transform: rotateY(180deg);
      font-family: 'Courier Prime', monospace;
      font-size: 0.75rem;
    }

    /* ===== MODAL ===== */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 500;
      border-radius: 24px;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
      animation: fadeIn 0.2s;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .modal-content {
      background: var(--paper);
      border-radius: 20px;
      padding: 1.5rem;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 0 rgba(0,0,0,0.3), 0 0 0 3px var(--gold);
      text-align: center;
      max-height: 90%;
      overflow-y: auto;
    }

    .modal-title {
      font-family: 'Righteous', cursive;
      font-size: 1.5rem;
      color: var(--ink);
      margin-bottom: 0.8rem;
    }

    .modal-body {
      font-family: 'Nunito Sans', sans-serif;
      color: var(--brown);
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .modal-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* ===== TOAST ===== */
    .toast-area {
      position: absolute;
      top: 60px;
      right: 20px;
      z-index: 600;
      display: flex;
      flex-direction: column;
      gap: 6px;
      pointer-events: none;
    }

    .toast {
      background: var(--ink);
      color: var(--cream);
      padding: 0.6rem 1.2rem;
      border-radius: 30px;
      font-family: 'Courier Prime', monospace;
      font-size: 0.85rem;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      border-left: 4px solid var(--gold);
      animation: slideIn 0.3s, fadeOut 0.4s 2.2s forwards;
    }

    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: translateX(40px); }
    }

    /* ===== CONFETTI ===== */
    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      background: var(--gold);
      z-index: 9998;
      pointer-events: none;
      animation: confettiFall 2s ease-out forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* ===== FINALE ===== */
    .finale-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }

    .stat-card {
      background: var(--cream);
      border-radius: var(--card-radius);
      padding: 1rem;
      border: 2px solid var(--accent);
      text-align: center;
    }

    .stat-value {
      font-family: 'Righteous', cursive;
      font-size: 2rem;
      color: var(--gold-dark);
    }

    .stat-label {
      font-family: 'Courier Prime', monospace;
      font-size: 0.8rem;
      color: var(--accent);
    }

    .rank-badge {
      font-family: 'Righteous', cursive;
      font-size: 1.5rem;
      color: var(--ink);
      background: var(--gold);
      display: inline-block;
      padding: 0.4rem 1.5rem;
      border-radius: 40px;
      box-shadow: 0 4px 0 var(--gold-dark);
      margin: 0.5rem 0;
    }

    .results-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .results-table th {
      font-family: 'Courier Prime', monospace;
      color: var(--accent);
      padding: 0.4rem;
      border-bottom: 2px solid var(--accent);
      text-align: left;
    }

    .results-table td {
      padding: 0.4rem;
      border-bottom: 1px dashed var(--accent);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      .game-shell {
        aspect-ratio: auto;
        min-height: 95vh;
      }
      .options-grid {
        grid-template-columns: 1fr;
      }
      .memory-grid {
        grid-template-columns: repeat(3, 1fr);
      }
      .map-grid {
        grid-template-columns: 1fr;
      }
      .hud {
        font-size: 0.8rem;
        gap: 0.4rem;
      }
      .brand {
        font-size: 1rem;
      }
    }

    /* ===== REDUCED MOTION ===== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--cream);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="game-shell" id="gameShell">
  <!-- ===== PRELOADER ===== -->
  <div class="preloader" id="preloader">
    <div class="preloader-logo">JAZZ · SUITS</div>
    <button class="preloader-btn" id="playBtn">PLAY ▶</button>
  </div>

  <!-- ===== HEADER CONSOLE ===== -->
  <header class="header-console">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      HARLEM · 1920s
    </div>
    <div class="progress-dots" id="progressDots"></div>
    <div class="hud">
      <span class="hud-score" id="scoreDisplay">0</span>
      <button class="icon-btn" id="soundBtn" aria-label="Toggle sound">
        <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      </button>
      <button class="icon-btn" id="mapBtn" aria-label="Level map">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== TOAST AREA ===== -->
  <div class="toast-area" id="toastArea"></div>

  <!-- ===== SCREEN: INTRO ===== -->
  <section class="screen intro-screen active" id="screenIntro">
    <h1 class="intro-title">
      JAZZ SUITS<br><span>&amp; LIBRARY CARDS</span>
    </h1>
    <p class="intro-sub">
      A Harlem Renaissance vocabulary journey.<br>
      Langston Hughes · Zora Neale Hurston · Duke Ellington
    </p>
    <button class="btn-primary" id="startMapBtn">ENTER THE SALON</button>
  </section>

  <!-- ===== SCREEN: LEVEL MAP ===== -->
  <section class="screen" id="screenMap">
    <div class="scene-header">
      <h2 class="scene-title">Choose a Reel</h2>
      <span class="scene-timer" id="mapScore">Total: 0</span>
    </div>
    <div class="map-grid" id="mapGrid"></div>
    <div style="margin-top:1rem; text-align:center;">
      <button class="btn-primary" id="finaleBtn" style="display:none;">🎞️ THE FINALE</button>
    </div>
  </section>

  <!-- ===== SCREEN: SCENE (minigame) ===== -->
  <section class="screen" id="screenScene">
    <div class="scene-header">
      <h2 class="scene-title" id="sceneTitle">Scene</h2>
      <span class="scene-timer" id="sceneTimer"></span>
    </div>
    <div class="game-area" id="gameArea"></div>
    <div class="feedback-line" id="feedbackLine"></div>
  </section>

  <!-- ===== SCREEN: FINALE ===== -->
  <section class="screen" id="screenFinale">
    <div class="scene-header">
      <h2 class="scene-title">The Finale</h2>
    </div>
    <div style="text-align:center;">
      <div class="rank-badge" id="rankBadge">JAZZ CAT</div>
    </div>
    <div class="finale-stats" id="finaleStats"></div>
    <div id="finaleTableWrap"></div>
    <div style="margin-top:1rem; text-align:center;">
      <button class="btn-primary" id="rewindBtn">⏪ REWIND THE TAPE</button>
    </div>
  </section>

  <!-- ===== MODAL OVERLAY ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ===== UTILITIES ===== */
  const $ = (s, c = document) => c.querySelector(s);
  const $$ = (s, c = document) => [...c.querySelectorAll(s)];
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const shuffle = (arr) => {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  /* ===== SOUND (Web Audio) ===== */
  let audioCtx = null;
  let soundMuted = false;
  try { soundMuted = localStorage.getItem('hr_muted') === 'true'; } catch(e) {}

  function initAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { audioCtx = null; }
  }

  function tone(freq, dur = 0.12, type = 'sine', vol = 0.15, when = 0) {
    if (!audioCtx || soundMuted) return;
    const t = audioCtx.currentTime + when;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur);
  }

  function noiseBurst(dur = 0.3, vol = 0.1) {
    if (!audioCtx || soundMuted) return;
    const bufferSize = audioCtx.sampleRate * dur;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(vol, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    src.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();
  }

  const sfx = {
    click: () => { tone(600, 0.06, 'square', 0.08); },
    flip: () => { tone(440, 0.08, 'triangle', 0.1); tone(660, 0.08, 'triangle', 0.08, 0.05); },
    correct: () => { tone(523, 0.1, 'sine', 0.15); tone(659, 0.1, 'sine', 0.15, 0.08); tone(784, 0.15, 'sine', 0.12, 0.16); },
    wrong: () => { tone(200, 0.2, 'sawtooth', 0.1); tone(150, 0.25, 'sawtooth', 0.08, 0.1); },
    match: () => { tone(880, 0.08, 'sine', 0.12); tone(1100, 0.1, 'sine', 0.1, 0.06); },
    fanfare: () => { [523,659,784,1047].forEach((f,i) => tone(f, 0.2, 'square', 0.1, i*0.1)); },
    tick: () => { tone(800, 0.03, 'square', 0.05); },
    cheer: () => { noiseBurst(0.6, 0.08); tone(523, 0.15, 'sine', 0.1); tone(659, 0.15, 'sine', 0.1, 0.1); }
  };

  /* ===== TOAST & CONFETTI & FLOAT ===== */
  function toast(msg) {
    const area = $('#toastArea');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    area.appendChild(el);
    setTimeout(() => el.remove(), 2800);
  }

  function popFloat(text, x, y, color = '#D4AF37') {
    const el = document.createElement('div');
    el.textContent = text;
    Object.assign(el.style, {
      position: 'fixed', left: x + 'px', top: y + 'px',
      fontFamily: "'Courier Prime', monospace", fontWeight: '700',
      color, fontSize: '1.4rem', pointerEvents: 'none', zIndex: 9999,
      transition: 'all 0.8s ease-out', opacity: 1
    });
    document.body.appendChild(el);
    requestAnimationFrame(() => {
      el.style.transform = 'translateY(-60px)';
      el.style.opacity = '0';
    });
    setTimeout(() => el.remove(), 900);
  }

  function spawnConfetti() {
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = '-10px';
      p.style.background = ['#D4AF37','#C0392B','#2E7D5E','#F5E9D8','#5C3A21'][Math.floor(Math.random()*5)];
      p.style.animationDelay = Math.random() * 0.5 + 's';
      p.style.animationDuration = (1.5 + Math.random()) + 's';
      p.style.width = (6 + Math.random()*8) + 'px';
      p.style.height = p.style.width;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 3000);
    }
  }

  /* ===== GAME DATA ===== */
  const LEVELS = [
    {
      id: 0, num: 1, title: "The Rent Party", char: "Langston Hughes",
      color: "#D4AF37", tag: "blanks",
      tip: "Fill in the blanks with the right word.",
      flavor: "Jazz was born in the streets of Harlem."
    },
    {
      id: 1, num: 2, title: "Real or Delusion", char: "Zora Neale Hurston",
      color: "#C0392B", tag: "truefalse",
      tip: "Is the statement true or false?",
      flavor: "The Harlem Renaissance was a cultural awakening."
    },
    {
      id: 2, num: 3, title: "The Salon", char: "Duke Ellington",
      color: "#2E7D5E", tag: "multiple",
      tip: "Choose the correct answer.",
      flavor: "Artists gathered in salons to share ideas."
    },
    {
      id: 3, num: 4, title: "Timeline of Genius", char: "Countee Cullen",
      color: "#5C3A21", tag: "sorting",
      tip: "Put the events in chronological order.",
      flavor: "From the Cotton Club to the Apollo."
    },
    {
      id: 4, num: 5, title: "Memory of a Movement", char: "Bessie Smith",
      color: "#8E44AD", tag: "memory",
      tip: "Match the pairs: term and definition.",
      flavor: "The blues sang of both sorrow and joy."
    },
    {
      id: 5, num: 6, title: "Encore!", char: "Fats Waller",
      color: "#E67E22", tag: "timed",
      tip: "Answer as many as you can in 75 seconds!",
      flavor: "The rhythm never stops!"
    }
  ];

  /* ===== QUESTION SETS ===== */
  const BLANK_QUESTIONS = [
    { sentence: "The ___ was a cultural movement in 1920s Harlem.", answer: "Harlem Renaissance" },
    { sentence: "Langston Hughes was a famous ___ and poet.", answer: "writer" },
    { sentence: "___ music was born in New Orleans and moved to Harlem.", answer: "Jazz" },
    { sentence: "The ___ Club was a famous venue in Harlem.", answer: "Cotton" },
  ];

  const TRUE_FALSE = [
    { statement: "The Harlem Renaissance happened in the 1920s.", answer: true },
    { statement: "Langston Hughes was a painter.", answer: false },
    { statement: "Zora Neale Hurston wrote 'Their Eyes Were Watching God'.", answer: true },
    { statement: "Duke Ellington played the saxophone.", answer: false },
    { statement: "The Apollo Theater is in Harlem.", answer: true },
  ];

  const MULTIPLE_CHOICE = [
    { q: "Who wrote 'The Weary Blues'?", options: ["Langston Hughes", "Zora Neale Hurston", "Countee Cullen"], correct: 0 },
    { q: "What was the Cotton Club?", options: ["A nightclub", "A bookstore", "A church"], correct: 0 },
    { q: "Which instrument did Duke Ellington play?", options: ["Piano", "Trumpet", "Saxophone"], correct: 0 },
    { q: "What does 'renaissance' mean?", options: ["Rebirth", "Revolution", "Retreat"], correct: 0 },
  ];

  const SORT_ITEMS = [
    { text: "Jazz is born in New Orleans", order: 1 },
    { text: "Harlem Renaissance begins", order: 2 },
    { text: "Cotton Club opens", order: 3 },
    { text: "Apollo Theater opens", order: 4 },
  ];

  const MEMORY_PAIRS = [
    { term: "Jazz", def: "American music genre" },
    { term: "Harlem", def: "NYC neighborhood" },
    { term: "Poet", def: "Langston Hughes" },
    { term: "Blues", def: "Musical expression" },
  ];

  const TIMED_QUESTIONS = [
    { q: "Who was a leading voice of the Harlem Renaissance?", a: "Langston Hughes" },
    { q: "What year did the movement peak?", a: "1920s" },
    { q: "What club was in Harlem?", a: "Cotton Club" },
    { q: "What instrument did Duke Ellington play?", a: "Piano" },
    { q: "What was Zora Neale Hurston known for?", a: "Writing" },
    { q: "What does 'Renaissance' mean?", a: "Rebirth" },
  ];

  /* ===== STATE ===== */
  let state = {
    screen: 'intro',
    currentLevel: null,
    totalScore: 0,
    levelScores: {},
    levelStars: {},
    unlocked: 1,
    muted: soundMuted,
    timerInterval: null,
    cleanupFns: [],
  };

  function saveProgress() {
    try {
      localStorage.setItem('hr_progress_v1', JSON.stringify({
        totalScore: state.totalScore,
        levelScores: state.levelScores,
        levelStars: state.levelStars,
        unlocked: state.unlocked
      }));
    } catch(e) {}
  }

  function loadProgress() {
    try {
      const d = localStorage.getItem('hr_progress_v1');
      if (d) {
        const p = JSON.parse(d);
        state.totalScore = p.totalScore || 0;
        state.levelScores = p.levelScores || {};
        state.levelStars = p.levelStars || {};
        state.unlocked = p.unlocked || 1;
      }
    } catch(e) {}
  }

  function setCleanup(fn) {
    state.cleanupFns.push(fn);
  }

  function runCleanup() {
    state.cleanupFns.forEach(fn => fn());
    state.cleanupFns = [];
    if (state.timerInterval) {
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
  }

  /* ===== UI RENDER ===== */
  const shell = $('#gameShell');
  const screens = {
    intro: $('#screenIntro'),
    map: $('#screenMap'),
    scene: $('#screenScene'),
    finale: $('#screenFinale')
  };

  function showScreen(name) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[name].classList.add('active');
    state.screen = name;
  }

  function updateHUD() {
    $('#scoreDisplay').textContent = state.totalScore;
    $('#mapScore').textContent = 'Total: ' + state.totalScore;
    // progress dots
    const dots = $('#progressDots');
    dots.innerHTML = LEVELS.map((_, i) => {
      const cls = i < state.unlocked - 1 ? 'completed' : (i === state.unlocked - 1 ? 'current' : '');
      return `<span class="dot ${cls}"></span>`;
    }).join('');
  }

  function renderMap() {
    const grid = $('#mapGrid');
    grid.innerHTML = LEVELS.map((lv, i) => {
      const unlocked = i < state.unlocked;
      const stars = state.levelStars[lv.id] || 0;
      const best = state.levelScores[lv.id] || 0;
      const starStr = Array.from({length: 3}, (_, j) =>
        `<span class="star ${j < stars ? 'filled' : ''}">★</span>`
      ).join('');
      return `
        <div class="reel-card ${unlocked ? '' : 'locked'}" data-level="${i}" ${unlocked ? '' : 'aria-disabled="true"'}>
          <div class="card-num">REEL ${lv.num}</div>
          <div class="card-title">${lv.title}</div>
          <div class="card-char">${lv.char}</div>
          <div class="card-stars">${starStr}</div>
          <div class="card-best">BEST: ${best}</div>
          ${unlocked ? '' : '<div class="card-lock">🔒</div>'}
        </div>
      `;
    }).join('');
    // finale button
    $('#finaleBtn').style.display = state.unlocked > LEVELS.length ? 'inline-block' : 'none';
  }

  function renderSound() {
    const btn = $('#soundBtn');
    if (state.muted) {
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>';
    } else {
      btn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>';
    }
  }

  /* ===== LEVEL LAUNCH ===== */
  function launchLevel(idx) {
    if (idx >= state.unlocked) {
      toast('🔒 Complete previous level first!');
      sfx.wrong();
      return;
    }
    const lv = LEVELS[idx];
    state.currentLevel = idx;
    runCleanup();
    showScreen('scene');
    $('#sceneTitle').textContent = `${lv.num}. ${lv.title}`;
    $('#feedbackLine').textContent = '';
    $('#sceneTimer').textContent = '';

    // show briefing modal
    showModal(
      `📜 ${lv.title}`,
      `<em>"${lv.flavor}"</em><br><br>${lv.tip}`,
      'BEGIN',
      () => { startMinigame(lv); }
    );
  }

  function startMinigame(lv) {
    const area = $('#gameArea');
    area.innerHTML = '';
    area.style.display = 'flex';
    switch(lv.tag) {
      case 'blanks': startBlanks(area); break;
      case 'truefalse': startTrueFalse(area); break;
      case 'multiple': startMultiple(area); break;
      case 'sorting': startSorting(area); break;
      case 'memory': startMemory(area); break;
      case 'timed': startTimed(area); break;
    }
  }

  /* ===== MINIGAME: FILL IN THE BLANKS ===== */
  function startBlanks(area) {
    const qs = shuffle(BLANK_QUESTIONS).slice(0, 3);
    let index = 0;
    let mistakes = 0;
    let score = 0;
    const bank = qs.map(q => q.answer).concat(['poetry', 'Harlem', 'blues']).filter((v,i,a) => a.indexOf(v) === i);
    const words = shuffle(bank);

    function renderQuestion() {
      area.innerHTML = '';
      const q = qs[index];
      const sentence = q.sentence.replace('___', '____');
      const div = document.createElement('div');
      div.innerHTML = `
        <div class="question-box" style="font-size:1.2rem;">${sentence}</div>
        <div style="margin:0.8rem 0; display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center;" id="wordBank">
          ${words.map(w => `<button class="option-btn" style="display:inline-block;padding:0.5rem 1rem;width:auto;" data-word="${w}">${w}</button>`).join('')}
        </div>
      `;
      area.appendChild(div);

      const handler = (e) => {
        const btn = e.target.closest('[data-word]');
        if (!btn) return;
        sfx.click();
        const word = btn.dataset.word;
        if (word === q.answer) {
          sfx.correct();
          score += 10;
          popFloat('+10', e.clientX, e.clientY);
          index++;
          if (index < qs.length) renderQuestion();
          else finishLevel(score, mistakes);
        } else {
          sfx.wrong();
          mistakes++;
          btn.classList.add('wrong');
          setTimeout(() => btn.classList.remove('wrong'), 400);
          popFloat('-2', e.clientX, e.clientY, '#C0392B');
        }
      };
      area.addEventListener('click', handler);
      setCleanup(() => area.removeEventListener('click', handler));
    }
    renderQuestion();
  }

  /* ===== MINIGAME: TRUE/FALSE ===== */
  function startTrueFalse(area) {
    const qs = shuffle(TRUE_FALSE);
    let index = 0;
    let mistakes = 0;
    let streak = 0;
    let score = 0;
    let timer = 6;
    let timerId;

    function renderQuestion() {
      clearInterval(timerId);
      area.innerHTML = '';
      if (index >= qs.length) { finishLevel(score, mistakes); return; }
      timer = 6;
      const q = qs[index];
      area.innerHTML = `
        <div class="timer-bar"><div class="timer-fill" id="tfTimer"></div></div>
        <div class="question-box" style="font-size:1.1rem;">${q.statement}</div>
        <div class="reaction-buttons">
          <button class="reaction-btn true-btn" data-tf="true">✅ TRUE</button>
          <button class="reaction-btn false-btn" data-tf="false">❌ FALSE</button>
        </div>
      `;
      const fill = $('#tfTimer');
      timerId = setInterval(() => {
        timer -= 0.1;
        if (fill) fill.style.width = Math.max(0, (timer/6)*100) + '%';
        if (timer <= 0) {
          clearInterval(timerId);
          sfx.tick();
          handleAnswer(null);
        }
      }, 100);
      setCleanup(() => clearInterval(timerId));

      const handler = (e) => {
        const btn = e.target.closest('[data-tf]');
        if (!btn) return;
        clearInterval(timerId);
        handleAnswer(btn.dataset.tf === 'true');
      };
      area.addEventListener('click', handler);
      setCleanup(() => area.removeEventListener('click', handler));
    }

    function handleAnswer(ans) {
      const q = qs[index];
      if (ans === q.answer) {
        sfx.correct();
        streak++;
        const pts = 10 + streak * 3;
        score += pts;
        popFloat('+' + pts, window.innerWidth/2, window.innerHeight/2);
        index++;
        renderQuestion();
      } else {
        sfx.wrong();
        streak = 0;
        mistakes++;
        index++;
        renderQuestion();
      }
    }

    renderQuestion();
  }

  /* ===== MINIGAME: MULTIPLE CHOICE ===== */
  function startMultiple(area) {
    const qs = shuffle(MULTIPLE_CHOICE);
    let index = 0;
    let mistakes = 0;
    let score = 0;

    function renderQuestion() {
      area.innerHTML = '';
      if (index >= qs.length) { finishLevel(score, mistakes); return; }
      const q = qs[index];
      area.innerHTML = `
        <div class="question-box">${q.q}</div>
        <div class="options-grid">
          ${q.options.map((o, i) => `<button class="option-btn" data-opt="${i}">${o}</button>`).join('')}
        </div>
      `;
      const handler = (e) => {
        const btn = e.target.closest('[data-opt]');
        if (!btn) return;
        sfx.click();
        const chosen = parseInt(btn.dataset.opt);
        if (chosen === q.correct) {
          btn.classList.add('correct');
          sfx.correct();
          score += 15;
          popFloat('+15', e.clientX, e.clientY);
        } else {
          btn.classList.add('wrong');
          sfx.wrong();
          mistakes++;
          document.querySelector(`[data-opt="${q.correct}"]`)?.classList.add('correct');
        }
        setTimeout(() => { index++; renderQuestion(); }, 800);
      };
      area.addEventListener('click', handler);
      setCleanup(() => area.removeEventListener('click', handler));
    }
    renderQuestion();
  }

  /* ===== MINIGAME: SORTING ===== */
  function startSorting(area) {
    const items = shuffle(SORT_ITEMS.map((s,i) => ({...s, id: i})));
    let attempts = 0;
    let score = 0;

    function render() {
      area.innerHTML = `
        <div style="font-family:'Courier Prime';margin-bottom:0.5rem;">Drag or use arrows to reorder:</div>
        <div class="sort-list" id="sortList">
          ${items.map((it, i) => `
            <div class="sort-item" draggable="true" data-id="${it.id}">
              <span>${it.text}</span>
              <div class="sort-arrows">
                <button class="sort-arrow" data-dir="up" data-idx="${i}">▲</button>
                <button class="sort-arrow" data-dir="down" data-idx="${i}">▼</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      // drag & drop
      let dragEl = null;
      $$('.sort-item').forEach(el => {
        el.addEventListener('dragstart', () => { dragEl = el; el.classList.add('dragging'); });
        el.addEventListener('dragend', () => { el.classList.remove('dragging'); });
        el.addEventListener('dragover', (e) => e.preventDefault());
        el.addEventListener('drop', (e) => {
          e.preventDefault();
          if (!dragEl || dragEl === el) return;
          const from = items.findIndex(it => it.id === dragEl.dataset.id);
          const to = items.findIndex(it => it.id === el.dataset.id);
          const [moved] = items.splice(from, 1);
          items.splice(to, 0, moved);
          render();
        });
      });
      // arrows
      area.addEventListener('click', (e) => {
        const btn = e.target.closest('.sort-arrow');
        if (!btn) return;
        const idx = parseInt(btn.dataset.idx);
        const dir = btn.dataset.dir;
        if (dir === 'up' && idx > 0) {
          [items[idx-1], items[idx]] = [items[idx], items[idx-1]];
          render();
        } else if (dir === 'down' && idx < items.length-1) {
          [items[idx], items[idx+1]] = [items[idx+1], items[idx]];
          render();
        }
        sfx.click();
      });
      // check
      const checkBtn = document.createElement('button');
      checkBtn.className = 'btn-primary';
      checkBtn.textContent = 'CHECK';
      checkBtn.style.marginTop = '1rem';
      checkBtn.addEventListener('click', () => {
        const correct = items.every((it, i) => it.order === i+1);
        if (correct) {
          sfx.correct();
          score = 30;
          finishLevel(score, attempts);
        } else {
          sfx.wrong();
          attempts++;
          toast('Not quite — try again!');
        }
      });
      area.appendChild(checkBtn);
    }
    render();
  }

  /* ===== MINIGAME: MEMORY ===== */
  function startMemory(area) {
    const pairs = shuffle(MEMORY_PAIRS).slice(0, 4);
    const cards = shuffle(pairs.flatMap((p, i) => [
      { id: i, text: p.term, type: 'term' },
      { id: i, text: p.def, type: 'def' }
    ]));
    let flipped = [];
    let matched = 0;
    let mistakes = 0;
    let streak = 0;
    let score = 0;
    let lock = false;

    function render() {
      area.innerHTML = `<div class="memory-grid" id="memGrid">${cards.map((c, i) => `
        <div class="memory-card" data-idx="${i}">
          <div class="front">?</div>
          <div class="back">${c.text}</div>
        </div>
      `).join('')}</div>`;
      const handler = (e) => {
        const card = e.target.closest('.memory-card');
        if (!card || lock || card.classList.contains('flipped')) return;
        const idx = parseInt(card.dataset.idx);
        card.classList.add('flipped');
        sfx.flip();
        flipped.push(idx);
        if (flipped.length === 2) {
          lock = true;
          const [a, b] = flipped;
          if (cards[a].id === cards[b].id) {
            setTimeout(() => {
              sfx.match();
              streak++;
              const pts = 15 * streak;
              score += pts;
              matched++;
              flipped = [];
              lock = false;
              if (matched === pairs.length) finishLevel(score, mistakes);
            }, 400);
          } else {
            mistakes++;
            streak = 0;
            setTimeout(() => {
              $$('.memory-card').forEach(c => c.classList.remove('flipped'));
              flipped = [];
              lock = false;
            }, 800);
          }
        }
      };
      area.addEventListener('click', handler);
      setCleanup(() => area.removeEventListener('click', handler));
    }
    render();
  }

  /* ===== MINIGAME: TIMED ===== */
  function startTimed(area) {
    let timeLeft = 75;
    let score = 0;
    let streak = 0;
    const questions = shuffle(TIMED_QUESTIONS);
    let qIndex = 0;
    let timerId;

    function renderQuestion() {
      if (qIndex >= questions.length) qIndex = 0;
      const q = questions[qIndex];
      area.innerHTML = `
        <div class="timer-bar"><div class="timer-fill" id="timedFill"></div></div>
        <div class="question-box" style="font-size:1.1rem;">${q.q}</div>
        <div class="options-grid">
          ${shuffle([q.a, 'Duke Ellington', '1920s', 'Langston Hughes']).slice(0,3).map(o => 
            `<button class="option-btn" data-ans="${o}">${o}</button>`
          ).join('')}
        </div>
      `;
      const fill = $('#timedFill');
      const handler = (e) => {
        const btn = e.target.closest('[data-ans]');
        if (!btn) return;
        sfx.click();
        if (btn.dataset.ans === q.a) {
          sfx.correct();
          streak++;
          const pts = 10 + streak * 2;
          score += pts;
          popFloat('+' + pts, e.clientX, e.clientY);
        } else {
          sfx.wrong();
          streak = 0;
        }
        qIndex++;
        renderQuestion();
      };
      area.addEventListener('click', handler);
      setCleanup(() => area.removeEventListener('click', handler));

      timerId = setInterval(() => {
        timeLeft -= 0.1;
        if (fill) fill.style.width = Math.max(0, (timeLeft/75)*100) + '%';
        if (timeLeft <= 0) {
          clearInterval(timerId);
          finishLevel(score, 0);
        }
      }, 100);
      setCleanup(() => clearInterval(timerId));
    }
    renderQuestion();
  }

  /* ===== FINISH LEVEL ===== */
  function finishLevel(score, mistakes) {
    runCleanup();
    let stars = 3;
    if (mistakes >= 3) stars = 1;
    else if (mistakes >= 1) stars = 2;

    const lv = LEVELS[state.currentLevel];
    state.levelScores[lv.id] = Math.max(state.levelScores[lv.id] || 0, score);
    state.levelStars[lv.id] = Math.max(state.levelStars[lv.id] || 0, stars);
    state.totalScore += score;
    if (state.currentLevel + 1 >= state.unlocked && state.unlocked < LEVELS.length) {
      state.unlocked = state.currentLevel + 2;
    } else if (state.currentLevel + 1 >= state.unlocked) {
      state.unlocked = LEVELS.length + 1;
    }
    saveProgress();
    updateHUD();

    sfx.fanfare();
    spawnConfetti();

    showModal(
      `🎬 Scene ${lv.num} Complete!`,
      `Score: <strong>${score}</strong><br>Stars: ${'★'.repeat(stars)}${'☆'.repeat(3-stars)}`,
      'BACK TO MAP',
      () => { showScreen('map'); renderMap(); }
    );
  }

  /* ===== MODAL ===== */
  function showModal(title, body, btnText, callback) {
    const overlay = $('#modalOverlay');
    const content = $('#modalContent');
    content.innerHTML = `
      <h3 class="modal-title">${title}</h3>
      <div class="modal-body">${body}</div>
      <div class="modal-actions">
        <button class="btn-primary" id="modalOk">${btnText}</button>
      </div>
    `;
    overlay.classList.add('active');
    $('#modalOk').addEventListener('click', () => {
      overlay.classList.remove('active');
      if (callback) callback();
    });
  }

  /* ===== FINALE ===== */
  function renderFinale() {
    const totalStars = Object.values(state.levelStars).reduce((a,b) => a+b, 0);
    const maxStars = LEVELS.length * 3;
    let rank = 'JAZZ CAT';
    if (state.totalScore > 150) rank = 'HARLEM LEGEND';
    else if (state.totalScore > 100) rank = 'COTTON CLUB STAR';
    else if (state.totalScore > 50) rank = 'RISING ARTIST';

    $('#rankBadge').textContent = rank;
    $('#finaleStats').innerHTML = `
      <div class="stat-card"><div class="stat-value">${state.totalScore}</div><div class="stat-label">TOTAL SCORE</div></div>
      <div class="stat-card"><div class="stat-value">${totalStars}/${maxStars}</div><div class="stat-label">STARS</div></div>
      <div class="stat-card"><div class="stat-value">${state.unlocked - 1}/${LEVELS.length}</div><div class="stat-label">LEVELS</div></div>
    `;
    $('#finaleTableWrap').innerHTML = `
      <table class="results-table">
        <thead><tr><th>Level</th><th>Best</th><th>Stars</th></tr></thead>
        <tbody>
          ${LEVELS.map(lv => `<tr>
            <td>${lv.num}. ${lv.title}</td>
            <td>${state.levelScores[lv.id] || 0}</td>
            <td>${'★'.repeat(state.levelStars[lv.id] || 0)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    `;
  }

  /* ===== EVENT LISTENERS ===== */
  // preloader
  $('#playBtn').addEventListener('click', () => {
    initAudio();
    sfx.click();
    shell.classList.add('hidden-preloader');
  });

  // start map
  $('#startMapBtn').addEventListener('click', () => {
    initAudio();
    sfx.click();
    showScreen('map');
    renderMap();
  });

  // map delegation
  $('#mapGrid').addEventListener('click', (e) => {
    const card = e.target.closest('.reel-card');
    if (!card) return;
    launchLevel(parseInt(card.dataset.level));
  });

  // finale
  $('#finaleBtn').addEventListener('click', () => {
    initAudio();
    sfx.click();
    showScreen('finale');
    renderFinale();
  });

  // rewind
  $('#rewindBtn').addEventListener('click', () => {
    sfx.click();
    try { localStorage.removeItem('hr_progress_v1'); } catch(e) {}
    state.totalScore = 0;
    state.levelScores = {};
    state.levelStars = {};
    state.unlocked = 1;
    updateHUD();
    renderMap();
    showScreen('map');
    toast('Progress rewound!');
  });

  // sound toggle
  $('#soundBtn').addEventListener('click', () => {
    state.muted = !state.muted;
    soundMuted = state.muted;
    try { localStorage.setItem('hr_muted', state.muted); } catch(e) {}
    renderSound();
    if (!state.muted) { initAudio(); sfx.click(); }
  });

  // map btn
  $('#mapBtn').addEventListener('click', () => {
    initAudio();
    sfx.click();
    runCleanup();
    showScreen('map');
    renderMap();
  });

  /* ===== INIT ===== */
  function init() {
    loadProgress();
    updateHUD();
    renderMap();
    renderSound();
    showScreen('intro');
  }

  init();

  // Expose for debug (optional)
  window.__hr = { state, LEVELS };

})();
</script>
</body>
</html>
