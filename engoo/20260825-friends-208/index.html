<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources · PDF files</title>
  <!-- DM Sans from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    /* reset & base */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f8f6f3;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      margin: 0;
      line-height: 1.4;
      color: #1a1a2e;
    }

    .container {
      max-width: 880px;
      width: 100%;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1.75rem;
    }

    .logo-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo {
      font-size: 2rem;
      line-height: 1;
    }

    .title {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #1a1a2e;
    }

    .subtitle {
      font-size: 1rem;
      font-weight: 400;
      color: #6b7280;
      margin-left: 0.25rem;
      background: #f0ede8;
      padding: 0.2rem 0.9rem;
      border-radius: 40px;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .badge-wrap {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
      padding: 0.35rem 1.1rem 0.35rem 0.9rem;
      border-radius: 40px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
      border: 1px solid #f0ede8;
    }

    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #e07a5f;
      border-radius: 50%;
      position: relative;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: #e07a5f;
      opacity: 0.5;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.6; }
      70% { transform: scale(1.6); opacity: 0; }
      100% { transform: scale(1.8); opacity: 0; }
    }

    .badge-label {
      font-weight: 500;
      font-size: 0.9rem;
      color: #1a1a2e;
      letter-spacing: -0.01em;
    }

    /* card */
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.04), 0 4px 10px rgba(0, 0, 0, 0.02);
      padding: 2rem 2rem 1.8rem;
      transition: box-shadow 0.2s;
      border: 1px solid #f0ede8;
    }

    /* grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem 1.2rem;
    }

    /* item links */
    .item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 0.8rem 0.6rem 0.7rem;
      border-radius: 16px;
      text-decoration: none;
      color: #1a1a2e;
      background: transparent;
      transition: background 0.15s, box-shadow 0.15s, transform 0.15s, border-color 0.15s;
      border: 1px solid transparent;
      position: relative;
      font-weight: 500;
      font-size: 0.95rem;
    }

    .item .emoji {
      font-size: 1.3rem;
      line-height: 1;
      flex-shrink: 0;
      width: 1.8rem;
      text-align: center;
    }

    .item .name {
      flex: 1;
      word-break: break-word;
      letter-spacing: -0.01em;
      font-weight: 500;
      color: #1a1a2e;
    }

    .item .arrow {
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      font-size: 1.2rem;
      color: #e07a5f;
      transform: translateX(-6px);
      font-weight: 300;
      flex-shrink: 0;
    }

    .item:hover {
      background: #fcf9f7;
      border-color: #e07a5f;
      box-shadow: 0 4px 12px rgba(224, 122, 95, 0.08);
      transform: translateY(-2px);
    }

    .item:hover .arrow {
      opacity: 1;
      transform: translateX(2px);
    }

    /* footer */
    .footer {
      text-align: center;
      margin-top: 2.2rem;
      font-size: 0.85rem;
      color: #6b7280;
      letter-spacing: 0.3px;
      font-weight: 400;
      border-top: 1px solid #ece8e2;
      padding-top: 1.5rem;
    }

    /* responsive */
    @media (max-width: 600px) {
      .header {
        flex-wrap: wrap;
        gap: 0.6rem;
      }
      .badge-wrap {
        margin-left: 0;
        width: auto;
      }
      .subtitle {
        white-space: normal;
        font-size: 0.9rem;
        padding: 0.2rem 0.8rem;
      }
      .card {
        padding: 1.5rem 1.2rem;
      }
      .grid {
        grid-template-columns: 1fr;
        gap: 0.3rem;
      }
      .item {
        padding: 0.6rem 0.6rem;
        font-size: 0.9rem;
      }
      .logo {
        font-size: 1.7rem;
      }
      .title {
        font-size: 1.5rem;
      }
    }

    @media (max-width: 420px) {
      .card {
        padding: 1.2rem 0.8rem;
      }
      .item {
        font-size: 0.85rem;
        padding: 0.5rem 0.4rem;
      }
      .item .emoji {
        width: 1.5rem;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- header -->
  <div class="header">
    <div class="logo-title">
      <span class="logo">📖</span>
      <span class="title">Resources</span>
    </div>
    <span class="subtitle">Friends · S2E8</span>
    <div class="badge-wrap">
      <span class="pulse-dot"></span>
      <span class="badge-label">PDF Files</span>
    </div>
  </div>

  <!-- card + grid -->
  <div class="card">
    <div class="grid">

      <!-- 1. 90s-sitcom-english-masterclass.pdf -->
      <a href="https://item1000-collab.github.io/ai/engoo/20260825-friends-208/90s-sitcom-english-masterclass.pdf"
         target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📘</span>
        <span class="name">90s-sitcom-english-masterclass.pdf</span>
        <span class="arrow">→</span>
      </a>

      <!-- 2. 90s-sitcom-english.pdf -->
      <a href="https://item1000-collab.github.io/ai/engoo/20260825-friends-208/90s-sitcom-english.pdf"
         target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📗</span>
        <span class="name">90s-sitcom-english.pdf</span>
        <span class="arrow">→</span>
      </a>

      <!-- 3. the-rachel-paradox.pdf -->
      <a href="https://item1000-collab.github.io/ai/engoo/20260825-friends-208/the-rachel-paradox.pdf"
         target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📙</span>
        <span class="name">the-rachel-paradox.pdf</span>
        <span class="arrow">→</span>
      </a>

    </div>
  </div>

  <!-- footer -->
  <div class="footer">Powered by AI Exploration Hub</div>
</div>
</body>
</html>
