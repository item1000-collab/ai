<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources · PDF viewer</title>
    <!-- DM Sans from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f6f3;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: #f8f6f3;
        }

        /* header */
        .page-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 28px;
            line-height: 1;
        }

        .header-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a2e;
            letter-spacing: -0.3px;
        }

        .header-sub {
            font-size: 16px;
            font-weight: 400;
            color: #6b7280;
            margin-left: 6px;
            letter-spacing: -0.2px;
        }

        .header-sub::before {
            content: "· ";
            color: #b0b8c4;
        }

        /* badge with pulsing dot — no count */
        .badge-pulse {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 6px 16px 6px 14px;
            border-radius: 40px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02), 0 1px 3px rgba(0, 0, 0, 0.04);
            font-weight: 500;
            font-size: 15px;
            color: #1a1a2e;
            border: 1px solid #eae7e2;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #e07a5f;
            border-radius: 50%;
            display: inline-block;
            position: relative;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            width: 14px;
            height: 14px;
            background: rgba(224, 122, 95, 0.3);
            border-radius: 50%;
            animation: pulse-ring 1.8s ease-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.7); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        /* main card */
        .card-grid {
            background: white;
            border-radius: 24px;
            padding: 28px 28px 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04), 0 2px 6px rgba(0, 0, 0, 0.02);
            margin-bottom: 30px;
        }

        .file-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        /* item link */
        .item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            background: #fcfcfb;
            border-radius: 16px;
            border: 1.5px solid transparent;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #1a1a2e;
            box-shadow: 0 1px 2px rgba(0,0,0,0.01);
            position: relative;
            font-weight: 500;
            font-size: 15px;
            letter-spacing: -0.2px;
            line-height: 1.3;
        }

        .item:hover {
            border-color: #e07a5f;
            background: white;
            box-shadow: 0 8px 18px rgba(224, 122, 95, 0.08), 0 2px 6px rgba(0,0,0,0.02);
            transform: translateY(-2px);
        }

        .item .emoji {
            font-size: 20px;
            line-height: 1;
            flex-shrink: 0;
            width: 28px;
            text-align: left;
        }

        .item .name {
            flex: 1;
            word-break: break-word;
            color: #1a1a2e;
            font-weight: 500;
        }

        .item .arrow {
            font-size: 18px;
            color: #b0b8c4;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.2s ease, transform 0.2s ease;
            flex-shrink: 0;
            margin-left: 2px;
        }

        .item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
            color: #e07a5f;
        }

        /* footer */
        .footer-note {
            text-align: center;
            font-size: 15px;
            color: #9aa2b0;
            font-weight: 400;
            letter-spacing: 0.2px;
            padding: 8px 0 4px;
            border-top: 1px solid #ece9e4;
            margin-top: 8px;
        }

        /* narrow screens */
        @media (max-width: 600px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 14px;
            }
            .badge-pulse {
                align-self: flex-start;
            }
            .header-sub {
                margin-left: 0;
            }
            .header-sub::before {
                content: "· ";
            }
        }

        @media (max-width: 500px) {
            .file-grid {
                grid-template-columns: 1fr;
            }
            .card-grid {
                padding: 20px 16px 16px;
            }
            .item {
                padding: 16px 14px;
            }
        }

        /* subtle hover for badge */
        .badge-pulse:hover {
            background: #fcfaf8;
            border-color: #ddd8d0;
        }

        /* clean spacing */
        .container {
            padding: 0;
        }
    </style>
</head>
<body>
<div class="container">

    <!-- header -->
    <header class="page-header">
        <div class="header-left">
            <span class="logo-icon">📖</span>
            <span class="header-title">Resources</span>
            <span class="header-sub">engoo · 20260905-fg</span>
        </div>
        <div class="badge-pulse">
            <span class="pulse-dot"></span>
            <span>PDF Files</span>
        </div>
    </header>

    <!-- main card grid -->
    <div class="card-grid">
        <div class="file-grid">
            <!-- 
                Only PDF files visible from screenshot: 
                "gump-s-american-odyssey.pdf" 
                (the only .pdf file shown; folder "keep" was deleted, not a PDF)
                Path from screenshot: after /ai/ → "engoo/20260905-fg/"
                (extracted from the visible URL fragment in the screenshot)
            -->
            <a href="https://item1000-collab.github.io/ai/engoo/20260905-fg/gump-s-american-odyssey.pdf" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="item">
                <span class="emoji">📘</span>
                <span class="name">gump-s-american-odyssey.pdf</span>
                <span class="arrow">→</span>
            </a>
            <!-- 
                Only one PDF file is present in the screenshot.
                No other .pdf files, no folders or non-pdf items.
            -->
        </div>
    </div>

    <!-- footer -->
    <div class="footer-note">
        Powered by AI Exploration Hub
    </div>
</div>
</body>
</html>
