<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind Your Language — Resources</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8f6f3;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #1a1a2e;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 32px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    .header-left {
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .logo {
      font-size: 32px;
      line-height: 1;
      background: #fff;
      border-radius: 16px;
      padding: 10px 12px;
      box-shadow: 0 2px 8px rgba(26, 26, 46, 0.06);
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #1a1a2e;
      line-height: 1.2;
    }

    .header-text .subtitle {
      font-size: 15px;
      font-weight: 400;
      color: #6b7280;
      margin-top: 2px;
    }

    /* ── Badge ── */
    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border-radius: 100px;
      padding: 8px 18px 8px 14px;
      box-shadow: 0 2px 8px rgba(26, 26, 46, 0.06);
      font-size: 14px;
      font-weight: 600;
      color: #1a1a2e;
      white-space: nowrap;
      flex-shrink: 0;
      margin-top: 6px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #e07a5f;
      border-radius: 50%;
      position: relative;
      flex-shrink: 0;
    }

    .pulse-dot::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 2px solid rgba(224, 122, 95, 0.4);
      animation: pulse 2s ease-out infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.8;
      }
      70% {
        transform: scale(2);
        opacity: 0;
      }
      100% {
        transform: scale(2);
        opacity: 0;
      }
    }

    /* ── Card ── */
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 4px 24px rgba(26, 26, 46, 0.06), 0 1px 3px rgba(26, 26, 46, 0.04);
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* ── Item ── */
    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      border-radius: 16px;
      background: #fafaf9;
      border: 1.5px solid transparent;
      text-decoration: none;
      color: #1a1a2e;
      transition: all 0.2s ease;
      position: relative;
      cursor: pointer;
    }

    .item:hover {
      background: #fff;
      border-color: #e07a5f;
      box-shadow: 0 6px 20px rgba(224, 122, 95, 0.12);
      transform: translateY(-2px);
    }

    .item .emoji {
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
    }

    .item .name {
      font-size: 14px;
      font-weight: 500;
      color: #1a1a2e;
      flex: 1;
      word-break: break-word;
      line-height: 1.35;
    }

    .item .arrow {
      font-size: 18px;
      color: #e07a5f;
      opacity: 0;
      transform: translateX(-6px);
      transition: all 0.2s ease;
      flex-shrink: 0;
      font-weight: 600;
    }

    .item:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      font-size: 13px;
      color: #6b7280;
      padding-top: 4px;
      font-weight: 400;
    }

    /* ── Responsive ── */
    @media (max-width: 500px) {
      body {
        padding: 24px 16px 24px;
      }

      .header {
        flex-direction: column;
        gap: 14px;
      }

      .header-text h1 {
        font-size: 24px;
      }

      .badge {
        align-self: flex-start;
        margin-top: 0;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 16px;
        border-radius: 20px;
      }

      .item {
        padding: 14px 16px;
      }

      .logo {
        font-size: 26px;
        padding: 8px 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-left">
        <div class="logo">📄</div>
        <div class="header-text">
          <h1>Resources</h1>
          <div class="subtitle">Mind Your Language — 102</div>
        </div>
      </div>
      <div class="badge">
        <span class="pulse-dot"></span>
        <span>PDF Files</span>
      </div>
    </header>

    <!-- Main card -->
    <main class="card">
      <div class="grid">
        <a href="https://item1000-collab.github.io/ai/engoo/20260924-102%20mind-your-language/mind-your-language-102-1.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📕</span>
          <span class="name">mind-your-language-102-1.pdf</span>
          <span class="arrow">→</span>
        </a>
        <a href="https://item1000-collab.github.io/ai/engoo/20260924-102%20mind-your-language/mind-your-language-102-2.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📘</span>
          <span class="name">mind-your-language-102-2.pdf</span>
          <span class="arrow">→</span>
        </a>
        <a href="https://item1000-collab.github.io/ai/engoo/20260924-102%20mind-your-language/mind-your-language-102-3.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📗</span>
          <span class="name">mind-your-language-102-3.pdf</span>
          <span class="arrow">→</span>
        </a>
        <a href="https://item1000-collab.github.io/ai/engoo/20260924-102%20mind-your-language/mind-your-language-102-4.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📙</span>
          <span class="name">mind-your-language-102-4.pdf</span>
          <span class="arrow">→</span>
        </a>
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">Powered by AI Exploration Hub</footer>
  </div>
</body>
</html>
