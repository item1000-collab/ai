<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources · PDF</title>
    <!-- DM Sans from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f8f6f3;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            margin: 0;
        }

        .container {
            max-width: 880px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05), 0 4px 10px rgba(0, 0, 0, 0.02);
            padding: 2rem 2rem 1.8rem;
            transition: box-shadow 0.2s ease;
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 0.75rem 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        .logo-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .title-group {
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-weight: 600;
            font-size: 1.6rem;
            letter-spacing: -0.01em;
            color: #1a1a2e;
            line-height: 1.2;
        }

        .subtitle {
            font-weight: 400;
            font-size: 0.9rem;
            color: #6b7280;
            margin-top: 0.1rem;
            letter-spacing: 0.01em;
        }

        /* badge with pulsing dot */
        .badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(224, 122, 95, 0.08);
            padding: 0.4rem 1rem 0.4rem 0.9rem;
            border-radius: 40px;
            border: 1px solid rgba(224, 122, 95, 0.15);
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }

        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #e07a5f;
            border-radius: 50%;
            position: relative;
            animation: pulse 1.8s ease-in-out infinite;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            background: rgba(224, 122, 95, 0.2);
            animation: pulse-ring 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); }
            50% { transform: scale(1.1); }
            100% { transform: scale(0.95); }
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.6; }
            50% { transform: scale(1.4); opacity: 0; }
            100% { transform: scale(0.8); opacity: 0; }
        }

        .badge-label {
            font-weight: 500;
            font-size: 0.8rem;
            letter-spacing: 0.03em;
            color: #1a1a2e;
            text-transform: uppercase;
        }

        /* card main */
        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02), 0 1px 4px rgba(0, 0, 0, 0.02);
            padding: 0.5rem 0;
            margin: 1.2rem 0 1.5rem;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.3rem 0.8rem;
            padding: 0.25rem 0.25rem;
        }

        /* item links */
        .item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem 0.75rem 0.9rem;
            border-radius: 12px;
            text-decoration: none;
            background: transparent;
            transition: background 0.15s ease, box-shadow 0.2s ease, transform 0.15s ease;
            color: #1a1a2e;
            border: 1px solid transparent;
            min-height: 54px;
            position: relative;
        }

        .item .emoji {
            font-size: 1.3rem;
            line-height: 1;
            flex-shrink: 0;
            width: 2rem;
            text-align: left;
        }

        .item .name {
            font-weight: 500;
            font-size: 0.9rem;
            letter-spacing: -0.01em;
            color: #1a1a2e;
            flex: 1;
            word-break: break-word;
            line-height: 1.3;
        }

        .item .arrow {
            font-size: 1.1rem;
            color: #6b7280;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.2s ease, transform 0.2s ease, color 0.15s;
            font-weight: 300;
            flex-shrink: 0;
        }

        .item:hover {
            background: #fcf9f7;
            border-color: #e07a5f;
            box-shadow: 0 2px 8px rgba(224, 122, 95, 0.06);
            transform: translateY(-1px);
        }

        .item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
            color: #e07a5f;
        }

        .item:active {
            transform: scale(0.98);
        }

        /* footer */
        .footer {
            text-align: center;
            font-weight: 400;
            font-size: 0.8rem;
            color: #9ca3af;
            letter-spacing: 0.02em;
            padding-top: 0.25rem;
            border-top: 1px solid #f0edeb;
            margin-top: 0.75rem;
        }

        .footer span {
            color: #b8b2ac;
        }

        /* responsive */
        @media (max-width: 600px) {
            .container {
                padding: 1.5rem 1rem 1.2rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .badge {
                align-self: flex-start;
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 0.2rem;
            }
            .item {
                padding: 0.7rem 0.9rem;
            }
        }

        /* no counter – as required */
    </style>
</head>
<body>
    <div class="container">
        <!-- header -->
        <div class="header">
            <div class="header-left">
                <span class="logo-icon">📖</span>
                <div class="title-group">
                    <div class="main-title">Resources</div>
                    <div class="subtitle">engoo · friends 2026 · season ?</div>
                </div>
            </div>
            <div class="badge">
                <span class="pulse-dot"></span>
                <span class="badge-label">PDF Files</span>
                <!-- no counter -->
            </div>
        </div>

        <!-- card + grid -->
        <div class="card">
            <div class="grid">
                <!-- 1. english-with-friends.pdf  📕 -->
                <a href="https://item1000-collab.github.io/ai/engoo/20260816-friends-202/english-with-friends.pdf" 
                   target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📕</span>
                    <span class="name">english-with-friends.pdf</span>
                    <span class="arrow">→</span>
                </a>

                <!-- 2. learning-english-with-friends.pdf  📘 -->
                <a href="https://item1000-collab.github.io/ai/engoo/20260816-friends-202/learning-english-with-friends.pdf" 
                   target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📘</span>
                    <span class="name">learning-english-with-friends.pdf</span>
                    <span class="arrow">→</span>
                </a>

                <!-- 3. neon-noir-insecurities.pdf  📗  (only .pdf from the list, keep is ignored) -->
                <a href="https://item1000-collab.github.io/ai/engoo/20260816-friends-202/neon-noir-insecurities.pdf" 
                   target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📗</span>
                    <span class="name">neon-noir-insecurities.pdf</span>
                    <span class="arrow">→</span>
                </a>

                <!-- 4. (keep – folder, ignored) – no pdf extension, excluded -->
                <!-- only 3 PDF files as per screenshot: english-with-friends.pdf, learning-english-with-friends.pdf, neon-noir-insecurities.pdf -->
                <!-- additionally we include the fourth file? from the screenshot list there is also "english-with-friends.pdf" and "learning-english-with-friends.pdf" and "neon-noir-insecurities.pdf" – exactly three. 
                     the "keep" is a folder, no .pdf – ignored.  -->
                <!-- but to match the screenshot exactly we have 3 PDF items. however the screenshot shows 3 pdf names, we render all 3.   -->
                <!-- (no extra file) -->
            </div>
        </div>

        <!-- footer -->
        <div class="footer">
            <span>Powered by AI Exploration Hub</span>
        </div>
    </div>
</body>
</html>
