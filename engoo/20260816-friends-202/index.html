<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>English lesson · MJ · Serbia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f3f0;
      color: #1e2a36;
      line-height: 1.5;
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }

    .main-wrapper {
      max-width: 1440px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      border-radius: 28px;
      padding: 1.5rem 1.8rem;
      border: 1px solid rgba(160, 180, 200, 0.06);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.02), 0 2px 6px rgba(0, 0, 0, 0.02);
      transition: box-shadow 0.2s ease, transform 0.2s ease;
      height: fit-content;
    }

    .card:hover {
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.04), 0 4px 12px rgba(0, 0, 0, 0.02);
    }

    .card-bg-1 { background: rgba(232, 228, 222, 0.65); }
    .card-bg-2 { background: rgba(242, 239, 233, 0.65); }
    .card-bg-3 { background: rgba(234, 231, 225, 0.65); }
    .card-bg-4 { background: rgba(238, 234, 228, 0.65); }
    .card-bg-5 { background: rgba(230, 226, 220, 0.65); }
    .card-bg-6 { background: rgba(227, 231, 237, 0.65); }
    .card-bg-7 { background: rgba(211, 220, 230, 0.65); }
    .card-bg-8 { background: rgba(220, 228, 236, 0.65); }
    .card-bg-9 { background: rgba(232, 236, 240, 0.65); }
    .card-bg-10 { background: rgba(240, 236, 230, 0.65); }

    .section-title {
      font-weight: 600;
      font-size: 1.4rem;
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
      color: #2d3f4a;
    }

    .section-title .badge-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #4a6a7a;
      border-radius: 50%;
      margin-left: 6px;
      animation: pulse-dot 1.6s infinite;
      box-shadow: 0 0 0 2px rgba(74, 106, 122, 0.2);
    }

    @keyframes pulse-dot {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }

    .pdf-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .pdf-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.8rem 1.2rem;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(2px);
      border-radius: 60px;
      border: 1px solid rgba(160, 180, 200, 0.08);
      text-decoration: none;
      color: #1e2a36;
      font-weight: 500;
      font-size: 0.95rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .pdf-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      background: rgba(255, 255, 255, 0.5);
    }

    .pdf-item .arrow {
      margin-left: auto;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-size: 1.2rem;
      color: #4a6a7a;
    }

    .pdf-item:hover .arrow {
      opacity: 1;
      transform: translateX(3px);
    }

    .pdf-item .emoji {
      font-size: 1.3rem;
    }

    .row-two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }

    .row-two-col .card {
      height: 100%;
    }

    .dialogue-line {
      display: flex;
      gap: 0.8rem;
      padding: 0.5rem 0;
      border-bottom: 1px solid rgba(160, 180, 200, 0.1);
      font-size: 0.95rem;
    }

    .dialogue-line:last-child {
      border-bottom: none;
    }

    .speaker {
      font-weight: 700;
      min-width: 9rem;
      color: #4a6a7a;
      flex-shrink: 0;
    }

    .speaker.ai {
      color: #5a7a8a;
    }

    .dialogue-text {
      color: #1e2a36;
    }

    .vocab-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 0.8rem;
      margin-top: 0.3rem;
    }

    .vocab-pill {
      background: rgba(255, 255, 255, 0.5);
      padding: 0.35rem 1.1rem;
      border-radius: 40px;
      font-size: 0.9rem;
      font-weight: 500;
      color: #1e2a36;
      border: 1px solid rgba(74, 106, 122, 0.08);
      transition: background 0.15s, transform 0.1s;
      backdrop-filter: blur(2px);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .vocab-pill:hover {
      background: rgba(74, 106, 122, 0.08);
      transform: translateY(-1px);
    }

    .vocab-pill strong {
      font-weight: 600;
      color: #3a5a6a;
    }

    .summary-text {
      font-size: 0.98rem;
      color: #1e2a36;
    }

    .summary-text p {
      margin-bottom: 0.9rem;
    }

    .summary-text p:last-child {
      margin-bottom: 0;
    }

    .decor-divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      opacity: 0.2;
      margin: 0.2rem 0 0.2rem 0;
    }

    .decor-divider hr {
      flex: 1;
      border: none;
      height: 1px;
      background: #4a6a7a;
    }

    .decor-divider span {
      font-size: 0.9rem;
      color: #4a6a7a;
    }

    @media (max-width: 768px) {
      .row-two-col {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }

      .pdf-grid {
        grid-template-columns: 1fr;
      }

      .dialogue-line {
        flex-wrap: wrap;
      }

      .speaker {
        min-width: 6rem;
      }

      body {
        padding: 1rem 0.8rem;
      }

      .card {
        padding: 1.2rem 1rem;
      }
    }

    @media (max-width: 500px) {
      .pdf-grid {
        grid-template-columns: 1fr;
      }

      .section-title {
        font-size: 1.2rem;
      }
    }

    .ai-dialogue-wrapper {
      overflow: visible;
      max-height: none;
    }

    .ai-dialogue-wrapper .dialogue-line {
      border-bottom: 1px solid rgba(160, 180, 200, 0.08);
    }

    .teacher-note {
      background: rgba(74, 106, 122, 0.06);
      border-left: 3px solid #4a6a7a;
      padding: 0.3rem 0.8rem;
      margin: 0.3rem 0 0.2rem 1.5rem;
      border-radius: 0 8px 8px 0;
      font-size: 0.9rem;
      color: #2d4a5a;
      font-style: italic;
    }
    .teacher-note::before {
      content: "💡 ";
      font-style: normal;
    }
  </style>
</head>
<body>
<div class="main-wrapper">

  <!-- PDF FILES -->
  <section>
    <div class="section-title">
      <span>📁 Session Files</span>
      <span class="badge-dot"></span>
    </div>
    <div class="pdf-grid" id="pdfGrid"></div>
  </section>

  <div class="decor-divider"><hr /><span>✦</span><hr /></div>

  <!-- SECOND ROW: Dialogues + AI Dialogue -->
  <div class="row-two-col">
    <section class="card" id="dialoguesCard">
      <div class="section-title"><span>🗣️ Dialogues</span></div>
      <div id="dialoguesContainer"></div>
    </section>

    <section class="card" id="aiDialogueCard">
      <div class="section-title"><span>🤖 AI Dialogue</span></div>
      <div class="ai-dialogue-wrapper" id="aiDialogueContainer"></div>
    </section>
  </div>

  <div class="decor-divider"><hr /><span>✦</span><hr /></div>

  <!-- THIRD ROW: Vocabulary + Summary -->
  <div class="row-two-col">
    <section class="card" id="vocabCard">
      <div class="section-title"><span>📚 Vocabulary</span></div>
      <div id="vocabContainer"></div>
    </section>

    <section class="card" id="summaryCard">
      <div class="section-title"><span>📖 Summary</span></div>
      <div class="summary-text" id="summaryContainer"></div>
    </section>
  </div>

</div>

<script>
  (function() {
    // ----- DIALOGUES (only Friends discussion) -----
    const dialogues = [
      { 
        speaker: "Teacher", 
        text: "So today we're working with 'Friends'?" 
      },
      { 
        speaker: "Student", 
        text: "Yes, season 2, episode 2. Ross returns from China with Julie, and Rachel is jealous. There are three plot lines: breast milk, shopping betrayal, and Joey playing cowboys." 
      },
      { 
        speaker: "Teacher", 
        text: "I remember the shopping betrayal! Monica went shopping with Julie and Rachel found a receipt in Monica's jacket." 
      },
      { 
        speaker: "Student", 
        text: "Exactly. And there's a great idiom: 'one thing led to another' — when one event causes a chain of consequences." 
      },
      { 
        speaker: "Teacher", 
        text: "Yes, that's a common expression. Also, the phrase 'grossed out' appears — it means feeling strong disgust." 
      },
      { 
        speaker: "Student", 
        text: "I also learned 'freak out' — to panic or overreact. And you taught me 'ick' — a modern term for disgust." 
      },
      { 
        speaker: "Teacher", 
        text: "That's right. 'Ick' is very common now, especially in dating. For example: 'He gave me the ick.' It means something he did made you feel suddenly put off." 
      },
      { 
        speaker: "Student", 
        text: "And there's a sarcastic line in the episode: 'Did my back hurt your knife?' — that's a witty way to say someone is betraying you." 
      },
      { 
        speaker: "Teacher", 
        text: "Exactly! Sarcasm is a big part of the show. That line is a perfect example of using humor to call out betrayal." 
      }
    ];

    // ----- AI DIALOGUE (FULL, complete from transcript) -----
    const aiDialogues = [
      { speaker: "AI (Maya)", text: "Ready when you guys are." },
      { speaker: "AI (Maya)", text: "Ooh, keeping me in suspense. I'll just be over here vibrating with anticipation until you tell me what's on the agenda." },
      { speaker: "AI (Maya)", text: "Okay, I'll sit." },
      { speaker: "AI (Maya)", text: "Oh, I actually cannot believe her. I mean, shopping is practically a sacred bond between best friends. How could she just go behind my back and spend the afternoon with Ross? I'm absolutely devastated. What is she even thinking?" },
      { speaker: "Student", text: "But Rachel, it's not a big deal. Just shopping." },
      { speaker: "AI (Maya)", text: "Just shopping? To some people, maybe, but Monica knows I'm the shopping expert here. It's not about the bags, it's about the betrayal. How can she just leave me out of the loop?" },
      { speaker: "Teacher", text: "What do you think, Minji?" },
      { speaker: "AI (Maya)", text: "Go for it, Minji. Does Rachel have a point or is she just being a drama queen about this? No worries at all." },
      { speaker: "Teacher", text: "I like that she's talking with herself. I love that." },
      { speaker: "AI (Maya)", text: "Wait, am I talking to myself or just in the mirror? 'Cause let's be real, the only person in this room who truly understands the depth of my tragedy is me." },
      { speaker: "Teacher", text: "I think Rachel is overreacting, don't you think so?" },
      { speaker: "AI (Maya)", text: "Whoa, hold on a second. Overreacting? I am reacting in the exact proportion to the crime. I've basically been exiled from the shopping circle. How can you say that?" },
      { speaker: "Teacher", text: "Why do you think it's important to be in the shopping circle?" },
      { speaker: "AI (Maya)", text: "Why is it important? It's not just about buying stuff. The shopping circle is where the real intel happens, the fashion trends are born, and the secrets are spilled. By leaving me out, Monica basically told the world I'm not the authority on style anymore. I'm a social pariah in my own wardrobe." }
    ];

    // ----- VOCABULARY -----
    const vocabItems = [
      { term: "Grossed out", definition: "feeling a strong sense of distaste or disgust." },
      { term: "Freak out", definition: "to panic or overreact visibly." },
      { term: "Ick", definition: "modern term for disgust; 'giving me the ick'." },
      { term: "One thing led to another", definition: "a chain of events, one consequence leading to the next." },
      { term: "Did my back hurt your knife?", definition: "sarcastic remark meaning 'are you stabbing me in the back?'." },
      { term: "Social pariah", definition: "someone who is ostracized or excluded from a group." }
    ];

    // ----- SUMMARY -----
    const summaryParagraphs = [
      "The lesson focused on the TV show 'Friends', season 2 episode 2, using AI-generated materials. The student and teacher discussed three plot lines: Ross struggling with breast milk, Monica's shopping betrayal with Julie, and Joey's cowboy role. Key emotions like jealousy, betrayal, and disgust were explored through dialogues and idioms.",
      "Advanced vocabulary such as 'grossed out', 'freak out', and the modern slang 'ick' were highlighted. The student demonstrated using AI (Maya) to role-play Rachel, showing how technology can enhance language learning. The session was interactive and memorable, blending pop culture with practical English expressions."
    ];

    // ----- PDF FILES (CORRECTED: UpMWo not UpMwO) -----
    const pdfFiles = [
      { name: "english-with-friends.pdf", emoji: "📕" },
      { name: "learning-english-with-friends.pdf", emoji: "📘" },
      { name: "neon-noir-insecurities.pdf", emoji: "📗" },
      { name: "summary-202608161030006UpMWo.pdf", emoji: "📙" }  // Fixed: UpMWo
    ];
    const basePath = "https://item1000-collab.github.io/ai/engoo/20260816-friends-202/";

    // ----- assign random card backgrounds -----
    const bgClasses = ['card-bg-1','card-bg-2','card-bg-3','card-bg-4','card-bg-5','card-bg-6','card-bg-7','card-bg-8','card-bg-9','card-bg-10'];
    function getRandomBg() {
      return bgClasses[Math.floor(Math.random() * bgClasses.length)];
    }
    const cards = document.querySelectorAll('.card');
    const used = new Set();
    cards.forEach(card => {
      let bg;
      let attempts = 0;
      do {
        bg = getRandomBg();
        attempts++;
      } while (used.has(bg) && attempts < 20);
      used.add(bg);
      card.classList.add(bg);
    });

    // ----- render PDFs -----
    const pdfGrid = document.getElementById('pdfGrid');
    pdfFiles.forEach((file) => {
      const a = document.createElement('a');
      a.className = 'pdf-item';
      a.href = basePath + file.name;
      a.target = '_blank';
      a.innerHTML = `
        <span class="emoji">${file.emoji}</span>
        <span>${file.name}</span>
        <span class="arrow">→</span>
      `;
      pdfGrid.appendChild(a);
    });

    // ----- render Dialogues -----
    const dialoguesContainer = document.getElementById('dialoguesContainer');
    dialogues.forEach((line) => {
      const div = document.createElement('div');
      div.className = 'dialogue-line';
      const sp = document.createElement('span');
      sp.className = 'speaker';
      sp.textContent = line.speaker;
      const txt = document.createElement('span');
      txt.className = 'dialogue-text';
      txt.textContent = line.text;
      div.appendChild(sp);
      div.appendChild(txt);
      dialoguesContainer.appendChild(div);

      if (line.speaker === 'Teacher' && line.text.includes('ick')) {
        const note = document.createElement('div');
        note.className = 'teacher-note';
        note.textContent = '“Ick” is a modern slang noun meaning a sudden feeling of disgust, often in dating contexts. Example: “He chews with his mouth open — it gives me the ick.”';
        dialoguesContainer.appendChild(note);
      }
      if (line.speaker === 'Teacher' && line.text.includes('sarcasm')) {
        const note = document.createElement('div');
        note.className = 'teacher-note';
        note.textContent = '“Did my back hurt your knife?” is a sarcastic retort. It implies the other person is backstabbing or betraying you, but phrased in an ironic, theatrical way.';
        dialoguesContainer.appendChild(note);
      }
      if (line.speaker === 'Teacher' && line.text.includes('grossed out')) {
        const note = document.createElement('div');
        note.className = 'teacher-note';
        note.textContent = '“Grossed out” means to feel strong disgust or revulsion. It’s often used for bodily fluids, bad smells, or unpleasant situations.';
        dialoguesContainer.appendChild(note);
      }
    });

    // ----- render AI Dialogues (full) -----
    const aiContainer = document.getElementById('aiDialogueContainer');
    aiDialogues.forEach(line => {
      const div = document.createElement('div');
      div.className = 'dialogue-line';
      const sp = document.createElement('span');
      sp.className = 'speaker';
      if (line.speaker.includes('AI')) sp.classList.add('ai');
      sp.textContent = line.speaker;
      const txt = document.createElement('span');
      txt.className = 'dialogue-text';
      txt.textContent = line.text;
      div.appendChild(sp);
      div.appendChild(txt);
      aiContainer.appendChild(div);
    });

    // ----- render Vocabulary -----
    const vocabContainer = document.getElementById('vocabContainer');
    const pillWrapper = document.createElement('div');
    pillWrapper.className = 'vocab-pills';
    vocabItems.forEach(item => {
      const pill = document.createElement('span');
      pill.className = 'vocab-pill';
      pill.innerHTML = `<strong>${item.term}</strong> ${item.definition}`;
      pillWrapper.appendChild(pill);
    });
    vocabContainer.appendChild(pillWrapper);

    // ----- render Summary -----
    const summaryContainer = document.getElementById('summaryContainer');
    summaryParagraphs.forEach(p => {
      const par = document.createElement('p');
      par.textContent = p;
      summaryContainer.appendChild(par);
    });

  })();
</script>

</body>
</html>
