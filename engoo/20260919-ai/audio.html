<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Radio · interactive transcript</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #121212;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1rem;
            color: #e0e0e0;
        }

        .app-container {
            max-width: 700px;
            width: 100%;
            background: #1e1e1e;
            border-radius: 24px;
            padding: 2rem 1.8rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }

        /* player block */
        .player-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2rem;
            text-align: center;
        }

        .cover-image {
            width: 200px;
            height: auto;
            border-radius: 8px;
            display: block;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.5);
            margin-bottom: 1.2rem;
            background: #2a2a2a; /* fallback if image missing */
            object-fit: cover;
        }

        .show-title {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 0.3rem;
            word-break: break-word;
        }

        .duration-badge {
            font-size: 1rem;
            color: #9e9e9e;
            margin-bottom: 1.4rem;
            background: #2c2c2c;
            padding: 0.2rem 1rem;
            border-radius: 40px;
            display: inline-block;
        }

        audio {
            width: 100%;
            border-radius: 40px;
            outline: none;
            margin-top: 0.4rem;
        }

        audio::-webkit-media-controls-panel {
            background: #2c2c2c;
        }

        /* error banner */
        .error-banner {
            background: #5f1e1e;
            color: #ffb3b3;
            padding: 1rem 1.4rem;
            border-radius: 16px;
            margin-bottom: 1.8rem;
            font-weight: 500;
            border-left: 6px solid #d32f2f;
            word-break: break-word;
        }

        /* transcript */
        .transcript-heading {
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaaaaa;
            margin-bottom: 1rem;
            font-weight: 500;
            border-bottom: 1px solid #333;
            padding-bottom: 0.6rem;
        }

        .transcript-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .transcript-line {
            padding: 0.9rem 1.2rem;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.15s ease, border-left-color 0.15s ease;
            border-left: 4px solid transparent;
            font-size: 1rem;
            line-height: 1.45;
            word-break: break-word;
            background: #1e1e1e;
            border-bottom: 1px solid #2a2a2a;
        }

        .transcript-line:last-child {
            border-bottom: none;
        }

        .transcript-line:hover {
            background: #2b2b2b;
            border-left-color: #3f3f3f;
        }

        /* active line */
        .transcript-line.active {
            background: #007bff;
            border-left-color: #ffffff;
            color: #ffffff;
            font-weight: 500;
            box-shadow: 0 4px 12px rgba(0, 123, 255, 0.3);
        }

        .transcript-line.active .speaker {
            color: #ffffff;
            font-weight: 700;
        }

        .speaker {
            font-weight: 700;
            color: #007bff;
            margin-right: 6px;
        }

        .transcript-line.active .speaker {
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* timecode inside line (optional hint, not required but neat) */
        .time-hint {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-right: 8px;
            font-family: monospace;
        }

        .transcript-line.active .time-hint {
            opacity: 0.9;
            color: #ffffff;
        }

        .loading-msg {
            color: #b0b0b0;
            text-align: center;
            padding: 2.5rem 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Error will be inserted here -->
        <div id="errorContainer"></div>

        <!-- Player section -->
        <div class="player-card">
            <img src="cover.png" alt="Show cover" class="cover-image" id="coverImage">
            <h1 class="show-title" id="showTitle">Loading…</h1>
            <div class="duration-badge" id="durationDisplay">—</div>
            <audio id="audioPlayer" controls preload="metadata">
                <source src="ai_radio.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- Transcript -->
        <div class="transcript-heading">Transcript · click to jump</div>
        <ul class="transcript-list" id="transcriptList">
            <li class="loading-msg">Loading transcript…</li>
        </ul>
    </div>

    <script>
        (function() {
            "use strict";

            // ----- DOM elements -----
            const errorContainer = document.getElementById('errorContainer');
            const showTitleEl = document.getElementById('showTitle');
            const durationDisplay = document.getElementById('durationDisplay');
            const transcriptList = document.getElementById('transcriptList');
            const audio = document.getElementById('audioPlayer');

            // ----- state -----
            let transcriptData = [];          // array of { start, end, speaker, text }
            let activeLineIndex = -1;
            let isSeeking = false;            // to avoid active updates during manual seek

            // ----- helpers -----

            // Convert "M:SS" or "MM:SS" or "H:MM:SS" to seconds
            function timecodeToSeconds(timecode) {
                const parts = timecode.trim().split(':').map(Number);
                if (parts.length === 2) {
                    return parts[0] * 60 + parts[1];
                } else if (parts.length === 3) {
                    return parts[0] * 3600 + parts[1] * 60 + parts[2];
                }
                return 0;
            }

            // Format seconds to MM:SS for display
            function formatTime(seconds) {
                if (isNaN(seconds) || seconds < 0) return '0:00';
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
            }

            // ----- show error and cleanup -----
            function displayError(message) {
                // clear all content except error
                errorContainer.innerHTML = `<div class="error-banner">⚠️ ${message}</div>`;
                showTitleEl.textContent = '—';
                durationDisplay.textContent = '—';
                transcriptList.innerHTML = '<li class="loading-msg">Transcript unavailable</li>';
                // hide cover if wanted? keep it but show broken? It's fine.
            }

            // ----- render transcript lines into DOM -----
            function renderTranscript(lines) {
                if (!lines || !lines.length) {
                    transcriptList.innerHTML = '<li class="loading-msg">No transcript available</li>';
                    return;
                }

                const fragment = document.createDocumentFragment();

                lines.forEach((line, idx) => {
                    const li = document.createElement('li');
                    li.className = 'transcript-line';
                    li.dataset.index = idx;

                    // optional small timecode (not required but helpful)
                    const timeSpan = document.createElement('span');
                    timeSpan.className = 'time-hint';
                    timeSpan.textContent = line.timecode || '';

                    const speakerSpan = document.createElement('span');
                    speakerSpan.className = 'speaker';
                    speakerSpan.textContent = line.speaker + ':';

                    const textSpan = document.createElement('span');
                    textSpan.className = 'line-text';
                    textSpan.textContent = line.text;

                    li.appendChild(timeSpan);
                    li.appendChild(speakerSpan);
                    li.appendChild(textSpan);

                    // click handler: seek to start of line and play
                    li.addEventListener('click', () => {
                        if (!audio.src) return;
                        isSeeking = true;  // prevent timeupdate from resetting class during seek
                        audio.currentTime = line.start;
                        audio.play().catch(() => {
                            // autoplay might be blocked, but user interacted so likely fine
                        });
                        // force immediate active class update
                        setActiveLine(idx, true);  // immediate scroll
                        // release lock after a short delay
                        setTimeout(() => { isSeeking = false; }, 150);
                    });

                    fragment.appendChild(li);
                });

                transcriptList.innerHTML = '';
                transcriptList.appendChild(fragment);
            }

            // ----- highlight active line based on index -----
            function setActiveLine(index, forceScroll = false) {
                if (index === activeLineIndex && !forceScroll) return;

                const allLines = transcriptList.querySelectorAll('.transcript-line');
                if (activeLineIndex >= 0 && allLines[activeLineIndex]) {
                    allLines[activeLineIndex].classList.remove('active');
                }

                activeLineIndex = index;

                if (index >= 0 && allLines[index]) {
                    const activeEl = allLines[index];
                    activeEl.classList.add('active');
                    // smooth scroll into view
                    activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            // ----- determine current active line from audio time -----
            function updateActiveLineFromTime() {
                if (isSeeking) return;  // avoid flicker while user clicks
                if (!transcriptData.length) return;

                const currentTime = audio.currentTime;
                let activeIndex = -1;

                for (let i = 0; i < transcriptData.length; i++) {
                    const { start, end } = transcriptData[i];
                    if (currentTime >= start && currentTime < end) {
                        activeIndex = i;
                        break;
                    }
                }

                // If no exact match (e.g., after last end or before first), 
                // we might choose to deactivate.
                if (activeIndex === -1) {
                    // fallback: sometimes currentTime might equal end of last line
                    const last = transcriptData[transcriptData.length - 1];
                    if (currentTime >= last.end) {
                        // no active line after show ends, or highlight last? Let's keep last inactive.
                        // but we could also highlight nothing.
                    }
                    setActiveLine(-1);
                } else {
                    setActiveLine(activeIndex);
                }
            }

            // ----- attach timeupdate listener -----
            function attachAudioSync() {
                audio.addEventListener('timeupdate', updateActiveLineFromTime);
                // also update on seeked to fix active when jumping via native controls
                audio.addEventListener('seeked', () => {
                    // small delay to ensure currentTime is settled
                    setTimeout(() => {
                        isSeeking = false;
                        updateActiveLineFromTime();
                    }, 50);
                });
            }

            // ----- fetch and initialise -----
            async function loadShowNotes() {
                try {
                    const response = await fetch('show_notes.json');
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status} – show_notes.json not found or invalid`);
                    }
                    const data = await response.json();

                    // validate minimal structure
                    if (!data.timecoded_transcript || !Array.isArray(data.timecoded_transcript)) {
                        throw new Error('Invalid JSON: missing "timecoded_transcript" array');
                    }

                    // update title and duration
                    showTitleEl.textContent = data.show_title || 'Untitled show';
                    durationDisplay.textContent = data.show_duration || '—';

                    // ----- build transcriptData with start/end seconds -----
                    const rawLines = data.timecoded_transcript;
                    const lines = rawLines.map((item, idx) => {
                        const start = timecodeToSeconds(item.timecode);
                        return {
                            index: idx,
                            timecode: item.timecode,
                            speaker: item.speaker || 'Unknown',
                            text: item.text || '',
                            start: start,
                            end: null, // fill later
                        };
                    });

                    // calculate endSeconds: if next line exists, use its start; else add 20 sec
                    for (let i = 0; i < lines.length; i++) {
                        if (i < lines.length - 1) {
                            lines[i].end = lines[i + 1].start;
                        } else {
                            lines[i].end = lines[i].start + 20; // default 20s tail
                        }
                    }

                    // ensure end is at least start + 0.5 to avoid empty ranges
                    lines.forEach(line => {
                        if (line.end <= line.start) line.end = line.start + 2;
                    });

                    transcriptData = lines;

                    // render transcript
                    renderTranscript(transcriptData);

                    // attach sync listener
                    attachAudioSync();

                    // set initial active line based on current time (usually 0)
                    setTimeout(() => updateActiveLineFromTime(), 100);

                } catch (err) {
                    console.error('Loading error:', err);
                    displayError(`Could not load show_notes.json – ${err.message}. Please ensure the file exists.`);
                }
            }

            // ----- also handle audio error (missing mp3) -----
            audio.addEventListener('error', (e) => {
                // Only show if there is no error yet (avoid duplicate)
                if (!errorContainer.querySelector('.error-banner')) {
                    displayError('Audio file "ai_radio.mp3" not found or failed to load.');
                }
            });

            // ----- start everything -----
            loadShowNotes();
        })();
    </script>
</body>
</html>
