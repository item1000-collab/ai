<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends English Lessons</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet" />
    <style>
        /* ── reset & variables (Точь-в-точь как в оригинале) ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #f8f6f3;
            --surface: #ffffff;
            --surface-warm: #faf9f7;
            --text-primary: #1a1a2e;
            --text-secondary: #6b7280;
            --text-muted: #9ca3af;
            --accent: #e07a5f;
            --accent-light: #fdf0ec;
            --accent-hover: #d4674a;
            --border: #e8e4df;
            --border-light: #f0eeeb;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 24px;
        }

        body {
            background: var(--bg);
            font-family: 'DM Sans', system-ui, sans-serif;
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        /* ── header ── */
        .site-header {
            max-width: 1200px;
            margin: 0 auto 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .brand-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #e07a5f 0%, #f2cc8f 100%);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: var(--shadow);
        }

        .brand-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
        }

        .brand-text span {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .repo-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 100px;
            padding: 0.4rem 1rem 0.4rem 0.6rem;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            box-shadow: var(--shadow-sm);
        }

        .repo-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #e07a5f;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── grid layout ── */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr; /* Только одна колонка, но внутри сетка */
            gap: 2rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1rem;
            padding: 0 0.25rem;
        }

        .section-header .icon {
            width: 32px;
            height: 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
        }

        .section-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .section-header .count {
            margin-left: auto;
            font-size: 0.7rem;
            font-weight: 500;
            color: var(--text-muted);
            background: var(--surface-warm);
            padding: 0.15rem 0.6rem;
            border-radius: 100px;
            border: 1px solid var(--border-light);
        }

        /* ── cards ── */
        .card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            transition: box-shadow 0.3s ease;
        }

        .card:hover {
            box-shadow: var(--shadow);
        }

        .card-body {
            padding: 1rem;
        }

        /* ── item grid (сетка из 2 колонок для файлов) ── */
        .items-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        @media (max-width: 500px) {
            .items-grid {
                grid-template-columns: 1fr; /* На телефонах в одну колонку */
            }
        }

        /* ── item (плитка с файлом) ── */
        .item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 0.75rem;
            background: var(--surface-warm);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            text-decoration: none;
            color: inherit;
            transition: all 0.15s ease;
            cursor: pointer;
        }

        .item:hover {
            background: var(--surface);
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .item:active {
            transform: translateY(0);
        }

        .item .emoji {
            font-size: 1.1rem;
            width: 28px;
            text-align: center;
            flex-shrink: 0;
        }

        .item .name {
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .item .arrow {
            margin-left: auto;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.15s ease;
        }

        .item:hover .arrow {
            opacity: 1;
            color: var(--accent);
        }

        /* ── footer ── */
        .site-footer {
            max-width: 1200px;
            margin: 3rem auto 0;
            display: flex;
            justify-content: center;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header class="site-header">
        <div class="brand">
            <div class="brand-icon">📖</div>
            <div class="brand-text">
                <h1>English Lessons</h1>
                <span>Friends S1E24 · 13 Aug 2026</span>
            </div>
        </div>
        <div class="repo-badge">
            <span class="dot"></span>
            <span>PDF Files</span>
            <span class="size">3</span>
        </div>
    </header>

    <main class="container">
        <section class="section">
            <div class="section-header">
                <div class="icon">📄</div>
                <h2>Lesson Materials</h2>
                <span class="count">3</span>
            </div>
            <div class="card">
                <div class="card-body">
                    <div class="items-grid">
                        
                        <!-- Файл 1 -->
                        <a href="https://item1000-collab.github.io/ai/engoo/20260813-friends-s1e24/friends-english-lesson.pdf" target="_blank" class="item">
                            <span class="emoji">📕</span>
                            <span class="name">friends-english-lesson.pdf</span>
                            <span class="arrow">→</span>
                        </a>

                        <!-- Файл 2 -->
                        <a href="https://item1000-collab.github.io/ai/engoo/20260813-friends-s1e24/friends-season-1-finale-analysis.pdf" target="_blank" class="item">
                            <span class="emoji">📘</span>
                            <span class="name">friends-season-1-finale-analysis.pdf</span>
                            <span class="arrow">→</span>
                        </a>

                        <!-- Файл 3 -->
                        <a href="https://item1000-collab.github.io/ai/engoo/20260813-friends-s1e24/sitcom-english-masterclass.pdf" target="_blank" class="item">
                            <span class="emoji">📗</span>
                            <span class="name">sitcom-english-masterclass.pdf</span>
                            <span class="arrow">→</span>
                        </a>

                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <span style="font-size: 0.8rem; color: var(--text-muted);">Powered by AI Exploration Hub</span>
    </footer>

</body>
</html>
