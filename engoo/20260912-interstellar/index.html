<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources – Interstellar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f8f6f3;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .wrapper {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            padding: 8px 0 32px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            font-size: 36px;
            line-height: 1;
        }

        .header-text h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #1a1a2e;
        }

        .header-text .subtitle {
            font-size: 15px;
            font-weight: 400;
            color: #6b7280;
            margin-top: 2px;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 100px;
            padding: 8px 16px 8px 14px;
            font-size: 13px;
            font-weight: 600;
            color: #1a1a2e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            white-space: nowrap;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: #e07a5f;
            border-radius: 50%;
            animation: pulse 1.8s ease-in-out infinite;
            flex-shrink: 0;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.75);
            }
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.04);
            flex: 1;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            background: #fafaf9;
            border: 1.5px solid #e5e7eb;
            border-radius: 16px;
            text-decoration: none;
            color: #1a1a2e;
            transition: all 0.2s ease;
            position: relative;
            cursor: pointer;
        }

        .item:hover {
            border-color: #e07a5f;
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(224, 122, 95, 0.12);
        }

        .item .emoji {
            font-size: 22px;
            line-height: 1;
            flex-shrink: 0;
        }

        .item .name {
            font-size: 14px;
            font-weight: 500;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #1a1a2e;
            transition: color 0.2s ease;
        }

        .item:hover .name {
            color: #e07a5f;
        }

        .item .arrow {
            font-size: 18px;
            color: #e07a5f;
            opacity: 0;
            transform: translateX(-6px);
            transition: all 0.2s ease;
            flex-shrink: 0;
            line-height: 1;
        }

        .item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        footer {
            text-align: center;
            padding: 28px 0 8px;
            font-size: 13px;
            color: #6b7280;
            font-weight: 400;
        }

        @media (max-width: 500px) {
            body {
                padding: 16px;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                padding-bottom: 24px;
            }

            .header-text h1 {
                font-size: 22px;
            }

            .badge {
                align-self: flex-start;
            }

            .card {
                padding: 18px;
                border-radius: 16px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .item {
                padding: 12px 14px;
                border-radius: 12px;
            }

            .item .name {
                font-size: 13px;
            }

            .item .arrow {
                opacity: 1;
                transform: translateX(0);
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <div class="header-left">
                <span class="logo">📄</span>
                <div class="header-text">
                    <h1>Resources</h1>
                    <div class="subtitle">Interstellar</div>
                </div>
            </div>
            <div class="badge">
                <span class="pulse-dot"></span>
                PDF Files
            </div>
        </header>

        <main class="card">
            <div class="grid">
                <a href="https://item1000-collab.github.io/ai/engoo/20260912-interstellar/interstellar-recoded.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📕</span>
                    <span class="name">interstellar-recoded.pdf</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </main>

        <footer>
            Powered by AI Exploration Hub
        </footer>
    </div>
</body>
</html>
