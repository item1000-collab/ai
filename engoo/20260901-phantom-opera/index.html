<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources · Phantom Opera</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8f6f3;
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1.5rem;
    }

    .container {
      max-width: 820px;
      width: 100%;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .main-title {
      font-size: 1.6rem;
      font-weight: 600;
      color: #1a1a2e;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 0.95rem;
      font-weight: 400;
      color: #6b7280;
      margin-top: 0.1rem;
    }

    /* badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
      padding: 0.4rem 1rem 0.4rem 0.9rem;
      border-radius: 40px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      font-weight: 500;
      font-size: 0.9rem;
      color: #1a1a2e;
      border: 1px solid #edeae5;
      letter-spacing: 0.01em;
    }

    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #e07a5f;
      border-radius: 50%;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }

    /* card */
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.04), 0 2px 8px rgba(0, 0, 0, 0.02);
      padding: 1.8rem 1.8rem 1.4rem;
      margin: 0.5rem 0 2.2rem;
      transition: box-shadow 0.2s ease;
    }

    .file-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.65rem 1.2rem;
    }

    /* item */
    .item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      padding: 0.55rem 0.6rem 0.55rem 0.6rem;
      border-radius: 16px;
      text-decoration: none;
      color: #1a1a2e;
      background: transparent;
      transition: background 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
      border: 1px solid transparent;
      font-weight: 500;
      font-size: 0.95rem;
      line-height: 1.4;
      position: relative;
    }

    .item .emoji {
      font-size: 1.3rem;
      line-height: 1;
      margin-right: 0.1rem;
      flex-shrink: 0;
    }

    .item .name {
      flex: 1;
      word-break: break-word;
      color: #1a1a2e;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: color 0.15s;
    }

    .item .arrow {
      opacity: 0;
      transform: translateX(-4px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-size: 1.2rem;
      font-weight: 300;
      color: #e07a5f;
      margin-left: auto;
      padding-left: 0.3rem;
      flex-shrink: 0;
    }

    .item:hover {
      background: white;
      border-color: #e07a5f;
      box-shadow: 0 4px 14px rgba(224, 122, 95, 0.08);
      transform: translateY(-1px);
    }

    .item:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .item:hover .name {
      color: #1a1a2e;
    }

    /* footer */
    .footer {
      text-align: center;
      font-size: 0.9rem;
      color: #9ca3af;
      padding: 0.4rem 0 0.2rem;
      letter-spacing: 0.01em;
      border-top: 1px solid #edeae5;
      padding-top: 1.2rem;
      margin-top: 0.2rem;
    }

    /* responsive */
    @media (max-width: 550px) {
      .file-grid {
        grid-template-columns: 1fr;
      }
      .header {
        flex-direction: row;
        align-items: center;
      }
      .badge {
        padding: 0.3rem 0.8rem 0.3rem 0.7rem;
        font-size: 0.8rem;
      }
      .card {
        padding: 1.5rem 1rem 1.2rem;
      }
      .main-title {
        font-size: 1.4rem;
      }
    }

    @media (max-width: 400px) {
      .header-left .logo-icon {
        font-size: 1.6rem;
      }
      .main-title {
        font-size: 1.2rem;
      }
      .subtitle {
        font-size: 0.8rem;
      }
      .item {
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- header -->
  <header class="header">
    <div class="header-left">
      <span class="logo-icon">📖</span>
      <div class="title-group">
        <span class="main-title">Resources</span>
        <span class="subtitle">Phantom Opera · engoo</span>
      </div>
    </div>
    <div class="badge">
      <span class="pulse-dot"></span>
      <span>PDF Files</span>
    </div>
  </header>

  <!-- card + grid -->
  <div class="card">
    <div class="file-grid">
      <!-- 
        extracted from screenshot: 
        only .pdf file: phantom-opera.pdf
        path after /ai/: engoo/20260901-phantom-opera/
        (based on the github URL in the image: /ai/engoo/20260901-phantom-opera/)
      -->
      <a href="https://item1000-collab.github.io/ai/engoo/20260901-phantom-opera/phantom-opera.pdf" 
         target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📘</span>
        <span class="name">phantom-opera.pdf</span>
        <span class="arrow">→</span>
      </a>
      <!-- 
        Only one PDF is visible. No other .pdf files appear in the screenshot.
        Folders and non-PDF files are ignored.
      -->
    </div>
  </div>

  <!-- footer -->
  <div class="footer">
    Powered by AI Exploration Hub
  </div>

</div>
</body>
</html>
