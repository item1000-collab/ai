<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources — Romanov Imperial Tragedy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f8f6f3;
    color: #1a1a2e;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 32px 24px 24px;
  }

  .wrapper {
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    flex: 1;
  }

  /* Header */
  .header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .header-left {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }

  .logo {
    width: 48px;
    height: 48px;
    background: #ffffff;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    box-shadow: 0 4px 14px rgba(26, 26, 46, 0.08);
    flex-shrink: 0;
  }

  .title-group h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.2;
    color: #1a1a2e;
  }

  .title-group .subtitle {
    font-size: 14px;
    font-weight: 500;
    color: #6b7280;
    margin-top: 2px;
  }

  /* Badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    border-radius: 100px;
    padding: 8px 16px;
    box-shadow: 0 4px 14px rgba(26, 26, 46, 0.08);
    font-size: 13px;
    font-weight: 600;
    color: #1a1a2e;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .pulse-dot {
    width: 9px;
    height: 9px;
    background: #e07a5f;
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
  }

  .pulse-dot::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #e07a5f;
    animation: pulse 2s ease-out infinite;
  }

  @keyframes pulse {
    0% {
      transform: scale(1);
      opacity: 0.7;
    }
    70% {
      transform: scale(2.4);
      opacity: 0;
    }
    100% {
      transform: scale(2.4);
      opacity: 0;
    }
  }

  /* Card */
  .card {
    background: #ffffff;
    border-radius: 24px;
    box-shadow: 0 8px 30px rgba(26, 26, 46, 0.08);
    padding: 24px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #f8f6f3;
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 14px 16px;
    text-decoration: none;
    color: #1a1a2e;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .item:hover {
    border-color: #e07a5f;
    background: #ffffff;
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(224, 122, 95, 0.15);
  }

  .item .emoji {
    font-size: 22px;
    line-height: 1;
    flex-shrink: 0;
  }

  .item .name {
    font-size: 14px;
    font-weight: 500;
    word-break: break-word;
    flex: 1;
    line-height: 1.3;
  }

  .item .arrow {
    font-size: 18px;
    color: #e07a5f;
    opacity: 0;
    transform: translateX(-6px);
    transition: all 0.2s ease;
    flex-shrink: 0;
    font-weight: 600;
  }

  .item:hover .arrow {
    opacity: 1;
    transform: translateX(0);
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 32px 0 8px;
    font-size: 13px;
    font-weight: 500;
    color: #6b7280;
  }

  /* Responsive */
  @media (max-width: 500px) {
    body {
      padding: 20px 16px 16px;
    }

    .grid {
      grid-template-columns: 1fr;
    }

    .card {
      padding: 16px;
      border-radius: 20px;
    }

    .title-group h1 {
      font-size: 22px;
    }

    .header {
      margin-bottom: 20px;
    }

    .logo {
      width: 42px;
      height: 42px;
      font-size: 20px;
      border-radius: 12px;
    }

    .badge {
      padding: 6px 14px;
      font-size: 12px;
    }
  }
</style>
</head>
<body>
  <div class="wrapper">
    <header class="header">
      <div class="header-left">
        <div class="logo">📄</div>
        <div class="title-group">
          <h1>Resources</h1>
          <div class="subtitle">Romanov Imperial Tragedy</div>
        </div>
      </div>
      <div class="badge">
        <span class="pulse-dot"></span>
        PDF Files
      </div>
    </header>

    <main class="card">
      <div class="grid">
        <a href="https://item1000-collab.github.io/ai/engoo/20260926-romanov-imperial-tragedy/romanov-imperial-tragedy.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📕</span>
          <span class="name">romanov-imperial-tragedy.pdf</span>
          <span class="arrow">→</span>
        </a>
      </div>
    </main>
  </div>

  <footer class="footer">
    Powered by AI Exploration Hub
  </footer>
</body>
</html>
