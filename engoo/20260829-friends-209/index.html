<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources · AI Exploration Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #f8f6f3;
            font-family: 'DM Sans', sans-serif;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1rem;
        }
        .wrapper {
            width: 100%;
            max-width: 880px;
            margin: 0 auto;
        }
        /* header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .logo {
            font-size: 2.6rem;
            line-height: 1;
            background: #ffffff;
            border-radius: 20px;
            width: 68px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px -6px rgba(0,0,0,0.08);
            border: 1px solid rgba(224, 122, 95, 0.2);
        }
        .header-text {
            display: flex;
            flex-direction: column;
        }
        .main-title {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #1a1a2e;
            line-height: 1.2;
        }
        .subtitle {
            font-size: 1rem;
            font-weight: 500;
            color: #6b7280;
            margin-top: 0.2rem;
        }
        /* badge */
        .badge {
            background: #ffffff;
            border-radius: 60px;
            padding: 0.7rem 1.4rem;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            box-shadow: 0 8px 20px -6px rgba(0,0,0,0.05);
            border: 1px solid #e9e4de;
            font-weight: 600;
            font-size: 0.95rem;
            color: #1a1a2e;
        }
        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #e07a5f;
            border-radius: 50%;
            position: relative;
            display: inline-block;
        }
        .pulse-dot::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: #e07a5f;
            border-radius: 50%;
            animation: pulse 1.8s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.8; transform: scale(1); }
            70% { opacity: 0; transform: scale(2.2); }
            100% { opacity: 0; transform: scale(1); }
        }
        /* card */
        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 2rem 1.8rem;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.02);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .file-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.9rem;
        }
        /* item */
        .item {
            display: flex;
            align-items: center;
            text-decoration: none;
            background: #fcfcfc;
            border-radius: 16px;
            padding: 0.9rem 1.2rem;
            border: 1px solid #eae5e0;
            transition: all 0.2s ease;
            color: #1a1a2e;
            box-shadow: 0 2px 5px rgba(0,0,0,0.01);
        }
        .item:hover {
            border-color: #e07a5f;
            transform: translateY(-2px);
            box-shadow: 0 12px 18px -8px rgba(224, 122, 95, 0.2);
            background: #ffffff;
        }
        .emoji {
            font-size: 1.8rem;
            margin-right: 0.9rem;
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.05));
        }
        .name {
            font-weight: 600;
            font-size: 0.98rem;
            flex: 1;
            word-break: break-word;
            line-height: 1.4;
            letter-spacing: -0.01em;
            color: #1a1a2e;
        }
        .arrow {
            font-size: 1.3rem;
            margin-left: 0.8rem;
            opacity: 0;
            transform: translateX(-6px);
            transition: all 0.18s ease;
            font-weight: 400;
            color: #e07a5f;
        }
        .item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }
        /* footer */
        .footer {
            margin-top: 2.5rem;
            text-align: center;
            color: #9a938a;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        @media (max-width: 500px) {
            .file-grid {
                grid-template-columns: 1fr;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .badge {
                align-self: flex-start;
            }
            .card {
                padding: 1.4rem 1.2rem;
            }
            .logo {
                width: 60px;
                height: 60px;
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- header -->
        <div class="header">
            <div class="header-left">
                <div class="logo">📖</div>
                <div class="header-text">
                    <div class="main-title">Resources</div>
                    <div class="subtitle">engoo · 20260829-friends-209</div>
                </div>
            </div>
            <div class="badge">
                <span class="pulse-dot"></span>
                <span>PDF Files</span>
            </div>
        </div>

        <!-- main card -->
        <div class="card">
            <div class="file-grid">
                <!-- file 1: 90s_Sitcom_English_Masterclass.pdf -->
                <a href="https://item1000-collab.github.io/ai/engoo/20260829-friends-209/90s_Sitcom_English_Masterclass.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📘</span>
                    <span class="name">90s_Sitcom_English_Masterclass.pdf</span>
                    <span class="arrow">→</span>
                </a>

                <!-- file 2: Friends_Phoebe_s_Dad_English_Lesson.pdf -->
                <a href="https://item1000-collab.github.io/ai/engoo/20260829-friends-209/Friends_Phoebe_s_Dad_English_Lesson.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📗</span>
                    <span class="name">Friends_Phoebe_s_Dad_English_Lesson.pdf</span>
                    <span class="arrow">→</span>
                </a>

                <!-- file 3: The_Architecture_of_Farce.pdf -->
                <a href="https://item1000-collab.github.io/ai/engoo/20260829-friends-209/The_Architecture_of_Farce.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📙</span>
                    <span class="name">The_Architecture_of_Farce.pdf</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>

        <!-- footer -->
        <div class="footer">Powered by AI Exploration Hub</div>
    </div>
</body>
</html>
