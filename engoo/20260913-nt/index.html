<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8f6f3;
            --card-bg: #ffffff;
            --accent: #e07a5f;
            --text-main: #1a1a2e;
            --text-secondary: #6b7280;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            --shadow-hover: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 2rem;
        }

        header {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto 2rem auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            font-size: 2rem;
            line-height: 1;
        }

        .header-text h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-text p {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--card-bg);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-main);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent);
            border-radius: 50%;
            position: relative;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--accent);
            border-radius: 50%;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.8;
            }
            70% {
                transform: scale(2.5);
                opacity: 0;
            }
            100% {
                transform: scale(2.5);
                opacity: 0;
            }
        }

        main {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 2rem;
            box-shadow: var(--shadow-md);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem;
            background-color: var(--card-bg);
            border: 1px solid #f0f0f0;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            position: relative;
            overflow: hidden;
        }

        .item:hover {
            border-color: var(--accent);
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }

        .emoji {
            font-size: 1.5rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .name {
            font-weight: 500;
            font-size: 1rem;
            flex: 1;
            word-break: break-word;
        }

        .arrow {
            font-size: 1.25rem;
            color: var(--accent);
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            flex-shrink: 0;
        }

        .item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        footer {
            max-width: 1000px;
            width: 100%;
            margin: 3rem auto 0 auto;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.875rem;
            font-weight: 500;
        }

        @media (max-width: 500px) {
            body {
                padding: 1rem;
            }

            header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .badge {
                align-self: flex-start;
            }

            .card {
                padding: 1rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .item {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo-icon">📄</div>
            <div class="header-text">
                <h1>Resources</h1>
                <p>engoo / 20260913-nt</p>
            </div>
        </div>
        <div class="badge">
            <span class="pulse-dot"></span>
            PDF Files
        </div>
    </header>

    <main>
        <div class="card">
            <div class="grid">
                <a href="https://item1000-collab.github.io/ai/engoo/20260913-nt/notebook.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📕</span>
                    <span class="name">notebook.pdf</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>
    </main>

    <footer>
        Powered by AI Exploration Hub
    </footer>

</body>
</html>
