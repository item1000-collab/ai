<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resources</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: #f8f6f3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 2rem 1.5rem 1.5rem;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            padding: 0.5rem 0 2rem 0;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            font-size: 2rem;
            line-height: 1;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #1a1a2e;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .header-subtitle {
            font-size: 0.95rem;
            color: #6b7280;
            margin-top: 4px;
            font-weight: 400;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 8px 20px;
            border-radius: 60px;
            box-shadow: 0 10px 20px -8px rgba(0, 0, 0, 0.08);
            font-weight: 500;
            font-size: 0.9rem;
            color: #1a1a2e;
            border: 1px solid #eee6de;
        }

        .pulse-dot {
            width: 10px;
            height: 10px;
            background: #e07a5f;
            border-radius: 50%;
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }

        .pulse-dot::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: #e07a5f;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 1.8s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
            z-index: -1;
        }

        @keyframes pulse {
            0% {
                width: 12px;
                height: 12px;
                opacity: 0.5;
            }
            70% {
                width: 30px;
                height: 30px;
                opacity: 0;
            }
            100% {
                opacity: 0;
                width: 30px;
                height: 30px;
            }
        }

        .badge-text {
            letter-spacing: 0.3px;
        }

        /* Main card */
        .main-card {
            background: white;
            border-radius: 24px;
            padding: 2.2rem 2rem 2.5rem;
            box-shadow: 0 25px 40px -15px rgba(0, 0, 0, 0.1), 0 10px 15px -8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(224, 122, 95, 0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        /* File item card */
        .item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #fdfcfb;
            border: 1.5px solid #eeebe8;
            padding: 1.1rem 1.4rem;
            border-radius: 16px;
            text-decoration: none;
            color: #1a1a2e;
            transition: all 0.2s ease;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.02);
            cursor: pointer;
            min-height: 78px;
        }

        .item .emoji {
            font-size: 2rem;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .item .name {
            font-weight: 500;
            font-size: 1.1rem;
            word-break: break-all;
            flex: 1;
            color: #1a1a2e;
            line-height: 1.4;
        }

        .item .arrow {
            font-size: 1.6rem;
            color: #e07a5f;
            opacity: 0;
            transform: translateX(-5px);
            transition: opacity 0.2s, transform 0.2s;
            font-weight: 300;
            flex-shrink: 0;
        }

        .item:hover {
            border-color: #e07a5f;
            background: #ffffff;
            box-shadow: 0 12px 22px -10px rgba(224, 122, 95, 0.13);
            transform: translateY(-3px);
        }

        .item:hover .arrow {
            opacity: 1;
            transform: translateX(0);
        }

        .item:hover .emoji {
            transform: scale(1.05);
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2.2rem 0 0.5rem;
            color: #6b7280;
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        @media (max-width: 600px) {
            .main-card {
                padding: 1.8rem 1rem 2rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .badge {
                align-self: flex-start;
            }
        }

        @media (max-width: 500px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .item {
                min-height: 70px;
            }
            .header-title h1 {
                font-size: 1.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-left">
                <span class="logo-icon">📖</span>
                <div class="header-title">
                    <h1>Resources</h1>
                    <div class="header-subtitle">engoo · 20260830-chocolat</div>
                </div>
            </div>
            <div class="badge">
                <span class="pulse-dot"></span>
                <span class="badge-text">PDF Files</span>
            </div>
        </header>

        <!-- Main card -->
        <div class="main-card">
            <div class="grid">
                <!-- Only PDF file from the screenshot: the-chocolat-awakening.pdf -->
                <a href="https://item1000-collab.github.io/ai/engoo/20260830-chocolat/the-chocolat-awakening.pdf" target="_blank" rel="noopener noreferrer" class="item">
                    <span class="emoji">📘</span>
                    <span class="name">the-chocolat-awakening.pdf</span>
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            Powered by AI Exploration Hub
        </footer>
    </div>
</body>
</html>
