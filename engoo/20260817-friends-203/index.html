<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resources · PDF files</title>
  <!-- Google Fonts: DM Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8f6f3;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      margin: 0;
      line-height: 1.4;
    }

    .container {
      max-width: 900px;
      width: 100%;
      background: #f8f6f3;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .logo-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .main-title {
      font-size: 1.8rem;
      font-weight: 600;
      color: #1a1a2e;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .subtitle {
      font-size: 1rem;
      font-weight: 400;
      color: #6b7280;
      margin-top: 0.1rem;
      letter-spacing: -0.01em;
    }

    /* badge right */
    .badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
      padding: 0.5rem 1.2rem 0.5rem 1rem;
      border-radius: 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02), 0 1px 3px rgba(0,0,0,0.04);
      border: 1px solid rgba(0,0,0,0.02);
      font-weight: 500;
      color: #1a1a2e;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .pulse-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #e07a5f;
      border-radius: 50%;
      position: relative;
      margin-right: 2px;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.5; transform: scale(0.92); }
      50% { opacity: 1; transform: scale(1.08); }
      100% { opacity: 0.5; transform: scale(0.92); }
    }

    .badge-label {
      letter-spacing: 0.01em;
    }

    /* card */
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.03), 0 2px 8px rgba(0,0,0,0.02);
      padding: 1.75rem 1.75rem 1.5rem;
      transition: box-shadow 0.2s;
      border: 1px solid rgba(0,0,0,0.02);
    }

    /* grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      list-style: none;
    }

    /* item = link */
    .item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.75rem 1rem;
      background: #fcfcfa;
      border-radius: 16px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #1a1a2e;
      font-weight: 450;
      font-size: 0.95rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.01);
      position: relative;
      min-height: 48px;
      word-break: break-word;
    }

    .item .emoji {
      font-size: 1.3rem;
      line-height: 1;
      flex-shrink: 0;
      width: 1.6rem;
      text-align: left;
    }

    .item .name {
      flex: 1;
      font-weight: 450;
      letter-spacing: -0.01em;
      transition: color 0.15s;
      line-height: 1.3;
    }

    .item .arrow {
      font-size: 1.3rem;
      color: #c0c0c0;
      transition: all 0.2s ease;
      flex-shrink: 0;
      opacity: 0;
      transform: translateX(-4px);
      font-weight: 300;
    }

    .item:hover {
      background: #ffffff;
      border-color: #e07a5f;
      box-shadow: 0 6px 14px rgba(224, 122, 95, 0.08), 0 2px 6px rgba(0,0,0,0.02);
      transform: translateY(-2px);
    }

    .item:hover .arrow {
      opacity: 1;
      transform: translateX(2px);
      color: #e07a5f;
    }

    .item:hover .name {
      color: #1a1a2e;
    }

    /* footer */
    .footer {
      margin-top: 2.5rem;
      text-align: center;
      font-size: 0.9rem;
      color: #9ca3af;
      letter-spacing: 0.02em;
      font-weight: 400;
      border-top: 1px solid rgba(0,0,0,0.02);
      padding-top: 2rem;
    }

    /* responsive */
    @media (max-width: 550px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 0.6rem;
      }

      .header {
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
      }

      .main-title {
        font-size: 1.5rem;
      }

      .badge {
        padding: 0.35rem 1rem 0.35rem 0.8rem;
        font-size: 0.85rem;
      }

      .card {
        padding: 1.25rem 1rem;
      }

      .item {
        padding: 0.65rem 0.9rem;
        font-size: 0.92rem;
      }

      .item .emoji {
        font-size: 1.2rem;
        width: 1.5rem;
      }
    }

    /* small extra safety */
    .item:active {
      transform: scale(0.99);
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- header -->
    <header class="header">
      <div class="header-left">
        <span class="logo-icon">📖</span>
        <div class="title-group">
          <h1 class="main-title">Resources</h1>
          <span class="subtitle">Friends · Season 2 · Episode 03</span>
        </div>
      </div>
      <div class="badge">
        <span class="pulse-dot"></span>
        <span class="badge-label">PDF Files</span>
      </div>
    </header>

    <!-- main card -->
    <main class="card">
      <div class="grid">
        <!-- 1 -->
        <a href="https://item1000-collab.github.io/ai/engoo/20260817-friends-203/friends-english-guide.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📕</span>
          <span class="name">friends-english-guide.pdf</span>
          <span class="arrow">→</span>
        </a>
        <!-- 2 -->
        <a href="https://item1000-collab.github.io/ai/engoo/20260817-friends-203/friends-english-mastery.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📘</span>
          <span class="name">friends-english-mastery.pdf</span>
          <span class="arrow">→</span>
        </a>
        <!-- 3 -->
        <a href="https://item1000-collab.github.io/ai/engoo/20260817-friends-203/the-one-with-the-void.pdf" target="_blank" rel="noopener noreferrer" class="item">
          <span class="emoji">📗</span>
          <span class="name">the-one-with-the-void.pdf</span>
          <span class="arrow">→</span>
        </a>
      </div>
    </main>

    <!-- footer -->
    <footer class="footer">
      Powered by AI Exploration Hub
    </footer>
  </div>
</body>
</html>
