<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends · Vocab Arcade · Prom Video</title>
  <style>
    /* ===== GLOBAL RESET & VARIABLES ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --paper: #FAF3E4;
      --ink: #2E2438;
      --red: #D9433B;
      --teal: #3E8E8C;
      --yellow: #F2B33D;
      --gold: #E5B13A;
      --success: #3E8E8C;
      --error: #D9433B;
      --shadow-hard: 0 6px 0 rgba(0, 0, 0, 0.2);
      --font-display: 'Righteous', cursive;
      --font-mono: 'Courier Prime', monospace;
      --font-hand: 'Caveat', cursive;
      --font-body: 'Nunito Sans', sans-serif;
      --radius-card: 16px;
      --radius-btn: 30px;
      --transition: 0.25s ease;
    }

    body {
      background: #1F1A24;
      background-image: radial-gradient(circle at 30% 10%, #3A2E44 0%, #1F1A24 80%);
      font-family: var(--font-body);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }

    /* ===== FILM GRAIN + VIGNETTE (SVG) ===== */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.12;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      background-size: 200px 200px;
    }

    .vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9998;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(0, 0, 0, 0.4) 100%);
    }

    /* ===== SHELL / GAME CONTAINER ===== */
    .game-shell {
      max-width: 1100px;
      width: 100%;
      background: var(--paper);
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 4px #2E2438 inset;
      position: relative;
      overflow: hidden;
      padding: 16px 20px 20px;
      transition: transform 0.3s ease;
      border: 1px solid #4A3D54;
    }

    /* ===== HEADER CONSOLE ===== */
    .header-console {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--ink);
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 2px;
      color: var(--ink);
      text-shadow: 2px 2px 0 var(--yellow);
    }

    .brand span {
      background: var(--red);
      color: #FAF3E4;
      padding: 2px 8px;
      border-radius: 40px;
      font-size: 0.8rem;
      letter-spacing: 1px;
      transform: rotate(-3deg);
    }

    .progress-dots {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #D9CEC0;
      border: 2px solid var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--ink);
      transition: var(--transition);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
    }

    .dot.completed {
      background: var(--success);
      color: #FAF3E4;
    }

    .dot.active {
      background: var(--yellow);
      transform: scale(1.15);
      box-shadow: 0 0 0 3px rgba(242, 179, 61, 0.5);
    }

    .hud-score {
      font-family: var(--font-mono);
      font-size: 1.6rem;
      font-weight: 700;
      background: var(--ink);
      color: var(--yellow);
      padding: 4px 16px;
      border-radius: 40px;
      box-shadow: 0 4px 0 #0F0D12;
      letter-spacing: 1px;
    }

    .header-buttons {
      display: flex;
      gap: 10px;
    }

    .icon-btn {
      background: none;
      border: 3px solid var(--ink);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 4px 0 var(--ink);
      line-height: 1;
      padding: 0;
    }

    .icon-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .icon-btn:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 2px;
    }

    /* ===== SCREENS ===== */
    .screen {
      display: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .screen.active {
      display: block;
      opacity: 1;
      animation: fadeUp 0.4s ease;
    }

    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== INTRO SCREEN ===== */
    .intro-card {
      text-align: center;
      padding: 32px 20px 24px;
      background: #FCF7EE;
      border-radius: 18px;
      border: 3px solid var(--ink);
      box-shadow: var(--shadow-hard);
      background-image: repeating-linear-gradient(45deg, rgba(217, 67, 59, 0.05) 0px, rgba(217, 67, 59, 0.05) 4px, transparent 4px, transparent 12px);
    }

    .intro-card h1 {
      font-family: var(--font-display);
      font-size: 3.2rem;
      color: var(--ink);
      text-shadow: 4px 4px 0 var(--yellow);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .intro-card p {
      font-size: 1.2rem;
      max-width: 650px;
      margin: 12px auto 24px;
      background: rgba(250, 243, 228, 0.8);
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
    }

    .btn-play {
      background: var(--red);
      color: #FAF3E4;
      font-family: var(--font-display);
      font-size: 2.2rem;
      padding: 16px 48px;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      box-shadow: 0 8px 0 #8F2A25, 0 12px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.1s;
      letter-spacing: 4px;
      border: 3px solid #FAF3E4;
    }

    .btn-play:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #8F2A25, 0 6px 12px rgba(0, 0, 0, 0.3);
    }

    .btn-play:focus-visible {
      outline: 4px solid var(--yellow);
      outline-offset: 4px;
    }

    /* ===== MAP SCREEN ===== */
    .map-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 18px;
      margin: 24px 0 12px;
    }

    .reel-card {
      background: #FCF7EE;
      border-radius: var(--radius-card);
      border: 3px solid var(--ink);
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2);
      padding: 16px 8px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      transition: all 0.15s;
      cursor: pointer;
      position: relative;
    }

    .reel-card:not(.locked):hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 0 rgba(0, 0, 0, 0.2);
    }

    .reel-card:not(.locked):active {
      transform: translateY(4px);
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
    }

    .reel-card.locked {
      opacity: 0.6;
      filter: grayscale(0.6);
      cursor: not-allowed;
      box-shadow: 0 4px 0 rgba(0, 0, 0, 0.1);
    }

    .reel-card .preview-svg {
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--teal), var(--red));
      border: 2px solid var(--ink);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-display);
      font-size: 1.8rem;
      color: #FAF3E4;
      text-shadow: 2px 2px 0 var(--ink);
    }

    .reel-card h3 {
      font-family: var(--font-display);
      font-size: 1.2rem;
      margin: 4px 0;
      color: var(--ink);
    }

    .reel-card .char-name {
      font-family: var(--font-hand);
      font-size: 1.1rem;
      color: var(--teal);
    }

    .stars-row {
      display: flex;
      gap: 4px;
      margin: 6px 0;
    }

    .star {
      font-size: 1.2rem;
      color: #D9CEC0;
    }

    .star.filled {
      color: var(--gold);
    }

    .best-score {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      background: var(--ink);
      color: var(--yellow);
      padding: 2px 10px;
      border-radius: 20px;
      margin-top: 6px;
    }

    .lock-icon {
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 1.4rem;
      background: var(--ink);
      color: var(--yellow);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #FAF3E4;
    }

    .finale-btn {
      grid-column: 1 / -1;
      background: var(--gold);
      border: 3px solid var(--ink);
      border-radius: 60px;
      padding: 16px;
      font-family: var(--font-display);
      font-size: 1.8rem;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 6px 0 #A07D2A;
      color: var(--ink);
      transition: all 0.1s;
    }

    .finale-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #A07D2A;
    }

    /* ===== MODALS & TOASTS ===== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(31, 26, 36, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: var(--paper);
      border: 4px solid var(--ink);
      border-radius: 24px;
      max-width: 550px;
      width: 90%;
      padding: 28px;
      box-shadow: 0 20px 0 rgba(0, 0, 0, 0.2);
      text-align: center;
      transform: scale(0.95);
      transition: transform 0.2s;
    }

    .modal-overlay.show .modal-box {
      transform: scale(1);
    }

    .modal-box h2 {
      font-family: var(--font-display);
      font-size: 2.2rem;
      margin-bottom: 12px;
      color: var(--ink);
    }

    .modal-box p {
      font-size: 1.1rem;
      margin-bottom: 24px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      font-family: var(--font-display);
      font-size: 1.4rem;
      padding: 10px 28px;
      border: 3px solid var(--ink);
      border-radius: 40px;
      cursor: pointer;
      background: var(--yellow);
      box-shadow: 0 5px 0 var(--ink);
      transition: all 0.1s;
      color: var(--ink);
      letter-spacing: 1px;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--ink);
    }

    .btn.secondary {
      background: #FAF3E4;
    }

    .toast-container {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }

    .toast {
      background: var(--ink);
      color: var(--yellow);
      font-family: var(--font-mono);
      font-size: 1rem;
      padding: 10px 24px;
      border-radius: 40px;
      box-shadow: 0 6px 0 rgba(0, 0, 0, 0.3);
      border: 2px solid var(--yellow);
      animation: toastIn 0.3s ease;
    }

    @keyframes toastIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* ===== MINI-GAME SHARED ===== */
    .game-area {
      background: #FCF7EE;
      border-radius: 20px;
      border: 3px solid var(--ink);
      padding: 24px;
      margin-top: 16px;
      box-shadow: var(--shadow-hard);
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .timer-bar {
      height: 12px;
      background: #D9CEC0;
      border-radius: 20px;
      border: 2px solid var(--ink);
      margin: 8px 0 16px;
      overflow: hidden;
    }

    .timer-fill {
      height: 100%;
      width: 100%;
      background: var(--teal);
      transition: width 0.1s linear;
    }

    .timer-fill.danger {
      background: var(--red);
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 700px) {
      .brand { font-size: 1.3rem; }
      .hud-score { font-size: 1.2rem; }
      .intro-card h1 { font-size: 2.2rem; }
      .btn-play { font-size: 1.6rem; padding: 12px 28px; }
      .map-grid { grid-template-columns: 1fr 1fr; }
      .game-shell { padding: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Courier+Prime:wght@400;700&family=Caveat:wght@400;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="grain-overlay"></div>
  <div class="vignette"></div>

  <div class="game-shell" id="gameShell">
    <!-- ===== HEADER ===== -->
    <header class="header-console">
      <div class="brand">
        📺 FRIENDS <span>VOCAB</span>
      </div>
      <div class="progress-dots" id="progressDots"></div>
      <div class="hud-score" id="scoreDisplay">0</div>
      <div class="header-buttons">
        <button class="icon-btn" id="soundToggle" aria-label="Toggle sound">🔊</button>
        <button class="icon-btn" id="mapBtn" aria-label="Level map">🗺️</button>
      </div>
    </header>

    <!-- ===== SCREENS ===== -->
    <!-- INTRO -->
    <section class="screen active" id="screenIntro">
      <div class="intro-card">
        <h1>THE PROM VIDEO</h1>
        <p>📼 Relive the iconic moments. Learn vocabulary. Become the ultimate Friends fan.</p>
        <button class="btn-play" id="playBtn" aria-label="Play game">PLAY ▶</button>
      </div>
    </section>

    <!-- LEVEL MAP -->
    <section class="screen" id="screenMap">
      <h2 style="font-family:var(--font-display);font-size:2rem;margin-bottom:8px;">🗺️ LEVEL MAP</h2>
      <div class="map-grid" id="mapGrid"></div>
    </section>

    <!-- GAME SCENE -->
    <section class="screen" id="screenGame">
      <div id="gameContainer"></div>
    </section>

    <!-- FINALE -->
    <section class="screen" id="screenFinale">
      <div class="intro-card" style="padding:20px;">
        <h1>🎬 THAT'S A WRAP!</h1>
        <div id="finaleContent"></div>
      </div>
    </section>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box" id="modalBox"></div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    (function() {
      "use strict";

      /* ===== UTILITIES ===== */
      const $ = (sel, ctx = document) => ctx.querySelector(sel);
      const $$ = (sel, ctx = document) => [...ctx.querySelectorAll(sel)];

      function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }
      function shuffle(arr) {
        const a = [...arr];
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function refreshIcons() {
        if (window.lucide) lucide.createIcons();
      }

      function toast(msg, duration = 2500) {
        const container = $('#toastContainer');
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        container.appendChild(el);
        setTimeout(() => el.remove(), duration);
      }

      function popFloat(text, color = '#F2B33D') {
        const el = document.createElement('div');
        el.textContent = text;
        el.style.cssText = `
          position: fixed; pointer-events: none; font-family: 'Righteous', cursive;
          font-size: 2rem; color: ${color}; z-index: 9999;
          text-shadow: 2px 2px 0 #2E2438; animation: floatUp 0.8s ease forwards;
          left: 50%; top: 40%; transform: translateX(-50%);
        `;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 800);
        // inject keyframes if not present
        if (!document.getElementById('floatKeyframes')) {
          const style = document.createElement('style');
          style.id = 'floatKeyframes';
          style.textContent = `@keyframes floatUp { 0% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); } 100% { opacity: 0; transform: translateX(-50%) translateY(-80px) scale(1.4); } }`;
          document.head.appendChild(style);
        }
      }

      function spawnConfetti(count = 30) {
        const colors = ['#D9433B', '#3E8E8C', '#F2B33D', '#FAF3E4', '#2E2438'];
        for (let i = 0; i < count; i++) {
          const particle = document.createElement('div');
          particle.style.cssText = `
            position: fixed; width: 10px; height: 10px; background: ${colors[i % colors.length]};
            left: ${Math.random() * 100}vw; top: -10px; border-radius: 2px;
            z-index: 9999; pointer-events: none;
            animation: confettiFall ${1 + Math.random() * 2}s linear forwards;
            transform: rotate(${Math.random() * 360}deg);
          `;
          document.body.appendChild(particle);
          setTimeout(() => particle.remove(), 3000);
        }
        if (!document.getElementById('confettiKeyframes')) {
          const style = document.createElement('style');
          style.id = 'confettiKeyframes';
          style.textContent = `@keyframes confettiFall { 0% { opacity: 1; top: -10px; } 100% { opacity: 0; top: 100vh; } }`;
          document.head.appendChild(style);
        }
      }

      /* ===== AUDIO (Web Audio API) ===== */
      let audioCtx = null;
      let isMuted = false;
      try { isMuted = localStorage.getItem('friends_muted') === 'true'; } catch (e) {}

      function initAudio() {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function tone(freq, dur, type = 'sine', vol = 0.3, when = 0) {
        if (isMuted || !audioCtx) return;
        const t = audioCtx.currentTime + when;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(vol, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + dur);
      }

      function noiseBurst(dur = 0.3, vol = 0.2) {
        if (isMuted || !audioCtx) return;
        const bufferSize = audioCtx.sampleRate * dur;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const source = audioCtx.createBufferSource();
        source.buffer = buffer;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
        source.connect(gain).connect(audioCtx.destination);
        source.start();
      }

      const sfx = {
        click: () => tone(800, 0.06, 'square', 0.15),
        flip: () => tone(500, 0.1, 'triangle', 0.2, 0),
        correct: () => { tone(660, 0.12, 'sine', 0.3); tone(880, 0.12, 'sine', 0.3, 0.1); },
        wrong: () => { tone(220, 0.15, 'sawtooth', 0.25); tone(180, 0.2, 'sawtooth', 0.2, 0.1); },
        match: () => { tone(700, 0.1, 'sine', 0.3); tone(1000, 0.15, 'sine', 0.3, 0.08); },
        fanfare: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, 'sine', 0.3, i * 0.1)); },
        tick: () => tone(1200, 0.04, 'square', 0.08),
        cheer: () => { noiseBurst(0.4, 0.15); [600, 800, 1000].forEach((f, i) => tone(f, 0.15, 'triangle', 0.2, i * 0.05)); }
      };

      /* ===== GAME DATA ===== */
      const SCENES = [
        { id: 1, num: '01', title: 'The Bracelet', char: 'Joey', color: '#D9433B', slide: '📼', tag: 'S02E14', obj: 'Friendship & Money', tip: 'Chandler gets a flashy gift.', flavor: 'To my best bud.' },

          ]

      /* ===== STATE ===== */
      const STORAGE_KEY = 'friends_vocab_arcade_v1';
      let state = {
        currentScreen: 'intro',
        currentLevel: null,
        score: 0,
        totalScore: 0,
        levelStars: {},
        levelBest: {},
        completedLevels: [],
        streak: 0,
        mistakes: 0,
        soundMuted: isMuted
      };

      function loadProgress() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const data = JSON.parse(saved);
            state.levelStars = data.levelStars || {};
            state.levelBest = data.levelBest || {};
            state.completedLevels = data.completedLevels || [];
            state.totalScore = data.totalScore || 0;
          }
        } catch (e) { /* private mode */ }
      }

      function saveProgress() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            levelStars: state.levelStars,
            levelBest: state.levelBest,
            completedLevels: state.completedLevels,
            totalScore: state.totalScore
          }));
        } catch (e) {}
      }

      /* ===== RENDER HELPERS ===== */
      function updateHUD() {
        $('#scoreDisplay').textContent = state.totalScore;
        const dots = $('#progressDots');
        dots.innerHTML = LEVELS.map((l, i) => {
          const done = state.completedLevels.includes(l.id);
          const active = state.currentLevel === l.id;
          return `<span class="dot ${done ? 'completed' : ''} ${active ? 'active' : ''}">${l.id}</span>`;
        }).join('');
      }

      function renderMap() {
        const grid = $('#mapGrid');
        let html = '';
        LEVELS.forEach((l, idx) => {
          const unlocked = idx === 0 || state.completedLevels.includes(LEVELS[idx - 1].id);
          const stars = state.levelStars[l.id] || 0;
          const best = state.levelBest[l.id] || 0;
          const starStr = Array(3).fill(0).map((_, i) => `<span class="star ${i < stars ? 'filled' : ''}">★</span>`).join('');
          html += `
            <div class="reel-card ${unlocked ? '' : 'locked'}" data-level="${l.id}" data-unlocked="${unlocked}" tabindex="${unlocked ? 0 : -1}" role="button" aria-label="Level ${l.id} - ${l.title}">
              <div class="preview-svg">${l.slide}</div>
              <h3>${l.num} · ${l.title}</h3>
              <div class="char-name">${l.char}</div>
              <div class="stars-row">${starStr}</div>
              <div class="best-score">Best: ${best}</div>
              ${unlocked ? '' : '<div class="lock-icon">🔒</div>'}
            </div>
          `;
        });
        const allCompleted = state.completedLevels.length === LEVELS.length;
        html += `<button class="finale-btn" id="finaleBtn" ${allCompleted ? '' : 'disabled style="opacity:0.5;cursor:not-allowed;"'}>🏆 FINALE 🏆</button>`;
        grid.innerHTML = html;

        // attach listeners
        $$('.reel-card:not(.locked)').forEach(card => {
          card.addEventListener('click', () => {
            const lid = parseInt(card.dataset.level);
            if (!card.classList.contains('locked')) startLevel(lid);
          });
          card.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              const lid = parseInt(card.dataset.level);
              if (!card.classList.contains('locked')) startLevel(lid);
            }
          });
        });
        const finaleBtn = $('#finaleBtn');
        if (finaleBtn && allCompleted) {
          finaleBtn.addEventListener('click', showFinale);
        }
        refreshIcons();
      }

      function renderSound() {
        const btn = $('#soundToggle');
        btn.textContent = state.soundMuted ? '🔇' : '🔊';
        btn.setAttribute('aria-label', state.soundMuted ? 'Unmute sound' : 'Mute sound');
      }

      /* ===== SCREEN MANAGEMENT ===== */
      let cleanupFn = null;
      function setCleanup(fn) { cleanupFn = fn; }

      function switchScreen(name) {
        if (cleanupFn) { cleanupFn(); cleanupFn = null; }
        $$('.screen').forEach(s => s.classList.remove('active'));
        const target = $(`#screen${name.charAt(0).toUpperCase() + name.slice(1)}`);
        if (target) target.classList.add('active');
        state.currentScreen = name;
      }

      /* ===== MODAL ===== */
      function showModal(html, actions) {
        const overlay = $('#modalOverlay');
        const box = $('#modalBox');
        box.innerHTML = html;
        if (actions) {
          const actDiv = document.createElement('div');
          actDiv.className = 'modal-actions';
          actions.forEach(a => {
            const btn = document.createElement('button');
            btn.className = `btn ${a.secondary ? 'secondary' : ''}`;
            btn.textContent = a.text;
            btn.addEventListener('click', () => { overlay.classList.remove('show'); a.action(); });
            actDiv.appendChild(btn);
          });
          box.appendChild(actDiv);
        }
        overlay.classList.add('show');
      }

      /* ===== LEVEL STARTERS ===== */
      function startLevel(levelId) {
        initAudio();
        sfx.click();
        const level = LEVELS.find(l => l.id === levelId);
        if (!level) return;
        state.currentLevel = levelId;
        state.streak = 0;
        state.mistakes = 0;

        showModal(`
          <h2>${level.num} · ${level.title}</h2>
          <p><strong>${level.char}</strong> — ${level.tip}</p>
          <p style="font-family:var(--font-hand);font-size:1.4rem;">"${level.flavor}"</p>
        `, [
          { text: 'START', action: () => launchGame(level) }
        ]);
      }

      function launchGame(level) {
        switchScreen('game');
        const container = $('#gameContainer');
        container.innerHTML = '';
        const gameDiv = document.createElement('div');
        gameDiv.className = 'game-area';
        container.appendChild(gameDiv);

        switch (level.type) {
          case 'fill': renderFillGame(gameDiv, level); break;
          case 'tf': renderTFGame(gameDiv, level); break;
          case 'mc': renderMCGame(gameDiv, level); break;
          case 'sort': renderSortGame(gameDiv, level); break;
          case 'memory': renderMemoryGame(gameDiv, level); break;
          case 'timed': renderTimedGame(gameDiv, level); break;
          default: break;
        }
        updateHUD();
      }

      /* ===== LEVEL 1: FILL IN THE BLANKS ===== */
      function renderFillGame(container, level) {
        let qIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let selectedBlank = null;
        let bankWords = [];

        function renderQuestion() {
          if (qIndex >= level.questions.length) {
            finishLevel(level, correctCount, wrongCount);
            return;
          }
          const q = level.questions[qIndex];
          bankWords = shuffle([...q.bank]);
          const parts = q.text.split('___');
          let textHtml = parts[0];
          textHtml += `<span class="blank-slot" data-blank="true" style="display:inline-block;min-width:120px;border-bottom:3px dashed var(--ink);margin:0 6px;padding:0 8px;font-weight:700;color:var(--teal);cursor:pointer;" tabindex="0" role="button" aria-label="Select blank">___</span>`;
          textHtml += parts[1] || '';

          container.innerHTML = `
            <div style="text-align:center;">
              <p style="font-size:1.4rem;margin-bottom:20px;">${textHtml}</p>
              <p style="font-family:var(--font-mono);margin-bottom:12px;">Click a word to fill the blank</p>
              <div id="wordBank" style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                ${bankWords.map(w => `<button class="btn word-btn" data-word="${w}" style="font-size:1.2rem;padding:8px 20px;">${w}</button>`).join('')}
              </div>
              <p style="margin-top:16px;font-family:var(--font-mono);">Score: ${state.score} | Streak: ${state.streak}</p>
            </div>
          `;

          // blank selection
          const blank = $('.blank-slot', container);
          blank.addEventListener('click', () => {
            sfx.click();
            $$('.blank-slot').forEach(b => b.style.background = 'transparent');
            blank.style.background = 'rgba(242,179,61,0.3)';
            selectedBlank = blank;
          });
          blank.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); blank.click(); }
          });

          // word bank
          $$('.word-btn', container).forEach(btn => {
            btn.addEventListener('click', () => {
              if (!selectedBlank) { toast('Select the blank first!'); return; }
              const word = btn.dataset.word;
              if (word === q.answer) {
                sfx.correct();
                selectedBlank.textContent = word;
                selectedBlank.style.borderBottom = '3px solid var(--success)';
                selectedBlank.style.color = 'var(--success)';
                selectedBlank.style.background = 'transparent';
                btn.disabled = true;
                btn.style.opacity = '0.4';
                correctCount++;
                state.streak++;
                const pts = 10 + state.streak * 2;
                state.score += pts;
                state.totalScore += pts;
                popFloat(`+${pts}`, '#3E8E8C');
                toast('Correct!', 800);
                updateHUD();
                setTimeout(() => { qIndex++; renderQuestion(); }, 700);
              } else {
                sfx.wrong();
                btn.style.animation = 'shake 0.3s';
                setTimeout(() => btn.style.animation = '', 300);
                state.streak = 0;
                state.score = Math.max(0, state.score - 5);
                state.totalScore = Math.max(0, state.totalScore - 5);
                wrongCount++;
                toast('Wrong! -5', 800);
                updateHUD();
              }
            });
          });
        }

        // inject shake keyframes
        if (!document.getElementById('shakeKeyframes')) {
          const style = document.createElement('style');
          style.id = 'shakeKeyframes';
          style.textContent = `@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }`;
          document.head.appendChild(style);
        }

        setCleanup(() => { /* no timers */ });
        renderQuestion();
      }

      /* ===== LEVEL 2: TRUE/FALSE ===== */
      function renderTFGame(container, level) {
        let idx = 0;
        let correct = 0;
        let wrong = 0;
        let timerInterval = null;
        let timeLeft = 6;

        function renderStatement() {
          if (idx >= level.statements.length) {
            if (timerInterval) clearInterval(timerInterval);
            finishLevel(level, correct, wrong);
            return;
          }
          const st = level.statements[idx];
          timeLeft = 6;
          container.innerHTML = `
            <div style="text-align:center;">
              <p style="font-size:1.2rem;font-family:var(--font-mono);margin-bottom:8px;">REAL or DELUSION?</p>
              <div class="timer-bar"><div class="timer-fill" id="tfTimerFill" style="width:100%"></div></div>
              <p style="font-size:1.6rem;margin:24px 0;font-weight:700;">"${st.text}"</p>
              <div style="display:flex;gap:16px;justify-content:center;">
                <button class="btn" id="tfTrue" style="background:var(--success);color:#FAF3E4;">REAL ✓</button>
                <button class="btn" id="tfFalse" style="background:var(--error);color:#FAF3E4;">DELUSION ✗</button>
              </div>
              <p style="margin-top:16px;">Score: ${state.score} | Streak: ${state.streak}</p>
            </div>
          `;

          const fill = $('#tfTimerFill', container);
          timerInterval = setInterval(() => {
            timeLeft -= 0.1;
            fill.style.width = `${(timeLeft / 6) * 100}%`;
            if (timeLeft <= 2) fill.classList.add('danger');
            if (timeLeft <= 0) {
              clearInterval(timerInterval);
              sfx.wrong();
              toast('Time up!');
              wrong++;
              state.streak = 0;
              idx++;
              renderStatement();
            }
          }, 100);

          function answer(val) {
            clearInterval(timerInterval);
            if (val === st.ans) {
              sfx.correct();
              correct++;
              state.streak++;
              const pts = 15 + state.streak * 3;
              state.score += pts;
              state.totalScore += pts;
              popFloat(`+${pts}`, '#3E8E8C');
              toast('Correct!', 600);
            } else {
              sfx.wrong();
              wrong++;
              state.streak = 0;
              state.score = Math.max(0, state.score - 5);
              state.totalScore = Math.max(0, state.totalScore - 5);
              toast('Wrong! -5', 600);
            }
            updateHUD();
            idx++;
            setTimeout(renderStatement, 600);
          }

          $('#tfTrue', container).addEventListener('click', () => answer(true));
          $('#tfFalse', container).addEventListener('click', () => answer(false));
          // arrow key support
          const keyHandler = (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); answer(true); }
            if (e.key === 'ArrowRight') { e.preventDefault(); answer(false); }
          };
          document.addEventListener('keydown', keyHandler);
          setCleanup(() => { clearInterval(timerInterval); document.removeEventListener('keydown', keyHandler); });
        }

        renderStatement();
      }

      /* ===== LEVEL 3: MULTIPLE CHOICE ===== */
      function renderMCGame(container, level) {
        let idx = 0;
        let correct = 0;
        let wrong = 0;

        function renderMC() {
          if (idx >= level.questions.length) { finishLevel(level, correct, wrong); return; }
          const q = level.questions[idx];
          container.innerHTML = `
            <div style="text-align:center;">
              <p style="font-size:1.5rem;margin-bottom:24px;font-weight:700;">${q.q}</p>
              <div style="display:flex;flex-direction:column;gap:12px;align-items:center;">
                ${q.opts.map((o, i) => `<button class="btn mc-opt" data-idx="${i}" style="min-width:240px;">${o}</button>`).join('')}
              </div>
              <p style="margin-top:24px;">Score: ${state.score}</p>
            </div>
          `;
          $$('.mc-opt', container).forEach(btn => {
            btn.addEventListener('click', () => {
              const chosen = parseInt(btn.dataset.idx);
              if (chosen === q.ans) {
                sfx.correct();
                correct++;
                const pts = 20;
                state.score += pts;
                state.totalScore += pts;
                popFloat(`+${pts}`, '#3E8E8C');
                toast('Correct!', 600);
                updateHUD();
                idx++;
                setTimeout(renderMC, 600);
              } else {
                sfx.wrong();
                wrong++;
                state.score = Math.max(0, state.score - 5);
                state.totalScore = Math.max(0, state.totalScore - 5);
                toast('Wrong! -5', 600);
                updateHUD();
                idx++;
                setTimeout(renderMC, 600);
              }
            });
          });
        }

        setCleanup(() => {});
        renderMC();
      }

      /* ===== LEVEL 4: SORTING ===== */
      function renderSortGame(container, level) {
        let items = shuffle([...level.items]);
        let correctOrder = [...level.items].sort((a, b) => a.order - b.order);
        let moves = 0;

        function renderSort() {
          container.innerHTML = `
            <div style="text-align:center;">
              <p style="font-size:1.2rem;margin-bottom:16px;">Drag or use arrows to order the events:</p>
              <div id="sortList" style="display:flex;flex-direction:column;gap:10px;max-width:500px;margin:0 auto;">
                ${items.map((it, i) => `
                  <div class="sort-item" draggable="true" data-idx="${i}" style="background:#FAF3E4;border:3px solid var(--ink);border-radius:12px;padding:12px;display:flex;align-items:center;justify-content:space-between;cursor:grab;box-shadow:0 4px 0 rgba(0,0,0,0.15);">
                    <span>${it.text}</span>
                    <div style="display:flex;gap:6px;">
                      <button class="icon-btn sort-up" data-idx="${i}" style="width:32px;height:32px;font-size:1.1rem;">▲</button>
                      <button class="icon-btn sort-down" data-idx="${i}" style="width:32px;height:32px;font-size:1.1rem;">▼</button>
                    </div>
                  </div>
                `).join('')}
              </div>
              <button class="btn" id="sortCheck" style="margin-top:20px;">CHECK ORDER</button>
            </div>
          `;

          // drag & drop
          let dragIdx = null;
          $$('.sort-item', container).forEach(item => {
            item.addEventListener('dragstart', (e) => { dragIdx = parseInt(item.dataset.idx); e.dataTransfer.effectAllowed = 'move'; });
            item.addEventListener('dragover', (e) => e.preventDefault());
            item.addEventListener('drop', (e) => {
              e.preventDefault();
              const targetIdx = parseInt(item.dataset.idx);
              if (dragIdx !== null && dragIdx !== targetIdx) {
                const moved = items.splice(dragIdx, 1)[0];
                items.splice(targetIdx, 0, moved);
                renderSort();
              }
            });
          });

          // arrow buttons
          $$('.sort-up', container).forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const i = parseInt(btn.dataset.idx);
              if (i > 0) { [items[i - 1], items[i]] = [items[i], items[i - 1]]; renderSort(); }
            });
          });
          $$('.sort-down', container).forEach(btn => {
            btn.addEventListener('click', (e) => {
              e.stopPropagation();
              const i = parseInt(btn.dataset.idx);
              if (i < items.length - 1) { [items[i], items[i + 1]] = [items[i + 1], items[i]]; renderSort(); }
            });
          });

          // check
          $('#sortCheck', container).addEventListener('click', () => {
            const currentOrder = items.map(it => it.order);
            const isCorrect = currentOrder.every((v, i) => v === correctOrder[i].order);
            if (isCorrect) {
              sfx.correct();
              toast('Perfect order! +25', 800);
              state.score += 25;
              state.totalScore += 25;
              updateHUD();
              finishLevel(level, 0, 0);
            } else {
              sfx.wrong();
              toast('Not quite. Try again! -5', 800);
              state.score = Math.max(0, state.score - 5);
              state.totalScore = Math.max(0, state.totalScore - 5);
              updateHUD();
            }
          });
        }

        setCleanup(() => {});
        renderSort();
      }

      /* ===== LEVEL 5: MEMORY ===== */
      function renderMemoryGame(container, level) {
        const pairs = level.pairs;
        let cards = shuffle([...pairs, ...pairs]);
        let flipped = [];
        let matched = [];
        let moves = 0;
        let lock = false;

        function renderMemory() {
          container.innerHTML = `
            <div style="text-align:center;">
              <p style="font-family:var(--font-mono);margin-bottom:12px;">Moves: ${moves} | Matched: ${matched.length / 2}/${pairs.length}</p>
              <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:0 auto;">
                ${cards.map((c, i) => `
                  <div class="mem-card" data-idx="${i}" style="aspect-ratio:1;perspective:600px;cursor:pointer;">
                    <div style="position:relative;width:100%;height:100%;transition:transform 0.4s;transform-style:preserve-3d;transform:${flipped.includes(i) || matched.includes(c) ? 'rotateY(180deg)' : 'rotateY(0)'};">
                      <div style="position:absolute;width:100%;height:100%;backface-visibility:hidden;background:var(--ink);border-radius:12px;border:3px solid var(--yellow);display:flex;align-items:center;justify-content:center;font-size:2rem;">?</div>
                      <div style="position:absolute;width:100%;height:100%;backface-visibility:hidden;background:#FAF3E4;border-radius:12px;border:3px solid var(--teal);display:flex;align-items:center;justify-content:center;font-size:2rem;transform:rotateY(180deg);">${c}</div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;

          $$('.mem-card', container).forEach(card => {
            card.addEventListener('click', () => {
              if (lock) return;
              const idx = parseInt(card.dataset.idx);
              if (flipped.includes(idx) || matched.includes(cards[idx])) return;
              sfx.flip();
              flipped.push(idx);
              if (flipped.length === 2) {
                moves++;
                lock = true;
                const [a, b] = flipped;
                if (cards[a] === cards[b]) {
                  sfx.match();
                  matched.push(cards[a], cards[b]);
                  state.streak++;
                  const pts = 15 + state.streak * 2;
                  state.score += pts;
                  state.totalScore += pts;
                  popFloat(`+${pts}`, '#3E8E8C');
                  flipped = [];
                  lock = false;
                  if (matched.length === cards.length) {
                    sfx.cheer();
                    spawnConfetti(20);
                    setTimeout(() => finishLevel(level, 0, 0), 600);
                  }
                  renderMemory();
                } else {
                  sfx.wrong();
                  state.streak = 0;
                  setTimeout(() => {
                    flipped = [];
                    lock = false;
                    renderMemory();
                  }, 800);
                }
              } else {
                renderMemory();
              }
            });
          });
        }

        setCleanup(() => {});
        renderMemory();
      }

      /* ===== LEVEL 6: TIMED BONUS ===== */
      function renderTimedGame(container, level) {
        let idx = 0;
        let timeLeft = 75;
        let timerInterval = null;
        let correct = 0;
        let wrong = 0;
        let streak = 0;

        function renderTimed() {
          if (idx >= level.questions.length || timeLeft <= 0) {
            clearInterval(timerInterval);
            finishLevel(level, correct, wrong);
            return;
          }
          const q = level.questions[idx];
          const opts = shuffle([...q.opts]);
          container.innerHTML = `
            <div style="text-align:center;">
              <div style="display:flex;justify-content:space-between;font-family:var(--font-mono);margin-bottom:8px;">
                <span>⏱️ ${Math.ceil(timeLeft)}s</span>
                <span>Streak: ${streak} ×</span>
              </div>
              <div class="timer-bar"><div class="timer-fill ${timeLeft < 15 ? 'danger' : ''}" style="width:${(timeLeft / 75) * 100}%"></div></div>
              <p style="font-size:1.5rem;margin:20px 0;">${q.q}</p>
              <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
                ${opts.map(o => `<button class="btn timed-opt" data-opt="${o}" style="min-width:140px;">${o}</button>`).join('')}
              </div>
            </div>
          `;

          $$('.timed-opt', container).forEach(btn => {
            btn.addEventListener('click', () => {
              if (btn.dataset.opt === q.ans) {
                sfx.correct();
                correct++;
                streak++;
                const pts = 20 * Math.min(streak, 5);
                state.score += pts;
                state.totalScore += pts;
                popFloat(`+${pts} ×${Math.min(streak, 5)}`, '#F2B33D');
              } else {
                sfx.wrong();
                wrong++;
                streak = 0;
                state.score = Math.max(0, state.score - 10);
                state.totalScore = Math.max(0, state.totalScore - 10);
                toast('Wrong! -10', 600);
              }
              updateHUD();
              idx++;
              renderTimed();
            });
          });
        }

        timerInterval = setInterval(() => {
          timeLeft -= 0.1;
          if (timeLeft <= 0) { clearInterval(timerInterval); finishLevel(level, correct, wrong); }
          if (idx < level.questions.length) renderTimed();
        }, 100);

        setCleanup(() => clearInterval(timerInterval));
        renderTimed();
      }

      /* ===== LEVEL COMPLETE ===== */
      function finishLevel(level, correct, wrong) {
        const mistakes = wrong;
        let stars = 3;
        if (mistakes >= 1) stars = 2;
        if (mistakes >= 3) stars = 1;
        if (mistakes >= 5) stars = 1;

        const prevStars = state.levelStars[level.id] || 0;
        if (stars > prevStars) state.levelStars[level.id] = stars;
        const prevBest = state.levelBest[level.id] || 0;
        if (state.score > prevBest) state.levelBest[level.id] = state.score;

        if (!state.completedLevels.includes(level.id)) state.completedLevels.push(level.id);
        saveProgress();
        updateHUD();

        sfx.fanfare();
        spawnConfetti(30);

        showModal(`
          <h2>LEVEL COMPLETE!</h2>
          <p style="font-size:2rem;">${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</p>
          <p>Score: <strong>${state.score}</strong></p>
          <p style="font-family:var(--font-hand);">"${level.flavor}"</p>
        `, [
          { text: 'CONTINUE', action: () => { state.score = 0; switchScreen('map'); renderMap(); updateHUD(); } }
        ]);
      }

      /* ===== FINALE ===== */
      function showFinale() {
        switchScreen('finale');
        const totalStars = Object.values(state.levelStars).reduce((a, b) => a + b, 0);
        let rank = 'Rookie';
        if (state.totalScore > 500) rank = 'Best Bud';
        if (state.totalScore > 1000) rank = 'Lobster';
        if (state.totalScore > 1500) rank = 'Bracelet Buddy';

        let tableHtml = LEVELS.map(l => {
          const stars = state.levelStars[l.id] || 0;
          const best = state.levelBest[l.id] || 0;
          return `<tr><td>${l.num} ${l.title}</td><td>${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</td><td>${best}</td></tr>`;
        }).join('');

        $('#finaleContent').innerHTML = `
          <p style="font-size:2rem;">Total Score: <strong>${state.totalScore}</strong></p>
          <p style="font-size:1.6rem;">Total Stars: ${'★'.repeat(totalStars)}${'☆'.repeat(18 - totalStars)}</p>
          <p style="font-size:1.8rem;font-family:var(--font-display);">RANK: ${rank}</p>
          <table style="width:100%;margin:16px 0;font-family:var(--font-mono);border-collapse:collapse;">
            <thead><tr><th>Level</th><th>Stars</th><th>Best</th></tr></thead>
            <tbody>${tableHtml}</tbody>
          </table>
          <button class="btn" id="resetBtn" style="background:var(--red);color:#FAF3E4;">⟲ REWIND THE TAPE</button>
        `;

        $('#resetBtn').addEventListener('click', () => {
          try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
          state.levelStars = {};
          state.levelBest = {};
          state.completedLevels = [];
          state.totalScore = 0;
          state.score = 0;
          toast('Progress reset!');
          switchScreen('map');
          renderMap();
          updateHUD();
        });

        sfx.cheer();
        spawnConfetti(60);
      }

      /* ===== INIT & EVENT LISTENERS ===== */
      function init() {
        loadProgress();
        renderSound();
        updateHUD();
        renderMap();
        refreshIcons();

        // play button
        $('#playBtn').addEventListener('click', () => {
          initAudio();
          sfx.click();
          switchScreen('map');
          renderMap();
        });

        // map button
        $('#mapBtn').addEventListener('click', () => {
          initAudio();
          sfx.click();
          if (state.currentLevel) state.score = 0;
          switchScreen('map');
          renderMap();
          updateHUD();
        });

        // sound toggle
        $('#soundToggle').addEventListener('click', () => {
          initAudio();
          state.soundMuted = !state.soundMuted;
          isMuted = state.soundMuted;
          try { localStorage.setItem('friends_muted', isMuted); } catch (e) {}
          renderSound();
          if (!isMuted) sfx.click();
        });

        // keyboard escape closes modal
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            $('#modalOverlay').classList.remove('show');
          }
        });
      }

      /* ===== BOOT ===== */
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
