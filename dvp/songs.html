<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Selected Songs · Shared Playlist | YouTube</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #f3f0ea 0%, #e8e2d8 100%);
      font-family: system-ui, 'Segoe UI', sans-serif;
      padding: 2rem 1.2rem;
      min-height: 100vh;
    }
    .container { max-width: 980px; margin: 0 auto; }
    .gist-card {
      background: white;
      border-radius: 2rem;
      box-shadow: 0 25px 40px -14px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .favorite-content { padding: 2rem; }

    .top-links-bar {
      background: #fef5e6;
      border-radius: 2rem;
      padding: 0.75rem 1.2rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      border: 1px solid #f0e2d0;
    }
    .links-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
    }
    .service-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0.4rem 1rem;
      border-radius: 60px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
      color: #fff4e6;
      background: #121212;
    }
    .service-link.youtube { background: #c4302b; }
    .service-link.youtube:hover { background: #a02722; transform: translateY(-2px); }
    .service-link.grouptube { background: #2c5f2d; }
    .service-link.grouptube:hover { background: #1e451f; transform: translateY(-2px); }
    .brand-text {
      font-weight: 600;
      color: #2b241d;
      font-size: 0.85rem;
      background: #fff0e0;
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
    }

    .title-section {
      margin-bottom: 2rem;
      border-left: 5px solid #c4302b;
      padding-left: 1.2rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .title-section h1 {
      font-size: 2.3rem;
      font-weight: 700;
      background: linear-gradient(135deg, #2b241d, #6b5a48);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .song-count {
      background: #f0ede8;
      padding: 0.3rem 0.9rem;
      border-radius: 40px;
      font-size: 0.85rem;
    }

    .add-song-form {
      background: #fefcf8;
      border: 1px solid #ece3da;
      border-radius: 1.5rem;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .form-title {
      font-weight: 600;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .url-input-wrapper {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .url-input-wrapper input {
      flex: 1;
      padding: 0.85rem 1.2rem;
      border: 1px solid #e2d8cd;
      border-radius: 1rem;
      font-size: 0.9rem;
      font-family: monospace;
    }
    .url-input-wrapper input:focus {
      outline: none;
      border-color: #c4302b;
    }
    .btn-add {
      background: #c4302b;
      color: white;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-add:hover { background: #a02722; transform: translateY(-2px); }
    .btn-add:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    .preview-card {
      margin-top: 1rem;
      padding: 0.8rem;
      background: #eef4ea;
      border-radius: 1rem;
      display: none;
      border-left: 3px solid #c4302b;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .preview-card.show { display: flex; }
    .preview-card img {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: 0.6rem;
    }
    .preview-artist { font-weight: 600; color: #2b5e2b; }
    .preview-track { color: #4a6e3b; }
    .error-msg {
      color: #c2410c;
      background: #fff0e6;
      padding: 0.5rem;
      border-radius: 0.8rem;
      margin-top: 0.75rem;
      display: none;
    }
    .error-msg.show { display: block; }

    .songs-list { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
    .song-item {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      background: #fefcf8;
      border: 1px solid #ece3da;
      border-radius: 1.2rem;
      padding: 1rem 1.2rem;
      transition: all 0.2s;
      gap: 12px;
    }
    .song-item:hover { border-color: #c4302b; transform: translateX(3px); }
    .song-info { flex: 2; min-width: 180px; }
    .song-title { font-size: 1.2rem; font-weight: 600; }
    .song-artist { font-size: 0.8rem; color: #8a7c6b; margin-top: 2px; }
    .song-links { display: flex; gap: 0.75rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .listen-link {
      background: #c4302b;
      color: #fef5e6;
      text-decoration: none;
      padding: 0.45rem 1.1rem;
      border-radius: 60px;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .listen-link:hover { background: #a02722; transform: translateY(-2px); }
    .btn-delete {
      background: none;
      border: 1px solid #e0cfbf;
      border-radius: 40px;
      padding: 0.45rem 1rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-delete:hover { background: #fde8dd; border-color: #c4302b; }

    .empty-message { text-align: center; padding: 2.5rem; color: #b8aa99; }
    .status-bar {
      font-size: 0.7rem;
      color: #1db954;
      margin-bottom: 1rem;
      padding: 0.3rem 0.8rem;
      background: #e6f4ea;
      border-radius: 40px;
      display: inline-block;
    }

    .password-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .password-modal.active { display: flex; }
    .modal-card {
      background: white;
      border-radius: 2rem;
      max-width: 380px;
      width: 90%;
      padding: 1.8rem;
      text-align: center;
      box-shadow: 0 25px 40px rgba(0,0,0,0.3);
    }
    .modal-card h3 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    .modal-card p { color: #5e5343; margin-bottom: 1rem; }
    .modal-card input {
      width: 100%;
      padding: 0.8rem;
      border: 1px solid #ddd2c4;
      border-radius: 1.2rem;
      font-size: 1rem;
      margin-bottom: 1.2rem;
      font-family: monospace;
    }
    .modal-buttons { display: flex; gap: 0.8rem; justify-content: center; }
    .modal-buttons button {
      padding: 0.5rem 1.4rem;
      border-radius: 2rem;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    .confirm-delete-btn { background: #c2410c; color: white; }
    .cancel-modal-btn { background: #e9e2d8; color: #2b241d; }

    .song-actions-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
    }
    .action-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    @media (max-width: 680px) {
      .favorite-content { padding: 1.5rem; }
      .song-item { flex-direction: column; align-items: stretch; gap: 12px; }
      .song-actions-right { align-items: stretch; }
      .action-buttons { justify-content: flex-start; }
      .url-input-wrapper { flex-direction: column; }
      .btn-add { width: 100%; }
      .top-links-bar { flex-direction: column; align-items: stretch; }
      .links-group { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="gist-card">
    <div class="favorite-content">
      <div class="top-links-bar">
        <div class="brand-text">🎵 Music Resources</div>
        <div class="links-group">
          <a href="https://youtube.com/" class="service-link youtube" target="_blank" rel="noopener noreferrer">
            ▶️ YouTube
          </a>
          <a href="https://group.tube/" class="service-link grouptube" target="_blank" rel="noopener noreferrer">
            🎧 Group.tube
          </a>
        </div>
      </div>

      <div class="title-section">
        <h1>Selected Songs <span>🎵</span></h1>
        <div class="song-count" id="song-counter">0 songs</div>
      </div>

      <!-- YouTube-only Add Section -->
      <div class="add-song-form">
        <div class="form-title">
          <span>▶️</span> Add song via YouTube link
        </div>
        <div class="url-input-wrapper">
          <input type="url" id="youtube-url" placeholder="https://www.youtube.com/watch?v=dQw4w9WgXcQ или https://youtu.be/dQw4w9WgXcQ">
          <button class="btn-add" id="add-song-btn">➕ Add from YouTube</button>
        </div>
        <div id="preview-card" class="preview-card">
          <img id="preview-thumb" src="" alt="thumbnail">
          <div>
            <div class="preview-artist" id="preview-artist"></div>
            <div class="preview-track" id="preview-track"></div>
          </div>
        </div>
        <div id="form-error" class="error-msg"></div>
      </div>

      <div id="status" class="status-bar">🔄 Loading from cloud...</div>
      <div id="songs-list-container" class="songs-list"></div>
    </div>
  </div>
</div>

<!-- Password deletion modal -->
<div id="deletePasswordModal" class="password-modal">
  <div class="modal-card">
    <h3>🔐 Confirm Deletion</h3>
    <p>Enter password to delete this song (password: 321)</p>
    <input type="password" id="deletePasswordInput" placeholder="Password" autocomplete="off">
    <div class="modal-buttons">
      <button class="cancel-modal-btn" id="cancelDeleteBtn">Cancel</button>
      <button class="confirm-delete-btn" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<script>
  // ========== YOUR CORRECT API CREDENTIALS ==========
  const JSONBIN_BIN_ID = '6a2bba45f5f4af5e29e4dead';
  const JSONBIN_API_KEY = '$2a$10$3cRcS9QxJXwORF.t0f//HugV4YAC5SXdGnP.gx6m59xm5nQNMAkfG';
  const REQUIRED_DELETE_PASSWORD = "321";
  // ==================================================

  let songs = [];
  let pendingDeleteIndex = null;
  let onPasswordSuccessCallback = null;
  let currentPreview = null;

  function extractYouTubeId(url) {
    if (!url) return null;
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]+)/,
      /(?:youtu\.be\/)([\w-]+)/,
      /(?:youtube\.com\/embed\/)([\w-]+)/,
      /(?:youtube\.com\/shorts\/)([\w-]+)/
    ];
    for (const pattern of patterns) {
      const match = url.match(pattern);
      if (match) return match[1];
    }
    return null;
  }

  async function fetchYouTubeInfo(url) {
    const videoId = extractYouTubeId(url);
    if (!videoId) return null;
    try {
      const oembedUrl = `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`;
      const response = await fetch(oembedUrl);
      if (!response.ok) return null;
      const data = await response.json();
      if (data && data.title) {
        return {
          videoId,
          validUrl: `https://www.youtube.com/watch?v=${videoId}`,
          title: data.title,
          author: data.author_name || 'Unknown artist',
          thumbnail: data.thumbnail_url || `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`
        };
      }
    } catch(e) { console.warn(e); }
    return null;
  }

  // ========== ОЧИСТКА СТАРЫХ ЗАПИСЕЙ (GENIUS) ==========
  // Возвращает { songs, removed } — новый массив без записей без youtubeUrl
  // и количество удалённых.
  function cleanupOldSongs(rawSongs) {
    if (!Array.isArray(rawSongs)) return { songs: [], removed: 0 };
    const cleaned = rawSongs.filter(s => s && typeof s.youtubeUrl === 'string' && s.youtubeUrl.length > 0);
    return { songs: cleaned, removed: rawSongs.length - cleaned.length };
  }
  // =====================================================

  // ========== CLOUD STORAGE ==========
  async function loadSongsFromCloud() {
    const statusDiv = document.getElementById('status');
    try {
      statusDiv.textContent = '🔄 Loading from cloud...';
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
        headers: { 'X-Master-Key': JSONBIN_API_KEY }
      });

      if (response.status === 401) {
        statusDiv.textContent = '⚠️ Invalid API Key. Using local storage.';
        loadFromLocalFallback();
        return;
      }

      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const raw = data.record.songs || [];

      const { songs: cleaned, removed } = cleanupOldSongs(raw);
      songs = cleaned;

      if (removed > 0) {
        // Сразу закрепляем очистку в облаке, чтобы старьё не вернулось
        console.log(`[cleanup] Удалено старых записей без YouTube: ${removed}`);
        await saveSongsToCloud();
        statusDiv.textContent = `✅ Загружено из облака. Удалено старых записей: ${removed}`;
      } else {
        statusDiv.textContent = '✅ Loaded from cloud! (Shared across all users)';
      }
      renderSongs();
    } catch (error) {
      console.error(error);
      statusDiv.textContent = '⚠️ Cloud error. Using local storage.';
      loadFromLocalFallback();
    }
  }

  function loadFromLocalFallback() {
    const stored = localStorage.getItem('selected_songs_fallback');
    if (stored) {
      try {
        const parsed = JSON.parse(stored);
        const { songs: cleaned, removed } = cleanupOldSongs(parsed);
        songs = cleaned;
        if (removed > 0) {
          localStorage.setItem('selected_songs_fallback', JSON.stringify(songs));
          console.log(`[cleanup-local] Удалено старых записей: ${removed}`);
        }
      } catch (e) {
        console.warn('Bad localStorage JSON, resetting');
        songs = [];
      }
    } else {
      songs = [
        { artist: "Rick Astley", track: "Never Gonna Give You Up", youtubeUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ", thumbnail: "https://img.youtube.com/vi/dQw4w9WgXcQ/mqdefault.jpg" },
        { artist: "Radiohead", track: "Creep", youtubeUrl: "https://www.youtube.com/watch?v=XFkzRNyygfk", thumbnail: "https://img.youtube.com/vi/XFkzRNyygfk/mqdefault.jpg" }
      ];
    }
    renderSongs();
  }

  async function saveSongsToCloud() {
    const statusDiv = document.getElementById('status');
    try {
      statusDiv.textContent = '💾 Saving to cloud...';
      const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json',
          'X-Master-Key': JSONBIN_API_KEY
        },
        body: JSON.stringify({ songs: songs })
      });

      if (response.status === 401) {
        statusDiv.textContent = '⚠️ API Key error. Saved locally only.';
        localStorage.setItem('selected_songs_fallback', JSON.stringify(songs));
        return;
      }

      if (!response.ok) throw new Error('Save failed');
      statusDiv.textContent = '✅ Saved to cloud! All users see changes.';
      localStorage.setItem('selected_songs_fallback', JSON.stringify(songs));
      setTimeout(() => {
        statusDiv.textContent = '☁️ Data in shared cloud storage';
      }, 3000);
    } catch (error) {
      console.error(error);
      statusDiv.textContent = '⚠️ Cloud save failed. Saved locally.';
      localStorage.setItem('selected_songs_fallback', JSON.stringify(songs));
    }
  }

  async function addSongFromYouTube() {
    const url = document.getElementById('youtube-url').value.trim();
    if (!url) {
      showFormError("❌ Please enter a YouTube link");
      return false;
    }

    let info = currentPreview;
    const currentId = extractYouTubeId(url);
    if (!info || !currentId || info.videoId !== currentId) {
      info = await fetchYouTubeInfo(url);
    }

    if (!info) {
      showFormError("❌ Invalid YouTube link or video not found");
      return false;
    }

    const duplicate = songs.some(s => s.youtubeUrl === info.validUrl);
    if (duplicate) {
      showFormError(`⚠️ This video is already in the playlist!`);
      return false;
    }

    songs.push({
      artist: info.author,
      track: info.title,
      youtubeUrl: info.validUrl,
      thumbnail: info.thumbnail
    });

    await saveSongsToCloud();
    renderSongs();
    clearYouTubeForm();
    showSuccessMessage(`✅ Added "${info.title}"`);
    return true;
  }

  function requestDeleteSongWithPassword(index) {
    pendingDeleteIndex = index;
    showPasswordModal(() => {
      if (pendingDeleteIndex !== null) {
        deleteSong(pendingDeleteIndex);
        pendingDeleteIndex = null;
      }
    });
  }

  function deleteSong(index) {
    songs.splice(index, 1);
    saveSongsToCloud();
    renderSongs();
    showSuccessMessage(`🗑️ Song deleted`);
  }

  function showPasswordModal(callback) {
    onPasswordSuccessCallback = callback;
    const modal = document.getElementById('deletePasswordModal');
    const input = document.getElementById('deletePasswordInput');
    input.value = '';
    modal.classList.add('active');
    input.focus();
  }

  function closePasswordModal() {
    document.getElementById('deletePasswordModal').classList.remove('active');
    pendingDeleteIndex = null;
    onPasswordSuccessCallback = null;
  }

  function verifyAndExecute() {
    const password = document.getElementById('deletePasswordInput').value;
    if (password === REQUIRED_DELETE_PASSWORD) {
      if (onPasswordSuccessCallback) onPasswordSuccessCallback();
      closePasswordModal();
    } else {
      showFormError('🔒 Wrong password! Deletion requires password: 321');
      const inp = document.getElementById('deletePasswordInput');
      inp.style.border = '1px solid #c2410c';
      setTimeout(() => inp.style.border = '', 500);
      inp.value = '';
    }
  }

  function renderSongs() {
    const container = document.getElementById('songs-list-container');
    const counter = document.getElementById('song-counter');
    if (songs.length === 0) {
      container.innerHTML = '<div class="empty-message">✨ No songs. Add your first one via YouTube! ✨</div>';
      counter.textContent = '0 songs';
      return;
    }
    counter.textContent = `${songs.length} ${songs.length === 1 ? 'song' : 'songs'}`;

    container.innerHTML = songs.map((song, idx) => {
      const thumb = song.thumbnail || (song.youtubeUrl ? `https://img.youtube.com/vi/${extractYouTubeId(song.youtubeUrl)}/mqdefault.jpg` : '');
      return `
        <div class="song-item">
          <div class="song-info">
            <div class="song-title">${escapeHtml(song.artist)} – ${escapeHtml(song.track)}</div>
            <div class="song-artist">▶️ added via YouTube</div>
            <div class="song-links">
              <a href="${escapeHtml(song.youtubeUrl)}" class="listen-link" target="_blank" rel="noopener noreferrer">▶️ Watch on YouTube</a>
            </div>
          </div>
          <div class="song-actions-right">
            ${thumb ? `<img src="${escapeHtml(thumb)}" alt="" style="width:96px;height:72px;object-fit:cover;border-radius:0.6rem;">` : ''}
            <div class="action-buttons">
              <button class="btn-delete" data-index="${idx}">🔐 Delete song (password)</button>
            </div>
          </div>
        </div>
      `;
    }).join('');

    document.querySelectorAll('.btn-delete').forEach(btn => {
      const idx = parseInt(btn.dataset.index);
      btn.addEventListener('click', () => requestDeleteSongWithPassword(idx));
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>"]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[m]));
  }

  function clearYouTubeForm() {
    document.getElementById('youtube-url').value = '';
    document.getElementById('preview-card').classList.remove('show');
    currentPreview = null;
  }

  function showFormError(msg) {
    const err = document.getElementById('form-error');
    err.textContent = msg;
    err.classList.add('show');
    setTimeout(() => err.classList.remove('show'), 3500);
  }

  function showSuccessMessage(msg) {
    const statusDiv = document.getElementById('status');
    const originalText = statusDiv.textContent;
    statusDiv.textContent = msg;
    statusDiv.style.background = "#d4edda";
    setTimeout(() => {
      statusDiv.textContent = originalText;
      statusDiv.style.background = "#e6f4ea";
    }, 2500);
  }

  async function updatePreview() {
    const url = document.getElementById('youtube-url').value.trim();
    const previewCard = document.getElementById('preview-card');
    if (!url || !extractYouTubeId(url)) {
      previewCard.classList.remove('show');
      currentPreview = null;
      return;
    }
    previewCard.classList.add('show');
    document.getElementById('preview-artist').textContent = '⏳ Loading...';
    document.getElementById('preview-track').textContent = '';
    document.getElementById('preview-thumb').src = '';

    const info = await fetchYouTubeInfo(url);
    if (info) {
      currentPreview = info;
      document.getElementById('preview-artist').textContent = info.author;
      document.getElementById('preview-track').textContent = info.title;
      document.getElementById('preview-thumb').src = info.thumbnail;
    } else {
      previewCard.classList.remove('show');
      currentPreview = null;
    }
  }

  let previewTimer = null;
  function debouncedPreview() {
    clearTimeout(previewTimer);
    previewTimer = setTimeout(updatePreview, 500);
  }

  document.addEventListener('DOMContentLoaded', () => {
    loadSongsFromCloud();
    document.getElementById('youtube-url').addEventListener('input', debouncedPreview);
    document.getElementById('add-song-btn').addEventListener('click', () => addSongFromYouTube());
    document.getElementById('confirmDeleteBtn').addEventListener('click', verifyAndExecute);
    document.getElementById('cancelDeleteBtn').addEventListener('click', closePasswordModal);
    document.getElementById('deletePasswordModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('deletePasswordModal')) closePasswordModal();
    });
  });
</script>
</body>
</html>
