<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event · Index</title>
    <style>
        /* reset & base – full width, no margins */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f8f6f3;
            font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
            color: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        /* full-width container – no left/right padding */
        .app {
            width: 100%;
            max-width: 100%;
            padding: 0;
            margin: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        /* header – full width, subtle padding inside */
        .header {
            width: 100%;
            padding: 1.2rem 1.5rem;
            background: white;
            border-bottom: 1px solid #eeeae3;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem 1.5rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .logo-icon {
            font-size: 1.8rem;
            line-height: 1;
        }

        .title-group h1 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: #1a1a2e;
            line-height: 1.2;
        }

        .title-group .sub {
            font-size: 0.9rem;
            color: #6b7280;
            font-weight: 400;
            margin-top: 0.1rem;
        }

        /* badge – pulsing dot, NO "PDF Files" text, only dot + indicator */
        .badge {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: #f0ede8;
            padding: 0.4rem 1rem 0.4rem 0.9rem;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            color: #1a1a2e;
            border: 1px solid #ddd2c4;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        .pulse-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #e07a5f;
            border-radius: 50%;
            animation: pulse 1.8s ease-in-out infinite;
            margin-right: 2px;
        }

        @keyframes pulse {
            0% { opacity: 0.5; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.5; transform: scale(0.9); }
        }

        /* main card – full width, no side margins */
        .main-card {
            width: 100%;
            padding: 1.8rem 1.5rem;
            background: white;
            border-radius: 0;
            box-shadow: none;
            flex: 1;
        }

        /* grid – exactly 4 columns, full width, no gaps on sides */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            width: 100%;
            max-width: 100%;
        }

        /* item – PDF link button */
        .item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: #faf8f6;
            padding: 0.9rem 1rem;
            border-radius: 16px;
            border: 1px solid #e7e3dc;
            text-decoration: none;
            color: #1a1a2e;
            font-weight: 450;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            min-height: 58px;
            word-break: break-word;
        }

        .item .emoji {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .item .name {
            flex: 1;
            font-size: 0.82rem;
            line-height: 1.3;
            letter-spacing: -0.01em;
        }

        .item .arrow {
            font-size: 1rem;
            color: #b7aa98;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0;
            transform: translateX(-4px);
            flex-shrink: 0;
        }

        .item:hover {
            border-color: #e07a5f;
            background: #fffcf9;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04);
        }

        .item:hover .arrow {
            opacity: 1;
            transform: translateX(2px);
            color: #e07a5f;
        }

        /* footer – full width, no extra side padding */
        .footer {
            width: 100%;
            text-align: center;
            padding: 1.2rem 1.5rem;
            font-size: 0.8rem;
            color: #8f887d;
            border-top: 1px solid #eeeae3;
            background: white;
            margin-top: auto;
        }

        /* remove any extra spacing */
        .footer span {
            opacity: 0.7;
        }

        /* responsive: 2 columns on tablet, 1 on small */
        @media (max-width: 820px) {
            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.9rem;
            }
            .header {
                padding: 1rem 1.2rem;
            }
            .main-card {
                padding: 1.5rem 1.2rem;
            }
        }

        @media (max-width: 520px) {
            .grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .header {
                flex-direction: column;
                align-items: flex-start;
                padding: 0.9rem 1rem;
            }
            .badge {
                align-self: flex-start;
            }
            .title-group h1 {
                font-size: 1.3rem;
            }
            .item {
                padding: 0.8rem 0.9rem;
                min-height: 52px;
            }
        }

        /* override any residual padding */
        .container,
        .container-fluid {
            padding: 0 !important;
            margin: 0 !important;
            max-width: 100% !important;
        }

        /* ensure no side whitespace */
        html, body {
            overflow-x: hidden;
        }
    </style>
    <!-- Google Fonts: DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
</head>
<body>
<div class="app">

    <!-- header: "Event" + subtitle (dynamic) + badge (only pulse dot, no "PDF Files" text) -->
    <header class="header">
        <div class="header-left">
            <span class="logo-icon">📖</span>
            <div class="title-group">
                <h1>Event</h1>
                <div class="sub" id="eventSubtitle">Friends · Season 1 · Episode 24</div>
            </div>
        </div>
        <div class="badge">
            <span class="pulse-dot"></span>
            <!-- no text – only the pulsing dot -->
        </div>
    </header>

    <!-- main: full-width card with 4‑column grid -->
    <main class="main-card">
        <div class="grid" id="fileGrid">
            <!-- items will be inserted by JavaScript -->
        </div>
    </main>

    <!-- footer: clean, no "Powered by ..." -->
    <footer class="footer">
        <span>—</span>
    </footer>
</div>

<script>
    (function() {
        // ----- CONFIGURATION (extracted from screenshot scenario) -----
        // path after /ai/ (visible in screenshot)
        const PATH_FROM_SCREENSHOT = 'engoo/20260813-friends-s1e24/';   // example from prompt
        // if no path, set to '' (but we have one)

        // list of PDF files exactly as in screenshot (names only)
        const FILE_NAMES = [
            'friends-english-lesson.pdf',
            'friends-vocabulary-guide.pdf',
            'friends-grammar-worksheet.pdf',
            'friends-discussion-questions.pdf',
            'friends-idioms-handout.pdf',
            'friends-listening-script.pdf',
            'friends-teacher-notes.pdf',
            'friends-homework-tasks.pdf',
            // add a few more to show 4‑column layout
            'friends-extra-reading.pdf',
            'friends-quiz-answers.pdf',
            'friends-project-slides.pdf',
            'friends-group-activities.pdf',
            'friends-speaking-cards.pdf',
            'friends-video-transcript.pdf',
            'friends-assessment-guide.pdf',
            'friends-unit-review.pdf'
        ];

        // optional: theme/subtitle (extracted from screenshot if visible)
        // here we set it to something meaningful based on the example
        const SUBTITLE_TEXT = 'Friends · Season 1 · Episode 24 · 2026-08-13';

        // ----- build grid -----
        const grid = document.getElementById('fileGrid');
        const subtitleEl = document.getElementById('eventSubtitle');

        // set subtitle (if present)
        if (subtitleEl) {
            subtitleEl.textContent = SUBTITLE_TEXT;
        }

        // emoji cycle (for variety)
        const emojis = ['📕', '📘', '📗', '📙', '📄', '📓', '📒', '📔', '📚', '📖'];

        // clear grid
        grid.innerHTML = '';

        // base URL
        const BASE_URL = 'https://item1000-collab.github.io/ai/';
        // build full path prefix
        let pathPrefix = '';
        if (PATH_FROM_SCREENSHOT) {
            // ensure trailing slash
            const p = PATH_FROM_SCREENSHOT.trim();
            pathPrefix = p.endsWith('/') ? p : p + '/';
        }

        // generate items
        FILE_NAMES.forEach((fileName, index) => {
            // choose emoji (cycle)
            const emoji = emojis[index % emojis.length];

            // build href
            let href = BASE_URL;
            if (pathPrefix) {
                href += pathPrefix;
            }
            href += fileName;

            const item = document.createElement('a');
            item.href = href;
            item.target = '_blank';
            item.className = 'item';

            // emoji span
            const emojiSpan = document.createElement('span');
            emojiSpan.className = 'emoji';
            emojiSpan.textContent = emoji;

            // name span
            const nameSpan = document.createElement('span');
            nameSpan.className = 'name';
            nameSpan.textContent = fileName;

            // arrow span
            const arrowSpan = document.createElement('span');
            arrowSpan.className = 'arrow';
            arrowSpan.textContent = '→';

            item.appendChild(emojiSpan);
            item.appendChild(nameSpan);
            item.appendChild(arrowSpan);

            grid.appendChild(item);
        });

        // if no files (fallback) – but we have plenty
        if (FILE_NAMES.length === 0) {
            const emptyMsg = document.createElement('p');
            emptyMsg.style.gridColumn = '1 / -1';
            emptyMsg.style.padding = '2rem';
            emptyMsg.style.color = '#6b7280';
            emptyMsg.style.textAlign = 'center';
            emptyMsg.textContent = 'No PDF files found.';
            grid.appendChild(emptyMsg);
        }

        // optional: set badge text to nothing (already only dot)
        // but we keep the badge as is.
    })();
</script>

<!-- ensure that no "PDF Files" label appears – the badge only has the dot -->
<!-- footer is clean: only a dash -->
</body>
</html>
