<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f3ef;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: #1a1a1a;
            padding: 2rem 0;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .card {
            background: white;
            border-radius: 28px;
            padding: 2rem;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e7e3dc;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: #1f2b2c;
            margin-bottom: 1.5rem;
        }

        .selector-group {
            margin-bottom: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #7b6e5d;
            margin-bottom: 0.5rem;
        }

        /* ===== КАСТОМНЫЙ СЕЛЕКТ ===== */
        .custom-select {
            position: relative;
            width: 100%;
            user-select: none;
        }

        .custom-select-trigger {
            width: 100%;
            padding: 0.8rem 2.8rem 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid #ddd8cf;
            background: #fefcf9;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            min-height: 52px;
            word-break: break-word;
        }

        .custom-select-trigger:hover {
            border-color: #b7aa98;
        }

        .custom-select-trigger .arrow {
            flex-shrink: 0;
            transition: transform 0.2s ease;
            color: #7b6e5d;
            font-size: 0.7rem;
        }

        .custom-select.open .custom-select-trigger .arrow {
            transform: rotate(180deg);
        }

        .custom-select-trigger .selected-text {
            flex: 1;
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
        }

        .custom-select-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: white;
            border-radius: 16px;
            border: 1px solid #ddd8cf;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            max-height: 280px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            padding: 0.4rem;
        }

        .custom-select.open .custom-select-dropdown {
            display: block;
        }

        .custom-select-option {
            padding: 0.7rem 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: background 0.15s ease;
            word-break: break-word;
            white-space: normal;
            line-height: 1.4;
            color: #1a1a1a;
        }

        .custom-select-option:hover {
            background: #f0ede8;
        }

        .custom-select-option.selected {
            background: #e8e0d6;
            font-weight: 500;
        }

        .custom-select-option:not(:last-child) {
            border-bottom: 1px solid #f0ede8;
        }

        .custom-select-dropdown::-webkit-scrollbar {
            width: 6px;
        }
        .custom-select-dropdown::-webkit-scrollbar-track {
            background: #f5f3ef;
            border-radius: 8px;
        }
        .custom-select-dropdown::-webkit-scrollbar-thumb {
            background: #ddd8cf;
            border-radius: 8px;
        }
        .custom-select-dropdown::-webkit-scrollbar-thumb:hover {
            background: #b7aa98;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 16px;
            border: 1px solid #ddd8cf;
            background: #fefcf9;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        input[type="text"]:hover {
            border-color: #b7aa98;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #b7aa98;
            background: #fff;
        }

        textarea {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            border: 1px solid #ddd8cf;
            background: #fefcf9;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        textarea:hover {
            border-color: #b7aa98;
        }

        textarea:focus {
            outline: none;
            border-color: #b7aa98;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(183, 170, 152, 0.15);
        }

        .inline-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .inline-group .input-group {
            flex: 1 1 200px;
            margin-bottom: 1.2rem;
        }

        .prompt-display {
            background: #1e2829;
            color: #e5e9e8;
            padding: 1.2rem;
            border-radius: 16px;
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.8rem;
            white-space: pre-wrap;
            word-break: break-word;
            margin: 1rem 0;
            border: 1px solid #3b4b4a;
            min-height: 100px;
            max-height: 400px;
            overflow-y: auto;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1rem 0;
        }

        .btn {
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            border: none;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        .btn-secondary {
            background: #f0ede8;
            color: #2b4a4d;
            border: 1px solid #ddd2c4;
        }

        .btn-secondary:hover {
            background: #e2d9cf;
        }

        .status {
            font-size: 0.8rem;
            color: #6f6a60;
            margin-top: 0.5rem;
        }

        .hint {
            font-size: 0.75rem;
            color: #8f887d;
            margin-top: 0.4rem;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {
            .custom-select-trigger {
                font-size: 0.85rem;
                padding: 0.7rem 2.5rem 0.7rem 0.9rem;
            }
            .custom-select-option {
                font-size: 0.85rem;
                padding: 0.6rem 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>⚙️ Prompt Engine</h1>

            <div class="selector-group">
                <label>⭐ Favorite Prompts</label>
                <div class="custom-select" id="customSelect">
                    <div class="custom-select-trigger" id="selectTrigger">
                        <span class="selected-text">— Choose a preset —</span>
                        <span class="arrow">▼</span>
                    </div>
                    <div class="custom-select-dropdown" id="selectDropdown"></div>
                </div>
            </div>

            <div id="teacherCountryGroup" class="hidden">
                <div class="inline-group">
                    <div class="input-group">
                        <label>👩‍🏫 Teacher</label>
                        <input type="text" id="teacherInput" placeholder="e.g. Rosie" />
                    </div>
                    <div class="input-group">
                        <label>🌍 Country</label>
                        <input type="text" id="countryInput" placeholder="e.g. Venezuela" />
                    </div>
                </div>
            </div>

            <div id="customTextGroup" class="hidden">
                <div class="input-group">
                    <label>📝 Optional: Add your custom text</label>
                    <textarea id="customText" placeholder="Paste your text here (optional). It will be prepended to the prompt."></textarea>
                    <div class="hint">If filled, this text will appear at the beginning of the prompt, followed by a blank line and the selected prompt.</div>
                </div>
            </div>

            <div class="button-group">
                <button id="copyBtn" class="btn btn-secondary">📋 Copy Prompt</button>
            </div>

            <div class="prompt-display" id="promptDisplay">
                Select a preset to load a prompt template.
            </div>

            <div class="status" id="statusMessage">💡 Choose a preset from the dropdown above</div>
        </div>
    </div>

    <script>
        // ===== ПОЛНЫЕ ТЕКСТЫ ПРОМПТОВ =====
        const prompts = {
            standard: {
                name: '📋 English-Russian Table (source optional: txt file)',
                prompt: `DeepSeek: Translate the following text from English to Russian. Provide a clear, accurate translation with a focus on natural language flow.

REQUIREMENTS:
1. Provide a complete translation of the entire source text.
2. Highlight in bold in the main text any advanced vocabulary.
3. Include a short glossary of key terms.
4. The ENTIRE translation output must be formatted as a two‑column table:
   | English (original) | Russian (translation) |
   Every sentence, phrase, or segment from the source must appear in the left column, with its corresponding Russian version in the right column.

OUTPUT: Return only the table. No extra commentary, no introductory or concluding text.`,
                showCustomText: true,
                showTeacherCountry: false
            },
            plaintext: {
                name: '📄 English-Russian Plain Text (source optional: txt file)',
                prompt: `Translate the following text from English to Russian. Provide a clear, accurate translation with a focus on natural language flow.

REQUIREMENTS:
1. Provide a complete translation of the entire source text.
2. Format the translation as plain text, with each English phrase or sentence on one line and its Russian translation directly below it on the next line.
3. Leave a blank line between each pair (English / translation) for readability.
4. Do NOT use tables, bullet points, numbers, or any additional markers like "English:" or "Russian:".
5. Just the text itself: one line in English, the next line — translation into Russian.
6. In the Russian translation, highlight in bold any advanced or complex vocabulary (e.g., idioms, bookish words, terms).
7. At the end of the translation, add a glossary of key terms — but format the glossary with English words/phrases and their Russian explanations (not with Russian terms).
8. Separate the glossary from the main text with a blank line and the heading "Glossary of key terms:".

OUTPUT: Return only the plain text translation with the glossary. No extra commentary, no introductory or concluding text.`,
                showCustomText: true,
                showTeacherCountry: false
            },
            methodist: {
                name: '📝 Article for Zen (sources: txt and pdf files)',
                prompt: `Напиши интересную статью для Дзен на основе вложенных файлов pdf-презентации и транскрипции мероприятия.

ТРЕБОВАНИЯ К СТАТЬЕ:

Статья должна быть на русском языке.

Использование исходного материала:
В тексте статьи используй номера слайдов [SLIDE X] из презентации, которые надо вставить в определенные места статьи согласно ее содержанию. Номера слайдов во всем тексте не должны повторяться. Если на слайдах содержится англоязычный текст - повтори его в тексте сразу после слайда и напиши пояснения на русском языке. Если это приемлемо - сделай пояснения интересными. Если на слайдах русский текст - тогда указанное для английского текста не применяй. Если использовался AI - приведи полностью текст AI на английском и дай перевод и пояснения на русском.

Требования для работы с англоязычным исходным материалом:
— Опираться на слайды с вокабуляром. Если идиома или ключевое слово есть в слайде, обязательно указать это.
— Представить лексику в текстовом формате (НЕ ТАБЛИЦЫ).
Для каждой единицы лексики:
— Сама фраза/слово на английском.
— Буквальное значение (если применимо).
— Переносное значение / значение в контексте.
— Пример из материала (цитата + перевод).
— Как эта лексика объясняется в методичке (цитата из слайда + перевод).

Метафоры, символы и ключевые идеи
— Опираться на слайды, где анализируются глубинные смыслы. Цитировать их.
— 3-4 ключевых элемента из материала (символы, метафоры, основные тезисы).
— Объяснение их значения на русском.
— Цитата из слайда с трактовкой.

Структура статьи:

Заголовок
Должен быть кликабельным и информативным — содержать название темы и ключевую познавательную цель. В заголовке обязательно указать источник материала (например, The Guardian, BBC, или название мероприятия).

Структура
Вступление (1-2 абзаца):
— Интересный факт или наблюдение, связанное с темой материала.
— ВСЕ ПРЕДЛОЖЕНИЯ — ТОЛЬКО УТВЕРДИТЕЛЬНЫЕ. ЗАПРЕЩЕНЫ ЛЮБЫЕ ВОПРОСЫ (в том числе риторические, уточняющие, вводные).
— Излагай как рассказчик, а не как собеседник.
— Краткое представление материала и его познавательная ценность (опираясь на вводные слайды).

Основная часть:
Раздел 1: Содержание и контекст
— Краткое изложение сути материала (2-3 абзаца)
— Ключевые моменты, важные для изучения языка.
— По каждому слайду приведи цитату идеи из слайда.
— Живой пример из урока (диалог учителя, ученика или AI), который ИЛЛЮСТРИРУЕТ эту идею из слайда.
— Практический совет для читателя, развивающий мысль из слайда.
— Комментарий учителя из транскрипции (если есть).

Заключение (1-2 абзаца):
— Вдохновляющая цитата из слайдов или материала.
— Главный вывод для изучающих язык, основанный на итоговом слайде.
— Призыв к действию (практиковаться, пересмотреть материал в оригинале, применить знания и т.д.).

ФОРМАТИРОВАНИЕ
Для Дзена:
— НЕ использовать таблицы (заменять на текст с маркированными списками или нумерованными списками).
— НЕ использовать риторические вопросы. ЛЮБЫЕ ВОПРОСЫ В ТЕКСТЕ ЗАПРЕЩЕНЫ. Вместо вопросов используй утвердительные конструкции: «Важно понимать, что...», «Стоит обратить внимание на...», «Следует отметить, что...», «Обратите внимание на...», «Интересно, что...», «Ключевой момент заключается в том...», «Стоит запомнить...».
— Использовать жирный шрифт для ключевых фраз.
— Использовать курсив для цитат на русском.
— Разделять разделы подзаголовками (##).
— Вставлять эмодзи (👩‍🏫, 💡, 📌, ⚠️) для визуального разнообразия.
— Ссылки на слайды ставить строго в квадратных скобках: [SLIDE 5].

Для цитат:
— Оригинал на английском → перевод на русском.
— Перевод выделять жирным или отдельным абзацем.
— Комментарии учителя помечать 👩‍🏫 и выделять курсивом.

СТИЛЬ ИЗЛОЖЕНИЯ
— Разговорный, но грамотный.
— Вдохновляющий и мотивирующий.
— Повествовательный стиль: ИСКЛЮЧИТЕЛЬНО утвердительные предложения. Излагай материал как рассказчик, а не как собеседник. ЗАПРЕЩЕНЫ все виды вопросов: риторические, уточняющие, вводные («знаете ли вы», «задумывались ли вы», «почему», «как», «что если» и т.д.). Вместо вопросов используй формулировки: «Важно понимать, что...», «Стоит обратить внимание на...», «Следует отметить...», «Обратите внимание...», «Интересно, что...», «Ключевой момент заключается в том...», «Стоит запомнить...».

ВАЖНОЕ НАПОМИНАНИЕ:
ОБЯЗАТЕЛЬНО проверяй, что номера слайдов в статье соответствуют номерам в PDF.
Добавляй комментарии учителя из транскрипции, чтобы связать теорию из слайдов с живой практикой (если есть).

Еще раз напоминаю - если использовался AI - приведи полностью текст AI на английском и дай перевод и пояснения на русском.`,
                showCustomText: false,
                showTeacherCountry: false
            },
            newsclips: {
                name: '📰 News Clips Event (sources - text-file, additional information pdf-file)',
                prompt: `Create a complete, self-contained HTML document about this session.

REQUIREMENTS:
1. PDF BAR: with label "Open Resource PDF →"
2. FULL-WIDTH layout: no margins/padding on body or main wrapper.
3. MAIN CONTENT: 
3.1. Short description of each article from txt-file with information about sources where these articles were taken. 
3.2. Structured English lesson description including target vocabulary, thematic blocks.
4. Two-paragraph summary at the end.
5. Highlight advanced vocabulary / idioms (minimum 5 expressions with definitions).
6. Clean HTML/CSS, responsive, Google Fonts optional.

This is a complete, self-contained HTML document for a language learning session. It structures news clips into a full-width lesson plan with vocabulary, thematic blocks, and a summary, including a link to the resource PDF.`,
                showCustomText: false,
                showTeacherCountry: false
            },
            indexofevent: {
                name: '📂 Index of Event (generate HTML page with PDF file list) — (source - screen)',
                prompt: `Create a complete, self-contained HTML document that displays a list of PDF files based on a screenshot or a provided file list.

## INPUT DATA (extract from the screenshot or file list):
- Extract all PDF files visible in the screenshot (their full names with .pdf extension). Include ONLY files with .pdf extension — ignore folders, directories, and files without .pdf extension.
- Determine the lesson theme/title (e.g., series name, season, episode, date) if shown in the screenshot. If the date is not obvious — do not include it in the subtitle, use only what is clearly visible.
- If a part of the URL after /ai/ is visible in the screenshot — extract this path for building links. Use EXACTLY the path shown in the screenshot.

## WHAT TO GENERATE:

A complete HTML document with the following features:

### 1. PAGE STRUCTURE:
- Header with logo (📖 icon), title "Resources", subtitle with lesson theme (extracted from the screenshot — e.g., series name, season, episode).
- Badge on the right with a pulsing dot indicator and label "PDF Files" (without a count).
- Main block with a card containing a grid of PDF files.
- Footer with text "Powered by AI Exploration Hub".

### 2. EACH PDF FILE CARD:
For each file, create an <a> element with class "item" containing:
- An emoji (choose appropriate: 📕, 📘, 📗, 📙, 📄 — alternate or pick by meaning).
- File name (exactly as in the screenshot, with .pdf extension — letter by letter, case sensitive).
- Right arrow → (appears on hover).
- Link built using this template:
  https://item1000-collab.github.io/ai/[PATH_FROM_SCREENSHOT]/[FILE_NAME]
  Where [PATH_FROM_SCREENSHOT] is the part of the URL visible in the screenshot after /ai/ (e.g., if the screenshot shows "engoo/20260813-friends-s1e24/", use that exact path).
- target="_blank" and rel="noopener noreferrer" attributes to open in a new tab with security.

### 3. STYLES (exact copy from the reference):
Use these CSS variables and styling:
- Background: #f8f6f3
- Cards: white with shadows, rounded corners (16px and 24px)
- Colors: accent #e07a5f, text #1a1a2e, secondary #6b7280
- Font: DM Sans (load from Google Fonts)
- File grid: 2 columns on wide screens, 1 column on narrow (≤500px)
- On hover: accent border highlight, slight lift, arrow appears
- Pulsing dot animation for the badge
- All hover effects, shadows, spacing — exactly as in the reference example

### 4. CODE REQUIREMENTS:
- Valid, semantic HTML with proper structure.
- All styles inside <style> tag in <head>.
- No external files (except Google Fonts).
- All links must be working and point to real PDF files using the specified template.
- File names in links must exactly match the names in the screenshot (case sensitive).
- Path in URL must be taken ONLY from the screenshot. If no path is specified — don't add extra folders, use base URL: https://item1000-collab.github.io/ai/[FILE_NAME]
- NO file counter (no "count" class or number next to "PDF Files").
- DO NOT display the number of files anywhere on the page.
- Include ONLY files with .pdf extension. Do NOT include folders, directories, or files without .pdf extension.

### 5. EXAMPLE OF BUILDING A LINK:
If the screenshot shows the path "engoo/20260813-friends-s1e24/" and the file name is "friends-english-lesson.pdf", the link should be:
https://item1000-collab.github.io/ai/engoo/20260813-friends-s1e24/friends-english-lesson.pdf

If the screenshot shows no path, only the file name "friends-english-lesson.pdf", the link is:
https://item1000-collab.github.io/ai/friends-english-lesson.pdf

### 6. EXAMPLE OF ONE ELEMENT (for format reference):
<a href="https://item1000-collab.github.io/ai/engoo/20260813-friends-s1e24/friends-english-lesson.pdf" target="_blank" rel="noopener noreferrer" class="item">
    <span class="emoji">📕</span>
    <span class="name">friends-english-lesson.pdf</span>
    <span class="arrow">→</span>
</a>

### 7. FINAL OUTPUT:
Output a complete HTML code that can be saved as a .html file and opened in a browser — it should work without any modifications.

## IMPORTANT:
- Date in subtitle is included ONLY if clearly visible in the screenshot. If there's no date — don't invent it.
- Path in URL is taken ONLY from the screenshot (the part after /ai/).
- NO file counter anywhere on the page.
- Include ONLY .pdf files. Ignore folders and files without .pdf extension.
- File names must be EXACT matches (case sensitive) — copy letter by letter from the screenshot.
- All links must have both target="_blank" and rel="noopener noreferrer".
- No comments or explanations in the final code, only clean HTML.
- Preserve all visual details: spacing, font sizes, rounding, shadows, colors.

Generate the HTML based on the attached screenshot.`,
                showCustomText: false,
                showTeacherCountry: false
            },
            englishlesson: {
                name: '🇬🇧 English lesson (sources: text-file and screen)',
                prompt: `Create a complete, self-contained HTML document for an English lesson.
Teacher: [TEACHER]
Country: [COUNTRY]

IMPORTANT:
- DO NOT create any black/dark header panel at the top of the page.
- The page should start directly with the content sections described below.
- The dialogue with AI must be presented in FULL (complete text), not shortened or summarized.
- The dialogue with AI must be in a SEPARATE section from the main dialogues.
- If there was NO AI dialogue in the source materials — DO NOT invent or generate one. Only include the AI dialogue if it actually exists in the provided text-file. If it doesn't exist, simply skip this section entirely.

                statusMessage.style.color = '#2c4b4e';
                copyBtn.textContent = '✅ Copied!';
                setTimeout(() => { copyBtn.textContent = '📋 Copy Prompt'; }, 2000);
            } catch (err) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                statusMessage.textContent = '✅ Copied to clipboard!';
                statusMessage.style.color = '#2c4b4e';
            }
        }

        copyBtn.addEventListener('click', copyPrompt);
        customText.addEventListener('input', loadPrompt);
        teacherInput.addEventListener('input', loadPrompt);
        countryInput.addEventListener('input', loadPrompt);

        selectOption('');
    </script>
</body>
</html>
