<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prompt Engine</title>
<style>
:root {
  --bg: #f5f3ef;
  --card-bg: #ffffff;
  --card-border: #e7e3dc;
  --text: #1a1a1a;
  --heading: #1f2b2c;
  --label: #7b6e5d;
  --hint: #8f887d;
  --input-bg: #fefcf9;
  --input-border: #ddd8cf;
  --input-border-hover: #b7aa98;
  --accent: #b7aa98;
  --accent-dark: #9e8f7c;
  --btn-bg: #f0ede8;
  --btn-bg-hover: #e2d9cf;
  --btn-text: #2b4a4d;
  --btn-border: #ddd2c4;
  --display-bg: #1e2829;
  --display-text: #e5e9e8;
  --display-border: #3b4b4a;
  --status-info: #6f6a60;
  --status-success: #2c4b4e;
  --status-error: #a05252;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); font-family: 'Inter', system-ui, -apple-system, sans-serif; color: var(--text); padding: 2rem 0; }
.container { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }
.card { background: var(--card-bg); border-radius: 28px; padding: 2rem; box-shadow: 0 8px 20px rgba(0,0,0,0.05); border: 1px solid var(--card-border); }
h1 { font-size: 1.8rem; font-weight: 600; color: var(--heading); margin-bottom: 1.5rem; }
.selector-group { margin-bottom: 1.5rem; }
.input-group { margin-bottom: 1.2rem; }
label { display: block; font-weight: 600; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--label); margin-bottom: 0.5rem; }
.custom-select { position: relative; width: 100%; user-select: none; }
.custom-select-trigger { width: 100%; padding: 0.8rem 2.8rem 0.8rem 1rem; border-radius: 16px; border: 1px solid var(--input-border); background: var(--input-bg); font-size: 0.9rem; font-family: inherit; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; min-height: 52px; word-break: break-word; }
.custom-select-trigger:hover { border-color: var(--input-border-hover); }
.custom-select-trigger .arrow { flex-shrink: 0; transition: transform 0.2s ease; color: var(--label); font-size: 0.7rem; }
.custom-select.open .custom-select-trigger .arrow { transform: rotate(180deg); }
.custom-select-trigger .selected-text { flex: 1; word-break: break-word; white-space: normal; line-height: 1.4; }
.custom-select-dropdown { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: white; border-radius: 16px; border: 1px solid var(--input-border); box-shadow: 0 8px 24px rgba(0,0,0,0.12); max-height: 400px; overflow-y: auto; z-index: 1000; display: none; padding: 0.4rem; }
.custom-select.open .custom-select-dropdown { display: block; }
.custom-select-option { padding: 0.7rem 0.9rem; border-radius: 12px; cursor: pointer; font-size: 0.9rem; font-family: inherit; transition: background 0.15s ease; word-break: break-word; white-space: normal; line-height: 1.4; color: var(--text); }
.custom-select-option:hover { background: #f0ede8; }
.custom-select-option.selected { background: #e8e0d6; font-weight: 500; }
.custom-select-option:not(:last-child) { border-bottom: 1px solid #f0ede8; }
input[type="text"] { width: 100%; padding: 0.8rem 1rem; border-radius: 16px; border: 1px solid var(--input-border); background: var(--input-bg); font-size: 0.9rem; font-family: inherit; transition: all 0.2s ease; }
input[type="text"]:hover { border-color: var(--input-border-hover); }
input[type="text"]:focus { outline: none; border-color: var(--input-border-hover); background: #fff; }
textarea { width: 100%; padding: 1rem 1.2rem; border-radius: 16px; border: 1px solid var(--input-border); background: var(--input-bg); font-size: 0.95rem; font-family: inherit; transition: all 0.2s ease; resize: vertical; min-height: 120px; line-height: 1.6; }
textarea:hover { border-color: var(--input-border-hover); }
textarea:focus { outline: none; border-color: var(--input-border-hover); background: #fff; box-shadow: 0 0 0 3px rgba(183,170,152,0.15); }
textarea.large-aesthetic {
  min-height: 200px;
  font-size: 0.95rem;
  padding: 1.2rem 1.4rem;
}
.inline-group { display: flex; gap: 1rem; flex-wrap: wrap; }
.inline-group .input-group { flex: 1 1 200px; margin-bottom: 1.2rem; }
.dynamic-group { margin-bottom: 1.2rem; }
.group-options { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
.group-options .btn { font-size: 0.75rem; padding: 0.4rem 1.2rem; }
.group-options .btn.active { background: var(--accent); color: white; border-color: var(--accent-dark); }
.prompt-display { background: var(--display-bg); color: var(--display-text); padding: 1.2rem; border-radius: 16px; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; white-space: pre-wrap; word-break: break-word; margin: 1rem 0; border: 1px solid var(--display-border); min-height: 100px; max-height: 400px; overflow-y: auto; }
.button-group { display: flex; gap: 1rem; flex-wrap: wrap; margin: 1rem 0; }
.btn { padding: 0.7rem 1.8rem; border-radius: 40px; border: none; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s ease; font-family: inherit; }
.btn-secondary { background: var(--btn-bg); color: var(--btn-text); border: 1px solid var(--btn-border); }
.btn-secondary:hover { background: var(--btn-bg-hover); }
.status { font-size: 0.8rem; margin-top: 0.5rem; }
.status--info { color: var(--status-info); }
.status--success { color: var(--status-success); }
.status--error { color: var(--status-error); }
.hint { font-size: 0.75rem; color: var(--hint); margin-top: 0.4rem; }
.hidden { display: none !important; }
@media (max-width: 600px) {
  .custom-select-trigger { font-size: 0.85rem; padding: 0.7rem 2.5rem 0.7rem 0.9rem; }
  .custom-select-option { font-size: 0.85rem; padding: 0.6rem 0.8rem; }
  .card { padding: 1.2rem; }
  textarea.large-aesthetic { min-height: 160px; }
}
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>⚙️ Prompt Engine</h1>

    <div class="selector-group">
      <label>⭐ Favorite Prompts</label>
      <div class="custom-select" id="customSelect">
        <div class="custom-select-trigger" id="selectTrigger" role="button" aria-haspopup="listbox" aria-expanded="false" tabindex="0">
          <span class="selected-text">— Choose a preset —</span>
          <span class="arrow">▼</span>
        </div>
        <div class="custom-select-dropdown" id="selectDropdown" role="listbox"></div>
      </div>
    </div>

    <div id="dynamicControls"></div>

    <div id="customTextGroup" class="hidden">
      <div class="input-group">
        <label>📝 Optional: Add your custom text</label>
        <textarea id="customText" placeholder="Paste your text here (optional). It will be prepended to the prompt."></textarea>
        <div class="hint">If filled, this text will appear at the beginning of the prompt, followed by a blank line and the selected prompt.</div>
      </div>
    </div>

    <div class="button-group">
      <button id="copyBtn" class="btn btn-secondary">📋 Copy Prompt</button>
    </div>

    <div class="prompt-display" id="promptDisplay">Select a preset to load a prompt template.</div>
    <div class="status status--info" id="statusMessage">💡 Choose a preset from the dropdown above</div>
  </div>
</div>

<script>
'use strict';

// ============================================================
// 1. PROMPT LIBRARY (data)
// ============================================================
const PROMPTS = {

  // ----------------------------------------------------------
  enrutranslator: {
    name: '📊 English-Russian Translation (source optional: txt file)',
    customText: true,
    template: `Translate the following text from English to Russian. Provide a clear, accurate translation with a focus on natural language flow.

REQUIREMENTS:

    Provide a complete translation of the entire source text.

    Highlight in bold in the main text any advanced vocabulary – this includes both the English source text and the Russian translation. Every term that appears in the glossary must be bolded in both columns of the table (English and Russian).

    Include a short glossary of key terms at the end of each episode. The glossary should include ONLY idioms, fixed expressions, phrasal verbs, and complex collocations — NOT simple standalone words (e.g., include "to give away", "to work out", "can't get the monkey off your back", but NOT "monkey", "jungle", "sad").

    The source text must be divided into episodes (logical segments: chapters, scenes, time blocks, or thematic parts) — each episode must be translated separately.

    In the output, each episode must start with a separator indicating the episode number and title (e.g., «— Episode 1: Title —» or «— Эпизод 1: Название —»).

    Do NOT mix content from different episodes.

    If the source contains clear episode markers (e.g., "Episode 1", "Part 2", "Scene 3", timestamps, or section headings), use them exactly as they appear.

    If no explicit episode markers exist, divide the text into equal logical parts (by paragraphs, scenes, or every ~200–300 words) and label them as «Episode 1», «Episode 2», etc.

CRITICAL FORMATTING RULE — BOLD IN BOTH COLUMNS:

    For EVERY term listed in the glossary for a given episode, you MUST bold that term in BOTH the English column AND the Russian column of the translation table for that episode. This applies to ALL episodes, not just the first one. Every occurrence of every glossary term in the translation table must be enclosed in **bold** markers (e.g., **to give away** in English and **отдать** in Russian). If a term appears multiple times in the table, bold it each time.`,
    variants: [{
      id: 'format',
      label: '📄 Output Format',
      hint: 'Choose how the translation should be formatted in the output.',
      default: 'table',
      options: [
        {
          id: 'table',
          label: '📊 Table',
          shortLabel: 'Table',
          suffix: `

OUTPUT FORMAT: Table

The ENTIRE translation output must be formatted as a two-column table:
| English (original) | Russian (translation) |
Every sentence, phrase, or segment from the source must appear in the left column, with its corresponding Russian version in the right column.

For each episode, add a glossary section after the translation table:
### Glossary for Episode X
| English term | Russian translation | Explanation |
|--------------|---------------------|-------------|
| ... | ... | ... |

IMPORTANT: Every term listed in the glossary must be bolded in BOTH columns of the translation table — the English column AND the Russian column. This applies to ALL episodes, not just the first one. Every occurrence of each glossary term in the table must be bolded.

OUTPUT: Return only the table and glossaries. No extra commentary, no introductory or concluding text.`
        },
        {
          id: 'gist',
          label: '📝 Gist Markdown',
          shortLabel: 'Gist Markdown',
          suffix: `

OUTPUT FORMAT: Gist Markdown

Format the translation as a structured Markdown document suitable for a GitHub Gist:

1. The entire output must be inside a single Markdown code block with \`\`\`markdown ... \`\`\` delimiters.

2. Use this structure:
    # Translation: [Title of the source text]

    ## Episode 1: [Title]
    | English (original) | Russian (translation) |
    |---------------------|------------------------|
    | ... | ... |

    ### Glossary for Episode 1
    | English term | Russian translation | Explanation |
    |--------------|---------------------|-------------|
    | ... | ... | ... |

    ## Episode 2: [Title]
    | English (original) | Russian (translation) |
    |---------------------|------------------------|
    | ... | ... |

    ### Glossary for Episode 2
    | English term | Russian translation | Explanation |
    |--------------|---------------------|-------------|
    | ... | ... | ... |

    (Continue this pattern for all episodes)

3. Each episode must be a separate Markdown section with its own table.

4. Each episode must have its own glossary table immediately following the translation table.

5. Bold the advanced vocabulary in both the English and Russian columns using **bold** markers. IMPORTANT: The bolded terms in the left (English) column and the right (Russian) column must match the terms listed in the glossary for that episode. This must be done for EVERY episode, not just the first one.

6. Do NOT include any text outside the Markdown block. No introductory or concluding remarks.

7. The output must be valid Markdown that renders correctly in a Gist.

OUTPUT: Return only the Markdown block.`
        },
        {
          id: 'plaintext',
          label: '📄 Plain Text',
          shortLabel: 'Plain Text',
          suffix: `

OUTPUT FORMAT: Plain Text

Format the translation as plain text (no tables, no Markdown).

1. Each episode must start with a separator line:
    — Episode 1: [Title] —
    (followed by a blank line)

2. For each sentence or phrase:
    - Write the English original on one line.
    - Write the Russian translation on the next line.
    - Leave a blank line between each pair.

3. Highlight advanced vocabulary in BOTH English and Russian using **bold** markers (e.g., **advanced word**). IMPORTANT: The bolded terms in the English text and the Russian text must match the terms listed in the glossary for that episode. This must be done for EVERY episode, not just the first one.

4. At the end of each episode, add a glossary for that episode:
    Glossary for Episode X:
    - English term — Russian translation — Explanation

5. Do NOT use any tables, columns, or Markdown formatting (except bold).

6. Do NOT include any introductory or concluding text — only the translation and glossaries.

OUTPUT: Return only the plain text translation with glossaries after each episode.`
        }
      ]
    }]
  },

  // ----------------------------------------------------------
  zenwriter: {
    name: '📝 Article for Zen (full slide-by-slide)',
    variants: [{
      id: 'mode',
      label: '🌐 Language Mode',
      hint: 'Ru-En: for English slides with translation. Ru: for Russian-only slides (no English content).',
      default: 'ru-en',
      options: [
        {
          id: 'ru-en',
          label: '🇷🇺🇬🇧 Ru-En (default)',
          shortLabel: '🇷🇺🇬🇧 Ru-En',
          template: `Напиши статью для Дзен на основе вложенных файлов (PDF-презентация и транскрипция мероприятия).

**ЯЗЫК СТАТЬИ:** русский.

**ГЛАВНОЕ ТРЕБОВАНИЕ:** последовательно разбери ВСЕ слайды презентации по порядку их следования. Каждый слайд должен найти отражение в статье. На основе этого полного разбора построй увлекательное, связное повествование, которое читается как живой рассказ, а не как техническая инструкция.

---

**1. РАБОТА СО СЛАЙДАМИ (обязательные правила):**
- В тексте статьи используй номера слайдов строго в квадратных скобках: [SLIDE X].
- Номера слайдов идут последовательно: [SLIDE 1], [SLIDE 2], [SLIDE 3] ... и так до последнего слайда.
- Если на слайде англоязычный текст — продублируй его на английском, затем дай русский перевод и пояснение.
- Если на слайде русский текст — процитируй его и поясни в контексте материала.
- Если в материале использовался AI — приведи полный текст AI на английском, затем дай перевод и пояснение на русском.
- Не пропускай слайды. Даже если слайд кажется техническим или незначительным — найди способ вписать его в повествование, показав его роль в общей логике материала.

**2. ЛЕКСИКА (если на слайдах есть вокабуляр):**
Разбери всю значимую лексику, которая встречается на слайдах. Для каждой единицы укажи:
— Саму фразу/слово на английском.
— Буквальное значение (если применимо).
— Значение в контексте.
— Пример из материала (цитата + перевод).
— Как эта лексика объясняется в методичке (цитата из слайда + перевод).
Лексику оформляй маркированным списком (НЕ ТАБЛИЦА). Вплетай разбор лексики в основной текст, а не выноси в отдельный скучный словарь.

**3. МЕТАФОРЫ, СИМВОЛЫ, КЛЮЧЕВЫЕ ИДЕИ:**
Выдели все значимые метафоры, символы и ключевые тезисы из материала. Дай объяснение их значения на русском. Обязательно приведи цитату из слайда с трактовкой. Покажи, как эти глубинные смыслы связаны с языком и культурой.

---

**4. СТРУКТУРА СТАТЬИ (строго соблюдай):**

**ЗАГОЛОВОК:**
Кликабельный, информативный. Обязательно содержит тему и источник (название мероприятия, издание или автора). Пример: «Как носители говорят на самом деле: полный разбор живого урока с BBC».

**ВСТУПЛЕНИЕ (1–2 абзаца):**
— Начни с яркого факта, наблюдения или интригующей детали, которая цепляет внимание.
— Кратко представь материал, его формат и познавательную ценность для изучающих язык.
— ВСЕ ПРЕДЛОЖЕНИЯ — ТОЛЬКО УТВЕРДИТЕЛЬНЫЕ. Запрещены любые вопросы.
— Излагай как рассказчик, а не как собеседник.

**ОСНОВНАЯ ЧАСТЬ (разбита на подзаголовки ##):**
— Двигайся последовательно по слайдам. Каждый слайд — это новый логический шаг в повествовании.
— Для каждого слайда:
  * Приведи цитату идеи из слайда (текст с самого слайда).
  * Объясни, что означает эта идея и как она вписывается в общий замысел материала.
  * Если на слайде есть лексика — разбери её здесь же, в контексте.
  * Если на слайде есть метафора или символ — поясни его глубинный смысл.
  * Приведи живой пример из урока (диалог учителя, ученика или AI), который иллюстрирует эту идею.
  * Дай практический совет для читателя, развивающий мысль из слайда.
- Следи за логическими переходами между слайдами. Статья не должна выглядеть как простой список. Выстраивай нарратив: от вводных слайдов — к ключевым идеям — к практическим выводам — к итоговому обобщению.

**ЗАКЛЮЧЕНИЕ (2–3 абзаца):**
— Приведи резюмирующий комментарий, который собирает воедино все ключевые идеи, прозвучавшие на слайдах.
— Сформулируй главный вывод, опираясь на финальный слайд и общую логику всего материала. Вывод должен быть практическим и вдохновляющим — читатель должен понять, что именно он выносит из этого разбора.
— Обязательно используй в заключении хотя бы одну цитату из последних слайдов или итогового комментария учителя.
— Закончи яркой, запоминающейся фразой, которая останется у читателя в голове.

---

**5. СТИЛЬ И ФОРМАТИРОВАНИЕ (для Дзена):**

**СТИЛЬ ИЗЛОЖЕНИЯ:**
— Тон — увлечённый исследователь, который делится захватывающим открытием. Спокойный, уверенный, вдохновляющий.
— Разговорный, но грамотный. Избегай канцеляризмов и сухости.
— ИСКЛЮЧИТЕЛЬНО повествовательный стиль. ВСЕ ПРЕДЛОЖЕНИЯ — УТВЕРДИТЕЛЬНЫЕ.
— ЗАПРЕЩЕНЫ ЛЮБЫЕ ВИДЫ ВОПРОСОВ. Вместо них используй обороты: «Важно понимать, что...», «Стоит обратить внимание на...», «Следует отметить...», «Обратите внимание...», «Интересно, что...», «Ключевой момент заключается в том...», «Стоит запомнить...», «Обращает на себя внимание...», «Показательно, что...».

**ПРИМЕР ПРАВИЛЬНОЙ ИНТОНАЦИИ (ориентируйся на это):**
*«Интересно, что британские журналисты намеренно используют короткие глаголы в прямых эфирах. Ключевой момент заключается в том, что это экономит время и создаёт эффект доверительного разговора. Стоит запомнить этот приём для повседневной речи»*.

**ФОРМАТИРОВАНИЕ:**
— НЕ использовать таблицы (только маркированные или нумерованные списки).
— Ключевые фразы, термины и выводы выделять **жирным шрифтом**.
— Цитаты на русском языке выделять *курсивом*.
— Разделы оформлять подзаголовками с ##.
— Использовать эмодзи для визуального разнообразия: 📚, 💡, 📌, ⚠️, 🎓, 🔥, 🗝️.
— Ссылки на слайды ставить строго в квадратных скобках [SLIDE X] сразу после упоминания идеи со слайда.
— Оригинал на английском → перевод на русском выделять **жирным** или отдельным абзацем.

---

**6. ЕСЛИ В ИСХОДНЫХ ФАЙЛАХ НЕ ХВАТАЕТ ДАННЫХ:**
Если для какого-то слайда нет пояснений в транскрипции или перевода — дай собственную интерпретацию, основываясь на контексте всего материала. Если слайд технический (например, просто заголовок раздела) — покажи его роль в структуре урока и перейди к следующему.

---

**ГЛАВНАЯ ЦЕЛЬ СТАТЬИ:**
Читатель должен пройти вместе с автором весь путь от первого до последнего слайда, увидеть, как выстраивается логика материала, обогатиться новой лексикой и идеями, вдохновиться и захотеть пересмотреть исходный материал в оригинале. Статья должна читаться как увлекательный репортаж с разбора, а не как сухой конспект.`
        },
        {
          id: 'ru',
          label: '🇷🇺 Ru only',
          shortLabel: '🇷🇺 Ru only',
          template: `Напиши статью для Дзен на основе вложенных файлов (PDF-презентация и транскрипция мероприятия).

**ЯЗЫК СТАТЬИ:** русский.

**ГЛАВНОЕ ТРЕБОВАНИЕ:** последовательно разбери ВСЕ слайды презентации по порядку их следования. Каждый слайд должен найти отражение в статье. На основе этого полного разбора построй увлекательное, связное повествование, которое читается как живой рассказ, а не как техническая инструкция.

---

**1. РАБОТА СО СЛАЙДАМИ (обязательные правила):**
- В тексте статьи используй номера слайдов строго в квадратных скобках: [SLIDE X].
- Номера слайдов идут последовательно: [SLIDE 1], [SLIDE 2], [SLIDE 3] ... и так до последнего слайда.
- Если на слайде русский текст — процитируй его и поясни в контексте материала.
- Если использовался AI — приведи полностью текст AI на русском.
- Не пропускай слайды. Даже если слайд кажется техническим или незначительным — найди способ вписать его в повествование, показав его роль в общей логике материала.

**2. КЛЮЧЕВЫЕ ТЕРМИНЫ И ПОНЯТИЯ:**
Разбери все значимые термины и понятия, которые встречаются на слайдах. Для каждой единицы укажи:
— Сам термин/понятие на русском.
— Определение или пояснение.
— Пример из материала (цитата из слайда или транскрипции).
— Как этот термин объясняется в исходных материалах (цитата из слайда).

**3. МЕТАФОРЫ, СИМВОЛЫ, КЛЮЧЕВЫЕ ИДЕИ:**
Выдели все значимые метафоры, символы и ключевые тезисы из материала. Дай объяснение их значения на русском. Обязательно приведи цитату из слайда с трактовкой.

---

**4. СТРУКТУРА СТАТЬИ (строго соблюдай):**

**ЗАГОЛОВОК:**
Кликабельный, информативный. Обязательно содержит тему и источник (название мероприятия, доклада или тема презентации).

**ВСТУПЛЕНИЕ (1–2 абзаца):**
— Начни с яркого факта, наблюдения или интригующей детали, которая цепляет внимание.
— Кратко представь материал, его формат и познавательную ценность.
— ВСЕ ПРЕДЛОЖЕНИЯ — ТОЛЬКО УТВЕРДИТЕЛЬНЫЕ. Запрещены любые вопросы.
— Излагай как рассказчик, а не как собеседник.

**ОСНОВНАЯ ЧАСТЬ (разбита на подзаголовки ##):**
— Двигайся последовательно по слайдам. Каждый слайд — это новый логический шаг в повествовании.
— Для каждого слайда:
  * Приведи цитату идеи из слайда (текст с самого слайда).

  * Если на слайде есть ключевые термины — разбери их здесь же, в контексте.
  * Если на слайде есть метафора или символ — поясни его глубинный смысл.
  * Приведи живой пример из материала (кейс, ситуация, фрагмент выступления, диалог или работа AI), который иллюстрирует эту идею.
  * Дай практический совет для читателя, развивающий мысль из слайда.
- Следи за логическими переходами между слайдами. Статья не должна выглядеть как простой список. Выстраивай нарратив: от вводных слайдов — к ключевым идеям — к практическим выводам — к итоговому обобщению.

**ЗАКЛЮЧЕНИЕ (2–3 абзаца):**
— Приведи резюмирующий комментарий, который собирает воедино все ключевые идеи, прозвучавшие на слайдах.

---

**5. СТИЛЬ И ФОРМАТИРОВАНИЕ (для Дзена):**

**СТИЛЬ ИЗЛОЖЕНИЯ:**
— Тон — увлечённый исследователь, который делится захватывающим открытием. Спокойный, уверенный, вдохновляющий.
— Разговорный, но грамотный. Избегай канцеляризмов и сухости.
— ИСКЛЮЧИТЕЛЬНО повествовательный стиль. ВСЕ ПРЕДЛОЖЕНИЯ — УТВЕРДИТЕЛЬНЫЕ.

**ФОРМАТИРОВАНИЕ:**

// ============================================================
// 2. STATE
// ============================================================
const STORAGE_KEY = 'promptEngineState';
const state = {
  presetId: '',   // selected preset
  variants: {},   // groupId -> optionId
  inputs: {},     // inputId -> value
  customText: ''
};

// ============================================================
// 3. DOM
// ============================================================
const $ = id => document.getElementById(id);
const customSelect    = $('customSelect');
const selectTrigger   = $('selectTrigger');
const selectDropdown  = $('selectDropdown');
const selectedText    = selectTrigger.querySelector('.selected-text');
const dynamicControls = $('dynamicControls');
const customTextGroup = $('customTextGroup');
const customTextInput = $('customText');
const copyBtn         = $('copyBtn');
const promptDisplay   = $('promptDisplay');
const statusMessage   = $('statusMessage');

// ============================================================
// 4. HELPERS
// ============================================================
function getPreset() { return PROMPTS[state.presetId] || null; }

function getVariantOption(group) {
  const id = state.variants[group.id] || group.default;
  return group.options.find(o => o.id === id) || group.options[0];
}

function setStatus(msg, type = 'info') {
  statusMessage.textContent = msg;
  statusMessage.className = 'status status--' + type;
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (s && typeof s === 'object') Object.assign(state, s);
  } catch (e) {}
  if (!state.variants || typeof state.variants !== 'object') state.variants = {};
  if (!state.inputs  || typeof state.inputs  !== 'object') state.inputs  = {};
  if (typeof state.customText !== 'string') state.customText = '';
  if (!PROMPTS[state.presetId]) state.presetId = '';

  // Migration: reset stale variant ids that no longer exist in the library
  Object.keys(PROMPTS).forEach(key => {
    const p = PROMPTS[key];
    (p.variants || []).forEach(g => {
      const saved = state.variants[g.id];
      if (saved && !g.options.some(o => o.id === saved)) {
        delete state.variants[g.id];
      }
    });
  });
}

// ============================================================
// 5. BUILD PROMPT
// ============================================================
function buildPrompt() {
  const p = getPreset();
  if (!p) return null;

  let text = p.template || '';

  // Variants: template replaces base, suffix appends to it
  (p.variants || []).forEach(g => {
    const opt = getVariantOption(g);
    if (opt.template != null)      text = opt.template;
    else if (opt.suffix != null)   text = text + opt.suffix;
  });

  // Field substitution — with optional support and custom templates
  (p.inputs || []).forEach(f => {
    const val = (state.inputs[f.id] || '').trim();

    // If the field has a template function — use it to generate the value
    if (f.template && typeof f.template === 'function') {
      const replacement = f.template(val);
      text = text.split(f.token).join(replacement);
    } else {
      // Default behavior: fallback if the field is required
      const fallback = f.optional ? '' : (f.fallback || '');
      text = text.split(f.token).join(val || fallback);
    }
  });

  // Custom text — prepend
  const custom = state.customText.trim();
  if (custom && p.customText) text = custom + '\n\n' + text;

  return text;
}

// ============================================================
// 6. RENDER
// ============================================================
function renderDropdownOptions() {
  selectDropdown.innerHTML = '';
  const add = (value, labelText) => {
    const el = document.createElement('div');
    el.className = 'custom-select-option';
    el.dataset.value = value;
    el.setAttribute('role', 'option');
    el.textContent = labelText;
    selectDropdown.appendChild(el);
  };
  add('', '— Choose a preset —');
  Object.keys(PROMPTS).forEach(key => add(key, PROMPTS[key].name));
}

function renderDropdownSelection() {
  let label = '— Choose a preset —';
  selectDropdown.querySelectorAll('.custom-select-option').forEach(opt => {
    const active = opt.dataset.value === state.presetId;
    opt.classList.toggle('selected', active);
    opt.setAttribute('aria-selected', active);
    if (active) label = opt.textContent;
  });
  selectedText.textContent = label;
}

function renderControls() {
  const p = getPreset();
  dynamicControls.innerHTML = '';
  if (!p) return;

  // Variant groups (buttons)
  (p.variants || []).forEach(g => {
    const wrap = document.createElement('div');
    wrap.className = 'dynamic-group';
    const label = document.createElement('label');
    label.textContent = g.label;
    wrap.appendChild(label);

    const row = document.createElement('div');
    row.className = 'group-options';
    const activeId = state.variants[g.id] || g.default;
    g.options.forEach(o => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn btn-secondary' + (o.id === activeId ? ' active' : '');
      b.dataset.group = g.id;
      b.dataset.option = o.id;
      b.textContent = o.label;
      row.appendChild(b);
    });
    wrap.appendChild(row);

    if (g.hint) {
      const h = document.createElement('div');
      h.className = 'hint';
      h.textContent = g.hint;
      wrap.appendChild(h);
    }
    dynamicControls.appendChild(wrap);
  });

  // Text fields (inline fields are grouped into one row)
  let inlineWrap = null;
  (p.inputs || []).forEach(f => {
    if (f.inline && !inlineWrap) {
      inlineWrap = document.createElement('div');
      inlineWrap.className = 'inline-group';
      dynamicControls.appendChild(inlineWrap);
    }
    if (!f.inline) inlineWrap = null;
    const target = f.inline ? inlineWrap : dynamicControls;

    const g = document.createElement('div');
    g.className = 'input-group';
    const label = document.createElement('label');
    label.textContent = f.label;

    let inp;
    if (f.type === 'textarea') {
      inp = document.createElement('textarea');
      if (f.className) inp.className = f.className;
      inp.placeholder = f.placeholder || '';
      inp.value = state.inputs[f.id] || '';
    } else {
      inp = document.createElement('input');
      inp.type = 'text';
      inp.placeholder = f.placeholder || '';
      inp.value = state.inputs[f.id] || '';
    }
    inp.dataset.input = f.id;
    g.appendChild(label);
    g.appendChild(inp);
    target.appendChild(g);
  });
}

function renderVisibility() {
  const p = getPreset();
  customTextGroup.classList.toggle('hidden', !(p && p.customText));
  customTextInput.value = state.customText;
}

function renderPrompt() {
  const p = getPreset();
  const full = buildPrompt();

  if (!full) {
    promptDisplay.textContent = '⚠️ Please select a prompt preset from the dropdown.';
    setStatus('📌 No prompt selected.', 'info');
    return;
  }
  promptDisplay.textContent = full;

  // Status line is assembled automatically from metadata
  const extra = [];
  (p.variants || []).forEach(g => {
    const o = getVariantOption(g);
    extra.push(o.shortLabel || o.label);
  });
  (p.inputs || []).forEach(f => {
    const v = (state.inputs[f.id] || '').trim();
    if (v) extra.push(v.length > 40 ? v.substring(0, 40) + '…' : v);
  });
  let label = p.name + (extra.length ? ' (' + extra.join(', ') + ')' : '');
  if (state.customText.trim()) label += ' (with custom text)';
  setStatus('✅ Loaded: ' + label, 'success');
}

function renderAll() {
  renderControls();
  renderVisibility();
  renderPrompt();
  saveState();
}

// ============================================================
// 7. EVENTS
// ============================================================
function toggleDropdown(open) {
  const willOpen = (open === undefined) ? !customSelect.classList.contains('open') : open;
  customSelect.classList.toggle('open', willOpen);
  selectTrigger.setAttribute('aria-expanded', willOpen);
}

function selectOption(value) {
  state.presetId = value;
  renderDropdownSelection();
  toggleDropdown(false);
  renderAll();
}

selectTrigger.addEventListener('click', e => { e.stopPropagation(); toggleDropdown(); });
selectTrigger.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleDropdown(); }
});
selectDropdown.addEventListener('click', e => {
  const option = e.target.closest('.custom-select-option');
  if (option) selectOption(option.dataset.value);
});
document.addEventListener('click', () => toggleDropdown(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') toggleDropdown(false); });

// Delegation: clicks on variant buttons
dynamicControls.addEventListener('click', e => {
  const btn = e.target.closest('button[data-group]');
  if (!btn) return;
  state.variants[btn.dataset.group] = btn.dataset.option;
  btn.closest('.group-options').querySelectorAll('.btn')
     .forEach(b => b.classList.toggle('active', b === btn));
  renderPrompt();
  saveState();
});

// Delegation: input in text fields
dynamicControls.addEventListener('input', e => {
  if (!e.target.matches('[data-input]')) return;
  state.inputs[e.target.dataset.input] = e.target.value;
  renderPrompt();
  saveState();
});

customTextInput.addEventListener('input', () => {
  state.customText = customTextInput.value;
  renderPrompt();
  saveState();
});

// ============================================================
// 8. COPY
// ============================================================
function copyFallback(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}

async function copyPrompt() {
  if (!getPreset()) {
    setStatus('⚠️ Select a preset first to copy a prompt.', 'error');
    return;
  }
  const text = promptDisplay.textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    copyFallback(text);
  }
  setStatus('✅ Copied to clipboard!', 'success');
  copyBtn.textContent = '✅ Copied!';
  setTimeout(() => { copyBtn.textContent = '📋 Copy Prompt'; }, 2000);
}

copyBtn.addEventListener('click', copyPrompt);

// ============================================================
// 9. INIT
// ============================================================
loadState();
renderDropdownOptions();
renderDropdownSelection();
selectOption(state.presetId || '');
</script>
