<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎮 Game Portal</title>
    <style>
        /* Reset & base – light theme */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: #f6f9fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #1e293b;
        }

        /* Main card – light, airy */
        .game-hub {
            max-width: 750px;
            width: 100%;
            background: #ffffff;
            border-radius: 48px;
            padding: 35px 30px 45px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.10), 0 0 0 1px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e9edf2;
        }

        .header-icon {
            font-size: 2.8rem;
            line-height: 1;
        }

        .header-text {
            display: flex;
            flex-direction: column;
        }

        .header-text h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #0f172a;
        }

        .header-text span {
            font-size: 0.95rem;
            color: #64748b;
            letter-spacing: 0.3px;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-text span::before {
            content: "✦";
            color: #f59e0b;
            font-size: 0.7rem;
        }

        /* Games grid */
        .games-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Game card – light style */
        .game-card {
            background: #f8fafc;
            border-radius: 28px;
            padding: 18px 24px 18px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
            border: 1px solid #eef2f6;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.02);
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .game-card:hover {
            background: #ffffff;
            border-color: #fcd34d;
            transform: scale(1.01) translateY(-3px);
            box-shadow: 0 16px 30px -8px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(245, 158, 11, 0.15);
        }

        .game-card:active {
            transform: scale(0.98);
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .game-emoji {
            font-size: 2.6rem;
            background: #ffffff;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 20px;
            flex-shrink: 0;
            border: 1px solid #e9edf2;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        .game-details {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .game-title {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .game-title .badge {
            font-size: 0.6rem;
            font-weight: 600;
            background: #fef3c7;
            color: #b45309;
            padding: 2px 14px;
            border-radius: 40px;
            letter-spacing: 0.4px;
            border: 1px solid #fde68a;
            text-transform: uppercase;
        }

        .game-desc {
            font-size: 0.9rem;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .game-desc .separator {
            color: #cbd5e1;
            font-weight: 300;
        }

        .game-arrow {
            color: #94a3b8;
            font-size: 1.8rem;
            transition: all 0.2s;
            opacity: 0.6;
            margin-left: 6px;
        }

        .game-card:hover .game-arrow {
            color: #f59e0b;
            opacity: 1;
            transform: translateX(6px);
        }

        /* Future games placeholder – light theme */
        .future-games {
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px dashed #dce1e8;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .future-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .future-label::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }

        .placeholder-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 16px;
            border-radius: 16px;
            background: #f1f5f9;
            opacity: 0.7;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .placeholder-item .icon {
            font-size: 1.8rem;
            filter: grayscale(0.2);
        }
        .placeholder-item .name {
            font-size: 0.95rem;
            color: #334155;
        }
        .placeholder-item .coming {
            margin-left: auto;
            font-size: 0.7rem;
            background: #e9edf2;
            padding: 3px 14px;
            border-radius: 40px;
            border: 1px solid #dce1e8;
            color: #64748b;
        }

        /* Responsive */
        @media (max-width: 550px) {
            .game-hub {
                padding: 25px 18px 30px;
                border-radius: 32px;
            }
            .header-text h1 {
                font-size: 1.8rem;
            }
            .game-card {
                padding: 14px 16px;
                flex-wrap: wrap;
                gap: 10px;
            }
            .game-info {
                gap: 12px;
                flex: 1;
            }
            .game-emoji {
                width: 52px;
                height: 52px;
                font-size: 2.2rem;
            }
            .game-title {
                font-size: 1.1rem;
            }
            .game-arrow {
                font-size: 1.4rem;
            }
            .header-icon {
                font-size: 2.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="game-hub">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">🎯</div>
            <div class="header-text">
                <h1>Game Portal</h1>
                <span>Pick a game and dive in</span>
            </div>
        </div>

        <!-- Game grid -->
        <div class="games-grid">
            <!-- The only game (active link) -->
            <a href="https://item1000-collab.github.io/ai/dvp/games/mood-match-cuba.html" target="_blank" rel="noopener noreferrer" class="game-card">
                <div class="game-info">
                    <div class="game-emoji">🇨🇺</div>
                    <div class="game-details">
                        <div class="game-title">
                            Cuba: Mood Match
                            <span class="badge">New</span>
                        </div>
                        <div class="game-desc">
                            <span>🎭 intuition · photo</span>
                            <span class="separator">•</span>
                            <span>❤️ bilingual</span>
                        </div>
                    </div>
                </div>
                <div class="game-arrow">➜</div>
            </a>

            <!-- Placeholder for future games (optional, can be removed) -->
            <div class="future-games">
                <div class="future-label">Coming soon</div>
                <div class="placeholder-item">
                    <span class="icon">🌀</span>
                    <span class="name">Daily Puzzle</span>
                    <span class="coming">in progress</span>
                </div>
                <div class="placeholder-item">
                    <span class="icon">🧩</span>
                    <span class="name">City Quiz</span>
                    <span class="coming">soon</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
