    function evaluateChoice(photoIdx, chosenEmotionIdx) {
        const photo = photosData[photoIdx];
        const isMatch = (chosenEmotionIdx === photo.authorMoodIndex);
        const emotions = photo.emotions[currentLang];
        const userEmotionText = emotions[chosenEmotionIdx];
        const authorEmotionText = emotions[photo.authorMoodIndex];
        const explanation = photo.getMismatchExplanation(userEmotionText, authorEmotionText);
        const analysisHtml = isMatch 
            ? `<div class="match-match" style="padding:0.5rem; border-radius:12px; background:#daf4ef;">✨ ${photo.getMatchAnalysis()[currentLang]}</div>`
            : explanation[currentLang];
        evaluationResults[photoIdx] = {
            match: isMatch,
            userEmotionText,
            authorEmotionText,
            analysisHtml
        };
        return evaluationResults[photoIdx];
    }

    function renderCurrentPhoto() {
        const photo = photosData[currentPhotoIndex];
        const selectedIdx = userChoices[currentPhotoIndex];

        const emotions = photo.emotions[currentLang];
        
        let emotionsHtml = '';

        const authorNoteClass = (selectedIdx !== null) ? 'visible' : '';

                const emotionIdx = parseInt(btn.dataset.emotionIdx);
                userChoices[currentPhotoIndex] = emotionIdx;
                const evalResult = evaluateChoice(currentPhotoIndex, emotionIdx);

                renderCurrentPhoto();

                    feedbackDiv.innerHTML = i18n[currentLang].incorrect_feedback;

                feedbackDiv.classList.add('congrats');
                setTimeout(() => feedbackDiv.classList.remove('congrats'), 4000);

    function resetGame() {
        userChoices = new Array(photosData.length).fill(null);
        evaluationResults = new Array(photosData.length).fill(null);
        currentPhotoIndex = 0;
        updateStats();
        renderCurrentPhoto();
        feedbackDiv.innerHTML = i18n[currentLang].reset_feedback;
        feedbackDiv.classList.remove('congrats');
        setTimeout(() => {
            feedbackDiv.innerHTML = i18n[currentLang].reset_after;
        }, 1800);
    }
    
    function switchLang() {
        currentLang = (currentLang === 'en' ? 'ru' : 'en');
        langToggle.textContent = currentLang.toUpperCase();
        
        // Update all static texts
        titleText.textContent = i18n[currentLang].title;
        subtitleText.textContent = i18n[currentLang].subtitle;
        badgeText.textContent = i18n[currentLang].badge;
        statDone.textContent = i18n[currentLang].stat_done;
        statMatches.textContent = i18n[currentLang].stat_matches;
        statPhoto.textContent = i18n[currentLang].stat_photo;
        footerText.textContent = i18n[currentLang].footer;
        
        // Update buttons
        nextBtn.textContent = i18n[currentLang].btn_next;
        resetBtn.textContent = i18n[currentLang].btn_reset;
        
        // Update feedback if no answers yet
        if (userChoices.every(c => c === null)) {
            feedbackDiv.innerHTML = i18n[currentLang].feedback_default;
        }
        
        // Re-render to update dynamic content (emotions, author notes, etc.)
        renderCurrentPhoto();
        updateStats();
    }

    langToggle.addEventListener('click', switchLang);
    nextBtn.addEventListener('click', nextPhoto);
    resetBtn.addEventListener('click', resetGame);
    
    function initGame() {
        userChoices = new Array(photosData.length).fill(null);
        evaluationResults = new Array(photosData.length).fill(null);
        currentPhotoIndex = 0;
        updateStats();
        renderCurrentPhoto();
        feedbackDiv.innerHTML = i18n[currentLang].init_feedback;
    }
    initGame();
</script>
</body>
</html>
