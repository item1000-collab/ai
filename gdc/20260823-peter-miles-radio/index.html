<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link · Peter Miles Radio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
    }

    .card {
      background: rgba(22, 28, 46, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 48px;
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
      padding: 3rem 2.5rem;
      max-width: 640px;
      width: 100%;
      transition: transform 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    .card:hover {
      transform: scale(1.01);
    }

    .badge {
      display: inline-block;
      background: rgba(110, 130, 255, 0.12);
      padding: 0.3rem 1rem;
      border-radius: 100px;
      color: #a7b9ff;
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      margin-bottom: 1.2rem;
      border: 1px solid rgba(110, 130, 255, 0.15);
      backdrop-filter: blur(4px);
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #f0f3ff;
      margin-bottom: 0.5rem;
      line-height: 1.2;
    }

    .subhead {
      font-size: 1rem;
      color: #9aa3c7;
      margin-bottom: 2.2rem;
      font-weight: 400;
      border-left: 3px solid #4a62d9;
      padding-left: 1rem;
      background: linear-gradient(90deg, rgba(74, 98, 217, 0.08), transparent);
      border-radius: 0 4px 4px 0;
    }

    .link-wrapper {
      background: rgba(12, 16, 28, 0.6);
      border-radius: 80px;
      padding: 0.3rem;
      border: 1px solid #2d3650;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      backdrop-filter: blur(4px);
    }

    .link-wrapper:hover {
      border-color: #5a75e6;
      box-shadow: 0 0 20px rgba(74, 98, 217, 0.2);
    }

    .link-wrapper a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 100%;
      padding: 1.1rem 1.8rem;
      background: transparent;
      border-radius: 80px;
      font-weight: 500;
      font-size: 1.1rem;
      color: #e4e9ff;
      text-decoration: none;
      transition: all 0.2s ease;
      letter-spacing: 0.2px;
      font-family: 'Inter', sans-serif;
    }

    .link-wrapper a i {
      font-style: normal;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #2c3a6b;
      width: 34px;
      height: 34px;
      border-radius: 40px;
      font-size: 1.2rem;
      transition: background 0.2s ease;
      color: #b3c2ff;
    }

    .link-wrapper a:hover {
      color: white;
      text-shadow: 0 0 12px rgba(110, 140, 255, 0.3);
    }

    .link-wrapper a:hover i {
      background: #4a62d9;
      color: white;
    }

    .link-wrapper a .arrow {
      margin-left: auto;
      opacity: 0.6;
      font-size: 1.3rem;
      transition: transform 0.2s ease, opacity 0.2s ease;
      display: inline-block;
    }

    .link-wrapper a:hover .arrow {
      transform: translateX(6px);
      opacity: 1;
      color: #a7b9ff;
    }

    .link-url {
      margin-top: 1.8rem;
      font-size: 0.7rem;
      color: #5d6a94;
      text-align: center;
      word-break: break-all;
      background: rgba(0, 0, 0, 0.2);
      padding: 0.6rem 1rem;
      border-radius: 40px;
      border: 1px solid #28304a;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', monospace;
      letter-spacing: 0.2px;
    }

    .link-url span {
      color: #7d8abc;
    }

    .footer-note {
      margin-top: 2rem;
      display: flex;
      justify-content: flex-end;
      font-size: 0.7rem;
      color: #3c4668;
      letter-spacing: 0.3px;
    }

    .footer-note a {
      color: #5d6e9e;
      text-decoration: none;
      border-bottom: 1px dotted #2e3857;
    }

    .footer-note a:hover {
      color: #8f9fcf;
      border-bottom-color: #4a62d9;
    }

    @media (max-width: 480px) {
      .card {
        padding: 2rem 1.5rem;
        border-radius: 32px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .link-wrapper a {
        font-size: 0.95rem;
        padding: 0.9rem 1rem;
        flex-wrap: wrap;
        justify-content: center;
      }

      .link-wrapper a .arrow {
        margin-left: 0;
      }

      .link-url {
        font-size: 0.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🎙️ live · 2026</div>
    <h1>Peter Miles<br>Radio Broadcast</h1>
    <div class="subhead">direct link · 23 August 2026</div>

    <div class="link-wrapper">
      <a href="https://item1000-collab.github.io/ai/gdc/20260823-peter-miles-radio/radio/" target="_blank" rel="noopener noreferrer">
        <i>📡</i>
        <span>Open broadcast</span>
        <span class="arrow">↗</span>
      </a>
    </div>

    <div class="link-url">
      <span>🔗</span> item1000-collab.github.io/ai/gdc/20260823-peter-miles-radio/radio/
    </div>

    <div class="footer-note">
      <a href="#" onclick="return false;">⏵ single destination</a>
    </div>
  </div>
</body>
</html>
