            padding: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .player-bar {
            background: #0b1120;

            padding: 12px 20px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 18px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 20px -5px rgba(0,0,0,0.5);

        .play-pause-btn {
            background: var(--accent-color);
            border: none;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #0f172a;
            font-size: 1.6rem;
            line-height: 1;
            transition: 0.15s;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(56,189,248,0.3);
        }
        .play-pause-btn:hover { background: #7dd3fc; transform: scale(1.02); }
        .play-pause-btn:active { transform: scale(0.97); }

        .time-display {
            font-family: 'SF Mono', 'Fira Code', monospace;
            font-size: 0.9rem;
            color: var(--text-muted);
            min-width: 100px;
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .time-display .current { color: #f1f5f9; font-weight: 500; }

        .progress-container {
            flex: 1;
            height: 6px;
            background: #1e2a3a;
            border-radius: 10px;
            cursor: pointer;
            transition: height 0.1s;
        }
        .progress-container:hover { height: 8px; }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-color), #a5d8ff);
            border-radius: 10px;
            transition: width 0.05s linear;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 1.2rem;
            flex-shrink: 0;
        }
        .volume-control input {
            width: 70px;
            height: 4px;
            -webkit-appearance: none;
            background: #1e2a3a;
            border-radius: 4px;
            outline: none;
            cursor: pointer;

            -webkit-appearance: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--accent-color);
            box-shadow: 0 0 6px var(--accent-color);

            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 22px;
            margin-bottom: 20px;
            padding: 0 4px;
            flex-wrap: wrap;

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            user-select: none;
            transition: color 0.2s;

        .toggle-label:hover { color: var(--text-color); }

            -webkit-appearance: none;
            width: 44px;
            height: 24px;
            background: #1e2a3a;
            border-radius: 24px;
            position: relative;
            cursor: pointer;
            transition: background 0.2s ease;
            border: 1px solid var(--border-color);
            outline: none;
            flex-shrink: 0;

            width: 18px; height: 18px;
            background: var(--text-muted);
            border-radius: 50%;

            margin-bottom: 25px;

            align-items: center;

        .speaker {

        .speaker-1 { color: var(--speaker1-color); }

        }
        .text { font-size: 1.05rem; color: #f1f5f9; }

        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
    </style>
</head>
