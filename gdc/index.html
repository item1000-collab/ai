<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Global Distance Club · Archive</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5efe7;
      font-family: system-ui, 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #2c3e2f;
    }

    .classes-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 2rem 2rem 3rem;
      position: relative;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.5rem 0 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .top-left-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #7f6b5a;
    }

    .logo {
      font-weight: 800;
      background: #2c3e2f;
      color: #fff;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
    }

    .header h1 {
      font-size: 1.2rem;
      color: #2c3e2f;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.6rem;
      margin: 1.5rem 0 2rem;
    }

    .class-card {
      background: #fff;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .class-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 32px -14px rgba(0, 0, 0, 0.12);
    }

    .card-media {
      height: 54px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      flex-shrink: 0;
      color: #fff;
    }

    .date-tag {
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 0.65rem;
      color: #fff;
      letter-spacing: 0.5px;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .teacher-tag {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(4px);
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.65rem;
      color: #1e293b;
      letter-spacing: 0.3px;
      z-index: 2;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .card-content {
      padding: 1rem 1.2rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .class-title {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
      color: #2c3e2f;
      flex: 1;
    }

    .class-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      background: #f5f0e6;
      padding: 0.6rem 1rem;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.75rem;
      color: #2c3e2f;
      transition: all 0.2s;
      width: 100%;
      gap: 6px;
      margin-top: 0.8rem;
      flex-shrink: 0;
    }

    .class-link:hover {
      background: #e6d9c8;
      gap: 10px;
    }

    .arrow-icon {
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .class-link:hover .arrow-icon {
      transform: translateX(4px);
    }

    .footer-note {
      text-align: center;
      padding: 1.5rem 1rem 1rem;
      font-size: 0.7rem;
      color: #8f7a66;
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid #e2d6c8;
      margin-top: 2rem;
    }

    .footer-note a {
      color: #8f7a66;
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    @media (max-width: 700px) {
      .classes-container {
        padding: 1rem;
      }
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
<div class="classes-container">
  <div class="header">
    <div class="top-left-logo">
      <span>+ global club +</span>
      <span class="logo">GDC</span>
    </div>
    <h1>Global Distance Club · Archive</h1>
  </div>

  <div class="grid" id="lessonsGrid">
    <!-- Cards will be inserted via JS -->
  </div>

  <div class="footer-note">
    <span>Global Distance Club - exploring the world through conversations</span>
    <a href="#">About the club</a>
    <a href="#">Archive</a>
  </div>
</div>

    {

    },

      title: "AI Dialogues Jul 4",

    {

    {

      title: "AI Cult",
      teacher: "Peter",
      dateLabel: "27.09.2026",
      colors: ['#1a1a2e', '#c9a84c']
    }
  ];

  function getGradient(colors) {
    if (!colors || colors.length === 0) return '#2c3e2f';
    if (colors.length === 1) return colors[0];
    if (colors.length === 2) {
      return `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
    }
    const stops = colors.map((c, i) => `${c} ${(i / (colors.length - 1)) * 100}%`).join(', ');
    return `linear-gradient(135deg, ${stops})`;
  }

  const grid = document.getElementById('lessonsGrid');

  function buildCard(link) {
    const div = document.createElement('div');
    div.className = 'class-card';
    
    const teacherHtml = link.teacher ? `<span class="teacher-tag">👩‍🏫 ${link.teacher}</span>` : '';
    const backgroundGradient = getGradient(link.colors);

    div.innerHTML = `
      <div class="card-media" style="background: ${backgroundGradient};">
        <span class="date-tag">🗓️ ${link.dateLabel}</span>
        ${teacherHtml}
      </div>
      <div class="card-content">
        <div class="class-title">${link.title}</div>
        <a href="${link.url}" class="class-link" target="_blank">
          <span>[Open event]</span>
          <span class="arrow-icon">[>]</span>
        </a>
      </div>
    `;
    return div;
  }

  // Заполнение сетки карточками
  linksData.forEach(link => {
    grid.appendChild(buildCard(link));
  });
</script>
</body>
</html>
