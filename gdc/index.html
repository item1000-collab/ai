<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Global Distance Club · Engoo Style</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5efe7;
      font-family: system-ui, 'Segoe UI', 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .classes-container {
      max-width: 100%;
      margin: 0 auto;
      padding: 1rem 2rem 3rem;
      position: relative;
      min-height: 100vh;
    }

    .header {
      text-align: center;
      padding: 0 1rem 1rem;
      background: transparent;
      position: relative;
    }

    .top-left-logo {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: #7f6b5a;
    }

    .logo {
      font-weight: 800;
      background: #2c3e2f;
      color: white;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
    }

    .header h1 {
      font-size: 2.7rem;
      font-weight: 700;
      color: #2c3e2f;
      margin-bottom: 0;
      margin-top: 0;
    }

    .filter-section {
      background: white;
      border-radius: 2rem;
      padding: 1rem 1.5rem;
      margin: 1rem 0 2rem;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.03);
      border: 1px solid #e9dfd3;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1.2rem;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .filter-label {
      font-weight: 600;
      font-size: 0.8rem;
      color: #4a3b2f;
      background: #f0e9e0;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: #f5f0e6;
      border: none;
      padding: 0.4rem 1rem;
      border-radius: 40px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #4a3b2f;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }

    .filter-btn.active {
      background: #2c3e2f;
      color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .filter-btn:hover:not(.active) {
      background: #e2d4c4;
    }

    .reset-btn {
      background: #e1d5c7;
    }

    .reset-btn:hover {
      background: #cdbcab;
    }

    .stats-info {
      font-size: 0.7rem;
      color: #8f7a66;
      background: #f9f5ef;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.6rem;
      margin: 1.5rem 0 2rem;
    }

    .class-card {
      background: #ffffff;
      border-radius: 1.5rem;
      overflow: hidden;
      box-shadow: 0 12px 28px -10px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .class-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 32px -14px rgba(0, 0, 0, 0.12);
    }

    .card-media {
      height: 44px;
      position: relative;
      background-size: cover;
      background-position: center;
      background: linear-gradient(135deg, #2c3e2f 0%, #5a7d5c 100%);
    }

    .card-media.gdc-2021 { background: linear-gradient(135deg, #0f2b3d 0%, #2f6f8f 100%); }
    .card-media.gdc-2026 { background: linear-gradient(135deg, #2c5a6e 0%, #4c9faf 100%); }
    .card-media.gdc-elvis { background: linear-gradient(135deg, #b33b2c 0%, #e88952 100%); }
    .card-media.gdc-maya { background: linear-gradient(135deg, #5b2e6e 0%, #e88d9e 100%); }
    .card-media.gdc-miles { background: linear-gradient(135deg, #c1272d 0%, #d94f30 100%); }
    .card-media.gdc-ai { background: linear-gradient(135deg, #1b2a47 0%, #b8860b 100%); }
    .card-media.gdc-singing { background: linear-gradient(135deg, #2d7a4a 0%, #5cb88a 100%); }
    .card-media.gdc-brain { background: linear-gradient(135deg, #2b2d42 0%, #e6b422 100%); }
    .card-media.gdc-peter { background: linear-gradient(135deg, #1a1a2e 0%, #c9a84c 100%); }
    .card-media.gdc-peter-uk { background: linear-gradient(135deg, #1a3a4a 0%, #7a9fbf 100%); }
    .card-media.gdc-moscow-ny { background: linear-gradient(135deg, #1a4d5e 0%, #3ba0b5 100%); }
    .card-media.gdc-coffee { background: linear-gradient(135deg, #3d2314 0%, #a67c52 100%); }

    .card-content {
      padding: 1rem 1.2rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .lesson-date {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #b47c48;
      margin-bottom: 0.3rem;
    }

    .class-title {
      font-size: 1.2rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 0.5rem;
      color: #2c3e2f;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 0.5rem 0 0;
      align-items: center;
    }

    .teacher-badge {
      background: #2c3e2f;
      color: white;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .topic-badge {
      background: #e6b422;
      color: #2c3e2f;
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .topic-icon {
      font-size: 0.85rem;
    }

    .class-link {
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      background: #f5f0e6;
      padding: 0.6rem 1rem;
      border-radius: 60px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.75rem;
      color: #2c3e2f;
      transition: all 0.2s;
      width: 100%;
      gap: 6px;
      margin-top: 0.8rem;
    }

    .class-link:hover {
      background: #e6d9c8;
      gap: 10px;
    }

    .arrow-icon {
      font-size: 1rem;
      transition: transform 0.2s;
    }

    .class-link:hover .arrow-icon {
      transform: translateX(4px);
    }

    .class-card.hidden-card {
      display: none;
    }

    .footer-note {
      text-align: center;
      padding: 1.5rem 1rem 1rem;
      font-size: 0.7rem;
      color: #8f7a66;
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
      border-top: 1px solid #e2d6c8;
      margin-top: 2rem;
    }

    .footer-note a {
      color: #8f7a66;
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    @media (min-width: 1600px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    @media (max-width: 1200px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
    }

    @media (max-width: 700px) {
      .classes-container { padding: 1rem; }
      .header h1 { font-size: 1.8rem; }
      .filter-section { flex-direction: column; align-items: stretch; }
      .filter-group { justify-content: space-between; }
      .card-media { height: 40px; }
      .grid { grid-template-columns: 1fr; margin-top: 0.5rem; }
      .meta-row { flex-direction: column; align-items: flex-start; }
      .top-left-logo { position: static; margin-bottom: 0.5rem; justify-content: center; }
      .header { padding-top: 0; }
    }
  </style>
</head>
<body>
<div class="classes-container">
  <div class="header">
    <div class="top-left-logo">
      <span>+ global club +</span>
      <span class="logo">GDC</span>
    </div>
    <h1>Global Distance Club · Archive</h1>
  </div>

  <div class="filter-section">
    <div class="filter-group">
      <span class="filter-label">Year</span>
      <div class="filter-buttons" id="yearFilterButtons"></div>
    </div>
    <div class="filter-group">
      <button id="resetFiltersBtn" class="filter-btn reset-btn">[ Reset ]</button>
      <span id="lessonCountDisplay" class="stats-info">15 events</span>
    </div>
  </div>

  <div class="grid" id="lessonsGrid">
    <!-- Cards will be inserted via JS -->
  </div>

  <div class="footer-note">
    <span>Global Distance Club - exploring the world through conversations</span>
    <a href="#">About the club</a>
    <a href="#">Archive</a>
  </div>
</div>

<script>
  const linksData = [
    {
      url: "https://item1000-collab.github.io/ai/gdc/20210108-gdc-30/index.html",
      title: "GDC 30",
      description: "Anniversary Foundations",
      dateLabel: "Jan 8, 2021",
      dateObj: new Date(2021, 0, 8),
      year: "2021",
      cardClass: "gdc-2021"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20211111-gdc-ce2/index.html",
      title: "GDC SE2",
      description: "Virtual Brazil Journey",
      dateLabel: "Nov 11, 2021",
      dateObj: new Date(2021, 10, 11),
      year: "2021",
      cardClass: "gdc-2021"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260215-ai-maya-coffee/index.html",
      title: "Maya Coffee Talk",
      description: "Conversations over coffee",
      dateLabel: "Feb 15, 2026",
      dateObj: new Date(2026, 1, 15),
      year: "2026",
      cardClass: "gdc-coffee"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260124-ai-moscow-n-york/index.html",
      title: "AI Moscow NY",
      description: "Moscow to New York",
      dateLabel: "Jan 24, 2026",
      dateObj: new Date(2026, 0, 24),
      year: "2026",
      cardClass: "gdc-moscow-ny"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260525-elvis/index.html",
      title: "Elvis Edition",
      description: "Tribute Rock and Roll",
      dateLabel: "May 31, 2026",
      dateObj: new Date(2026, 4, 31),
      year: "2026",
      cardClass: "gdc-elvis"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260606-maya-singing/index.html",
      title: "Maya Sings",
      description: "Voice fitness Acapella",
      dateLabel: "Jun 06, 2026",
      dateObj: new Date(2026, 5, 6),
      year: "2026",
      cardClass: "gdc-maya"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260607-miles-showmaster/index.html",
      title: "Miles Showmaster",
      description: "Showcraft Masterclass",
      dateLabel: "Jun 07, 2026",
      dateObj: new Date(2026, 5, 7),
      year: "2026",
      cardClass: "gdc-miles"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260704-ai-dialogs/index.html",
      title: "AI Dialogues Jul 4",
      description: "Miles Copilot Gemini",
      dateLabel: "Jul 04, 2026",
      dateObj: new Date(2026, 6, 4),
      year: "2026",
      cardClass: "gdc-ai"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260705-ai-dialogs/index.html",
      title: "AI Dialogues",
      description: "Conversational transcripts",
      dateLabel: "Jul 05, 2026",
      dateObj: new Date(2026, 6, 5),
      year: "2026",
      cardClass: "gdc-ai"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260718-AI-singing-attemps/index.html",
      title: "AI Singing Attempts",
      description: "Vocal experiments AI",
      dateLabel: "Jul 18, 2026",
      dateObj: new Date(2026, 6, 18),
      year: "2026",
      cardClass: "gdc-singing"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260719-ai/index.html",
      title: "AI Jul 19",
      description: "Deep learning Dialogues",
      dateLabel: "Jul 19, 2026",
      dateObj: new Date(2026, 6, 19),
      year: "2026",
      cardClass: "gdc-brain"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260801-peter-miles/index.html",
      title: "Peter Miles",
      description: "Special session Miles",
      dateLabel: "Aug 01, 2026",
      dateObj: new Date(2026, 7, 1),
      year: "2026",
      cardClass: "gdc-peter"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260808-peter-in-uk/index.html",
      title: "Peter in UK",
      description: "UK session London",
      dateLabel: "Aug 08, 2026",
      dateObj: new Date(2026, 7, 8),
      year: "2026",
      cardClass: "gdc-peter-uk"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260815-peter-in-uk/index.html",
      title: "Peter in UK II",
      description: "UK session Edinburgh",
      dateLabel: "Aug 15, 2026",
      dateObj: new Date(2026, 7, 15),
      year: "2026",
      cardClass: "gdc-peter-uk"
    },
    {
      url: "https://item1000-collab.github.io/ai/gdc/20260823-peter-miles-radio/index.html",
      title: "Peter Miles Radio",
      description: "Radio session with Peter & Miles",
      dateLabel: "Aug 23, 2026",
      dateObj: new Date(2026, 7, 23),
      year: "2026",
      cardClass: "gdc-peter"
    }
  ];

  // Sort by date (oldest to newest)
  const sorted = [...linksData].sort((a, b) => a.dateObj - b.dateObj);

  const grid = document.getElementById('lessonsGrid');
  const yearFilterContainer = document.getElementById('yearFilterButtons');
  const resetBtn = document.getElementById('resetFiltersBtn');
  const lessonCountSpan = document.getElementById('lessonCountDisplay');

  let currentYear = 'all';

  function buildCard(link) {
    const div = document.createElement('div');
    div.className = `class-card ${link.cardClass || 'gdc-2026'}`;
    div.setAttribute('data-year', link.year);
    div.innerHTML = `
      <div class="card-media ${link.cardClass || 'gdc-2026'}">
      </div>
      <div class="card-content">
        <div class="lesson-date">[${link.dateLabel}]</div>
        <div class="class-title">${link.title}</div>
        <div class="meta-row">
          <span class="teacher-badge">[GDC]</span>
          <span class="topic-badge"><span class="topic-icon">[#]</span> ${link.description}</span>
        </div>
        <a href="${link.url}" class="class-link" target="_blank">
          <span>[Open event]</span>
          <span class="arrow-icon">[>]</span>
        </a>
      </div>
    `;
    return div;
  }

  function renderYearButtons() {
    const years = [...new Set(sorted.map(d => d.year))].sort();
    let buttonsHtml = `<button data-year="all" class="filter-btn ${currentYear === 'all' ? 'active' : ''}">All years</button>`;
    years.forEach(year => {
      buttonsHtml += `<button data-year="${year}" class="filter-btn ${currentYear === year ? 'active' : ''}">${year}</button>`;
    });
    yearFilterContainer.innerHTML = buttonsHtml;
    
    yearFilterContainer.querySelectorAll('[data-year]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentYear = btn.getAttribute('data-year');
        updateFilters();
        updateActiveButtons();
      });
    });
  }

  function updateActiveButtons() {
    yearFilterContainer.querySelectorAll('[data-year]').forEach(btn => {
      const val = btn.getAttribute('data-year');
      btn.classList.toggle('active', val === currentYear);
    });
  }

  function updateFilters() {
    let visibleCount = 0;
    const allCards = grid.querySelectorAll('.class-card');
    allCards.forEach(card => {
      const year = card.getAttribute('data-year');
      const matches = (currentYear === 'all' || year === currentYear);
      card.classList.toggle('hidden-card', !matches);
      if (matches) visibleCount++;
    });
    lessonCountSpan.innerText = `${visibleCount} event${visibleCount !== 1 ? 's' : ''}`;
  }

  function resetFilters() {
    currentYear = 'all';
    updateFilters();
    updateActiveButtons();
  }

  // Fill the grid
  sorted.forEach(link => {
    grid.appendChild(buildCard(link));
  });

  renderYearButtons();
  resetBtn.addEventListener('click', resetFilters);
  updateFilters();
</script>
</body>
</html>
