<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>English lesson · Peter in the UK</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f0eb;
            background-image: 
                radial-gradient(ellipse at 20% 50%, rgba(200, 215, 225, 0.3) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(215, 200, 190, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(190, 210, 220, 0.15) 0%, transparent 50%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 1.5rem 0 3rem 0;
            color: #2c3e4a;
        }

        .app-wrapper {
            width: 100%;
            max-width: 1400px;
            padding: 0 1.2rem;
        }

        .page-title {
            font-size: 2.2rem;
            font-weight: 550;
            letter-spacing: -0.02em;
            margin: 0 0 0.3rem 0;
            padding: 0.2rem 0 0.8rem 0;
            color: #2c4a5a;
            border-bottom: 1px solid rgba(74, 106, 122, 0.12);
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
        }
        .page-title small {
            font-weight: 400;
            font-size: 1rem;
            color: #5a7a8a;
            background: rgba(74, 106, 122, 0.06);
            padding: 0.2rem 1rem;
            border-radius: 40px;
            letter-spacing: 0.01em;
        }

        .section-divider {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin: 2.2rem 0 1.8rem 0;
            color: #7a9aaa;
            font-size: 0.85rem;
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, rgba(74, 106, 122, 0.12), transparent);
        }
        .section-divider span {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
            padding: 0.1rem 0.9rem;
            border-radius: 30px;
            border: 1px solid rgba(160, 180, 200, 0.08);
        }

        .card {
            border-radius: 28px;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(200, 215, 225, 0.15);
            box-shadow: 0 8px 28px -12px rgba(60, 80, 95, 0.08), 0 2px 6px rgba(0,0,0,0.02);
            padding: 1.5rem 1.8rem;
            transition: box-shadow 0.25s ease, transform 0.2s ease;
            height: fit-content;
        }
        .card:hover {
            box-shadow: 0 20px 40px -16px rgba(60, 80, 95, 0.15), 0 4px 12px rgba(0,0,0,0.02);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.3rem;
            font-weight: 550;
            letter-spacing: -0.01em;
            margin-bottom: 1.2rem;
            color: #2c4a5a;
            border-bottom: 1px solid rgba(74, 106, 122, 0.07);
            padding-bottom: 0.6rem;
        }
        .card-header .badge-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #6a8a9a;
            border-radius: 50%;
            margin-right: 0.3rem;
            animation: pulse-dot 2s infinite;
            box-shadow: 0 0 0 0 rgba(74, 106, 122, 0.25);
        }
        @keyframes pulse-dot {
            0% { box-shadow: 0 0 0 0 rgba(74, 106, 122, 0.2); }
            70% { box-shadow: 0 0 0 8px rgba(74, 106, 122, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 106, 122, 0); }
        }

        .row-group {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-bottom: 1rem;
        }

        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: stretch;
        }

        .pdf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 0.2rem;
        }
        .pdf-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1.2rem;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(2px);
            border-radius: 40px;
            border: 1px solid rgba(200, 215, 225, 0.12);
            text-decoration: none;
            color: #2c3e4a;
            font-weight: 450;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .pdf-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -12px rgba(60, 80, 95, 0.15);
            background: rgba(255, 255, 255, 0.75);
            border-color: rgba(74, 106, 122, 0.12);
        }
        .pdf-item .arrow {
            margin-left: auto;
            transition: transform 0.2s ease, opacity 0.2s ease;
            opacity: 0.4;
            font-size: 1.1rem;
        }
        .pdf-item:hover .arrow {
            opacity: 1;
            transform: translateX(5px);
        }
        .pdf-item .emoji {
            font-size: 1.3rem;
        }

        .narrative-text {
            font-size: 0.98rem;
            line-height: 1.7;
            color: #2c3e4a;
        }
        .narrative-text p {
            margin-bottom: 1rem;
        }
        .narrative-text p:last-child {
            margin-bottom: 0;
        }
        .narrative-text strong {
            color: #2c4a5a;
            font-weight: 600;
            background: rgba(74, 106, 122, 0.05);
            padding: 0 0.2rem;
            border-radius: 4px;
        }
        .narrative-text .gloss {
            font-weight: 400;
            color: #5a7a8a;
            background: rgba(74, 106, 122, 0.04);
            padding: 0 0.3rem;
            border-radius: 4px;
            font-size: 0.92rem;
        }

        .vocab-pill {
            display: inline-block;
            background: rgba(74, 106, 122, 0.06);
            padding: 0.25rem 1rem 0.3rem 1rem;
            border-radius: 40px;
            margin: 0.2rem 0.4rem 0.2rem 0;
            font-size: 0.9rem;
            border: 1px solid rgba(74, 106, 122, 0.04);
            transition: all 0.15s ease;
            font-weight: 450;
            color: #2c4a5a;
        }
        .vocab-pill:hover {
            background: rgba(74, 106, 122, 0.1);
            transform: scale(1.02);
        }
        .vocab-def {
            display: block;
            margin: 0.4rem 0 0.7rem 0.2rem;
            font-size: 0.92rem;
            color: #3a5a6a;
            padding-left: 0.5rem;
            border-left: 2px solid rgba(74, 106, 122, 0.12);
        }

        .summary-text {
            font-size: 0.98rem;
            line-height: 1.6;
            color: #2c3e4a;
        }
        .summary-text p {
            margin-bottom: 1rem;
        }
        .summary-text p:last-child {
            margin-bottom: 0;
        }

        @media (max-width: 768px) {
            .grid-2col {
                grid-template-columns: 1fr;
                gap: 1.8rem;
            }
            .pdf-grid {
                grid-template-columns: 1fr;
            }
            .page-title {
                font-size: 1.8rem;
            }
            .card {
                padding: 1.2rem 1.2rem;
            }
        }
        @media (max-width: 500px) {
            .pdf-grid {
                grid-template-columns: 1fr;
            }
            .app-wrapper {
                padding: 0 0.6rem;
            }
            .card-header {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
<div class="app-wrapper">

    <h1 class="page-title">
        🇬🇧 Peter's UK travelogue
        <small>Teacher · Plymouth &amp; Cornwall</small>
    </h1>

    <!-- ========== PDF FILES ========== -->
    <div class="row-group">
        <div class="card" id="pdf-card" style="background: rgba(235, 225, 215, 0.5);">
            <div class="card-header">
                <span class="badge-dot"></span> 📁 Session Files
            </div>
            <div class="pdf-grid" id="pdfGrid"></div>
        </div>
    </div>

    <!-- ========== SECOND ROW: Narrative ========== -->
    <div class="row-group">
        <div class="grid-2col">
            <div class="card" id="narrative-card" style="background: rgba(225, 235, 240, 0.45); grid-column: 1 / -1;">
                <div class="card-header">🗣️ Travel story</div>
                <div class="narrative-text" id="narrativeContainer"></div>
            </div>
        </div>
    </div>

    <!-- ========== THIRD ROW: Vocabulary + Summary ========== -->
    <div class="row-group">
        <div class="grid-2col">
            <div class="card" id="vocab-card" style="background: rgba(235, 228, 220, 0.5);">
                <div class="card-header">📚 Vocabulary</div>
                <div id="vocabularyContainer"></div>
            </div>
            <div class="card" id="summary-card" style="background: rgba(220, 230, 235, 0.45);">
                <div class="card-header">📖 Summary</div>
                <div class="summary-text" id="summaryContainer"></div>
            </div>
        </div>
    </div>

    <div class="section-divider" style="margin-top: 2.5rem;"><span>✦</span></div>
</div>

<script>
    (function() {
        // -------- PDF FILES --------
        const pdfFiles = [
            { name: 'british-coastal-guide.pdf', emoji: '📘' },
            { name: 'summary-20260816045847QiVnXh.pdf', emoji: '📕' },
            { name: 'summary-20260816050434psvfBJ.pdf', emoji: '📗' },
            { name: 'summary-20260816050725fWPrGv.pdf', emoji: '📙' }
        ];
        const BASE_PATH = 'https://item1000-collab.github.io/ai/gdc/20260815-peter-in-uk/';
        const pdfGrid = document.getElementById('pdfGrid');
        if (pdfGrid) {
            pdfGrid.innerHTML = '';
            pdfFiles.forEach(file => {
                const a = document.createElement('a');
                a.href = BASE_PATH + file.name;
                a.target = '_blank';
                a.className = 'pdf-item';
                a.innerHTML = `
                    <span class="emoji">${file.emoji}</span>
                    <span>${file.name}</span>
                    <span class="arrow">→</span>
                `;
                pdfGrid.appendChild(a);
            });
        }

        // -------- FULL NARRATIVE (no dates, no medical details) --------
        const narrativeHTML = `
            <p><strong>Peter's journey</strong> began in Plymouth, where he stayed in a flat near the Armada. He describes the city as <strong>pedestrianised</strong> <span class="gloss">(car-free zone)</span> — a rarity in the UK — and notes that Plymouth was <strong>flattened</strong> <span class="gloss">(destroyed)</span> during WWII, which gives it a more American layout. He also mentions the Tamar Bridge, a <strong>toll bridge</strong> <span class="gloss">(payment required to cross)</span> that separates Cornwall from Devon.</p>

            <p>One of his first excursions was to <strong>Torquay</strong>, the <strong>birthplace</strong> <span class="gloss">(town of origin)</span> of Agatha Christie. He was struck by the <strong>English Riviera</strong> vibe: palm trees, yachts, and the <strong>promenade</strong> <span class="gloss">(seafront walkway)</span>. He marvelled at the <strong>crystal-clear</strong> water and the <strong>shallow</strong> <span class="gloss">(not deep)</span> bay, perfect for families. However, he found the <strong>signposting</strong> <span class="gloss">(directional signs)</span> for tourist information <strong>abysmal</strong> <span class="gloss">(extremely bad)</span> — he spent almost an hour circling the buildings. He noted that the cliffs are made of <strong>brittle</strong> <span class="gloss">(easily crumbled)</span> stone, and many have <strong>steel netting</strong> to catch falling rocks. The sea wall, built of natural stone with plants growing through it, was a <strong>picturesque</strong> <span class="gloss">(visually attractive)</span> feature.</p>

            <p>In Torquay, Peter also visited the Grand Hotel, where Agatha Christie once stayed. He sat under a palm tree and chatted with a local lady, even giving her his sunscreen. He mentioned that the town is very hilly, and many people have to climb steep stairs to get home. He also observed that the beach was crowded even early in the morning, and the water was so clear you could see if a shark was coming.</p>

            <p>His trip to <strong>Newquay</strong> was a contrast: a surf town with a younger crowd. He arrived early and sat in the shade of the cliffs, but still got <strong>sunburned</strong>. He described the beach as <strong>crystal-clear</strong> and <strong>shallow</strong>, with flags to separate swimmers from bodyboarders. He recalled his own bodyboarding days in Penzance, and mentioned that he still owns a neoprene suit from 1985 — over 40 years old! He was <strong>fascinated</strong> by the <strong>driftwood sculptures</strong> and the <strong>sea glass</strong> <span class="gloss">(polished glass fragments)</span> that people collect. He also noted that Newquay is more for young people, with surf shops everywhere, and that during a music event the town of 15,000 people was flooded with 50,000 visitors.</p>

            <p>Peter also explored <strong>Penzance</strong>, where he had lived years ago. He walked along the promenade to Marazion, passing St Michael's Mount, and noted the <strong>hose ban</strong> <span class="gloss">(restriction on using garden hoses)</span> due to <strong>drought</strong>. He visited The Turk's Head, a pub from the 13th century, where he celebrated his birthday — sitting in the exact same spot as on a previous milestone birthday. He tried two Cornish ales: a <strong>dark, malty</strong> beer and a <strong>pale ale</strong>, and joked that he looked drunk in the photo, though he only had two half-pints. He also showed a photo of the Egyptian House, a unique building with antiques, and pointed out where he had once planned to open a fish bistro in Bakehouse Lane.</p>

            <p>Throughout his trip, Peter used a photo editing app with <strong>HDR effects</strong> <span class="gloss">(High Dynamic Range, enhances details)</span> to improve his pictures. He demonstrated how the "dynamic" mode made the images sharper and more vibrant. He also shared a <strong>handy trick</strong>: opening a cider bottle without an opener by poking a hole in the cap with nail scissors — the <strong>carbonated</strong> <span class="gloss">(fizzy)</span> drink then <strong>spurted</strong> out. He mentioned that he had bought two bottles of cider in Newquay and enjoyed them very much.</p>

            <p>Peter also reflected on the <strong>heatwave</strong> that had turned the grass brown and caused a hose ban. He noted that the water in the reservoirs was running low, and the landscape looked more like a desert than a lawn. He also talked about the <strong>Cornish language</strong>, a <strong>revived</strong> <span class="gloss">(brought back to use)</span> Celtic language, and mentioned that there are still news broadcasts in Cornish on the radio.</p>

            <p>On his return journey, he travelled first class on the train and received complimentary snacks and drinks. He also had a conversation with a teacher on the train, recommending <strong>NotebookLM</strong> to her. He was impressed by the train facilities, including disabled toilets and baby-changing rooms, which he found much better than in Germany.</p>

            <p>Overall, Peter's trip was a blend of <strong>nostalgia</strong> <span class="gloss">(sentimental longing for the past)</span> and discovery. He revisited places from his youth, tried new ales, and enjoyed the <strong>breathtaking</strong> <span class="gloss">(stunningly beautiful)</span> coastal views. He even considered returning in September for the Agatha Christie festival, as accommodation was surprisingly affordable at under £300 for a week.</p>
        `;

        const narrativeContainer = document.getElementById('narrativeContainer');
        if (narrativeContainer) {
            narrativeContainer.innerHTML = narrativeHTML;
        }

        // -------- VOCABULARY --------
        const vocabItems = [
            { word: 'pedestrianised', def: 'An area where vehicles are not allowed, reserved for pedestrians.' },
            { word: 'flattened (in war)', def: 'Completely destroyed or razed to the ground.' },
            { word: 'toll bridge', def: 'A bridge where you must pay a fee to cross.' },
            { word: 'birthplace', def: 'The town or place where a person was born.' },
            { word: 'promenade', def: 'A paved public walkway, usually along the seafront.' },
            { word: 'crystal-clear', def: 'Perfectly transparent and clean (water).' },
            { word: 'shallow', def: 'Not deep; with little depth.' },
            { word: 'signposting', def: 'Signs that give directions or information.' },
            { word: 'abysmal', def: 'Extremely bad or of very poor quality.' },
            { word: 'brittle', def: 'Hard but easily broken or cracked.' },
            { word: 'steel netting', def: 'A mesh of steel wires used to catch falling rocks.' },
            { word: 'picturesque', def: 'Visually attractive, like a painting.' },
            { word: 'sunburned', def: 'Skin damaged by overexposure to the sun.' },
            { word: 'driftwood', def: 'Wood washed onto the shore by the sea, often used in art.' },
            { word: 'sea glass', def: 'Broken glass polished by the sea into frosted, smooth pieces.' },
            { word: 'hose ban', def: 'Official restriction on using a garden hose due to water shortage.' },
            { word: 'drought', def: 'A prolonged period of abnormally low rainfall.' },
            { word: 'carbonated', def: 'Containing dissolved carbon dioxide, producing fizz.' },
            { word: 'spurted', def: 'Gushed out suddenly in a stream.' },
            { word: 'handy trick', def: 'A useful and practical technique.' },
            { word: 'HDR effects', def: 'High Dynamic Range; a technique to enhance contrast and detail in photos.' },
            { word: 'revived (language)', def: 'Brought back into active use after being dormant.' },
            { word: 'nostalgia', def: 'Sentimental longing or wistful affection for the past.' },
            { word: 'breathtaking', def: 'Stunningly beautiful or awe-inspiring.' }
        ];

        const vocabContainer = document.getElementById('vocabularyContainer');
        if (vocabContainer) {
            vocabContainer.innerHTML = '';
            vocabItems.forEach(item => {
                const pill = document.createElement('span');
                pill.className = 'vocab-pill';
                pill.textContent = item.word;
                vocabContainer.appendChild(pill);
                const def = document.createElement('div');
                def.className = 'vocab-def';
                def.textContent = item.def;
                vocabContainer.appendChild(def);
            });
        }

        // -------- SUMMARY --------
        const summaryContainer = document.getElementById('summaryContainer');
        if (summaryContainer) {
            summaryContainer.innerHTML = `
                <p>Peter's travelogue captures the essence of a summer trip to Devon and Cornwall. He contrasts the elegant, tourist-friendly Torquay with the surf-oriented Newquay, and revisits Penzance, where he once lived. His observations range from practical tips (opening a bottle without an opener) to cultural notes (the Cornish language, Agatha Christie's legacy). The narrative is rich with sensory details: the heat of the sun, the taste of local ales, and the texture of brittle cliffs. He also reflects on the impact of a drought, the challenge of navigating poorly signposted tourist information, and the joy of rediscovering familiar places after many years.</p>
                <p>The story also reflects on personal memories — birthdays spent in a 13th-century pub, bodyboarding in Penzance, and chance encounters with locals. Peter's use of photo editing apps and his recommendation of NotebookLM show his engagement with modern technology. His experiences highlight the unique character of each town: Torquay's elegance, Newquay's youthful energy, and Penzance's quiet charm. Overall, the journey is a blend of nostalgia, discovery, and practical wisdom, offering a vivid portrait of England's southwestern coast and the enduring appeal of its seaside towns.</p>
            `;
        }
    })();
</script>

</body>
</html>
