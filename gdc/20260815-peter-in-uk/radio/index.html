<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Talk Radio · enlarged cover</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .player-container {
            width: 100%;
            max-width: 700px;
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .cover-wrapper {
            text-align: center;
            margin-bottom: 20px;
        }
        /* +++ ENLARGED COVER SIZE +++ */
        #cover {
            width: 100%;
            max-width: 480px;   /* was 300px — now significantly larger */
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            display: block;
            margin: 0 auto;
            transition: transform 0.2s;
        }
        #cover:hover {
            transform: scale(1.01);
        }
        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin: 10px 0 6px;
            color: #fff;
            letter-spacing: 0.3px;
        }
        .duration {
            text-align: center;
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 30px;
            background: #2a2a2a;
        }
        #transcript {
            max-height: 400px;
            overflow-y: auto;
            padding-right: 6px;
            scroll-behavior: smooth;
        }
        .transcript-line {
            padding: 12px 14px;
            border-bottom: 1px solid #2c2c2c;
            cursor: pointer;
            transition: background 0.25s, color 0.2s, border-color 0.2s;
            border-radius: 6px;
            margin-bottom: 2px;
            background-color: #1a1a1a;
        }
        .transcript-line:hover {
            background-color: #2a2a2a;
            border-left: 3px solid #4caf50;
        }
        .transcript-line.active {
            background-color: #007bff;
            color: #ffffff;
            border-left: 4px solid #90caf9;
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.3);
        }
        .speaker {
            font-weight: 700;
            color: #4caf50;
            margin-right: 10px;
            letter-spacing: 0.2px;
        }
        .transcript-line.active .speaker {
            color: #ffffff;
            text-shadow: 0 0 6px rgba(255,255,255,0.5);
        }
        /* custom scroll for transcript */
        #transcript::-webkit-scrollbar {
            width: 6px;
        }
        #transcript::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        #transcript::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
        #transcript::-webkit-scrollbar-thumb:hover {
            background: #666;
        }
        /* responsive */
        @media (max-width: 500px) {
            #cover {
                max-width: 100%;
            }
            .player-container {
                padding: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="cover-wrapper">
            <!-- cover.png now displays up to 480px (was 300px) -->
            <img id="cover" src="cover.png" alt="Show Cover">
        </div>
        <h1 id="show-title">Loading...</h1>
        <p class="duration" id="show-duration"></p>
        <audio id="audio-player" controls></audio>
        <div id="transcript" class="transcript"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('audio-player');
            const transcriptDiv = document.getElementById('transcript');
            const titleEl = document.getElementById('show-title');
            const durationEl = document.getElementById('show-duration');
            
            let linesData = [];

            function timecodeToSeconds(tc) {
                const parts = tc.split(':').map(Number);
                if (parts.length === 2) return parts[0] * 60 + parts[1];
                if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
                return 0;
            }

            fetch('show_notes.json')
                .then(response => response.json())
                .then(data => {
                    titleEl.textContent = data.show_title || 'AI Talk Radio';
                    durationEl.textContent = "Show duration: " + (data.show_duration || '—');
                    linesData = data.timecoded_transcript || [];

                    linesData.forEach((line, index) => {
                        line.startSeconds = timecodeToSeconds(line.timecode);
                        if (index < linesData.length - 1) {
                            line.endSeconds = timecodeToSeconds(linesData[index + 1].timecode);
                        } else {
                            line.endSeconds = line.startSeconds + 20; 
                        }
                    });

                    renderTranscript(linesData);
                    audio.src = data.audio_file || 'ai_radio.mp3';
                })
                .catch(error => {
                    console.error('Error loading JSON:', error);
                    titleEl.textContent = "⚠️ Error: show_notes.json not found";
                    // demo data so the interface isn't empty
                    linesData = [
                        { speaker: 'AI', text: 'Welcome to AI Talk Radio.', timecode: '00:00' },
                        { speaker: 'Host', text: 'Today we talk about neural networks and music.', timecode: '00:04' },
                        { speaker: 'AI', text: 'This is a test example because JSON did not load.', timecode: '00:08' }
                    ];
                    linesData.forEach((line, i) => {
                        line.startSeconds = timecodeToSeconds(line.timecode);
                        line.endSeconds = (i < linesData.length - 1) 
                            ? timecodeToSeconds(linesData[i+1].timecode) 
                            : line.startSeconds + 20;
                    });
                    renderTranscript(linesData);
                    audio.src = 'ai_radio.mp3';
                });

            function renderTranscript(lines) {
                transcriptDiv.innerHTML = ''; 
                lines.forEach(line => {
                    const div = document.createElement('div');
                    div.className = 'transcript-line';
                    div.dataset.start = line.startSeconds;
                    div.innerHTML = `<span class="speaker">${line.speaker || '?'}:</span> ${line.text || ''}`;

                    div.addEventListener('click', () => {
                        audio.currentTime = line.startSeconds;
                        audio.play().catch(e => console.warn('autoplay blocked', e));
                    });
                    transcriptDiv.appendChild(div);
                });
            }

            // highlight active line by time
            audio.addEventListener('timeupdate', () => {
                const currentTime = audio.currentTime;
                const allLines = document.querySelectorAll('.transcript-line');

                allLines.forEach((el, index) => {
                    const start = parseFloat(el.dataset.start);
                    const end = (linesData[index] && linesData[index].endSeconds) || start + 20;
                    if (currentTime >= start && currentTime < end) {
                        allLines.forEach(l => l.classList.remove('active'));
                        el.classList.add('active');
                        // smooth scroll to active line
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                });
            });
        });
    </script>
</body>
</html>
