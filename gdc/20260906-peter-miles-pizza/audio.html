=== audio.html ===
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peter Miles Pizza · Audio Show</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      padding: 2rem 1.5rem;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      max-width: 820px;
      width: 100%;
      background: #1e1e1e;
      border-radius: 28px;
      padding: 2rem 2rem 2.5rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }

    .show-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.8rem;
    }

    .cover-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 16px;
      background: #2a2a2a;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .title-group {
      flex: 1;
    }

    .show-title {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.2;
    }

    .show-duration {
      font-size: 1rem;
      color: #aaa;
      background: #2c2c2c;
      display: inline-block;
      padding: 0.25rem 0.9rem;
      border-radius: 30px;
      margin-top: 0.3rem;
    }

    .audio-wrapper {
      margin: 1.2rem 0 1.6rem;
    }

    audio {
      width: 100%;
      border-radius: 40px;
      background: #2a2a2a;
      height: 48px;
    }
    audio::-webkit-media-controls-panel {
      background: #2a2a2a;
    }

    .transcript-container {
      max-height: 580px;
      overflow-y: auto;
      border-radius: 18px;
      background: #171717;
      padding: 0.25rem 0.25rem 0.25rem 0;
      margin-top: 0.5rem;
      scroll-behavior: smooth;
    }

    .transcript-container::-webkit-scrollbar {
      width: 6px;
    }
    .transcript-container::-webkit-scrollbar-track {
      background: #222;
      border-radius: 10px;
    }
    .transcript-container::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 10px;
    }

    .line {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      padding: 0.7rem 1.2rem;
      border-bottom: 1px solid #282828;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s;
      border-radius: 12px;
      margin: 2px 4px;
      background: transparent;
    }

    .line:hover {
      background: #2a2a2a;
    }

    .line.active {
      background: #007bff;
      color: #ffffff;
      border-bottom-color: #007bff;
      box-shadow: 0 4px 14px rgba(0, 123, 255, 0.25);
    }

    .line.active .speaker {
      color: #ffffff !important;
    }

    .line .timecode {
      font-size: 0.75rem;
      font-weight: 500;
      color: #888;
      min-width: 48px;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
    }

    .line.active .timecode {
      color: #d0e6ff;
    }

    .line .speaker {
      font-weight: 700;
      color: #7cb9ff;
      min-width: 90px;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .line .text {
      flex: 1;
      word-break: break-word;
      line-height: 1.5;
    }

    .line.active .text {
      color: #fff;
    }

    .error-msg {
      background: #2a0f0f;
      color: #ffa8a8;
      padding: 1rem 1.5rem;
      border-radius: 14px;
      border-left: 4px solid #ff4d4d;
      margin: 1rem 0;
    }

    @media (max-width: 600px) {
      .app {
        padding: 1.2rem;
      }
      .show-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .cover-img {
        width: 100px;
        height: 100px;
      }
      .show-title {
        font-size: 1.5rem;
      }
      .line {
        padding: 0.5rem 0.8rem;
        flex-wrap: wrap;
      }
      .line .speaker {
        min-width: 70px;
        max-width: 80px;
        font-size: 0.85rem;
      }
      .line .timecode {
        font-size: 0.65rem;
        min-width: 38px;
      }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="show-header">
      <img class="cover-img" id="coverImg" src="https://item1000-collab.github.io/ai/gdc/20260906-peter-miles-pizza/audio.jpg" alt="cover" />
      <div class="title-group">
        <div class="show-title" id="showTitle">Peter Miles Pizza</div>
        <span class="show-duration" id="showDuration">⏱ 24:16</span>
      </div>
    </div>

    <div class="audio-wrapper">
      <audio id="audioPlayer" controls preload="metadata">
        <source src="https://item1000-collab.github.io/ai/gdc/20260906-peter-miles-pizza/audio.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>

    <div class="transcript-container" id="transcriptContainer"></div>
    <div id="errorContainer"></div>
  </div>

  <script>
    (function() {
      'use strict';

      const PATH = 'gdc/20260906-peter-miles-pizza/';

      const audioEl = document.getElementById('audioPlayer');
      const transcriptContainer = document.getElementById('transcriptContainer');
      const showTitleEl = document.getElementById('showTitle');
      const showDurationEl = document.getElementById('showDuration');
      const errorContainer = document.getElementById('errorContainer');

      let transcriptData = null;
      let lineElements = [];
      let currentActiveIndex = -1;
      let lastScrollTime = 0;

      function timecodeToSeconds(tc) {
        if (!tc) return 0;
        const parts = tc.split(':').map(Number);
        if (parts.length === 2) {
          return parts[0] * 60 + parts[1];
        } else if (parts.length === 3) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }
        return 0;
      }

      function loadTranscript(jsonData) {
        const data = jsonData;
        if (!data || !data.timecoded_transcript || !data.timecoded_transcript.length) {
          throw new Error('Invalid transcript data: missing timecoded_transcript array.');
        }

        if (data.show_title) showTitleEl.textContent = data.show_title;
        if (data.show_duration) showDurationEl.textContent = '⏱ ' + data.show_duration;

        const lines = data.timecoded_transcript.map((item, idx, arr) => {
          const startSec = timecodeToSeconds(item.timecode);
          let endSec = startSec + 20;
          if (idx < arr.length - 1) {
            const nextStart = timecodeToSeconds(arr[idx + 1].timecode);
            if (nextStart > startSec) endSec = nextStart;
          }
          return {
            timecode: item.timecode,
            speaker: item.speaker || 'Speaker',
            text: item.text || '',
            start: startSec,
            end: endSec
          };
        });

        transcriptData = lines;
        renderTranscript(lines);
      }

      function renderTranscript(lines) {
        transcriptContainer.innerHTML = '';
        lineElements = [];

        lines.forEach((line, index) => {
          const div = document.createElement('div');
          div.className = 'line';
          div.dataset.index = index;

          const timeSpan = document.createElement('span');
          timeSpan.className = 'timecode';
          timeSpan.textContent = line.timecode;

          const speakerSpan = document.createElement('span');
          speakerSpan.className = 'speaker';
          speakerSpan.textContent = line.speaker;

          const textSpan = document.createElement('span');
          textSpan.className = 'text';
          textSpan.textContent = line.text;

          div.appendChild(timeSpan);
          div.appendChild(speakerSpan);
          div.appendChild(textSpan);

          div.addEventListener('click', function(e) {
            const idx = parseInt(this.dataset.index, 10);
            if (!isNaN(idx) && transcriptData && transcriptData[idx]) {
              const targetTime = transcriptData[idx].start;
              audioEl.currentTime = targetTime;
              if (audioEl.paused) audioEl.play().catch(() => {});
              highlightLine(idx);
            }
          });

          transcriptContainer.appendChild(div);
          lineElements.push(div);
        });
      }

      function highlightLine(index) {
        if (currentActiveIndex === index) return;
        if (currentActiveIndex >= 0 && currentActiveIndex < lineElements.length) {
          lineElements[currentActiveIndex].classList.remove('active');
        }
        if (index >= 0 && index < lineElements.length) {
          lineElements[index].classList.add('active');
          currentActiveIndex = index;
          const now = Date.now();
          if (now - lastScrollTime > 120) {
            lineElements[index].scrollIntoView({ block: 'center', behavior: 'smooth' });
            lastScrollTime = now;
          }
        } else {
          currentActiveIndex = -1;
        }
      }

      function updateHighlightFromTime(currentTime) {
        if (!transcriptData || transcriptData.length === 0) return;

        let foundIndex = -1;
        for (let i = 0; i < transcriptData.length; i++) {
          const line = transcriptData[i];
          if (currentTime >= line.start && currentTime < line.end) {
            foundIndex = i;
            break;
          }
        }

        if (foundIndex !== -1) {
          highlightLine(foundIndex);
        } else {
          const last = transcriptData.length - 1;
          if (currentTime >= transcriptData[last].start) {
            highlightLine(last);
          } else {
            if (currentActiveIndex !== -1) {
              if (currentActiveIndex >= 0 && currentActiveIndex < lineElements.length) {
                lineElements[currentActiveIndex].classList.remove('active');
              }
              currentActiveIndex = -1;
            }
          }
        }
      }

      function fetchData() {
        const jsonUrl = `https://item1000-collab.github.io/ai/${PATH}audio.json`;
        fetch(jsonUrl)
          .then(res => {
            if (!res.ok) throw new Error(`HTTP ${res.status} — could not fetch audio.json`);
            return res.json();
          })
          .then(data => {
            loadTranscript(data);
          })
          .catch(err => {
            console.error('Error loading audio.json:', err);
            errorContainer.innerHTML = `
              <div class="error-msg">
                ⚠️ Could not load transcript data (audio.json).<br />
                <span style="font-size:0.85rem;color:#cc8888;">${err.message}</span>
              </div>
            `;
          });
      }

      function onTimeUpdate() {
        if (!audioEl) return;
        updateHighlightFromTime(audioEl.currentTime);
      }

      function init() {
        audioEl.src = `https://item1000-collab.github.io/ai/${PATH}audio.mp3`;
        audioEl.load();
        fetchData();
        audioEl.addEventListener('timeupdate', onTimeUpdate);
        audioEl.addEventListener('seeked', function() {
          updateHighlightFromTime(audioEl.currentTime);
        });
      }

      init();
    })();
  </script>
</body>
</html>
