<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Miles – Talking About Homemade Pizza</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #121212;
      font-family: 'Inter', -apple-system, system-ui, sans-serif;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
      min-height: 100vh;
    }
    .container {
      max-width: 820px;
      width: 100%;
      background: #1e1e1e;
      border-radius: 28px;
      padding: 2rem 1.8rem 3rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
    }
    /* header */
    .show-header {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
      border-bottom: 1px solid #2a2a2a;
      padding-bottom: 1.5rem;
    }
    .cover-img {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 16px;
      background: #2a2a2a;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }
    .title-group {
      flex: 1;
    }
    .show-title {
      font-size: 1.7rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: #ffffff;
      line-height: 1.2;
    }
    .show-duration {
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.95rem;
      font-weight: 400;
      color: #a0a0a0;
      background: #2a2a2a;
      padding: 0.2rem 1rem;
      border-radius: 40px;
    }
    /* audio */
    .audio-wrapper {
      margin-bottom: 2.2rem;
    }
    audio {
      width: 100%;
      border-radius: 60px;
      background: #1e1e1e;
      outline: none;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
    }
    audio::-webkit-media-controls-panel {
      background: #2a2a2a;
    }
    /* PDF section */
    .pdf-section {
      margin: 1.8rem 0 2.2rem;
      background: #171717;
      border-radius: 18px;
      padding: 1rem 1.6rem;
      border: 1px solid #2a2a2a;
    }
    .pdf-section h3 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #8a8a8a;
      margin-bottom: 0.6rem;
      font-weight: 600;
    }
    .pdf-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.2rem;
      list-style: none;
    }
    .pdf-list li {
      font-size: 0.95rem;
    }
    .pdf-list a {
      color: #7aa9ff;
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .pdf-list a:hover {
      border-bottom-color: #7aa9ff;
    }
    .pdf-list a::before {
      content: "📄";
      font-size: 0.9rem;
      opacity: 0.7;
    }
    /* transcript */
    .transcript-container {
      margin-top: 0.5rem;
    }
    .transcript-item {
      padding: 0.6rem 0.9rem;
      border-bottom: 1px solid #252525;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s ease, border-color 0.15s;
      display: flex;
      gap: 0.6rem;
      align-items: baseline;
    }
    .transcript-item:hover {
      background: #282828;
      border-color: #3a3a3a;
    }
    .transcript-item.active {
      background: #007bff;
      border-color: #007bff;
      box-shadow: 0 0 0 1px #007bff;
    }
    .transcript-item.active .speaker-name,
    .transcript-item.active .line-text {
      color: #ffffff;
    }
    .transcript-item .timecode {
      font-family: 'Inter', monospace;
      font-size: 0.8rem;
      font-weight: 500;
      color: #888;
      min-width: 52px;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    .transcript-item.active .timecode {
      color: #cce4ff;
    }
    .speaker-name {
      font-weight: 600;
      color: #b0b8ff;
      flex-shrink: 0;
      min-width: 80px;
    }
    .line-text {
      color: #d4d4d4;
      word-break: break-word;
    }
    /* scroll */
    .transcript-scroll {
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
      scroll-behavior: smooth;
    }
    .transcript-scroll::-webkit-scrollbar {
      width: 5px;
    }
    .transcript-scroll::-webkit-scrollbar-track {
      background: #1a1a1a;
    }
    .transcript-scroll::-webkit-scrollbar-thumb {
      background: #3a3a3a;
      border-radius: 12px;
    }
    /* status */
    .status-msg {
      background: #1c1c1c;
      padding: 1rem 1.2rem;
      border-radius: 14px;
      border-left: 4px solid #ffb347;
      color: #d0d0d0;
      font-size: 0.95rem;
    }
    .status-msg.error {
      border-left-color: #e74c3c;
      background: #221818;
    }
    .hidden {
      display: none;
    }
    @media (max-width: 600px) {
      .container { padding: 1.2rem 1rem; }
      .show-header { flex-direction: column; align-items: flex-start; }
      .cover-img { width: 100px; height: 100px; }
      .show-title { font-size: 1.4rem; }
      .speaker-name { min-width: 70px; }
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <!-- header -->
    <div class="show-header">
      <img class="cover-img" src="https://item1000-collab.github.io/ai/gdc/audio.png" alt="cover" id="coverImage" />
      <div class="title-group">
        <h1 class="show-title" id="showTitle">Miles – Talking About Homemade Pizza</h1>
        <span class="show-duration" id="showDuration">24:16</span>
      </div>
    </div>

    <!-- audio -->
    <div class="audio-wrapper">
      <audio id="audioPlayer" controls preload="metadata">
        <source src="https://item1000-collab.github.io/ai/gdc/ai_radio.mp3" type="audio/mpeg" />
        Your browser does not support the audio element.
      </audio>
    </div>

    <!-- PDF links -->
    <div class="pdf-section" id="pdfSection">
      <h3>📎 Related PDFs</h3>
      <ul class="pdf-list" id="pdfList">
        <!-- filled by JS -->
      </ul>
    </div>

    <!-- transcript -->
    <div class="transcript-container">
      <div class="transcript-scroll" id="transcriptScroll">
        <!-- items injected by JS -->
      </div>
      <div id="statusMessage" class="status-msg hidden"></div>
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      const PATH = "gdc"; // from screenshot: 20260906-peter-miles-pizza/ → we use "gdc" as the folder name
      const BASE_URL = `https://item1000-collab.github.io/ai/${PATH}/`;
      const AUDIO_URL = BASE_URL + "ai_radio.mp3";
      const COVER_URL = BASE_URL + "audio.png";

      // PDF files extracted from screenshot (full names)
      const PDF_FILES = [
        "dough-and-data.pdf",
        "summary-20260906171835ayhXbv.pdf"
      ];

      // DOM refs
      const audioEl = document.getElementById('audioPlayer');
      const coverImg = document.getElementById('coverImage');
      const showTitleEl = document.getElementById('showTitle');
      const showDurationEl = document.getElementById('showDuration');
      const transcriptScroll = document.getElementById('transcriptScroll');
      const statusMsg = document.getElementById('statusMessage');

      // set audio src
      audioEl.src = AUDIO_URL;
      coverImg.src = COVER_URL;

      // render PDF links
      const pdfList = document.getElementById('pdfList');
      if (PDF_FILES.length) {
        PDF_FILES.forEach(name => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = BASE_URL + name;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.textContent = name;
          li.appendChild(a);
          pdfList.appendChild(li);
        });
      } else {
        const li = document.createElement('li');
        li.textContent = 'No PDF files available.';
        li.style.color = '#777';
        pdfList.appendChild(li);
      }

      // ----- fetch & parse JSON -----
      const JSON_URL = BASE_URL + 'show_notes.json';

      let transcriptData = []; // array of { timecode, speaker, text, startSeconds, endSeconds }

      function parseTimecodeToSeconds(tc) {
        if (!tc) return 0;
        let str = tc.trim();
        // remove brackets if present
        str = str.replace(/^\[/, '').replace(/\]$/, '');
        let parts = str.split(':').map(Number);
        if (parts.length === 2) {
          return parts[0] * 60 + parts[1];
        } else if (parts.length === 3) {
          return parts[0] * 3600 + parts[1] * 60 + parts[2];
        }
        return 0;
      }

      function formatTimecode(seconds) {
        const m = Math.floor(seconds / 60);
        const s = Math.floor(seconds % 60);
        return `${m}:${s.toString().padStart(2, '0')}`;
      }

      function buildTranscriptItems(json) {
        if (!json.timecoded_transcript || !json.timecoded_transcript.length) {
          showStatus('Transcript is empty or invalid.', true);
          return [];
        }
        const items = json.timecoded_transcript.map(entry => {
          const raw = entry.timecode || '0:00';
          const sec = parseTimecodeToSeconds(raw);
          return {
            timecode: raw,
            speaker: entry.speaker || 'Speaker',
            text: entry.text || '',
            startSeconds: sec
          };
        });
        // calculate end times: next start, or start+20 for last
        for (let i = 0; i < items.length; i++) {
          if (i < items.length - 1) {
            items[i].endSeconds = items[i + 1].startSeconds;
          } else {
            // last line: use start + 20s or duration from json
            const dur = json.show_duration ? parseTimecodeToSeconds(json.show_duration) : 0;
            if (dur > items[i].startSeconds) {
              items[i].endSeconds = dur;
            } else {
              items[i].endSeconds = items[i].startSeconds + 20;
            }
          }
        }
        return items;
      }

      function renderTranscript(items) {
        const container = transcriptScroll;
        container.innerHTML = '';
        if (!items || items.length === 0) {
          const div = document.createElement('div');
          div.className = 'status-msg';
          div.textContent = 'No transcript lines to display.';
          container.appendChild(div);
          return;
        }
        items.forEach((item, idx) => {
          const div = document.createElement('div');
          div.className = 'transcript-item';
          div.dataset.index = idx;
          div.dataset.start = item.startSeconds;
          div.dataset.end = item.endSeconds || item.startSeconds + 20;

          const timeSpan = document.createElement('span');
          timeSpan.className = 'timecode';
          timeSpan.textContent = item.timecode;

          const speakerSpan = document.createElement('span');
          speakerSpan.className = 'speaker-name';
          speakerSpan.textContent = item.speaker + ':';

          const textSpan = document.createElement('span');
          textSpan.className = 'line-text';
          textSpan.textContent = item.text;

          div.appendChild(timeSpan);
          div.appendChild(speakerSpan);
          div.appendChild(textSpan);

          // click → seek
          div.addEventListener('click', function(e) {
            const start = parseFloat(this.dataset.start);
            if (!isNaN(start) && audioEl) {
              audioEl.currentTime = start;
              audioEl.play().catch(() => {});
            }
          });

          container.appendChild(div);
        });
      }

      function highlightCurrentLine(currentTime) {
        const items = document.querySelectorAll('.transcript-item');
        let activeIdx = -1;
        for (let i = 0; i < items.length; i++) {
          const start = parseFloat(items[i].dataset.start);
          const end = parseFloat(items[i].dataset.end);
          if (currentTime >= start && currentTime < end) {
            activeIdx = i;
            break;
          }
        }
        // if none found, but we have items and currentTime >= last start, highlight last
        if (activeIdx === -1 && items.length > 0) {
          const last = items[items.length - 1];
          const lastStart = parseFloat(last.dataset.start);
          if (currentTime >= lastStart) {
            activeIdx = items.length - 1;
          }
        }

        items.forEach((el, idx) => {
          if (idx === activeIdx) {
            el.classList.add('active');
            // scroll into view if not fully visible
            const container = transcriptScroll;
            const rect = el.getBoundingClientRect();
            const containerRect = container.getBoundingClientRect();
            if (rect.top < containerRect.top || rect.bottom > containerRect.bottom) {
              el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
          } else {
            el.classList.remove('active');
          }
        });
      }

      function showStatus(msg, isError = false) {
        statusMsg.textContent = msg;
        statusMsg.className = 'status-msg' + (isError ? ' error' : '');
        statusMsg.classList.remove('hidden');
      }

      function hideStatus() {
        statusMsg.classList.add('hidden');
      }

      // ----- load JSON -----
      fetch(JSON_URL)
        .then(res => {
          if (!res.ok) throw new Error(`HTTP ${res.status} – ${res.statusText}`);
          return res.json();
        })
        .then(json => {
          hideStatus();
          // set title & duration
          if (json.show_title) {
            showTitleEl.textContent = json.show_title;
          }
          if (json.show_duration) {
            showDurationEl.textContent = json.show_duration;
          }
          // build items
          const items = buildTranscriptItems(json);
          transcriptData = items;
          renderTranscript(items);

          // audio timeupdate
          audioEl.removeEventListener('timeupdate', onTimeUpdate);
          audioEl.addEventListener('timeupdate', onTimeUpdate);

          function onTimeUpdate() {
            const ct = audioEl.currentTime;
            highlightCurrentLine(ct);
          }

          // initial highlight after metadata loaded
          if (audioEl.readyState >= 1) {
            highlightCurrentLine(audioEl.currentTime);
          } else {
            audioEl.addEventListener('loadedmetadata', function() {
              highlightCurrentLine(audioEl.currentTime);
            });
          }
        })
        .catch(err => {
          console.error('Failed to load show_notes.json:', err);
          showStatus(`⚠️ Could not load transcript data. Please check that show_notes.json exists at ${JSON_URL}`, true);
          // still render empty transcript
          renderTranscript([]);
        });

      // handle errors on audio
      audioEl.addEventListener('error', function(e) {
        console.warn('Audio load error', e);
        // no crash, just show a subtle message
      });

      // if cover image fails, fallback
      coverImg.addEventListener('error', function() {
        this.style.display = 'none';
      });

      // small hack: if the transcript container is empty after render, show placeholder
      // but renderTranscript handles empty.
    })();
  </script>
</body>
</html>
