<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📁 Peter in UK · resources</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fa;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            margin: 0;
            line-height: 1.5;
        }

        .card {
            max-width: 820px;
            width: 100%;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 16px 32px -10px rgba(0, 20, 30, 0.2);
            padding: 1.8rem 1.8rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .resource-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .resource-column {
            border-radius: 1rem;
            padding: 0.8rem 0.8rem 0.6rem;
            background: #fafcfe;
            border: 1px solid #eef2f7;
        }

        .resource-column.presentations-col {
            background: #f6f9fc;
            border-color: #dce5f0;
        }

        .resource-column.summary-col {
            background: #f5f9f5;
            border-color: #d8e8da;
        }

        .section-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 0.5rem;
            color: #1a2d3c;
        }

        .section-label.presentations {
            background: #d6e4f2;
            color: #1a4b6d;
        }

        .section-label.summary {
            background: #d4e8d6;
            color: #1f5a3a;
        }

        .file-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .file-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem 0.5rem 0.2rem 0.6rem;
            border-radius: 30px;
            transition: background 0.15s, transform 0.1s;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.6);
        }

        .file-item:hover {
            background: rgba(255, 255, 255, 0.95);
            border-color: #c5d4e5;
            transform: translateX(2px);
        }

        .file-icon {
            font-size: 1rem;
            line-height: 1;
            width: 1.4rem;
            text-align: center;
            flex-shrink: 0;
        }

        .file-name {
            font-weight: 450;
            color: #1a2d3c;
            word-break: break-word;
            flex: 1;
            font-size: 0.78rem;
        }

        .file-link {
            text-decoration: none;
            color: inherit;
            display: flex;
            align-items: center;
            width: 100%;
            gap: 0.4rem;
        }

        .file-link:visited .file-name {
            color: #4b5b70;
        }

        .arrow-hint {
            color: #7c8ca0;
            font-size: 0.7rem;
            margin-left: auto;
            opacity: 0.4;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        .file-item:hover .arrow-hint {
            opacity: 1;
            color: #1f5980;
        }

        .file-tag {
            font-size: 0.5rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            padding: 0.05rem 0.5rem;
            border-radius: 10px;
            opacity: 0.7;
            flex-shrink: 0;
        }

        .file-tag.presentation-tag {
            background: #d0e0f0;
            color: #1a4b6d;
        }

        .file-tag.summary-tag {
            background: #cde8d0;
            color: #1f5a3a;
        }

        .file-sub {
            font-size: 0.6rem;
            color: #5a7a90;
            font-weight: 400;
            margin-left: 0.1rem;
        }

        hr {
            border: none;
            border-top: 1px solid #e8eef5;
            margin: 0.8rem 0 0.2rem;
        }

        @media (max-width: 650px) {
            .resource-grid {
                grid-template-columns: 1fr;
                gap: 0.8rem;
            }
            .card {
                padding: 1.2rem 1rem 1.5rem;
            }
            .file-item {
                padding: 0.3rem 0.5rem 0.3rem 0.7rem;
            }
            .file-name {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
