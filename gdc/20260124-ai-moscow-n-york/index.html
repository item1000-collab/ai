<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Lessons · PDF list</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f8f6f3;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 820px;
      width: 100%;
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .logo-icon {
      font-size: 2rem;
      line-height: 1;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .title-main {
      font-weight: 600;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      color: #1a1a2e;
      line-height: 1.2;
    }

    .title-sub {
      font-weight: 400;
      font-size: 0.95rem;
      color: #6b7280;
      margin-top: 0.1rem;
    }

    .badge {
      background: white;
      padding: 0.5rem 1rem 0.5rem 0.9rem;
      border-radius: 60px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
      font-size: 0.9rem;
      color: #1a1a2e;
      border: 1px solid #f0ede8;
    }

    .pulse-dot {
      width: 10px;
      height: 10px;
      background: #e07a5f;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.8s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0% { opacity: 0.6; transform: scale(0.95); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.6; transform: scale(0.95); }
    }

    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.04), 0 4px 10px rgba(0,0,0,0.02);
      padding: 1.8rem 1.8rem 1.5rem;
      border: 1px solid #f0ede8;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.6rem 1.2rem;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.7rem 0.9rem 0.7rem 0.7rem;
      border-radius: 16px;
      background: #fcfbf9;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #1a1a2e;
      font-weight: 500;
      font-size: 0.95rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.01);
      position: relative;
    }

    .item .emoji {
      font-size: 1.4rem;
      line-height: 1;
      flex-shrink: 0;
      width: 1.8rem;
      text-align: center;
    }

    .item .name {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .item .arrow {
      margin-left: auto;
      color: #d0ccc6;
      font-size: 1.1rem;
      transition: all 0.2s ease;
      opacity: 0;
      transform: translateX(-6px);
      font-weight: 300;
    }

    .item:hover {
      border-color: #e07a5f;
      background: white;
      box-shadow: 0 6px 16px rgba(224, 122, 95, 0.08);
      transform: translateY(-2px);
    }

    .item:hover .arrow {
      opacity: 1;
      transform: translateX(2px);
      color: #e07a5f;
    }

    .footer {
      margin-top: 2.2rem;
      text-align: center;
      font-weight: 400;
      color: #9ca3af;
      font-size: 0.85rem;
      letter-spacing: 0.3px;
    }

    @media (max-width: 500px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .badge {
        align-self: flex-start;
      }
      .card {
        padding: 1.2rem;
      }
      .item .name {
        white-space: normal;
        word-break: break-word;
      }
    }

    .item:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
<div class="container">
  <header class="header">
    <div class="header-left">
      <span class="logo-icon">📖</span>
      <div class="title-group">
        <span class="title-main">English Lessons</span>
        <span class="title-sub">gdc · AI Moscow N-York</span>
      </div>
    </div>
    <div class="badge">
      <span class="pulse-dot"></span>
      <span>PDF Files</span>
    </div>
  </header>

  <div class="card">
    <div class="grid">
      <a href="https://item1000-collab.github.io/ai/gdc/20260124-ai-moscow-n-york/ai-narrative-mechanics-2.pdf" target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📕</span>
        <span class="name">ai-narrative-mechanics-2.pdf</span>
        <span class="arrow">→</span>
      </a>
      <a href="https://item1000-collab.github.io/ai/gdc/20260124-ai-moscow-n-york/ai-narrative-mechanics.pdf" target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📘</span>
        <span class="name">ai-narrative-mechanics.pdf</span>
        <span class="arrow">→</span>
      </a>
      <a href="https://item1000-collab.github.io/ai/gdc/20260124-ai-moscow-n-york/moscow-to-manhattan.pdf" target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📗</span>
        <span class="name">moscow-to-manhattan.pdf</span>
        <span class="arrow">→</span>
      </a>
    </div>
  </div>

  <footer class="footer">
    Powered by AI Exploration Hub
  </footer>
</div>
</body>
</html>
