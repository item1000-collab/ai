<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
  <title>Resources · AI Maya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f8f6f3;
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      line-height: 1.4;
      color: #1a1a2e;
    }

    .container {
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
    }

    /* header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem 1rem;
      margin-bottom: 2rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logo-icon {
      font-size: 2rem;
      line-height: 1;
      margin-right: 0.1rem;
    }

    .title-group {
      display: flex;
      flex-direction: column;
    }

    .title-main {
      font-weight: 600;
      font-size: 1.8rem;
      letter-spacing: -0.01em;
      color: #1a1a2e;
      line-height: 1.2;
    }

    .subtitle {
      font-weight: 400;
      font-size: 1rem;
      color: #6b7280;
      margin-top: 0.1rem;
    }

    /* badge */
    .badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: white;
      padding: 0.4rem 1rem 0.4rem 0.9rem;
      border-radius: 60px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02), 0 2px 4px rgba(0,0,0,0.02);
      border: 1px solid rgba(0,0,0,0.02);
      font-weight: 500;
      font-size: 0.95rem;
      color: #1a1a2e;
      white-space: nowrap;
    }

    .dot-pulse {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e07a5f;
      animation: pulse-dot 1.8s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes pulse-dot {
      0% { opacity: 0.5; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.5; transform: scale(0.9); }
    }

    .badge-label {
      letter-spacing: 0.01em;
    }

    /* card */
    .card {
      background: white;
      border-radius: 24px;
      padding: 1.75rem 1.75rem 1.5rem;
      box-shadow: 0 12px 30px rgba(0,0,0,0.04), 0 4px 8px rgba(0,0,0,0.02);
      transition: box-shadow 0.2s;
      width: 100%;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem 1.2rem;
    }

    /* item */
    .item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 0.9rem 0.7rem 0.9rem;
      border-radius: 16px;
      background: #fcfcfb;
      border: 1px solid rgba(0,0,0,0.02);
      text-decoration: none;
      color: #1a1a2e;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px rgba(0,0,0,0.01);
      font-weight: 500;
      font-size: 0.95rem;
      position: relative;
    }

    .item .emoji {
      font-size: 1.3rem;
      line-height: 1;
      flex-shrink: 0;
      width: 1.8rem;
      text-align: left;
    }

    .item .name {
      flex: 1;
      word-break: break-word;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: #1a1a2e;
      transition: color 0.2s;
    }

    .item .arrow {
      font-size: 1.1rem;
      opacity: 0;
      transform: translateX(-6px);
      transition: all 0.2s ease;
      color: #e07a5f;
      font-weight: 400;
      flex-shrink: 0;
    }

    .item:hover {
      background: white;
      border-color: #e07a5f;
      box-shadow: 0 8px 18px rgba(224, 122, 95, 0.08), 0 2px 6px rgba(0,0,0,0.02);
      transform: translateY(-1.5px);
    }

    .item:hover .arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .item:hover .name {
      color: #1a1a2e;
    }

    /* footer */
    .footer {
      margin-top: 2.4rem;
      font-size: 0.9rem;
      color: #6b7280;
      text-align: center;
      letter-spacing: 0.01em;
      font-weight: 400;
      border-top: 1px solid rgba(0,0,0,0.03);
      padding-top: 1.8rem;
      width: 100%;
    }

    /* responsive */
    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 0.7rem;
      }
      .header {
        flex-direction: row;
        align-items: center;
        flex-wrap: wrap;
      }
      .badge {
        padding: 0.3rem 0.8rem 0.3rem 0.7rem;
        font-size: 0.85rem;
      }
      .title-main {
        font-size: 1.5rem;
      }
      .card {
        padding: 1.3rem 1.2rem;
      }
      .item {
        padding: 0.65rem 0.8rem;
        font-size: 0.9rem;
      }
      .item .emoji {
        font-size: 1.2rem;
        width: 1.6rem;
      }
    }

    @media (max-width: 420px) {
      .header-left .logo-icon {
        font-size: 1.7rem;
      }
      .title-main {
        font-size: 1.3rem;
      }
      .subtitle {
        font-size: 0.85rem;
      }
      .badge {
        font-size: 0.75rem;
        padding: 0.2rem 0.6rem 0.2rem 0.5rem;
      }
      .dot-pulse {
        width: 8px;
        height: 8px;
      }
    }

    /* no counter — intentionally omitted */
  </style>
</head>
<body>
<div class="container">
  <!-- header -->
  <header class="header">
    <div class="header-left">
      <span class="logo-icon">📖</span>
      <div class="title-group">
        <span class="title-main">Resources</span>
        <span class="subtitle">AI Maya · Coffee &amp; Audit</span>
      </div>
    </div>
    <div class="badge">
      <span class="dot-pulse"></span>
      <span class="badge-label">PDF Files</span>
    </div>
  </header>

  <!-- main card -->
  <main class="card">
    <div class="grid">
      <!-- only one PDF file from the screenshot: maya-ai-audit.pdf -->
      <a href="https://item1000-collab.github.io/ai/gdc/20260215-ai-maya-coffee/maya-ai-audit.pdf" target="_blank" rel="noopener noreferrer" class="item">
        <span class="emoji">📘</span>
        <span class="name">maya-ai-audit.pdf</span>
        <span class="arrow">→</span>
      </a>
      <!-- the screenshot shows only one .pdf file. 
           no extra files, no folders, no count -->
    </div>
  </main>

  <!-- footer -->
  <footer class="footer">
    Powered by AI Exploration Hub
  </footer>
</div>
</body>
</html>
